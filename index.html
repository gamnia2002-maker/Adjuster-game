<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="保險公證人人生模擬:從 23 歲入行到 65 歲退休,在每個十字路口做出選擇。">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>冒險公證人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 版面:案件卷宗。窄欄單列:像素場景與時間條在上,十字路口卡片緊接其後,下方是屬性、控制與逐年日誌。色票:安全帽黃、鋼藍墨、冷灰紙。 */
:root{
  --bg:#e8ecef; --card:#f8fafb; --ink:#14212c; --mute:#5a6a77; --line:#c9d3da;
  --accent:#f2b705; --accent-ink:#1b1500; --steel:#2f5d7c;
  --good:#23794a; --bad:#b53a29; --track:#d6dee4;
  --s-pro:#2f5d7c; --s-rep:#b8860b; --s-net:#6a4fa3; --s-hp:#1f8a7a; --s-fam:#c0507a;
  --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1923; --card:#16242f; --ink:#e7eef3; --mute:#97a8b5; --line:#2b3d4b;
    --accent:#f4c430; --accent-ink:#1b1500; --steel:#7fb2d6;
    --good:#4fbf86; --bad:#ee7b68; --track:#243543;
    --s-pro:#6fa8d1; --s-rep:#f2c14e; --s-net:#a98be0; --s-hp:#4fcbb4; --s-fam:#ee8aa8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1923; --card:#16242f; --ink:#e7eef3; --mute:#97a8b5; --line:#2b3d4b;
  --accent:#f4c430; --accent-ink:#1b1500; --steel:#7fb2d6;
  --good:#4fbf86; --bad:#ee7b68; --track:#243543;
  --s-pro:#6fa8d1; --s-rep:#f2c14e; --s-net:#a98be0; --s-hp:#4fcbb4; --s-fam:#ee8aa8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.75 var(--f-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.mast b{font:900 20px/1.2 var(--f-display);letter-spacing:.06em}
.code{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.04em}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero h1{font-size:clamp(34px,10vw,48px);font-weight:900;letter-spacing:.04em}
.hero .lede{font-size:17px;max-width:34em}
.stamp{align-self:flex-start;font:700 12px var(--f-mono);letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:3px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts div{border-top:2px solid var(--ink);padding-top:6px;line-height:1.3}
.facts b{display:block;font:700 22px var(--f-mono)}
.facts span{font-size:12px;color:var(--mute)}

.tab{display:inline-block;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-mono);letter-spacing:.1em;padding:5px 12px;border-radius:5px 5px 0 0;margin-bottom:-1px;position:relative}
.tab.dark{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.card.ev{border:2px solid var(--accent)}
.card.br{border:2px solid var(--steel)}
.tab.br{background:var(--steel);color:var(--card)}
.card h2{font-size:22px}
.last{font:500 13px/1.6 var(--f-mono);color:var(--mute);border-left:3px solid var(--line);padding-left:10px}

/* 場景與時間 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:10px}
canvas.scene{display:block;width:100%;height:auto;aspect-ratio:120/56;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px;background:#a8dcff}
.cap{font-size:12px;color:var(--mute);line-height:1.5}
.yb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mute)}
.yb b{font:700 12px var(--f-mono);color:var(--ink)}
.ytrack{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.ytrack u{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.ytrack u.run{animation-name:yfill;animation-timing-function:linear;animation-fill-mode:forwards}
.ytrack u.pz{animation-play-state:paused}
.ytrack u.hold{transform:scaleX(1);background:var(--steel)}
@keyframes yfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.life{display:flex;flex-direction:column;gap:4px}
.ltrack{position:relative;height:14px;background:var(--track);border-radius:3px}
.ltrack>u{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.82;border-radius:3px 0 0 3px;transition:width .4s}
.ltrack i{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;transform:rotate(45deg);border:2px solid var(--steel);background:var(--card)}
.ltrack i.done{background:var(--steel)}
.ltrack em{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--accent)}
.lscale{position:relative;height:14px;font:500 11px/14px var(--f-mono);color:var(--mute)}
.lscale span{position:absolute;transform:translateX(-50%)}
.lscale span:first-child{transform:none}
.lscale span:last-child{transform:translateX(-100%)}

.hdr{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 12px}
.kv{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.kv span{font-size:12px;color:var(--mute)}
.kv b{font:700 16px var(--f-mono)}
.kv b.zh{font:700 15px var(--f-body)}
.sts{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:2.6em 1fr 2.4em;align-items:center;gap:10px;font-size:13px}
.st i{display:block;height:8px;background:var(--track);border-radius:2px;overflow:hidden}
.st u{display:block;height:100%;border-radius:2px;transition:width .4s}
.st b{text-align:right;font:700 13px var(--f-mono)}
.st b.low{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.prof{display:flex;flex-direction:column;gap:2px}
.prof b{color:var(--ink);font-weight:700}

.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--mute);letter-spacing:.06em}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer}
.auto input{width:18px;height:18px;accent-color:var(--steel)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.s4{grid-template-columns:repeat(4,1fr)}
@media (max-width:460px){.seg.s4{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}}
.seg button{all:unset;box-sizing:border-box;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;line-height:1.35;background:var(--bg)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.pbtn{all:unset;box-sizing:border-box;padding:8px 14px;border-radius:6px;border:1px solid var(--ink);font:700 14px var(--f-body);cursor:pointer;min-width:6em;text-align:center}
.pbtn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;line-height:1.55}
.opt:hover{border-color:var(--steel)}
.opt[disabled]{cursor:not-allowed;opacity:.5}
.opt[disabled]:hover{border-color:var(--line)}
.opt:focus-visible,.btn:focus-visible,.seg button:focus-visible,.pbtn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.opt b{font-weight:700;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 12px/1.2 var(--f-mono);padding:4px 7px;border-radius:3px;border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:currentColor}
.chip.dn{color:var(--bad);border-color:currentColor}
.chip.pr{color:var(--steel);border-color:currentColor}
.chip.hk{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lk{color:var(--mute);border-style:dashed}
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;padding:13px 18px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);cursor:pointer;letter-spacing:.06em}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mute)}
.field input,.field textarea{font:500 16px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.field textarea{font:400 14px/1.6 var(--f-body);resize:none;height:84px}

.rowkv{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rowkv:last-of-type{border-bottom:0;padding-bottom:0}
.rowkv .k{font-size:12px;color:var(--mute)}
.rowkv .v{font-weight:700}
.rowkv .p{font:500 12px var(--f-mono);color:var(--steel)}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.feed li:last-child{border-bottom:0}
.feed li>span{font:700 12px/1.9 var(--f-mono);color:var(--mute)}
.feed li div{min-width:0;display:flex;flex-direction:column;gap:4px}
.feed li.up b,.feed li.up>div>span:first-child{color:var(--good)}
.feed li.bad b{color:var(--bad)}
.feed li.ev b{color:var(--steel)}
.feed li.new{animation:fresh .6s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--accent) 30%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.feed li.new{animation:none}.st u,.ltrack>u{transition:none}}

.score{display:flex;align-items:baseline;gap:10px}
.score b{font:900 56px/1 var(--f-display)}
.score span{color:var(--mute);font:500 13px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
svg.ch{width:100%;height:auto;display:block}
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--mute);font:9px var(--f-mono)}

details{border:1px solid var(--line);border-radius:6px;background:var(--card)}
summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:15px}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tbl{overflow-x:auto}
.foot{font-size:12px;color:var(--mute);text-align:center}
.know{border:1px dashed var(--steel);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.know .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.know b{font-size:15px}
.know p{font-size:14px;line-height:1.75}
.var{font-size:13px;line-height:1.6;background:color-mix(in srgb,var(--accent) 20%,transparent);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 4px 4px 0}
.tier{font:700 14px var(--f-mono);letter-spacing:.08em}
.tier.g{color:var(--good)}.tier.b{color:var(--bad)}.tier.m{color:var(--steel)}
.twist{font-size:14px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}
.feed li.mk>div>span:first-child{color:var(--s-rep);font-weight:700}
</style>
</head>
<body>

<main class="wrap" id="app"></main>

<script>
/* ===================== 基本設定 ===================== */
const KEYS=['pro','rep','net','hp','fam'];
const KN={pro:'專業',rep:'信譽',net:'人脈',hp:'健康',fam:'家庭',gov:'公司治理'};
const RANK=[
 {m:4.2},
 {m:6,y:3,pro:45,rep:0,net:0},
 {m:9,y:8,pro:60,rep:50,net:0},
 {m:13,y:14,pro:63,rep:0,net:50},
 {m:18,y:20,pro:70,rep:62,net:62},
 {m:28,y:28,pro:82,rep:78,net:72}
];
/* 職涯路線:職稱、月薪倍率、健康耗損(null = 依任職公司)、升遷門檻調整 */
const ROUTES={
 adj:{n:'公證主線',r:['助理公證人','公證人','資深公證人','理賠經理','協理','合夥人'],m:1,d:null,off:{},x:'全方位發展,門檻均衡'},
 exp:{n:'技術專家線',r:['助理公證人','公證人','資深公證人','技術顧問','首席專家','鑑識權威'],m:.95,d:null,off:{pro:5,net:-20},x:'重專業,幾乎不看人脈'},
 mgr:{n:'管理線',r:['助理公證人','公證人','資深公證人','團隊主管','部門經理','總經理'],m:1.1,d:null,off:{pro:-8,net:5},x:'重人脈與帶人,薪水較高'},
 brk:{n:'保險經紀業',r:['理賠專員','理賠顧問','資深理賠顧問','理賠經理','副總監','理賠總監'],m:1.1,d:1.2,off:{net:3},x:'站在客戶這一側主導理賠'},
 ins:{n:'保險公司',r:['理賠專員','理賠襄理','理賠經理','理賠部協理','理賠部副總','副總經理'],m:1,d:.6,off:{pro:-5,rep:-5},x:'穩定,健康耗損低'},
 rei:{n:'再保險',r:['再保專員','理賠分析師','資深分析師','亞洲區理賠經理','亞太理賠主管','全球理賠總監'],m:1.25,d:1.4,off:{pro:5},x:'國際舞台,高薪高壓'},
 own:{n:'自營公證行',r:['工作室負責人','工作室負責人','公證行負責人','公證行負責人','區域公證行老闆','公證集團董事長'],m:1.3,d:1.6,off:{net:5},x:'收入最高,風險最高'},
 edu:{n:'講師與學界',r:['兼任講師','兼任講師','專任講師','助理教授','副教授','教授'],m:.75,d:.4,off:{net:-10},x:'收入較低,身心最平衡'}
};
const BG=[
 {n:'理工背景',w:30,fx:{pro:8,net:-2},d:'看得懂圖面與設備'},
 {n:'法律商管背景',w:22,fx:{rep:5,pro:3},d:'條款與程序是你的母語'},
 {n:'船務海事背景',w:12,fx:{pro:4,net:4},d:'熟悉貨物與運輸鏈'},
 {n:'保險公司轉職',w:20,fx:{net:8,pro:2},d:'知道對岸怎麼想'},
 {n:'社會新鮮人',w:16,fx:{hp:8,fam:4,pro:-3},d:'體力好,什麼都得學'}
];
const SP=[
 {id:'fire',n:'財產險(火災、爆炸)',w:30},
 {id:'cargo',n:'貨物與海事險',w:22},
 {id:'eng',n:'工程險',w:14},
 {id:'re',n:'再生能源(太陽能、風電)',w:10},
 {id:'semi',n:'半導體與高科技',w:10},
 {id:'motor',n:'汽車與責任險',w:14}
];
const FM=[
 {n:'外商公證公司',w:30,m:1.15,d:1.5,x:'薪水高,壓力大'},
 {n:'本土公證行',w:45,m:1,d:1,x:'節奏中等'},
 {n:'保險公司理賠部',w:25,m:0.92,d:0.5,x:'穩定,天花板較低'}
];
const FOCUS=[
 {id:'study',n:'苦讀專業',fx:{pro:5,hp:-2,fam:-1},ph:['你把週末泡在條款與判例裡。','你啃完一整套損失計算教材。','你開始習慣在報告後面附上推算依據。','你把十年來的舊案重新讀了一遍。']},
 {id:'field',n:'衝現場',fx:{pro:2,rep:2,hp:-4,fam:-3},inc:1.15,ph:['你一年跑了上百個案場。','你的安全鞋換了第二雙。','你在國道休息站吃了太多次晚餐。','你的車上永遠放著雨鞋和捲尺。']},
 {id:'net',n:'經營人脈',fx:{net:5,rep:1,hp:-1,fam:-1},ph:['你和幾家保險公司的窗口吃了不少頓飯。','你的名片夾又厚了一層。','你在公會活動認識了不少新面孔。','經紀人開始會主動打電話給你。']},
 {id:'rest',n:'休養陪家人',fx:{hp:5,fam:5,pro:-1},ph:['你準時下班,週末陪家人。','你開始規律運動。','你把年假真的休完了。','你學會在晚上十點後不看手機。']}
];
const SPD={slow:[2200,'慢'],mid:[1300,'中'],fast:[600,'快']};

/* ===================== 事件庫 =====================
   c:判定(成功率 = b + (數值 − 50) × s,限 5–95%)。gr:大成功(擲點 ≤ 成功率 × 0.2)。
   a:自動模式權重。show:選項是否出現。req/lk:選項門檻與說明。
   sched:數年後必定觸發的後續。route:轉換職涯路線。end:直接進入特殊結局。 */
const E=[
/* ---- 職涯分岔(固定年齡觸發) ---- */
{id:'br1',n:'職涯的十字路口',w:3,br:1,job:1,once:1,when:s=>s.age>=27&&s.age<=36&&s.rank>=1&&s.track==='adj',t:'你已經能獨當一面。幾個方向同時向你招手,接下來的十年要往哪裡走?',ch:[

br2:['再保險','保險公司把承擔的部分風險再轉給再保險公司,以穩定財務、提高承保能量。大型災損最後往往由國際再保人分擔,所以再保人常會參與或查核重大理賠。'],
br3:['公證報告的獨立性','公證報告的價值來自獨立與專業。無論職涯走到哪個階段,報告都應依證據與保單條款認定,不受委託方或被保險人的壓力左右。'],
first:['第一時間的現場保全','事故發生後,應盡快拍照、標記、保存起火點與受損物,並記錄時間與在場人員。現場一旦清理或被雨水破壞,原因鑑定就很難回溯。'],
english:['倫敦市場','倫敦(Lloyd’s 與倫敦公司市場)是全球大型商業風險與再保險的核心市場。許多海上、能源、巨災保單以英文條款為準,條款解釋常參考英國法。'],
emba:['風險管理與企業決策','企業主越了解風險管理,越會把保險當成財務工具,而不只是成本。保險規劃通常要搭配損失預防、自留額與營運持續計畫一起看。'],

bribe:['公證人的誠信','公證人收受利益而影響報告內容,可能涉及刑事責任並失去執業資格。遇到不當利益,應拒絕並留下紀錄,向公司報備。'],
audit:['理賠稽核','保險公司與再保人會對大額或異常理賠做事後稽核,調閱報告、照片與計算底稿。底稿完整、推算有依據,是公證人最好的保護。'],
trust:['信譽是公證人的資產','保險公司與經紀人指派公證人時,最看重過往報告的品質與誠信紀錄。一次正直的選擇,常在多年後換來大案的指名。'],
typhoon:['巨災事件的理賠作業','颱風、地震等巨災會在短時間內產生大量案件。保險公司常啟動簡易理賠流程並分級處理:小額案件快速結案,大額案件安排資深公證人。'],
quake:['地震險','住宅地震基本保險承保建築物全損與推定全損;商業火險附加的地震險,常有較高的自負額或比例分擔。理賠前先確認適用條款與自負額。'],
angry:['理賠溝通','被保險人在事故後常處於焦慮狀態。清楚說明流程、所需文件與時程,比爭論金額更能降低衝突。'],
unsafe:['勘查人員的安全','火災或倒塌現場可能有結構坍塌、有毒氣體與帶電設備。進入前應確認結構安全、配戴防護裝備,必要時等技師評估。沒有任何證據值得用生命交換。'],
underins:['不足額保險與比例分擔','保險金額低於實際價值時,通常按「保險金額 ÷ 實際價值」的比例賠付。例:價值 5 億、保額 3 億,損失 1 億只賠 6,000 萬。定期依重置成本檢視保額可以避免。'],

trip:['海外勘查與當地協作','跨國保單在海外出事時,常由當地公證人先行勘查、保全現場,再由主辦公證人統籌報告。事先建立海外合作網絡,能大幅縮短反應時間。'],

newcontact:['報告的可驗證性','好的公證報告讓任何人都能從證據推回結論:照片有編號、數字有來源、推算有公式。審核者越挑剔,越需要這種結構。'],
pressure:['報告的中立','公證人雖受保險公司委託,報告仍應依證據與條款認定。刻意壓低或灌水,都可能讓公證人在訴訟中負擔責任。'],
lawsuit:['公證報告在訴訟中的角色','理賠爭議進入訴訟時,公證報告常是重要證據,公證人也可能被傳喚作證。報告裡的每個假設,都可能在交互詰問中被逐一檢視。'],
inflate:['損失清單的查核','庫存損失應以帳冊、進銷存紀錄、盤點表與發票交叉核對。誇大損失可能構成保險詐欺,協助的人也有法律責任。'],
credit:['底稿與紀錄','理賠分析的計算底稿、版本紀錄與往來郵件,是釐清責任與功勞的依據,也是日後稽核時的保護。'],
scapegoat:['理賠決策的書面紀錄','重要決策要留下書面紀錄:誰決定、依據什麼、何時通知。出問題時,紀錄是唯一能還原事實的東西。'],
merger:['產業整合','國際保險經紀與公證公司持續整併。併購後通常會整合系統與流程,專業能力越清楚可見的人,越容易在新組織中找到位置。'],
freeze:['承保循環','保費與案量會隨承保循環起伏:軟市場保費下降、競爭激烈;硬市場保費上升、承保條件變嚴。從業人員的收入也會跟著波動。'],
hunter:['理賠人才市場','具備大型商業險、工程險、海上險或再保經驗的理賠人才,在保險公司、經紀公司與公證公司之間都相當搶手。'],
cert:['專業證照','國際上常見的理賠相關資格,包括英國特許保險學會(CII)與特許理算師學會(CILA)。證照不等於能力,但能讓國際客戶更快信任你。'],
court:['專家證人','在訴訟中提供專業意見時,要清楚說明方法、依據與限制。法官要的是可理解、可驗證的推論,而不只是結論。'],
soft:['軟市場','承保能量充足時,保費下降、條件放寬,理賠與公證服務也跟著被壓價。低價常伴隨品質下降,這是長期客戶最在意的風險。'],
ai:['AI 在理賠的應用','AI 可以協助摘要條款、分類照片、比對單據、草擬報告,但條款解釋與損失認定仍需專業判斷。引用前一定要核對原始條款。'],
newbie:['經驗傳承','理賠的判斷力大多來自案例。讓新人跟著看現場、讀舊報告、參與計算,是培養公證人最有效的方式。'],
reins:['再保人的理賠參與','大額理賠常需取得再保人同意(理賠合作或理賠控制條款)。再保人會檢視報告的方法與計算,要求補充資料是常態。'],
speaker:['案例分享','公會與研討會的案例分享,能讓同業對理賠標準形成共識,也是建立專業名聲的重要管道。'],
olderr:['報告更正','發現已交付的報告有誤時,應主動通知委託方並出具更正說明。主動更正的成本,遠低於被稽核發現的代價。'],
startup:['設立公證公司','設立公證人公司須符合主管機關對資格、資本與專業人員的要求,並依規定繳存保證金或投保責任保險。創業前要先算清楚案源、人力與現金流。'],
broker:['保險經紀人','保險經紀人基於被保險人的利益洽訂保險,並在理賠時協助整理索賠文件、與保險公司協商。好的經紀人會在事故發生前,就把理賠需要的條件設計進保單。'],
expat:['區域理賠中心','跨國保險集團常在新加坡、香港等地設立區域中心,集中處理亞洲大型案件,讓專業人才與再保資源可以跨國調度。'],
petro:['聯合公證','超大型損失常由多家公證公司聯合處理,依專業分工(結構、設備、營業中斷),並設主公證人統籌報告與對外溝通。'],
lastcase:['長尾理賠','部分責任險或工程險案件,事故與求償可能相隔多年。完整保存舊案資料,是處理長尾理賠的關鍵。'],
earlyout:['退休與年金','提早退休要評估的不只是存款,還有醫療、長照與通膨。年金與醫療保險可以補足退休後的現金流與醫療風險。'],
b1:['經紀人的立場','經紀人代表客戶,也要與保險公司維持長期關係。最穩的做法,是用證據與條款支持索賠,並誠實告知客戶合理的預期。'],
b2:['STP 存貨流通保險','Stock Throughput 保單把貨物從原料採購、運輸、倉儲到成品出貨的全程整合在一張保單,減少運輸險與火險之間的缺口,常見於跨國製造業。'],
b3:['經紀服務的價值','客戶留下來的理由通常不是費率,而是出事時誰能把理賠處理好。防損訓練與理賠成果,是經紀人最有說服力的服務。'],
i1:['理賠準備金','保險公司要依估計的未決賠款提存準備金。刻意低估可以美化短期財報,但違反提存規範,主管機關檢查時會被要求補提並處分。'],
i_audit:['主管機關檢查','金融監理機關會定期檢查保險公司的準備金、理賠流程與內控。決策過程有沒有書面紀錄,常是責任歸屬的關鍵。'],
i2:['理賠效率指標','保險公司常用平均結案天數、未決案件數、客訴率衡量理賠品質。只追求速度而犧牲查核,可能讓詐欺或錯賠增加。'],
i3:['核保與理賠的回饋','理賠資料是核保最好的教材。把事故原因與損失型態回饋給核保,可以改善費率與承保條件。'],
r1:['再保理賠協商','再保理賠爭議常涉及條款解釋、損失分配與事件定義。數據與先例越完整,在國際市場越有話語權。'],
r2:['巨災模型','再保公司用巨災模型評估颱風、地震、洪水的潛在損失,決定承保容量與價格。大型巨災年之後,再保費率通常會上漲。'],
r3:['72 小時條款','巨災再保合約常約定:連續 72 小時內、同一原因造成的損失視為一次事件。事件怎麼切分,會影響自留額要扣幾次、再保人要賠多少。'],
o1:['事務所的現金流','公證行的收入取決於報告完成與委託方付款,帳期可能長達數月。準備足夠的營運資金,是小型事務所的基本功。'],
o2:['客戶集中度','獨家合約帶來穩定案源,也讓公司依賴單一客戶。客戶集中度太高,是小型專業事務所最大的營運風險之一。'],
o3:['合夥協議','合夥創業應事先約定股權、客戶歸屬、競業與退場機制。沒有書面約定時,拆夥往往兩敗俱傷。'],
o4:['地區據點','公證業務高度仰賴在地人脈與到場速度。開設據點前,先用駐點方式確認案源與需求。'],
x1:['火災鑑識','火災原因鑑定會分析燃燒痕跡、起火點、電氣熔痕與助燃劑殘留,是判斷意外、設計缺陷或人為縱火的關鍵。'],
x2:['專家證人的中立','專家證人對法院負責,而不是對委託人負責。意見要建立在可重現的方法上,並清楚說明不確定性。'],
x3:['損失計算方法','常見方法包括修復成本法、重置成本扣折舊、毛利損失法。選用哪一種,要看保單基礎與損失型態。'],
m1:['資深人才與報告品質','公證工作高度依賴資深人員的判斷。裁員或流失資深人員,常直接影響報告品質與客戶信任。'],
m2:['新興產業的保險需求','再生能源、半導體、物流等產業的保險需求快速成長。具備產業知識的理賠團隊,更容易開拓新客群。'],
m3:['關鍵人才風險','專業服務公司最大的資產是人。關鍵人才離職可能帶走客戶,企業常以職涯發展、獎酬與競業約定降低風險。'],
e1:['理賠實務教育','保險公證人須通過國家考試取得資格,執業後也要持續受訓。實務書籍與案例教材,是新人入行最重要的學習資源。'],
e2:['企業風險管理','企業風險管理要從辨識、評估、控制、移轉四個步驟著手。保險只是「移轉」的一種手段,不是全部。'],
e3:['國際再保職涯','國際再保公司重視英文、條款理解與數據分析能力。具體的案例與成果,比空泛的推薦更有說服力。'],
fire1:['故意行為除外','被保險人故意造成的損失屬於除外責任。懷疑人為縱火時,應交由鑑識單位分析,並配合警消調查。'],
fire2:['倉庫火災的多方求償','公共倉庫失火時,貨主可能分別向自己的保險公司、倉庫業者及其責任保險求償。釐清每批貨的所有權、保險與倉儲契約是第一步。'],
fire3:['住宅火險的動產舉證','住宅火險承保建築物與屋內動產,但動產需要舉證。平時拍照或保留購買紀錄,事故後能大幅加快理賠。'],
cargo1:['共同海損','船舶遇險時,為保全船貨所做的犧牲或支出,由船、貨各方按價值比例分攤。貨主通常要提供擔保(多由貨物保險人出具)才能提貨。'],
cargo2:['溫控貨物','冷鏈貨物理賠的關鍵在溫度紀錄。紀錄缺漏時,要結合原始數據、運輸時序與產品穩定性報告,判斷是否真的受損。'],
cargo3:['衝擊記錄器','高價設備運輸常裝設衝擊記錄器。數值超標不等於一定受損,要會同原廠開箱檢測,判斷受損範圍。'],
re1:['太陽能電廠保險','太陽能電廠常投保營運期財產險(含天災)與營業中斷險。颱風損失的爭議常在於:風速是否超過設計規範,還是施工或設計缺陷。'],
re2:['離岸風電施工險','離岸風電施工期多以營造綜合險承保,海纜損壞是最常見也最昂貴的損失之一。施工船租金高,修復速度直接影響損失金額。'],
semi1:['半導體的營業中斷','晶圓廠停機的損失常遠大於設備本身,包括報廢晶圓與營業中斷。計算時要考量產能利用率、在製品、訂單與替代產能。'],
semi2:['煙燻污染','無塵室或電子設備遭煙塵污染,不一定需要整機更換。專業清潔與檢測後,許多設備可以恢復使用,損失會大幅下降。'],
eng1:['第三人責任','施工造成鄰房損害,屬於營造綜合險的第三人意外責任範圍。施工前的鄰房現況鑑定,是釐清責任的重要依據。'],
eng2:['減損費用','為避免或減輕損害所支出的必要費用,保險人依保險法第 33 條負償還責任。及時減損,對被保險人與保險公司都有利。'],
motor1:['過失比例','多車事故依各方過失比例分攤賠償。行車紀錄器、監視器與現場跡證,是重建事故時序的關鍵。'],
motor2:['公共意外責任險','營業場所因設施或管理疏失造成顧客受傷,由公共意外責任險負擔賠償。告示、清潔紀錄與監視器是判斷過失的重要證據。'],
love:['成家後的保險檢視','組成家庭後,壽險保額可依房貸、生活費與子女教育費估算,並指定受益人。這是家庭財務規劃的第一步。'],
baby:['新生兒保險','新生兒可在出生後投保醫療與意外險,部分保單也提供出生前預約投保。規劃以醫療、意外為優先。'],
house:['住宅火險與地震險','辦房貸通常會要求投保住宅火險,並附加住宅地震基本保險。也要檢視保額是否足以重建,避免不足額。'],
family:['家庭的最大風險','家中主要收入者的健康與工作能力,是家庭最大的風險。壽險與失能險,是讓家人在意外時仍能維持生活的安排。'],
crisis:['受益人變更','婚姻狀況改變時,記得檢視並更新壽險受益人與要保人資料,避免保險金給付給不符合原意的人。'],
kidschool:['教育金規劃','子女教育費的支出時間很明確,適合提早用定期儲蓄或投資準備。保險商品是工具之一,要比較費用與彈性。'],
parent:['長期照顧險','長照費用長期且高昂。長照險在被保險人符合失能條件時給付,購買前要看清楚給付條件與等待期。'],
checkup:['告知義務','投保時要誠實告知健康狀況。未告知既往症,保險公司可能在一定期間內解除契約。健康的時候投保,選擇最多。'],
burnout:['失能險','長期過勞引發的疾病可能讓人無法工作。失能保險在符合失能等級時給付,補上收入中斷的缺口。'],
invest:['投資型保單','投資型保單的帳戶價值隨市場波動,沒有保證收益。投保前要了解費用結構與投資標的的風險。'],
marathon:['意外險的定義','意外險承保外來、突發、非疾病引起的傷害。一般路跑受傷通常在承保範圍內,但部分高風險活動可能除外。'],
midlife:['轉職的保障缺口','離開公司後,團體保險的保障也會跟著消失。轉職或創業前,要先補上個人的醫療與壽險保障。'],
crash:['強制險與任意險','汽車強制險只賠體傷、失能與死亡,而且有限額;車損與對他人財物的損失,要靠任意車險。被追撞時,可以先向對方的保險求償。'],
reunion:['人脈與案源','保險業的案源與合作,很多來自同學、前同事與業界人脈。持續經營關係,是專業服務業的長期投資。']

  if(ev.job)S.lj=S.age;

  S.log.push({age:S.age,t:nm(ev)+'|'+lbl(ch)+'('+o.n+')。'+r.t+(flav?' '+flav:'')+(tw?' '+tw.t:''),k:o.g==='b'?'bad':'ev',fx,m:0});
  snap();fresh=S.log.length;

function hex(c){return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function toHex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hex(a),B=hex(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))}
function skyAt(t){
  const st=[[0,'#a8dcff'],[.35,'#86c8f2'],[.65,'#f4cf93'],[.85,'#ee9a72'],[1,'#7a5a96']];
  for(let i=1;i<st.length;i++)if(t<=st[i][0]){const [a,ca]=st[i-1],[b,cb]=st[i];return mix(ca,cb,(t-a)/(b-a))}
  return st[st.length-1][1];
}

  const FL={married:'結婚',house:'購屋',abroad:'外派',divorced:'分開',eng:'英文能力',cert:'國際證照',sprint:'衝刺模式',semi:'退居二線'};
  if(fx.flag&&FL[fx.flag])o.push(chip(FL[fx.flag],'hk'));
  if(fx.kid)o.push(chip('家中添丁','hk'));
  if(fx.route)o.push(chip('轉向'+ROUTES[fx.route].n,'hk'));
  if(fx.big&&fx.big>-9)o.push(chip('大案'+(fx.big>0?'優勢 +':'劣勢 ')+fx.big,fx.big>0?'up':'dn'));
  if(fx.sched)o.push(chip(/^big/.test(fx.sched.id)?'大案下一階段':'埋下伏筆','hk'));
  ['lin','chen','wang'].forEach(k=>{if(fx[k])o.push(chip(NPCN[k]+'好感'+(fx[k]>0?'+':'')+fx[k],fx[k]>0?'up':'dn'))});
  if(fx.st)o.push(chip('狀態:'+STA[fx.st].n+'('+STA[fx.st].y+' 年)','hk'));
  if(fx.sk)o.push(chip('學會:'+SK[fx.sk].n,'hk'));
  if(fx.strat)o.push(chip('理財改為'+STRAT[fx.strat].n,'hk'));
  if(fx.invSell)o.push(chip('賣出'+(fx.invSell<1?'一半':'全部')+'投資','hk'));
  if(fx.invBuy)o.push(chip('加碼投資','hk'));
  if(fx.home)o.push(chip('房產 +'+fx.home+' 萬','up'));
  if(fx.found)o.push(chip('創立'+CO[fx.found].n,'hk'));
  if(fx.res)o.push(chip('公司準備金'+(fx.res>0?'+':'')+fx.res+'萬',fx.res>0?'up':'dn'));
  if(fx.gov)o.push(chip('治理'+(fx.gov>0?'+':'')+fx.gov,fx.gov>0?'up':'dn'));
  if(fx.sz)o.push(chip('公司規模'+(fx.sz>0?'+':'')+fx.sz,fx.sz>0?'up':'dn'));
  if(fx.Vm)o.push(chip('公司估值 ×'+fx.Vm,fx.Vm>=1?'up':'dn'));
  if(fx.pol)o.push(chip('方針改為'+POL[fx.pol].n,'hk'));
  if(fx.sell)o.push(chip('出售公司','hk'));
  if(fx.bust)o.push(chip('公司結束','dn'));
  if(fx.ipo)o.push(chip('公司上市','hk'));
  if(fx.end)o.push(chip('人生轉折','hk'));
  return o.join('');
}

function stage(){

    bar='<div class="yb"><span>'+(paused?'暫停中':'時間流逝中')+'</span><b>'+S.age+' → '+(S.age+1)+' 歲</b></div>'
      +'<div class="ytrack"><u class="run'+(paused?' pz':'')+'" style="animation-duration:'+dur()+'ms;animation-delay:-'+Math.round(prog())+'ms"></u></div>';
  }else if(P==='event'||P==='result'){
    bar='<div class="yb"><span>十字路口,時間暫停</span><b>'+S.age+' 歲</b></div><div class="ytrack"><u class="hold"></u></div>';
  }
  const L=a=>((a-23)/42*100).toFixed(2)+'%';
  const marks=S.log.filter(e=>e.m&&e.age>23).map(e=>'<'+(/轉向/.test(e.t)?'i class="done"':'em')+' style="left:'+L(e.age)+'"></'+(/轉向/.test(e.t)?'i':'em')+'>').join('');

    +'<div class="lscale">'+[23,35,45,55,65].map(a=>'<span style="left:'+L(a)+'">'+a+'</span>').join('')+'</div></div>';

function startView(){
  return '<section class="hero"><span class="stamp">案件卷宗 · 保險公證人</span>'
   +'<h1>冒險公證人</h1>'
   +'<p class="lede">你是一名保險公證人。從 23 歲入行到 65 歲退休,時間會自己往前走。你決定人生重心、在十字路口做選擇。轉職機會隨機出現,可能來得很早,也可能一輩子都沒來。入行背景、專長、任職公司、家庭背景與個性特質都由系統抽籤,不能挑。存下來的錢可以投資,錢夠了也能自己開公司。</p>'
   +'<div class="facts"><div><b>'+E.length+'</b><span>互動事件</span></div><div><b>'+MINOR.length+'</b><span>人生小插曲</span></div><div><b>'+Object.keys(ROUTES).length+'</b><span>職涯路線</span></div><div><b>'+ENDINGS+'</b><span>種結局</span></div></div></section>'
   +'<div><span class="tab">開案設定</span><div class="card">'
   +'<div class="field"><label for="seed">人生代碼(留空則隨機)</label><input id="seed" inputmode="numeric" maxlength="9" placeholder="例如 482913" value="'+startSeed+'"></div>'
   +'<button class="btn" data-a="begin">抽籤入行</button></div></div>'
   +'<details><summary>機率與規則說明</summary>'+probHTML()+'</details>'
   +'<p class="foot">內容純屬虛構。機率為遊戲設計,非真實統計。</p>';
}
function birthView(){
  const row=(k,v,p)=>'<div class="rowkv"><span class="k">'+k+'</span><span class="v">'+v+'</span><span class="p">抽中機率 '+p+'%</span></div>';
  const st=KEYS.map(k=>chip(KN[k]+' '+Math.round(S[k]),'pr')).join('');
  return mast()+stage()
   +'<div><span class="tab">入行檔案</span><div class="card">'
   +row('入行背景',S.bg.n+'。'+S.bg.d,pct(BG,S.bg))
   +row('專長領域',S.sp.n,pct(SP,S.sp))
   +row('任職公司',S.fm.n+'。'+S.fm.x,pct(FM,S.fm))
   +'<div class="rowkv"><span class="k">家庭背景</span><span class="v">'+FB[S.fbg].n+'。'+FB[S.fbg].d+'</span><span class="p">抽中機率 '+FB[S.fbg].w+'%</span></div>'
   +'<div class="rowkv"><span class="k">個性特質</span>'+S.traits.map(x=>'<span class="v">'+TR[x].n+':'+TR[x].d+'</span>').join('')+'</div>'
   +'<div class="rowkv"><span class="k">成長天賦</span><span class="v">天賦:'+KN[S.tal]+'(成長 ×1.4) · 短板:'+KN[S.weak]+'(成長 ×0.7)</span></div>'
   +'<div class="rowkv"><span class="k">起始資產</span><span class="v">'+money(S.cash)+' 萬</span></div>'
   +'<div class="rowkv"><span class="k">起始屬性</span><div class="row">'+st+'</div></div>'
   +'<p class="mute" style="font-size:14px">按下開始後,年齡會自動前進。黃色橫條是這一年的進度。你可以隨時切換人生重心、調整速度或暫停。</p>'
   +'<button class="btn" data-a="enter">開始職涯</button></div></div>';
}
function eventCard(){
  if(P==='event'){
    const br=!!(EV.br||EV.job),bigc=!!EV.big;
    const vr=S.vr?'<p class="var">現場變數:'+S.vr.n+'('+(S.vr.k==='all'?'所有判定':KN[S.vr.k]+'相關判定')+' '+(S.vr.v>0?'+':'−')+Math.abs(S.vr.v)+'%)</p>':'';
    const opts=EV.ch.map((c,i)=>{
      if(!shown(c))return '';
      const ok=open(c);
      let tags='';
      if(c.hid)tags+=chip('隱藏選項 · '+KN[c.hid.k]+' ≥ '+c.hid.v+' 解鎖','hk');
      if(c.hs)tags+=chip('技能選項 · '+SK[c.hs].n,'hk');
      if(!ok)tags+=chip('條件:'+c.lk,'lk');
      else{
        const O=outs(c),cc=cOf(c),bs=bsum(cc);
        tags+=(O.length>1?chip('依'+cLab(cc)+'判定','pr'):'')+(O.length>1&&bs?chip('加成 '+(bs>0?'+':'')+bs+'%',bs>0?'up':'dn'):'')+O.map(x=>chip(x.n+' '+x.p+'%',x.g==='g'?'up':x.g==='b'?'dn':'pr')).join('');
      }
      const rr=c.ok.fx.route||c.ok.fx.found,rt=rr?chip(ROUTES[rr].n+':'+ROUTES[rr].x,'pr'):'';
      return '<button class="opt" data-a="opt" data-v="'+i+'"'+(ok?'':' disabled')+'><b>'+lbl(c)+'</b><span class="row">'+tags+rt+'</span></button>';
    }).join('');
    const bl=bonuses({k:'pro'}).filter(x=>!x[2]&&!['技術專家','國際證照','年輕體力'].includes(x[0]));
    const bline=bl.length?'<p class="var">你的優勢:'+bl.map(x=>x[0]+(x[1]>0?' +':' ')+x[1]+'%').join('、')+'</p>':'';
    return '<div id="evbox"><span class="tab'+(br?' br':'')+'">'+S.age+' 歲 · '+(br?'職涯機會':bigc?'大案':'十字路口')+'</span><div class="card '+(br?'br':'ev')+'"><h2>'+nm(EV)+'</h2><p>'+tx(EV)+'</p>'+vr+bline+'<div class="opts">'+opts+'</div></div></div>';
  }
  if(P==='result'){
    const K=kn(RES.ev);
    return '<div id="evbox"><span class="tab">'+S.age+' 歲 · 結果</span><div class="card ev"><h2>'+nm(RES.ev)+'</h2>'
     +'<p class="mute">你選擇:'+lbl(RES.ch)+'</p>'
     +'<span class="tier '+RES.o.g+'">'+RES.o.n+'</span>'
     +(RES.line?'<p class="last">'+RES.line+'</p>':'')
     +'<p>'+RES.r.t+'</p>'+(RES.flav?'<p class="twist">'+RES.flav+'</p>':'')+(RES.tw?'<p class="twist">'+RES.tw.t+'</p>':'')
     +'<div class="row">'+fxChips(RES.r.fx)+'</div>'
     +(K?'<div class="know"><span class="kt">'+(LIFE.has(RES.ev.id)?'保險小常識':'理賠小教室')+'</span><b>'+K[0]+'</b><p>'+K[1]+'</p></div>':'')
     +'<button class="btn" data-a="cont">'+(RES.end?'查看結局':'繼續人生')+'</button></div></div>';
  }
  return '';
}
function playView(){
  return mast()+stage()+eventCard()+head()+controls()
   +'<div><span class="tab dark">職涯日誌</span><div class="card">'+feedHTML(40)+'</div></div>';
}
function chartSVG(){
  const H=S.hist,W=320,Ht=150,l=28,r=8,t=8,b=20;
  const a0=23,a1=Math.max(H[H.length-1].age,a0+1);
  const x=a=>l+(a-a0)/(a1-a0)*(W-l-r),y=v=>t+(1-v/100)*(Ht-t-b);
  let g=[0,50,100].map(v=>'<line class="gl" x1="'+l+'" x2="'+(W-r)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="tx" x="'+(l-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>').join('');
  g+='<text class="tx" x="'+l+'" y="'+(Ht-5)+'">'+a0+' 歲</text><text class="tx" x="'+(W-r)+'" y="'+(Ht-5)+'" text-anchor="end">'+a1+' 歲</text>';
  const ls=KEYS.map(k=>'<polyline fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:var(--s-'+k+')" points="'+H.map(h=>x(h.age).toFixed(1)+','+y(h[k]).toFixed(1)).join(' ')+'"/>').join('');
  const lg=KEYS.map(k=>'<span><i style="background:var(--s-'+k+')"></i>'+KN[k]+'</span>').join('');
  return '<svg class="ch" viewBox="0 0 '+W+' '+Ht+'" role="img" aria-label="五項屬性隨年齡變化">'+g+ls+'</svg><div class="legend">'+lg+'</div>';
}
function endView(){
  const share='我的《冒險公證人》人生:'+END.t+'|'+RT().n+'・'+rankName()+'|淨資產 '+money(NW())+' 萬|'+S.age+' 歲|經歷 '+S.evc+' 個十字路口|總評 '+END.score+'|人生代碼 '+S.seed;
  const fin=KEYS.map(k=>chip(KN[k]+' '+Math.round(S[k]),'pr')).join('');
  return mast()+stage()
   +'<div><span class="tab">結案報告</span><div class="card">'
   +'<h2>'+END.t+'</h2><p>'+END.d+'</p>'
   +'<div class="score"><b class="mono">'+END.score+'</b><span>職涯總評 / 100</span></div>'
   +'<div class="row">'+chip(S.age+' 歲','pr')+chip(RT().n,'pr')+chip(rankName(),'pr')+chip('淨資產 '+money(NW())+' 萬','pr')+chip(S.evc+' 個十字路口','pr')+fin+'</div>'
   +chartSVG()
   +'<div class="field"><label for="share">分享文字</label><textarea id="share" readonly>'+share+'</textarea></div>'
   +'<button class="btn sec" data-a="copy">複製分享文字</button>'
   +'<button class="btn" data-a="again">重新抽籤,再活一次</button>'
   +'<button class="btn sec" data-a="same">用同一個人生代碼重玩</button></div></div>'
   +'<details><summary>完整職涯紀錄('+S.log.length+' 筆)</summary><div class="dbody">'+feedHTML(999)+'</div></details>';
}
let lastP='';
function render(){
  let h='';
  if(P==='start')h=startView();
  else if(P==='birth')h=birthView();
  else if(P==='run'||P==='event'||P==='result')h=playView();
  else if(P==='end')h=endView();
  app.innerHTML=h;
  if(S&&P!=='start')drawScene(document.getElementById('scene'));
  if(P!==lastP){
    if(P==='start'||P==='birth'||P==='end')window.scrollTo(0,0);
    if(P==='event'){const b=document.getElementById('evbox');if(b&&b.getBoundingClientRect().top>window.innerHeight*0.7)b.scrollIntoView({block:'start',behavior:'smooth'})}
  }
  lastP=P;
  loop();
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='begin'){
    const s=document.getElementById('seed');
    const n=s?parseInt(s.value.replace(/\D/g,''),10):NaN;
    newGame(n>0?n:Math.floor(100000+Math.random()*900000));P='birth';render();
  }
  else if(a==='enter'){P='run';newYear();render()}
  else if(a==='focus'){focus=v;render()}
  else if(a==='strat'){S.strat=v;render()}
  else if(a==='pol'){if(S.co)S.co.pol=v;render()}
  else if(a==='speed'){const f=prog()/dur();speed=v;yrAcc=f*dur();yrRes=now();render()}
  else if(a==='pause'){if(!paused){yrAcc+=now()-yrRes;paused=true}else{paused=false;yrRes=now()}render()}
  else if(a==='opt')choose(+v);
  else if(a==='cont')cont();
  else if(a==='again'){startSeed='';P='start';S=null;END=null;render()}
  else if(a==='same'){newGame(S.seed);P='birth';render()}
  else if(a==='copy'){
    const ta=document.getElementById('share');
    const done=ok=>{b.textContent=ok?'已複製':'請長按文字手動複製'};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>done(true),()=>{ta.focus();ta.select();done(false)});
    }else{ta.focus();ta.select();done(false)}
  }
});
app.addEventListener('change',e=>{if(e.target.id==='autoBox'){auto=e.target.checked;render()}});
app.addEventListener('input',e=>{if(e.target.id==='seed')startSeed=e.target.value});
render();
</script>

</html>
