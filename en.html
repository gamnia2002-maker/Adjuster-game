<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A loss adjuster life-sim: from 23 to retirement at 65, make choices at every crossroads and learn real insurance along the way.">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>The Loss Adjuster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#e8ecef; --card:#f8fafb; --ink:#14212c; --mute:#5a6a77; --line:#c9d3da;
  --accent:#f2b705; --accent-ink:#1b1500; --steel:#2f5d7c;
  --good:#23794a; --bad:#b53a29; --track:#d6dee4;
  --s-pro:#2f5d7c; --s-rep:#b8860b; --s-net:#6a4fa3; --s-hp:#1f8a7a; --s-fam:#c0507a;
  --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1923; --card:#16242f; --ink:#e7eef3; --mute:#97a8b5; --line:#2b3d4b;
    --accent:#f4c430; --accent-ink:#1b1500; --steel:#7fb2d6;
    --good:#4fbf86; --bad:#ee7b68; --track:#243543;
    --s-pro:#6fa8d1; --s-rep:#f2c14e; --s-net:#a98be0; --s-hp:#4fcbb4; --s-fam:#ee8aa8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1923; --card:#16242f; --ink:#e7eef3; --mute:#97a8b5; --line:#2b3d4b;
  --accent:#f4c430; --accent-ink:#1b1500; --steel:#7fb2d6;
  --good:#4fbf86; --bad:#ee7b68; --track:#243543;
  --s-pro:#6fa8d1; --s-rep:#f2c14e; --s-net:#a98be0; --s-hp:#4fcbb4; --s-fam:#ee8aa8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.75 var(--f-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.mast b{font:900 20px/1.2 var(--f-display);letter-spacing:.06em}
.code{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.04em}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero h1{font-size:clamp(34px,10vw,48px);font-weight:900;letter-spacing:.04em}
.hero .lede{font-size:17px;max-width:34em}
.stamp{align-self:flex-start;font:700 12px var(--f-mono);letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:3px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts div{border-top:2px solid var(--ink);padding-top:6px;line-height:1.3}
.facts b{display:block;font:700 22px var(--f-mono)}
.facts span{font-size:12px;color:var(--mute)}

.tab{display:inline-block;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-mono);letter-spacing:.1em;padding:5px 12px;border-radius:5px 5px 0 0;margin-bottom:-1px;position:relative}
.tab.dark{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.card.ev{border:2px solid var(--accent)}
.card.br{border:2px solid var(--steel)}
.tab.br{background:var(--steel);color:var(--card)}
.card h2{font-size:22px}
.last{font:500 13px/1.6 var(--f-mono);color:var(--mute);border-left:3px solid var(--line);padding-left:10px}


.stage{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:10px}
canvas.scene{display:block;width:100%;height:auto;aspect-ratio:120/56;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px;background:#a8dcff}
.cap{font-size:12px;color:var(--mute);line-height:1.5}
.yb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mute)}
.yb b{font:700 12px var(--f-mono);color:var(--ink)}
.ytrack{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.ytrack u{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.ytrack u.run{animation-name:yfill;animation-timing-function:linear;animation-fill-mode:forwards}
.ytrack u.pz{animation-play-state:paused}
.ytrack u.hold{transform:scaleX(1);background:var(--steel)}
@keyframes yfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.life{display:flex;flex-direction:column;gap:4px}
.ltrack{position:relative;height:14px;background:var(--track);border-radius:3px}
.ltrack>u{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.82;border-radius:3px 0 0 3px;transition:width .4s}
.ltrack i{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;transform:rotate(45deg);border:2px solid var(--steel);background:var(--card)}
.ltrack i.done{background:var(--steel)}
.ltrack em{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--accent)}
.lscale{position:relative;height:14px;font:500 11px/14px var(--f-mono);color:var(--mute)}
.lscale span{position:absolute;transform:translateX(-50%)}
.lscale span:first-child{transform:none}
.lscale span:last-child{transform:translateX(-100%)}

.hdr{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 12px}
.kv{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.kv span{font-size:12px;color:var(--mute)}
.kv b{font:700 16px var(--f-mono)}
.kv b.zh{font:700 15px var(--f-body)}
.sts{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:6.6em 1fr 3.9em;align-items:center;gap:10px;font-size:13px}
.st i{display:block;height:8px;background:var(--track);border-radius:2px;overflow:hidden}
.st u{display:block;height:100%;border-radius:2px;transition:width .4s}
.st b{text-align:right;font:700 13px var(--f-mono)}
.st b.low{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.prof{display:flex;flex-direction:column;gap:2px}
.var.warn{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.linkbtn{all:unset;cursor:pointer;font-size:13px;color:var(--steel);text-decoration:underline;align-self:flex-start}
.linkbtn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.prof b{color:var(--ink);font-weight:700}

.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--mute);letter-spacing:.06em}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer}
.auto input{width:18px;height:18px;accent-color:var(--steel)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.s4{grid-template-columns:repeat(4,1fr)}
@media (max-width:460px){.seg.s4{grid-template-columns:1fr 1fr}.facts{grid-template-columns:1fr 1fr}}
.seg button{all:unset;box-sizing:border-box;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;line-height:1.35;background:var(--bg)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.pbtn{all:unset;box-sizing:border-box;padding:8px 14px;border-radius:6px;border:1px solid var(--ink);font:700 14px var(--f-body);cursor:pointer;min-width:6em;text-align:center}
.pbtn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;line-height:1.55}
.opt:hover{border-color:var(--steel)}
.opt[disabled]{cursor:not-allowed;opacity:.5}
.opt[disabled]:hover{border-color:var(--line)}
.opt:focus-visible,.btn:focus-visible,.seg button:focus-visible,.pbtn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.opt b{font-weight:700;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 12px/1.2 var(--f-mono);padding:4px 7px;border-radius:3px;border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:currentColor}
.chip.dn{color:var(--bad);border-color:currentColor}
.chip.pr{color:var(--steel);border-color:currentColor}
.chip.hk{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lk{color:var(--mute);border-style:dashed}
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;padding:13px 18px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);cursor:pointer;letter-spacing:.06em}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mute)}
.field input,.field textarea{font:500 16px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.field textarea{font:400 14px/1.6 var(--f-body);resize:none;height:84px}

.rowkv{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rowkv:last-of-type{border-bottom:0;padding-bottom:0}
.rowkv .k{font-size:12px;color:var(--mute)}
.rowkv .v{font-weight:700}
.rowkv .p{font:500 12px var(--f-mono);color:var(--steel)}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.feed li:last-child{border-bottom:0}
.feed li>span{font:700 12px/1.9 var(--f-mono);color:var(--mute)}
.feed li div{min-width:0;display:flex;flex-direction:column;gap:4px}
.feed li.up b,.feed li.up>div>span:first-child{color:var(--good)}
.feed li.bad b{color:var(--bad)}
.feed li.ev b{color:var(--steel)}
.feed li.new{animation:fresh .6s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--accent) 30%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.feed li.new{animation:none}.st u,.ltrack>u{transition:none}}

.score{display:flex;align-items:baseline;gap:10px}
.score b{font:900 56px/1 var(--f-display)}
.score span{color:var(--mute);font:500 13px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
svg.ch{width:100%;height:auto;display:block}
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--mute);font:9px var(--f-mono)}

details{border:1px solid var(--line);border-radius:6px;background:var(--card)}
summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:15px}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tbl{overflow-x:auto}
.foot{font-size:12px;color:var(--mute);text-align:center}
.know{border:1px dashed var(--steel);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.know .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.know b{font-size:15px}
.know p{font-size:14px;line-height:1.75}
.var{font-size:13px;line-height:1.6;background:color-mix(in srgb,var(--accent) 20%,transparent);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 4px 4px 0}
.tier{font:700 14px var(--f-mono);letter-spacing:.08em}
.tier.g{color:var(--good)}.tier.b{color:var(--bad)}.tier.m{color:var(--steel)}
.twist{font-size:14px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}
.feed li.mk>div>span:first-child{color:var(--s-rep);font-weight:700}
.clause{margin:0;border-left:3px solid var(--steel);background:var(--bg);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px;line-height:1.75;display:flex;flex-direction:column;gap:4px}
.clause .kt,.clans .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.clans{border:1px solid var(--steel);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.clans b{font-size:15px}
.clans .ok{color:var(--good);font:700 13px var(--f-mono)}.clans .ng{color:var(--bad);font:700 13px var(--f-mono)}
.clans p{font-size:14px;line-height:1.75}
.src{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.03em}
.tab.hist{background:var(--ink);color:var(--bg)}
.dexh{font-size:clamp(28px,8vw,40px)!important}
.dexsum{display:flex;align-items:baseline;gap:10px;border-top:2px solid var(--ink);padding-top:8px}
.dexsum b{font-size:34px;font-weight:700}
.dexsum span{color:var(--mute);font-size:13px}
.dexc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.dexc>summary{display:grid;grid-template-columns:1fr auto;gap:6px 10px;cursor:pointer;font-weight:700;list-style:none}
.dexc>summary::-webkit-details-marker{display:none}
.dexc>summary i{grid-column:1/-1;display:block;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.dexc>summary u{display:block;height:100%;background:var(--accent)}
.dexc ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.dexc li{font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.dexc li summary{cursor:pointer;font-weight:500}
.dexc li p{margin-top:6px;color:var(--mute);line-height:1.75}
.dexc li.lock{color:var(--mute);display:flex;justify-content:space-between;gap:10px}
.dexc li.lock span{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap;align-self:flex-start}
.endc{gap:16px}
.idcard{width:100%;max-width:380px;margin:0 auto;height:auto;display:block;border-radius:12px;box-shadow:0 8px 24px rgba(20,33,44,.22);background:#f7f4ec}
.sum{font:700 19px/1.65 var(--f-display);border-left:4px solid var(--accent);padding-left:12px;text-wrap:pretty}
.story{display:flex;flex-direction:column;gap:6px}
.story .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.story p{font-size:16px;line-height:1.95}
.endbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:-6px 0 0}
.linkbtn.inl{display:inline;font-size:12px;align-self:auto}
.term{border-bottom:1px dashed var(--steel);cursor:help}
.term:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.gpop{position:absolute;z-index:50;background:var(--card);color:var(--ink);border:1px solid var(--steel);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font:400 14px/1.7 var(--f-body)}
.gpop b{display:block;color:var(--steel);font-size:14px;margin-bottom:2px}
.gpop p{margin:0}
.works,.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.works li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px;font-size:15px}
.works li span{font-size:12px;color:var(--mute)}
.works li em{font-style:normal;font:700 12px var(--f-mono);color:var(--good)}
.goals li{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px}
.goals li i{font-style:normal;font:700 14px var(--f-mono);width:20px;flex:none;text-align:center}
.goals li.ok i{color:var(--good)}.goals li.no i{color:var(--mute)}
.goals li div{display:flex;flex-direction:column}
.goals li b{font-size:15px}.goals li span{font-size:13px;color:var(--mute)}
.goals li.no b{color:var(--mute)}
.dtabs{display:flex;gap:8px}
.dtabs button{flex:1;font:700 14px var(--f-body);padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.dtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.achsum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.achsum div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.achsum b{font-size:22px}
.achsum span{font-size:12px;color:var(--mute)}
.dexc li.achok{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dexc li.achok em{font-style:normal;font-size:12px;color:var(--good);white-space:nowrap}
.dexc li.achok span{line-height:1.6}
</style>
</head>

 own:{n:'Own adjusting practice',r:['Studio Owner','Studio Owner','Practice Owner','Practice Owner','Regional Practice Owner','Adjusting Group Chair'],m:1.3,d:1.6,off:{net:5},x:'Highest income, highest risk'},

 {l:'Keep your head down until it blows over',c:{k:'rep',b:55,s:.6},ok:{t:'You survive.',fx:{hp:-2}},ng:{t:'You are laid off anyway. It takes three months to find a new job.',fx:{cash:-20,hp:-4,fam:-2,raise:-.05}}}
]},
{id:'freeze',n:'Pay freeze',w:6,t:'The firm announces a pay freeze this year, and bonuses shrink.',ch:[
 {l:'Teach outside courses for extra income',ok:{t:'Your weekends go to teaching. Income recovers; you are tired.',fx:{cash:10,hp:-3,net:2}}},
 {l:'Put your energy back into family',ok:{t:'A little less money, a little more warmth at home.',fx:{fam:4,cash:-5}}},
 {l:'Talk to your manager',c:{k:'rep',b:45,s:.8},ok:{t:'Your manager wins you a special raise.',fx:{raise:.05}},ng:{t:'Your manager shrugs. It is awkward for you both.',fx:{net:-2,hp:-1}}}
]},
{id:'hunter',n:'A headhunter calls',w:8,yrs:[5,35],t:'A headhunter calls: a competitor offers 30% more to lead a team.',ch:[
 {l:'Jump ship',c:{k:'rep',b:55,s:.7},ok:{t:'More resources, and the pay is real.',fx:{raise:.18,net:-3,pro:3,hp:-2,rep:2}},ng:{t:'The new firm’s management style doesn’t suit you. Six months in, you think it was a mistake.',fx:{raise:.08,hp:-5,fam:-3,net:-4}}},
 {l:'Stay, and use the offer to negotiate',c:{k:'rep',b:45,s:.8},ok:{t:'Your firm wants to keep you. The raise is bigger than expected.',fx:{raise:.1,rep:1}},ng:{t:'Your boss thinks you are making threats. The relationship cools.',fx:{rep:-2,net:-2}}},
 {l:'Not interested',ok:{t:'You turn down the headhunter. A little regret, a little peace.',fx:{fam:1,hp:1}}}
]},
{id:'cert',n:'International qualification',w:10,yrs:[1,25],once:1,t:'You consider an international loss adjusting qualification. It will eat every weekend for a year.',ch:[
 {l:'Sign up and go for it',c:{k:'pro',b:40,s:1},ok:{t:'You pass. Clients look at you differently.',fx:{flag:'cert',pro:8,rep:5,hp:-4,fam:-3,cash:-8}},ng:{t:'You fail the first attempt and must try again next year.',fx:{pro:4,hp:-4,fam:-4,cash:-8}}},
 {l:'Focus on practice for now',ok:{t:'You keep your time for sites and family.',fx:{fam:2,hp:1}}}
]},
{id:'court',n:'Testifying in court',w:7,yrs:[4,40],t:'The insured disputes your report and files a civil suit. You are called to testify.',ch:[
 {l:'Prepare data, photos and methods item by item',c:{k:'pro',b:50,s:1},ok:{t:'Your logic holds under cross-examination. The court adopts your analysis.',fx:{rep:7,pro:4,net:2}},ng:{t:'Opposing counsel finds one assumption. The judge asks for more explanation.',fx:{rep:-5,hp:-3}}},
 {l:'Only answer what is asked',ok:{t:'You avoid risk, but do not show your expertise.',fx:{rep:1,hp:-1}}}
]},
{id:'soft',n:'Soft market price war',w:7,t:'The market softens. Case volumes shrink and competitors cut prices.',ch:[
 {l:'Hold quality, don’t cut prices',c:{k:'rep',b:45,s:.9},ok:{t:'Several key clients stay.',fx:{rep:4,net:2,cash:-10}},ng:{t:'You lose two clients and revenue clearly drops.',fx:{cash:-30,net:-3}}},
 {l:'Cut prices to keep volume',ok:{t:'You keep the volume, but margins are thin and you are run ragged.',fx:{cash:-5,hp:-4,rep:-1}}},
 {l:'Use the slow season to study and build a case library',ok:{t:'Business is weak, but you are better prepared for the next upturn.',fx:{pro:5,cash:-15,hp:2}}}
]},
{id:'ai',n:'AI tools arrive',w:10,yrs:[8,40],once:1,t:'The firm rolls out AI tools that summarize wordings, sort photos and draft reports.',ch:[
 {l:'Learn it and make it your own tool',c:{k:'pro',b:60,s:.6},ok:{t:'You hand repetitive work to the tool and focus on judgment.',fx:{pro:5,rep:3,hp:3}},ng:{t:'You trust the tool too much. One report cites a clause that doesn’t exist.',fx:{rep:-6,pro:1}}},
 {l:'Stick to your old ways',ok:{t:'Your colleagues quietly pull ahead of you.',fx:{pro:-1,hp:-2}}}
]},
{id:'newbie',n:'Mentoring juniors',w:9,yrs:[8,40],t:'The firm assigns you two new hires. They are smart, with endless questions.',ch:[
 {l:'Teach everything and let them shadow cases',ok:{t:'They improve fast, and teaching sharpens your own method.',fx:{net:4,rep:3,pro:2,hp:-2}}},
 {l:'Just give them tasks',ok:{t:'You save time, but when they slip up, you clean up.',fx:{hp:-2,rep:-1}}}
]},
{id:'reins',n:'Reinsurer review',w:7,when:s=>s.rank>=3&&s.track!=='rei',t:'An international reinsurer comes to Taiwan to review a claim worth millions and asks for your report and model.',ch:[
 {l:'Present in English, starting with your method',c:{k:'pro',b:45,s:1},ok:{t:'The reinsurer accepts your framework and wants you on more international cases.',fx:{rep:8,pro:4,net:6,cash:40}},ng:{t:'The reinsurer raises many questions. You must recalculate and resubmit.',fx:{rep:-3,hp:-6,pro:3}}},
 {l:'Ask your manager to present',ok:{t:'Someone else carries the risk. You miss your international moment.',fx:{net:1,rep:-1}}}
]},
{id:'speaker',n:'Conference speaker',w:7,when:s=>s.rank>=3,t:'The non-life insurance association invites you to share a major loss case at its annual conference.',ch:[
 {l:'Prepare the case and present',c:{k:'pro',b:55,s:.7},ok:{t:'People line up to give you their cards afterwards.',fx:{rep:6,net:6,cash:10,hp:-2}},ng:{t:'One question stumps you. It is awkward.',fx:{rep:-2,net:2,pro:2}}},
 {l:'Decline and focus on cases',ok:{t:'You save your time and miss the stage.',fx:{hp:2,net:-1}}}
]},
{id:'olderr',n:'A calculation error from three years ago',w:7,yrs:[3,40],t:'Reviewing old files, you find an error in a report from three years ago that affects the payment by about 5%. No one has noticed.',ch:[
 {l:'Notify them and correct it',ok:{t:'They are stunned at first, then thank you for your honesty.',fx:{rep:5,pro:2,cash:-10,sched:{id:'trust',in:[3,6]}}}},
 {l:'Pretend you didn’t see it',a:.2,c:{k:'rep',b:75,s:0},ok:{t:'All quiet, but every time you see that file number, you pause.',fx:{rep:-2,hp:-1}},ng:{t:'The reinsurer finds it on review. Your credibility takes a big crack.',fx:{rep:-25,cash:-30}}}
]},
{id:'startup',n:'A partnership offer',w:5,job:1,when:s=>s.rank>=2&&s.age>=32&&s.age<=58&&s.track!=='own'&&!s.f.semi,t:'A peer invites you to found an independent practice. You bring the expertise, he brings capital and clients.',ch:[
 {l:'Found it and take the gamble',c:{k:'net',b:35,s:1},ok:{t:'The first two years are hard, but your reputation builds a client base. The practice survives.',fx:{route:'own',cash:80,net:6,rep:3,hp:-6,fam:-4}},ng:{t:'Clients fall short and cash runs tight. You leave quietly.',fx:{cash:-120,rep:-4,hp:-8,fam:-5}}},
 {l:'Stay where you are',ok:{t:'You choose stability, though sometimes you wonder “what if.”',fx:{fam:2,hp:1}}}
]},
{id:'broker',n:'A broker’s invitation',w:5,job:1,when:s=>s.rank>=1&&s.age>=27&&s.age<=52&&s.net>=40&&s.track!=='brk',t:'An international insurance broker invites you to manage claims for its large clients.',ch:[
 {l:'Move to the broker',c:{k:'net',b:50,s:.8},ok:{t:'You learn to design whole claims strategies from the client’s side.',fx:{route:'brk',raise:.15,net:5,pro:2}},ng:{t:'Broking moves faster than you expected. It takes you two years to find your feet.',fx:{route:'brk',raise:.05,hp:-4,net:-2}}},
 {l:'Decline',ok:{t:'You like being on site.',fx:{pro:2,rep:1}}}
]},
{id:'expat',n:'Posting to Singapore',w:6,once:1,when:s=>s.rank>=2&&s.age>=30&&s.age<=50&&!s.f.semi,t:'Your firm wants to send you to its Singapore regional hub for three years to handle large Southeast Asian losses.',ch:[
 {l:'Move the whole family',show:s=>s.f.married,ok:{t:'The kids change schools and your partner gives up a job. You start over abroad together.',fx:{net:6,pro:4,raise:.12,fam:-2,cash:10,flag:'abroad'}}},
 {l:'Go alone',c:{k:'fam',b:55,s:.8},ok:{t:'Weekly video calls, home every quarter. You make it through.',fx:{net:6,pro:4,raise:.12,fam:-6,flag:'abroad'}},ng:{t:'Three years later you come home and feel like a guest.',fx:{net:5,pro:3,raise:.12,fam:-14,hp:-3,flag:'abroad'}}},
 {l:'Decline',ok:{t:'You stay in Taiwan. The firm sends someone else.',fx:{fam:3,net:-2}}}
]},
{id:'petro',n:'Petrochemical plant explosion',w:4,yrs:[6,40],t:'A petrochemical plant explodes. Losses are estimated in the hundreds of millions of dollars, and the international reinsurers want a joint adjustment.',ch:[
 {l:'Push to take the lead',c:{k:'pro',b:40,s:1.1},ok:{t:'You lead a once-in-a-decade case, and the industry talks about your report.',fx:{pro:6,rep:8,net:5,cash:40,hp:-5}},ng:{t:'The pressure is too much. The international team sidelines you.',fx:{rep:-3,hp:-6,pro:3}},gr:{t:'Your report becomes a reference case for the Asian reinsurance market.',fx:{pro:8,rep:12,net:8,cash:60,hp:-4}}},
 {l:'Take a supporting role',ok:{t:'You learn how international teams work.',fx:{pro:3,net:3,cash:15,hp:-2}}},
 {l:'Stay out of it',ok:{t:'You miss the industry’s case of the decade.',fx:{pro:-1,net:-1,hp:1}}}
]},
{id:'lastcase',n:'The last case',w:30,once:1,when:s=>s.age>=62,t:'Just before you retire, an insured you handled twenty years ago has another loss and asks for you by name.',ch:[
 {l:'Take it yourself',c:{k:'pro',b:60,s:.6},ok:{t:'Like your younger self, you get every detail right.',fx:{rep:6,net:3}},ng:{t:'Your body can’t keep up. You twist an ankle on site.',fx:{hp:-6,rep:-1}}},
 {l:'Give it to someone you trained and advise',ok:{t:'They do great. The client says: “You taught them well.”',fx:{net:5,rep:3}}},
 {l:'Decline and enjoy retirement',ok:{t:'You keep the time for yourself.',fx:{fam:4,hp:3}}}
]},
{id:'earlyout',n:'Retire early?',w:8,once:1,when:s=>s.age>=50&&s.age<=60&&NW()>=1500,t:'Your financial planner looks at your balance sheet: “You could actually retire now.”',ch:[
 {l:'Retire',ok:{t:'You hand in your access card.',fx:{fam:6,hp:6,end:{t:'The early retiree',d:'You didn’t wait until 65. On an ordinary Friday you handed in your access card, and on the drive home you didn’t take a single call.'}}}},
 {l:'Work a few more years',ok:{t:'You can’t let go of the field yet.',fx:{rep:2,hp:-2}}}
]},

{id:'b1',n:'A client wants you to push',route:['brk'],w:10,t:'Before renewal, a big client’s CFO hints: “If this claim isn’t paid in full, we change brokers next year.”',ch:[
 {l:'Build a complete claim file and negotiate on evidence',c:{k:'pro',b:50,s:.9},ok:{t:'Your file convinces the insurer, and the client happily renews.',fx:{rep:4,net:3,cash:15}},ng:{t:'The evidence isn’t strong enough. You only get 80%, and the client is disappointed.',fx:{net:-4,hp:-3}}},
 {l:'Lean on the insurer through your network',c:{k:'net',b:50,s:.8},ok:{t:'The insurer does you a favor.',fx:{net:2,cash:15,rep:-1}},ng:{t:'The insurer feels pressured, and the relationship cracks.',fx:{net:-5,rep:-3}}},
 {l:'Tell the client honestly what to expect',ok:{t:'The CFO isn’t pleased, but renews the following year anyway.',fx:{rep:3,net:-3}}}
]},
{id:'b2',n:'A global master policy',route:['brk'],w:10,t:'A multinational client asks you to design an STP policy covering its global cargo and inventory.',ch:[
 {l:'Lead the team and review risks country by country',c:{k:'pro',b:45,s:1},ok:{t:'The policy goes live and handles three cross-border claims in its first year.',fx:{pro:6,rep:5,cash:30,hp:-4}},ng:{t:'Regulations differ too much by country. The project slips six months.',fx:{pro:3,hp:-6}},gr:{t:'The policy becomes the firm’s standard structure across Asia-Pacific.',fx:{pro:7,rep:9,net:5,cash:50}}},
 {l:'Split the work with overseas colleagues',ok:{t:'Things go smoothly, and you make a name inside the group.',fx:{net:4,pro:2}}},
 {l:'Tweak an existing structure',ok:{t:'The client accepts, but isn’t impressed.',fx:{hp:1,rep:-1}}}
]},
{id:'b3',n:'A client being poached',route:['brk'],w:8,t:'A competitor offers lower fees to win away your big client.',ch:[
 {l:'Let your claims track record speak',c:{k:'rep',b:50,s:.9},ok:{t:'The client says: “When there’s a claim, you’re the one I trust.”',fx:{rep:3,net:3}},ng:{t:'The client leaves anyway.',fx:{cash:-20,net:-4}}},
 {l:'Match the lower price',ok:{t:'The client stays; margins shrink.',fx:{cash:-10,net:2}}},
 {l:'Add value: free loss-prevention training',ok:{t:'You train the client’s warehouse staff yourself. The client is touched.',fx:{pro:2,net:4,hp:-3}}}
]},

{id:'i1',n:'Dressing up the reserves',route:['ins'],w:10,t:'Before quarter-end, finance wants claims to “lower” the reserves on several big cases.',ch:[
 {l:'Refuse and reserve on actual assessment',ok:{t:'The CFO doesn’t look at you once in the meeting.',fx:{rep:5,net:-4}}},
 {l:'Reassess properly based on new information',c:{k:'pro',b:55,s:.8},ok:{t:'A few can genuinely be adjusted. You give figures both sides accept.',fx:{pro:3,rep:2,net:2}},ng:{t:'The reassessment doesn’t hold up. The actuaries send it back.',fx:{rep:-2,hp:-2}}},
 {l:'Do as asked',a:.2,ok:{t:'The quarterly report looks great.',fx:{net:4,rep:-6,sched:{id:'i_audit',in:[1,3]}}}}
]},
{id:'i_audit',n:'Regulator inspection',w:0,t:'The regulator finds the reserves were inadequate and asks the claims department to explain.',ch:[
 {l:'Take responsibility',ok:{t:'You are reprimanded, but colleagues look at you with new respect.',fx:{rep:-8,cash:-10}}},
 {l:'Explain it was finance’s instruction',c:{k:'net',b:45,s:.8},ok:{t:'The inspection report records the decision process. You receive only a light penalty.',fx:{rep:-3,net:-2}},ng:{t:'There is nothing in writing. All the blame lands on you.',fx:{rep:-12,net:-6}}}
]},
{id:'i2',n:'Halve the time to close',route:['ins'],w:9,t:'Management wants the average claim closing time cut in half.',ch:[
 {l:'Improve the process and systems',c:{k:'pro',b:50,s:.8},ok:{t:'Closing time drops 40%, and you win the annual award.',fx:{pro:3,rep:3,raise:.04}},ng:{t:'The new system has problems and makes things slower.',fx:{hp:-4,rep:-1}}},
 {l:'Push your adjusters to go faster',ok:{t:'The adjusters start complaining about you.',fx:{net:-3,rep:1}}},
 {l:'Have the team work overtime',ok:{t:'The numbers are met, and the team is exhausted.',fx:{hp:-6,rep:2}}}
]},
{id:'i3',n:'An invitation from underwriting',route:['ins'],w:8,t:'Underwriting wants you to help assess a high-risk factory.',ch:[
 {l:'Join and bring claims experience to underwriting',ok:{t:'The three risks you flag lead the insurer to decline a policy that later has a real loss.',fx:{pro:4,net:3,rep:2,hp:-2}}},
 {l:'Decline and focus on claims',ok:{t:'You stick to your core job.',fx:{hp:1,pro:1}}}
]},

{id:'r1',n:'The London meeting room',route:['rei'],w:10,t:'In a London market meeting room, you must defend the payment position on a big Asian loss, in English.',ch:[
 {l:'Prepare data and precedents and face it head on',c:{k:'pro',b:45,s:1},ok:{t:'Afterwards, a senior underwriter comes over to shake your hand.',fx:{rep:7,net:5,pro:3}},ng:{t:'The follow-up questions keep coming. In the end you can only say “we’ll follow up.”',fx:{rep:-3,hp:-4}},gr:{t:'Your position is accepted in full, and head office gives you a raise.',fx:{rep:10,net:8,pro:4,raise:.05}}},
 {l:'Let a London colleague lead; you handle the data',ok:{t:'Safe, but the credit goes to your colleague.',fx:{net:2,rep:-1}}}
]},
{id:'r2',n:'Catastrophe season',route:['rei'],w:9,t:'Three major hurricanes and floods hit the world in one year. You spend half the year traveling.',ch:[
 {l:'Throw yourself into it',ok:{t:'You see disaster zones on three continents.',fx:{pro:4,rep:4,hp:-8,fam:-6,cash:25}}},
 {l:'Ask for a rotation to protect family time',c:{k:'net',b:50,s:.7},ok:{t:'Your manager agrees.',fx:{fam:3,hp:-2}},ng:{t:'Your manager says: “That’s the job.”',fx:{fam:-2,net:-3}}}
]},
{id:'r3',n:'The 72-hour clause',route:['rei'],w:9,t:'A typhoon plus five days of rain. How the reinsurance “72-hour clause” splits the event affects tens of millions.',ch:[
 {l:'Split events hour by hour using weather data',c:{k:'pro',b:45,s:1.1},ok:{t:'Your method becomes a reference in later disputes.',fx:{pro:5,rep:5}},ng:{t:'The cedant’s lawyers find gaps in your data.',fx:{pro:2,rep:-3,hp:-3}}},
 {l:'Negotiate a compromise with the cedant',ok:{t:'You keep the relationship, but head office thinks you gave away too much.',fx:{net:4,rep:-1}}}
]},

{id:'o1',n:'Can’t make payroll',route:['own'],w:9,t:'Two big clients are paying late. You may not be able to pay salaries next month.',ch:[
 {l:'Advance it from your own savings',ok:{t:'Your staff never know. Only you do.',fx:{cash:-80,net:3,rep:2}}},
 {l:'Borrow from the bank',c:{k:'rep',b:50,s:.6},ok:{t:'The bank lends on the strength of your credit.',fx:{cash:-20}},ng:{t:'The interest rate is high. You take on more debt.',fx:{cash:-50,hp:-4}}},
 {l:'Delay pay and explain honestly',ok:{t:'Two employees quit.',fx:{net:-5,rep:-3}}}
]},
{id:'o2',n:'An exclusive deal',route:['own'],w:9,t:'A large insurer offers an exclusive arrangement, if you cut your fees by 20%.',ch:[
 {l:'Accept for stable work',ok:{t:'More cases than you can handle, but thinner margins.',fx:{cash:40,rep:-1,hp:-3}}},
 {l:'Refuse and stay independent',ok:{t:'One big client fewer, a bit more freedom.',fx:{rep:4,cash:-10}}},
 {l:'Counter-offer with a performance bonus',c:{k:'net',b:45,s:.9},ok:{t:'They accept. Everyone wins.',fx:{cash:50,net:3}},ng:{t:'They walk away and go to someone else.',fx:{net:-3}}}
]},
{id:'o3',n:'A partner wants out',route:['own'],w:7,t:'Your partner wants to take half the clients and go solo.',ch:[
 {l:'Part on good terms with a written split',ok:{t:'Half the clients gone, half the arguments too.',fx:{cash:-60,net:-3,hp:2}}},
 {l:'Persuade him to stay with some equity',c:{k:'net',b:50,s:.8},ok:{t:'He stays, and the firm is more stable.',fx:{cash:-20,net:4}},ng:{t:'He takes the equity and leaves anyway.',fx:{cash:-60,hp:-5}}},
 {l:'Go to court',ok:{t:'Two years of litigation. Both sides lose.',fx:{cash:-30,rep:-3,hp:-4}}}
]},
{id:'o4',n:'Opening a branch',route:['own'],w:7,t:'There is demand in the south. You consider a branch in Kaohsiung.',ch:[
 {l:'Open it',c:{k:'net',b:45,s:.9},ok:{t:'The branch breaks even in its second year.',fx:{cash:80,net:5,rep:3,hp:-4}},ng:{t:'Without local connections, the branch closes after a year.',fx:{cash:-100,hp:-5}}},
 {l:'Station someone there first to test the waters',ok:{t:'Steady, but slow.',fx:{net:2,cash:-10}}}
]},

{id:'x1',n:'Forensics lab',route:['exp'],w:9,t:'The firm will invest in a fire and electrical forensics lab, with you in charge.',ch:[
 {l:'Take it on',c:{k:'pro',b:50,s:.9},ok:{t:'In its first year, the lab cracks two arson cases.',fx:{pro:7,rep:5,hp:-4}},ng:{t:'Equipment purchasing is delayed. The lab opens six months late.',fx:{pro:3,hp:-5,rep:-2}}},
 {l:'Suggest partnering with a university first',ok:{t:'Low cost, and the students become your reserve team.',fx:{pro:3,net:3}}}
]},
{id:'x2',n:'Expert witness',route:['exp'],w:9,t:'The court appoints you as expert witness in a major workplace accident case.',ch:[
 {l:'Accept',c:{k:'pro',b:50,s:1},ok:{t:'The judgment cites your expert opinion.',fx:{rep:7,pro:3,cash:15}},ng:{t:'The other side’s expert clashes with you, and the judge sides with them.',fx:{rep:-5,hp:-3}}},
 {l:'Decline to avoid a conflict of interest',ok:{t:'The industry remembers your caution.',fx:{rep:2}}}
]},
{id:'x3',n:'Journal invitation',route:['exp'],w:8,t:'An international journal invites you to publish your loss quantification method.',ch:[
 {l:'Write it through the night',ok:{t:'The paper is published and overseas peers start citing your method.',fx:{pro:4,rep:4,hp:-4,fam:-2}}},
 {l:'Let a junior write it under your guidance',ok:{t:'The junior makes a name, and stays grateful to you.',fx:{net:3,rep:2}}}
]},

{id:'m1',n:'The layoff list',route:['mgr'],w:9,t:'You are told to cut two people from your team.',ch:[
 {l:'Decide on performance and tell them yourself',ok:{t:'You get home very late that day.',fx:{rep:2,net:-3,hp:-3}}},
 {l:'Fight to keep everyone with a team-wide pay cut',c:{k:'rep',b:45,s:.8},ok:{t:'The team is saved, and more loyal than ever.',fx:{net:5,raise:-.05}},ng:{t:'Management refuses and sees you as uncooperative.',fx:{net:-2,rep:-3}}},
 {l:'Hand the list to HR',ok:{t:'You keep your distance, and the team keeps theirs.',fx:{net:-5,hp:1}}}
]},
{id:'m2',n:'Targets up 30%',route:['mgr'],w:9,t:'Head office raises next year’s targets by 30%.',ch:[
 {l:'Lead the team into a new market',c:{k:'net',b:50,s:.9},ok:{t:'You win renewable energy clients and beat the target.',fx:{net:4,cash:20,raise:.05,hp:-3}},ng:{t:'The new market doesn’t open up. You fail your annual review.',fx:{hp:-5,rep:-2}}},
 {l:'Negotiate the target with head office',c:{k:'rep',b:45,s:.8},ok:{t:'The increase is cut to 15%.',fx:{rep:2,hp:1}},ng:{t:'Head office won’t budge.',fx:{net:-3}}},
 {l:'Push the pressure down to your team',ok:{t:'The numbers are hit, and someone leaves in tears.',fx:{net:-4,cash:10}}}
]},
{id:'m3',n:'Your star wants to leave',route:['mgr'],w:8,t:'Your best adjuster is being poached by a rival.',ch:[
 {l:'Fight for a raise and promotion to keep him',c:{k:'net',b:50,s:.8},ok:{t:'He stays, and says it is because of you.',fx:{net:4,rep:2}},ng:{t:'He leaves anyway and takes a client.',fx:{net:-3,hp:-2}}},
 {l:'Wish him well and develop the next one',ok:{t:'You coach new people yourself. Six months later the team is back to strength.',fx:{net:2,pro:1,hp:-2}}}
]},

{id:'e1',n:'Writing a book',route:['edu'],w:9,t:'A publisher invites you to write a practical book on claims.',ch:[
 {l:'Write it',c:{k:'pro',b:50,s:.8},ok:{t:'The book becomes required reading for the adjuster exam.',fx:{rep:6,pro:3,cash:10,hp:-3}},ng:{t:'You get stuck halfway, and publication slips two years.',fx:{hp:-4,pro:2}}},
 {l:'Decline',ok:{t:'You save your energy for your students.',fx:{hp:2,net:1}}}
]},
{id:'e2',n:'A consulting offer',route:['edu'],w:9,t:'A tech company wants you as a part-time risk management advisor.',ch:[
 {l:'Accept',ok:{t:'Theory and practice finally connect.',fx:{cash:30,net:4,hp:-3}}},
 {l:'Decline and focus on teaching',ok:{t:'Your teaching evaluations are excellent.',fx:{pro:2,fam:2}}}
]},
{id:'e3',n:'A recommendation letter',route:['edu'],w:8,t:'A former student is applying to an international reinsurer and asks you for a reference.',ch:[
 {l:'Write it carefully with concrete examples',ok:{t:'The student gets in. Years later, they become your contact in London.',fx:{net:4,rep:2}}},
 {l:'Use a template',ok:{t:'The student is not accepted.',fx:{net:-1}}}
]},

{id:'fire1',n:'Metalworks fire',spec:['fire'],w:10,yrs:[2,40],t:'A metalworking plant catches fire before dawn. The plant manager insists it was faulty wiring, but the burn marks don’t match the stock records.',ch:[
 {l:'Commission a fire cause investigation',c:{k:'pro',b:55,s:.9},ok:{t:'The investigation finds signs of arson. The case becomes a criminal inquiry.',fx:{rep:6,pro:4,net:3,cash:20}},ng:{t:'The investigation can’t rule out an electrical fault. It is handled as an ordinary fire.',fx:{pro:3,rep:-1,hp:-2}}},
 {l:'Conclude conservatively on site evidence',ok:{t:'A neutral report nobody can fault.',fx:{rep:2,pro:1}}}
]},
{id:'fire2',n:'Logistics warehouse fire',spec:['fire'],w:10,yrs:[2,40],t:'A huge fire at a logistics warehouse. Goods from over a thousand customers are inside, and every one wants to be paid first.',ch:[
 {l:'Set up batch counting and priorities',c:{k:'pro',b:50,s:.9},ok:{t:'You turn a chaotic site into one table. Everyone knows where they stand.',fx:{pro:4,rep:4,net:3}},ng:{t:'The counting system collapses. You work overtime for a month.',fx:{hp:-5,rep:-2}}},
 {l:'Handle the three biggest first',ok:{t:'The big clients are happy; the small ones slam you online.',fx:{net:3,rep:-2}}},
 {l:'Require the warehouse to produce a full inventory first',ok:{t:'Slow, but every line is supported.',fx:{rep:1,hp:1,pro:1}}}
]},
{id:'fire3',n:'Old apartment fire',spec:['fire'],w:8,t:'A fire in an old apartment block. Most residents are elderly, and many have no proof of what they owned.',ch:[
 {l:'Rebuild the lists from photos and neighbors’ statements',ok:{t:'An elderly woman holds your hand and thanks you. You are quiet the whole drive back.',fx:{rep:4,pro:2,hp:-2}}},
 {l:'Require receipts as the rules say',ok:{t:'The process is correct, but a few residents end up with nothing.',fx:{rep:-1,hp:-1}}}
]},
{id:'cargo1',n:'Containers overboard',spec:['cargo'],w:10,yrs:[2,40],t:'A container ship hits heavy weather and loses dozens of containers. The owner declares general average. Your client has three containers of high-value electronics aboard.',ch:[
 {l:'Help the cargo owner post general average security right away',c:{k:'pro',b:50,s:1},ok:{t:'The documents are right the first time. The owner collects the rest of the cargo smoothly.',fx:{pro:5,rep:4,net:3,cash:20}},ng:{t:'The ship’s agent rejects the security format. The cargo is held two extra weeks.',fx:{rep:-4,hp:-3}}},
 {l:'Wait for the insurer’s position first',ok:{t:'Nothing goes wrong, but you are a step behind.',fx:{rep:-1,net:2}}}
]},
{id:'cargo2',n:'Six hours missing from the temperature log',spec:['cargo'],w:10,yrs:[2,40],t:'A container of imported vaccines has a six-hour gap in its temperature log. The owner claims a total loss.',ch:[
 {l:'Pull the logger’s raw data',c:{k:'pro',b:50,s:.9},ok:{t:'The raw data show the temperature never went out of range. You save the whole container.',fx:{pro:4,rep:4,cash:10}},ng:{t:'The logger really did fail. A total loss has to be presumed.',fx:{pro:2,rep:-2,hp:-2}}},
 {l:'Ask the manufacturer to assess product stability',ok:{t:'The manufacturer issues a report and the dispute narrows.',fx:{pro:2,rep:2,cash:-3}}},
 {l:'Accept a total loss',ok:{t:'The cargo owner is pleased; the insurer thinks you gave up too fast.',fx:{rep:-3,net:3}}}
]},
{id:'cargo3',n:'Lithography tool over 10G',spec:['cargo','semi'],w:10,yrs:[2,40],t:'A lithography tool arrives at the fab, and the shock recorder shows over 10G. The tool is worth tens of millions of dollars.',ch:[
 {l:'Open and test it with the manufacturer',c:{k:'pro',b:50,s:.9},ok:{t:'Testing shows only some modules are damaged. A total loss becomes a partial repair.',fx:{pro:5,rep:5,net:3,cash:20}},ng:{t:'The manufacturer insists on returning the whole tool. You can’t argue otherwise.',fx:{pro:3,hp:-4,rep:-2}},gr:{t:'Your unpacking inspection procedure is written into the client’s global supply chain standards.',fx:{pro:7,rep:8,net:6,cash:30}}},
 {l:'Pursue the carrier first',ok:{t:'Subrogation is a long road, but the right direction.',fx:{net:-2,rep:2,pro:1}}},
 {l:'Settle on the manufacturer’s quote',ok:{t:'The client is delighted; the insurer is in pain.',fx:{rep:-2,net:3}}}
]},
{id:'re1',n:'Solar panels blown away',spec:['re'],w:10,yrs:[2,40],t:'After a typhoon, large sections of panels at a coastal solar farm are blown off. Investors demand immediate payment and question the mounting design.',ch:[
 {l:'Inspect jointly with a structural engineer',c:{k:'pro',b:50,s:.9},ok:{t:'Wind speed, design codes and construction gaps are laid out clearly. The split of responsibility is accepted.',fx:{pro:5,rep:5,net:3,cash:20}},ng:{t:'Weather and code data don’t line up. Everyone is deadlocked.',fx:{hp:-4,rep:-2,pro:2}}},
 {l:'Issue an early payment view to calm investors',ok:{t:'Investors relax; the reinsurer points out the support is incomplete.',fx:{rep:-2,net:2}}}
]},
{id:'re2',n:'Severed subsea cable',spec:['re'],w:10,yrs:[2,40],t:'A section of export cable at an offshore wind farm breaks during installation. The work vessel costs hundreds of thousands of dollars a day.',ch:[
 {l:'Coordinate repairs and notify insurers immediately',c:{k:'net',b:45,s:1},ok:{t:'You bring everyone together within 72 hours. Downtime losses fall sharply.',fx:{net:5,rep:5,cash:20}},ng:{t:'Everyone passes the buck, and you are stuck in the middle.',fx:{hp:-5,rep:-2}}},
 {l:'First establish installation error or design defect',ok:{t:'Responsibility is clear, but several extra days of vessel hire are paid.',fx:{pro:3,rep:1,net:-2}}},
 {l:'Wait for the international adjuster to lead',ok:{t:'You become a supporting player.',fx:{net:1,rep:-2}}}
]},
{id:'semi1',n:'Voltage dip at the fab',spec:['semi'],w:10,yrs:[2,40],t:'A sudden voltage dip at a wafer fab scraps an entire lot in process. Business interruption must be estimated too.',ch:[
 {l:'Build your own capacity and recovery-curve model',c:{k:'pro',b:45,s:1.1},ok:{t:'The model breaks the loss into verifiable parts. Everyone accepts it.',fx:{pro:6,rep:6,net:4,cash:30}},ng:{t:'The accountants challenge every assumption. You spend two weeks revising.',fx:{pro:3,hp:-5,rep:-2}}},
 {l:'Use the insured’s figures',a:.5,ok:{t:'Negotiation ends fast, but a later review says there was no independent verification.',fx:{rep:-4,net:1,cash:8}}},
 {l:'Hire outside accountants to review jointly',ok:{t:'Not cheap, but all three parties agree.',fx:{rep:4,pro:2,cash:-8,net:2}}}
]},
{id:'semi2',n:'Smoke in the cleanroom',spec:['semi'],w:10,yrs:[2,40],t:'A small fire breaks out in a cleanroom. The flames are minor, but soot may have contaminated the whole area.',ch:[
 {l:'Arrange contamination testing and zone cleaning',c:{k:'pro',b:50,s:.9},ok:{t:'Most equipment recovers after cleaning. The loss falls to a third.',fx:{pro:5,rep:5,cash:20}},ng:{t:'Test results are ambiguous. Everyone argues for six months.',fx:{pro:3,hp:-3,rep:-2}}},
 {l:'Replace everything as the insured asks',ok:{t:'The client is happy; the insurer thinks you are a pushover.',fx:{rep:-4,net:4}}},
 {l:'Only pay for direct fire damage',ok:{t:'The client is furious and threatens to get someone else.',fx:{rep:1,net:-4}}}
]},
{id:'eng1',n:'Cracks next to a deep excavation',spec:['eng'],w:10,yrs:[2,40],t:'At a deep excavation along a metro line, neighboring buildings crack and tilt.',ch:[
 {l:'Recommend stopping work and surveying neighbors',c:{k:'rep',b:50,s:.7},ok:{t:'Your call turns out to have prevented a much bigger loss.',fx:{rep:6,pro:3,cash:15}},ng:{t:'The contractor protests the delay, and the owner complains too.',fx:{rep:-3,net:-3,hp:-3}}},
 {l:'Gather data first, no position yet',ok:{t:'Things become clear in a few days, but you are criticized for reacting slowly.',fx:{rep:-1,pro:2}}}
]},
{id:'eng2',n:'Tunnel inrush',spec:['eng'],w:10,yrs:[2,40],t:'Water suddenly floods a tunnel, trapping the boring machine underground.',ch:[
 {l:'Analyze the cause with a geotechnical engineer',c:{k:'pro',b:45,s:1},ok:{t:'You pinpoint gaps in the ground investigation. Responsibility is clear.',fx:{pro:5,rep:4,cash:20}},ng:{t:'The ground data contradict each other. The dispute drags on for two years.',fx:{hp:-4,pro:2}}},
 {l:'Prioritize rescue and mitigation costs',ok:{t:'The machine is recovered and the mitigation costs are accepted.',fx:{rep:3,net:3,hp:-2}}},
 {l:'Wait for the owner to submit a full claim',ok:{t:'You miss the golden window for mitigation.',fx:{rep:-2,hp:1}}}
]},
{id:'motor1',n:'Multi-car pile-up',spec:['motor'],w:10,yrs:[2,40],t:'A multi-vehicle crash. Three insurers disagree on who is at fault and by how much.',ch:[
 {l:'Reconstruct the timeline with expert help',c:{k:'pro',b:55,s:.9},ok:{t:'Once the sequence is rebuilt, the fault split is agreed quickly.',fx:{pro:4,rep:4,net:4,cash:10}},ng:{t:'Key CCTV footage is missing. It takes six months to settle.',fx:{hp:-3,rep:-1}}},
 {l:'Mediate a compromise split',ok:{t:'None of the three are happy, but all can live with it.',fx:{net:3,rep:1,pro:-1}}}
]},
{id:'motor2',n:'Department store slip',spec:['motor'],w:10,yrs:[2,40],t:'A shopper slips and breaks a bone at a department store, demands huge compensation and threatens to go to the media.',ch:[
 {l:'Pull the CCTV and check the cleaning signs',c:{k:'pro',b:50,s:.8},ok:{t:'The warning sign is clearly visible. Fault is shared fairly.',fx:{rep:3,pro:2,net:2}},ng:{t:'The camera happened to miss it. The claim is paid in full.',fx:{rep:-2,hp:-2}}},
 {l:'Recommend a quick settlement',ok:{t:'It ends quickly and stays out of the news.',fx:{net:3,rep:-1,cash:5}}},
 {l:'Hold firm on fault percentages',ok:{t:'They do go to the media, but the coverage is neutral.',fx:{rep:2,net:-2}}}
]},

{id:'love',n:'Someone easy to talk to',w:9,when:s=>!s.f.married&&s.age>=24&&s.age<=40,t:'A friend introduces you to someone, and you really click. But lately you are on site almost every week.',ch:[
 {l:'Make time for the relationship',c:{k:'fam',b:45,s:.8},ok:{t:'A year later, you are married.',fx:{flag:'married',unflag:'divorced',fam:12,hp:2,cash:-15}},ng:{t:'They say: “You seem to love your cases more.”',fx:{fam:-2,hp:-1}}},
 {l:'Focus on your career for now',ok:{t:'You keep their number but never call.',fx:{pro:2,fam:-2}}}
]},
{id:'baby',n:'A new life',w:12,when:s=>s.f.married&&s.kids<2&&s.age>=26&&s.age<=42,t:'A baby is on the way. It is one of the biggest projects of your life, and you don’t control the schedule.',ch:[
 {l:'Pause new cases for the birth and early months',ok:{t:'You barely sleep for months, and barely regret it.',fx:{kid:1,fam:12,hp:-2,cash:-20,rep:-1}}},
 {l:'Keep your pace and ask family to help',c:{k:'fam',b:55,s:.8},ok:{t:'Your family holds things together, and you don’t slow down at work.',fx:{kid:1,fam:4,cash:10,hp:-3}},ng:{t:'You miss several important moments.',fx:{kid:1,fam:-7,hp:-3,cash:10}}}
]},
{id:'house',n:'Buying a home',w:8,once:1,when:s=>s.age>=28&&s.age<=45&&s.cash>=150,t:'You find a home 40 minutes from work. The down payment is about US$94K.',ch:[
 {l:'Buy it with a 30-year mortgage',ok:{t:'The day you get the keys, you walk circles in the empty rooms. The mortgage makes you more careful about which cases you take.',fx:{cash:-300,flag:'house',fam:5,hp:-1}}},
 {l:'Keep renting and invest the money',c:{k:'pro',b:50,s:0},ok:{t:'The market is good and your assets grow.',fx:{cash:80,fam:-1}},ng:{t:'A crash hits and your portfolio shrinks.',fx:{cash:-60,hp:-2}}},
 {l:'Keep renting and save',ok:{t:'You save a lot, but it is a bit cramped.',fx:{cash:20,fam:1}}}
]},
{id:'family',n:'Three weekends away',w:10,when:s=>s.f.married,t:'You have missed three weekends with your family. Nobody complains; they just stop asking “Are you free this weekend?”',ch:[
 {l:'Take a week off for your family',ok:{t:'You take no cases that week. Things slowly warm up again.',fx:{fam:9,hp:4,pro:-1,cash:-8}}},
 {l:'Say “I’ll rest once this case is done”',c:{k:'fam',b:55,s:.8},ok:{t:'Your family accepts it, for now.',fx:{fam:-1,rep:1}},ng:{t:'Nobody says more, but something quietly changes.',fx:{fam:-8,hp:-2}}}
]},
{id:'crisis',n:'We need to talk',w:s=>s.fam<45?30:0,when:s=>s.f.married,t:'Your partner says: “We need to talk.”',ch:[
 {l:'Go to couples counseling and travel less',ok:{t:'It is hard, but you both stay.',fx:{fam:12,cash:-10,pro:-2,hp:2}}},
 {l:'Promise to change but keep working the same',a:.5,c:{k:'fam',b:40,s:.8},ok:{t:'They give you one more chance.',fx:{fam:3}},ng:{t:'You separate.',fx:{fam:-15,unflag:'married',flag:'divorced',cash:-150,hp:-5}}},
 {l:'Plan a long trip together',ok:{t:'The trip is beautiful. Back home, nothing changes.',fx:{fam:5,cash:-15}}}
]},
{id:'kidschool',n:'School meetings and sports days',w:8,when:s=>s.kids>0&&s.age>=36&&s.age<=56,t:'Your child is changing schools. Your partner wants you at every parents’ meeting and every game.',ch:[
 {l:'Show up as much as you can',ok:{t:'Your child sees you at the finish line and lights up.',fx:{fam:7,pro:-1}}},
 {l:'Make up for it with money: tutors and classes',ok:{t:'Your child’s schedule is busier than yours.',fx:{cash:-30,fam:2}}},
 {l:'Leave it to your partner',ok:{t:'Your child rarely tells you about school anymore.',fx:{fam:-5,pro:2}}}
]},
{id:'parent',n:'A parent in hospital',w:12,once:1,when:s=>s.age>=46&&s.age<=62,t:'One of your parents falls ill and is hospitalized. Someone needs to be there for the long term.',ch:[
 {l:'Adjust your work and care for them yourself',ok:{t:'You slow down. Being there brings a comfort you can’t measure.',fx:{fam:6,hp:-4,cash:-25,rep:-1}}},
 {l:'Hire a caregiver and share it with family',ok:{t:'Everything runs as usual, but late at night you sometimes feel guilty.',fx:{cash:-20,fam:-2,hp:-2}}}
]},
{id:'checkup',n:'Red flags in the checkup',w:s=>s.hp<40?40:(s.hp<55?15:4),when:s=>s.age>=30,t:'Your health checkup shows several red flags. The doctor wants you to change your routine and come back for follow-up.',ch:[

 {l:'Deal with it after this busy stretch',a:.5,c:{k:'hp',b:55,s:1},ok:{t:'Your body holds up. This time.',fx:{hp:-3}},ng:{t:'You suddenly get dizzy on site and are rushed to the ER.',fx:{hp:-16,cash:-20,fam:-3}}}
]},
{id:'burnout',n:'Palpitations at 4 am',w:s=>s.hp<40?30:0,t:'For three months you have slept four hours a night. You wake with your heart racing.',ch:[
 {l:'Take two weeks off right now',ok:{t:'You sleep for two whole days and wake to a quiet world.',fx:{hp:12,cash:-5,rep:-1}}},
 {l:'Push through on coffee',a:.4,c:{k:'hp',b:45,s:1},ok:{t:'You make it through.',fx:{hp:-2,rep:1}},ng:{t:'You faint during a report meeting.',fx:{hp:-12,rep:-2}}},
 {l:'Ask your manager to cut your caseload',c:{k:'rep',b:50,s:.6},ok:{t:'Your manager agrees and your caseload drops by 30%.',fx:{hp:8,cash:-5}},ng:{t:'Your manager says: “Everyone is working hard.”',fx:{hp:2,net:-2,cash:-3}}}
]},
{id:'invest',n:'A sure-thing stock tip',w:6,t:'An old classmate has a stock tip he swears can’t lose.',ch:[
 {l:'Put in US$31K',c:{k:'net',b:40,s:.3},ok:{t:'It really goes up. You make a nice profit.',fx:{cash:120}},ng:{t:'The company gets delisted.',fx:{cash:-100,hp:-2}}},
 {l:'Try US$6K',c:{k:'net',b:40,s:.3},ok:{t:'A small gain.',fx:{cash:25}},ng:{t:'A small loss.',fx:{cash:-20}}},
 {l:'Stay out',ok:{t:'You sleep well.',fx:{hp:1}}}
]},
{id:'marathon',n:'Marathon invitation',w:6,once:1,when:s=>s.age>=30&&s.age<=55,t:'A colleague asks you to train together for next year’s full marathon.',ch:[
 {l:'Join, three runs a week',c:{k:'hp',b:55,s:.7},ok:{t:'You finish the marathon and feel like you are in your twenties again.',fx:{hp:10,net:2,fam:-1}},ng:{t:'You hurt your knee and spend three months in rehab.',fx:{hp:-5,cash:-5}}},
 {l:'Walk half an hour a day instead',ok:{t:'Unremarkable, but you keep it up for years.',fx:{hp:4,fam:1}}},
 {l:'No time',ok:{t:'You go back to writing reports.',fx:{pro:1,hp:-1}}}
]},
{id:'midlife',n:'A midlife question',w:6,once:1,when:s=>s.age>=41&&s.age<=47,t:'You start wondering: “Do I really want to do this until I retire?” A friend running a guesthouse in Hualien invites you to buy in.',ch:[
 {l:'Leave insurance for Hualien',a:.4,ok:{t:'You hand in your resignation.',fx:{hp:8,fam:4,end:{t:'Hualien guesthouse owner',d:'You hang your hard hat behind the guesthouse counter as decoration. When guests ask, you tell them a story from a fire scene.'}}}},
 {l:'Take a month off to travel',ok:{t:'When you come back, you fall in love with the job again.',fx:{hp:8,fam:4,cash:-15,rep:-1}}},
 {l:'Do a part-time master’s and grow differently',ok:{t:'Two years of evening classes are tough, but your perspective changes.',fx:{pro:6,net:3,hp:-4,cash:-25,fam:-3}}}
]},
{id:'crash',n:'Rear-ended on the highway',w:4,t:'On your way to a site, you are rear-ended on the highway.',ch:[
 {l:'Stay in hospital and recover',ok:{t:'In your hospital bed you realize, for the first time, that it is okay not to work.',fx:{hp:-6,cash:-5,fam:2}}},
 {l:'Push on and finish the inspection',c:{k:'hp',b:55,s:.8},ok:{t:'The client is deeply moved when they find out.',fx:{rep:3,hp:-6}},ng:{t:'Only on site do you discover a cracked rib.',fx:{hp:-14,rep:-1}}}
]},
{id:'reunion',n:'University reunion',w:6,t:'At your university reunion, many classmates now work in risk, legal, or as insurance executives.',ch:[
 {l:'Go and swap cards',ok:{t:'The next month a classmate refers a case to you.',fx:{net:4,hp:-1}}},
 {l:'Skip it and rest at home',ok:{t:'You miss some gossip and get a good night’s sleep.',fx:{hp:2,fam:1}}}
]}
];

const KNOW={
br1:['Adjusters, insurers and brokers','A loss adjuster is appointed to independently inspect and assess the loss and issue a report; the insurer decides and pays the claim; the broker represents the policyholder in arranging cover and helps with claims. Each stands in a different place and sees the same claim differently.'],
br2:['Reinsurance','An insurer passes part of its risk to a reinsurer to stabilize its finances and increase capacity. Large losses are often ultimately shared by international reinsurers, so reinsurers often take part in or review major claims.'],
br3:['Independence of the adjuster’s report','An adjuster’s report is valuable because it is independent and expert. At every stage of your career, findings should follow the evidence and the policy, not pressure from the client or the insured.'],
first:['Securing the scene early','After a loss, photograph, mark and preserve the origin and damaged items as soon as possible, and record times and who was present. Once the site is cleared or rained on, establishing the cause becomes very hard.'],
english:['The London market','London (Lloyd’s and the London company market) is the global hub for large commercial risks and reinsurance. Many marine, energy and catastrophe policies use English wordings, often interpreted under English law.'],
emba:['Risk management and business decisions','The better business owners understand risk management, the more they see insurance as a financial tool, not just a cost. Insurance planning should go together with loss prevention, retentions and business continuity planning.'],
deadline:['Preliminary report','A preliminary report is issued soon after inspection, covering the circumstances, initial loss estimate, policy response and outstanding documents. Where data are incomplete, state assumptions and limits clearly and update in the final report.'],
bribe:['The adjuster’s integrity','An adjuster who takes benefits that influence a report may face criminal liability and lose their license. Refuse improper benefits, keep a record, and report it to your firm.'],
audit:['Claims audits','Insurers and reinsurers audit large or unusual claims after the fact, reviewing reports, photos and workings. Complete workings and well-supported calculations are an adjuster’s best protection.'],
trust:['Reputation is an adjuster’s asset','When insurers and brokers appoint adjusters, they value the quality and integrity of past reports most. One honest choice often leads to being named on a big case years later.'],
typhoon:['Handling catastrophe claims','Typhoons and earthquakes generate huge numbers of claims in a short time. Insurers often launch simplified procedures and triage: small claims are closed quickly, large ones go to senior adjusters.'],
quake:['Earthquake insurance','In Taiwan, the basic residential earthquake policy covers total and constructive total loss of the building; earthquake extensions on commercial fire policies often carry higher deductibles or coinsurance. Check the applicable wording and deductible before settling.'],
angry:['Claims communication','After a loss, the insured is often anxious. Clearly explaining the process, required documents and timeline reduces conflict more than arguing about the amount.'],
unsafe:['Safety of inspectors','Fire or collapse sites may have unstable structures, toxic gases and live equipment. Confirm structural safety and wear protective gear before entering; wait for an engineer if needed. No evidence is worth your life.'],
underins:['Underinsurance and average','When the sum insured is below the actual value, claims are usually paid in the proportion of sum insured to actual value. Example: worth US$15M, insured for US$9M, a US$3M loss pays only US$1.8M. Regularly reviewing sums insured at replacement cost avoids this.'],
depr:['Actual cash value vs replacement cost','Actual cash value (ACV) = replacement cost − depreciation; replacement cost (RCV) pays the price of new, with no deduction for depreciation. Which basis the policy uses decides how much old equipment is worth.'],
bi:['Business interruption loss','Business interruption insurance pays lost gross profit and continuing expenses during the downtime caused by the loss, limited to a reasonable recovery period. Key factors: pre-loss performance, the recovery timeline, and whether alternative capacity can reduce the loss.'],
fraud:['Warning signs of fraud','The same contact appearing repeatedly, cover added just before the loss, identical document formats and suspiciously precise loss lists are common red flags. Refer concerns to the insurer’s investigation unit and preserve the evidence.'],
threat:['Protecting yourself on contentious cases','On fraud or highly contentious cases, avoid working alone and don’t discuss cases in private settings. If threatened, call the police, inform your firm, and keep every record.'],
media:['Speaking at disaster sites','After a major disaster, the insurer usually communicates its claims position publicly. Adjusters should explain only the process and timeline, not whether or how much will be paid.'],
trip:['Overseas inspections and local partners','When a loss occurs abroad under a cross-border policy, a local adjuster often inspects and secures the site first, with the lead adjuster coordinating the report. A network of overseas partners shortens response time dramatically.'],
pandemic:['Remote inspection','When the site is inaccessible, video, drones and the insured’s photos can be used, but verify when and where they were taken and follow up with a physical inspection if necessary.'],
newcontact:['Verifiable reports','A good adjuster’s report lets anyone trace conclusions back to evidence: numbered photos, sourced figures and stated formulas. The pickier the reviewer, the more you need this structure.'],
pressure:['Neutral reporting','Even when appointed by an insurer, the adjuster’s findings must follow the evidence and the wording. Deliberately lowering or inflating a loss can expose the adjuster to liability in court.'],
lawsuit:['The adjuster’s report in court','When a claim goes to court, the adjuster’s report is often key evidence and the adjuster may be called as a witness. Every assumption can be tested under cross-examination.'],
inflate:['Checking loss schedules','Stock losses should be cross-checked against ledgers, purchase and sales records, stock counts and invoices. Inflating a loss may be insurance fraud, and those who help can also be liable.'],
credit:['Workings and records','Calculation workings, version history and correspondence are the basis for sorting out responsibility and credit, and your protection in later audits.'],
scapegoat:['Documenting claims decisions','Record important decisions in writing: who decided, on what basis, and when people were told. When something goes wrong, the record is the only way to reconstruct the facts.'],
merger:['Industry consolidation','International brokers and adjusting firms keep consolidating. After a merger, systems and processes are usually integrated; people whose expertise is clearly visible find their place more easily.'],
freeze:['The underwriting cycle','Premiums and case volumes move with the underwriting cycle: in a soft market premiums fall and competition is fierce; in a hard market premiums rise and terms tighten. Professionals’ income moves with it.'],
hunter:['The claims talent market','Claims professionals with large commercial, engineering, marine or reinsurance experience are in demand at insurers, brokers and adjusting firms alike.'],
cert:['Professional qualifications','Common international claims qualifications include the Chartered Insurance Institute (CII) and the Chartered Institute of Loss Adjusters (CILA). A qualification isn’t the same as ability, but it helps international clients trust you faster.'],
court:['Expert witness','When giving expert evidence, explain your method, basis and limits clearly. Judges want reasoning they can understand and verify, not just conclusions.'],
soft:['Soft market','When capacity is plentiful, premiums fall and terms loosen, and claims and adjusting fees get squeezed too. Low prices often bring lower quality, which long-term clients worry about most.'],
ai:['AI in claims','AI can summarize wordings, sort photos, match documents and draft reports, but interpreting wording and assessing loss still need professional judgment. Always check the original wording before citing it.'],
newbie:['Passing on experience','Claims judgment comes mostly from cases. Letting juniors join site visits, read old reports and take part in calculations is the most effective way to develop adjusters.'],
reins:['Reinsurer involvement in claims','Large claims often need reinsurer consent (claims cooperation or claims control clauses). Reinsurers review the report’s method and calculations; requests for more information are normal.'],
speaker:['Sharing cases','Case sharing at associations and conferences builds consensus on claims standards and is an important way to build a professional reputation.'],
olderr:['Correcting a report','If you find an error in a delivered report, notify the client and issue a correction. Correcting it yourself costs far less than having an audit find it.'],
startup:['Setting up an adjusting firm','In Taiwan, an adjusting company must meet the regulator’s requirements for qualifications, capital and professional staff, and post a guarantee deposit or buy liability insurance. Before starting, work out your case pipeline, people and cash flow.'],
broker:['Insurance brokers','An insurance broker arranges cover in the policyholder’s interest and, after a loss, helps prepare the claim and negotiate with the insurer. Good brokers design the conditions claims will need into the policy before anything happens.'],
expat:['Regional claims hubs','International insurance groups often set up regional hubs in Singapore or Hong Kong to handle large Asian losses, so expertise and reinsurance capacity can be deployed across borders.'],
petro:['Joint adjustment','Very large losses are often handled jointly by several adjusting firms, split by specialty (structures, equipment, business interruption), with a lead adjuster coordinating the report and communications.'],
lastcase:['Long-tail claims','For some liability and engineering policies, years may pass between the incident and the claim. Keeping complete files on old cases is key to handling long-tail claims.'],
earlyout:['Retirement and annuities','Retiring early means thinking about more than savings: healthcare, long-term care and inflation too. Annuities and health insurance can support cash flow and medical costs in retirement.'],
b1:['The broker’s position','A broker represents the client but also needs long-term relationships with insurers. The safest approach is to support claims with evidence and wording, and be honest with clients about reasonable expectations.'],
b2:['STP (stock throughput) insurance','A stock throughput policy covers goods from raw material purchase through transit and storage to finished goods shipment in one policy, closing gaps between cargo and property cover. It is common among multinational manufacturers.'],
b3:['The value of broking service','Clients usually stay not because of price but because of who handles their claims well when things go wrong. Loss-prevention training and claims results are a broker’s most persuasive service.'],
i1:['Claims reserves','Insurers must reserve for estimated outstanding claims. Deliberately underestimating flatters short-term results but breaches reserving rules; regulators will require top-ups and impose penalties.'],
i_audit:['Regulator inspection','Financial regulators regularly examine insurers’ reserves, claims processes and internal controls. Whether decisions are documented often determines who is held responsible.'],
i2:['Claims performance indicators','Insurers measure claims quality by average closing time, open claim counts and complaint rates. Chasing speed at the expense of checks can increase fraud and wrong payments.'],
i3:['Feedback from claims to underwriting','Claims data is underwriting’s best teacher. Feeding causes and loss patterns back to underwriting improves pricing and terms.'],
r1:['Negotiating reinsurance claims','Reinsurance claim disputes often involve wording interpretation, loss allocation and event definitions. The more complete your data and precedents, the more weight you carry in the international market.'],
r2:['Catastrophe models','Reinsurers use catastrophe models to estimate potential typhoon, earthquake and flood losses and to set capacity and price. After big catastrophe years, reinsurance rates usually rise.'],
r3:['The 72-hour clause','Catastrophe reinsurance treaties often treat losses from the same cause within 72 consecutive hours as one event. How events are split decides how many retentions apply and how much the reinsurer pays.'],
o1:['A practice’s cash flow','An adjusting practice’s income depends on completing reports and clients paying, and payment terms can run for months. Enough working capital is basic for a small practice.'],
o2:['Client concentration','Exclusive deals bring steady work but make you dependent on one client. High client concentration is one of the biggest operating risks for small professional firms.'],
o3:['Partnership agreements','Partners should agree on equity, client ownership, non-compete and exit terms in advance. Without a written agreement, a split usually hurts everyone.'],
o4:['Regional offices','Adjusting relies on local relationships and how fast you can get to site. Before opening an office, station someone there to test demand.'],
x1:['Fire forensics','Fire investigation analyzes burn patterns, the point of origin, electrical arcing and accelerant residues. It is key to telling an accident from a design defect or arson.'],
x2:['The expert witness’s neutrality','An expert witness owes their duty to the court, not the client. Opinions must rest on reproducible methods and state their uncertainty clearly.'],
x3:['Loss quantification methods','Common methods include cost of repair, replacement cost less depreciation, and loss of gross profit. Which to use depends on the policy basis and the type of loss.'],
m1:['Senior talent and report quality','Adjusting depends heavily on senior judgment. Layoffs or losing senior people often directly affect report quality and client trust.'],
m2:['Insurance demand in growth industries','Insurance demand is growing fast in renewables, semiconductors and logistics. Claims teams with industry knowledge win new clients more easily.'],
m3:['Key person risk','A professional firm’s greatest asset is its people. Key departures can take clients with them; firms reduce this with career paths, rewards and non-compete terms.'],
e1:['Claims education','Loss adjusters in Taiwan must pass a national exam to qualify and keep training after they start practicing. Practical books and case materials are a newcomer’s most important resources.'],
e2:['Enterprise risk management','Enterprise risk management has four steps: identify, assess, control and transfer. Insurance is only one way to transfer risk, not the whole answer.'],
e3:['International reinsurance careers','International reinsurers value English, understanding of wordings and data analysis. Concrete cases and results persuade more than vague praise.'],
fire1:['Intentional act exclusion','Losses deliberately caused by the insured are excluded. If arson is suspected, have forensic specialists analyze it and cooperate with police and fire investigators.'],
fire2:['Multiple claims after a warehouse fire','When a public warehouse burns, cargo owners may claim from their own insurers, the warehouse operator and its liability insurer. The first step is establishing ownership, insurance and storage contracts for each lot.'],
fire3:['Proving contents under home insurance','Home fire insurance covers the building and its contents, but contents must be proven. Photos or purchase records kept in advance speed claims up dramatically.'],
cargo1:['General average','When a ship is in peril, sacrifices or expenses made to save ship and cargo are shared by all parties in proportion to their values. Cargo owners usually need to post security, often issued by their cargo insurer, before collecting goods.'],
cargo2:['Temperature-controlled cargo','Cold-chain claims hinge on temperature records. Where records are missing, combine raw data, the transit timeline and product stability reports to judge whether goods were really damaged.'],
cargo3:['Shock recorders','High-value equipment is often shipped with shock recorders. A reading over the limit doesn’t always mean damage; open and test with the manufacturer to establish the extent.'],
re1:['Solar farm insurance','Solar farms usually buy operational property cover (including natural perils) and business interruption. Typhoon disputes often turn on whether wind speeds exceeded design codes, or there were installation or design defects.'],
re2:['Offshore wind construction insurance','Offshore wind construction is usually covered under construction all risks, and cable damage is among the most common and costly losses. With expensive vessels, repair speed directly drives the size of the loss.'],
semi1:['Semiconductor business interruption','A fab shutdown often costs far more than the equipment itself, including scrapped wafers and business interruption. Calculations must consider utilization, work in progress, orders and alternative capacity.'],
semi2:['Smoke contamination','Cleanrooms or electronics contaminated by smoke don’t necessarily need replacing. After professional cleaning and testing, much equipment can return to service and the loss falls sharply.'],
eng1:['Third-party liability','Damage to neighboring buildings caused by construction falls under the third-party liability section of construction all risks. A pre-construction survey of neighbors is key evidence for liability.'],
eng2:['Mitigation costs','Under Article 33 of Taiwan’s Insurance Act, the insurer must reimburse necessary costs incurred to avoid or reduce a loss. Prompt mitigation benefits both the insured and the insurer.'],
motor1:['Apportioning fault','In multi-vehicle accidents, compensation is shared by each party’s degree of fault. Dashcams, CCTV and physical evidence are key to reconstructing the sequence.'],
motor2:['Public liability insurance','When customers are injured because of a business’s premises or management failures, public liability insurance pays. Warning signs, cleaning logs and CCTV are key evidence on fault.'],
love:['Reviewing insurance when you start a family','Once you have a family, life cover can be sized to your mortgage, living costs and children’s education, with beneficiaries named. It is the first step of family financial planning.'],
baby:['Insurance for newborns','Newborns can be covered for health and accident after birth, and some policies allow enrollment before birth. Prioritize health and accident cover.'],
house:['Home fire and earthquake insurance','Mortgage lenders in Taiwan usually require home fire insurance with the basic residential earthquake cover. Check that the sum insured is enough to rebuild, to avoid underinsurance.'],
family:['A family’s biggest risk','The health and earning power of the main earner is a family’s biggest risk. Life and disability insurance let the family keep going if something happens.'],
crisis:['Changing beneficiaries','When your marital status changes, review and update life insurance beneficiaries and policyholder details so benefits don’t go to someone you no longer intend.'],
kidschool:['Planning for education costs','Children’s education costs come at predictable times, so they suit early regular saving or investing. Insurance products are one tool; compare fees and flexibility.'],
parent:['Long-term care insurance','Long-term care is long and expensive. LTC insurance pays when the insured meets disability criteria; check the benefit triggers and waiting periods before buying.'],
checkup:['Duty of disclosure','Disclose your health honestly when applying. If you don’t disclose a pre-existing condition, the insurer may be able to rescind the contract within a certain period. You have the most options when you are healthy.'],
burnout:['Disability insurance','Illness caused by long-term overwork can leave you unable to work. Disability insurance pays when you meet a disability level, filling the gap in lost income.'],
invest:['Investment-linked policies','The account value of investment-linked policies moves with markets and has no guaranteed return. Understand the fee structure and the risks of the underlying investments before buying.'],
marathon:['What accident insurance covers','Accident insurance covers injuries that are external, sudden and not caused by illness. Ordinary running injuries are usually covered, but some high-risk activities may be excluded.'],
midlife:['Coverage gaps when changing jobs','When you leave a company, its group insurance ends too. Before changing jobs or starting a business, put your own health and life cover in place.'],
crash:['Compulsory and voluntary motor insurance','Taiwan’s compulsory motor insurance only pays for bodily injury, disability and death, up to set limits; damage to vehicles and others’ property needs voluntary motor cover. If you are rear-ended, you can claim from the other driver’s insurer first.'],
reunion:['Network and new business','Much of the work and partnerships in insurance come from classmates, former colleagues and industry contacts. Keeping relationships alive is a long-term investment in professional services.']
};
