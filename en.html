  (END.goals||[]).forEach((g,i)=>{const mx=bx-24+i*24,my=by+56;c.beginPath();c.arc(mx,my,8,0,Math.PI*2);if(g.ok){c.fillStyle='#f2b705';c.fill();c.lineWidth=1.5;c.strokeStyle='#1b1500';c.stroke();c.beginPath();c.moveTo(mx-4,my);c.lineTo(mx-1,my+3);c.lineTo(mx+4,my-3);c.lineWidth=2;c.strokeStyle='#1b1500';c.stroke()}else{c.lineWidth=1.5;c.strokeStyle='#cfc6b2';c.stroke()}});
  if(END.kind==='banned'){c.save();c.translate(W-96,150);c.rotate(-0.22);c.strokeStyle='rgba(181,58,41,0.85)';c.lineWidth=3;c.strokeRect(-56,-24,112,44);T('REVOKED',0,10,'900 26px '+SERIF,'rgba(181,58,41,0.85)','center');c.restore()}
  c.restore();rr(1,1,W-2,H-2,18);c.lineWidth=2;c.strokeStyle='#cfc6b2';c.stroke();
  return cv;
}
function cardRender(){
  const img=document.getElementById('idcard');if(!img||!img.setAttribute)return;
  const put=()=>{if(P!=='end')return;const cv=drawCard(),im=document.getElementById('idcard');if(cv&&im)try{im.src=cv.toDataURL('image/png')}catch(e){}};
  put();
  try{if(document.fonts&&document.fonts.load){const txt=END.t+rankName()+RT().n+(BR()?BR().n:'')+S.sp.n+(CARDH[S.track]||'')+KEYS.map(k=>KN[k]+lvl(S[k])).join('')+Object.keys(S.skills).map(x=>SK[x].n).join('')+'SkillsTraitsNet worthScoreCareer endingyrs oldREVOKED'+S.traits.map(x=>TR[x].n).join('');
    Promise.all([document.fonts.load("900 34px 'Noto Serif TC'",txt),document.fonts.load("700 17px 'Noto Sans TC'",txt),document.fonts.load("500 13px 'Noto Sans TC'",txt),document.fonts.load("500 14px 'JetBrains Mono'",'No.0123456789→')]).then(put,put)}}catch(e){}
}
function saveCard(){
  const cv=CARDCV||drawCard();if(!cv||!cv.toBlob)return;
  const fn='adjuster-card-'+S.seed+'.png';
  cv.toBlob(b=>{
    if(!b)return;
    if(DL){DL.save({filename:fn,data:b}).catch(()=>{});return}
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
  },'image/png');
}
function worksHTML(){
  const cs=(S.cases||[]).slice().sort((a,b)=>b.w-a.w||b.a-a.a).slice(0,3).sort((a,b)=>a.a-b.a);
  if(!cs.length)return '';
  return '<div class="story"><span class="kt">Signature cases</span><ul class="works">'+cs.map(c=>'<li><span class="mono">Age '+c.a+'</span><b>'+c.n+'</b><em>'+c.o+'</em></li>').join('')+'</ul></div>';
}
function goalsHTML(){
  const g=END.goals||[];if(!g.length)return '';const k=g.filter(x=>x.ok).length;
  return '<div class="story"><span class="kt">Life goals · achieved '+k+' / '+g.length+(k?' · Score +'+(3*k):'')+'</span><ul class="goals">'+g.map(x=>'<li class="'+(x.ok?'ok':'no')+'"><i>'+(x.ok?'✔':'✕')+'</i><div><b>'+x.n+'</b><span>'+x.d+'</span></div></li>').join('')+'</ul></div>';
}
function endView(){
  return mast()
   +'<div><span class="tab">Closing report</span><div class="card endc">'
   +'<img class="idcard" id="idcard" alt="'+END.t+' · '+rankName()+'" width="360" height="512">'
   +'<p class="hint">You can also long-press or right-click to save the card image</p>'
   +'<p class="sum">'+lifeSummary()+'</p>'
   +'<div class="story"><span class="kt">Life story</span><p>'+lifeStory()+'</p></div>'+worksHTML()+goalsHTML()
   +'<div class="endbtns"><button class="btn" data-a="savecard">Download card</button><button class="btn sec" data-a="again">Live again</button></div>'
   +'<p class="hint">'+(S.nc?'New cards this life: '+S.nc+' · ':'')+'<button class="linkbtn inl" data-a="dex">Claims 101 collection</button></p>'
   +'</div></div>';
}
let lastP='';
function render(){
  glHide();
  let h='';
  if(P==='start')h=startView();
  else if(P==='birth')h=birthView();
  else if(P==='run'||P==='event'||P==='result')h=playView();
  else if(P==='end')h=endView();
  else if(P==='dex')h=dexView();
  app.innerHTML=h;
  if(S&&P!=='start'&&P!=='dex'&&P!=='end')drawScene(document.getElementById('scene'));
  if(P==='end')cardRender();
  if(P!==lastP){
    if(P==='start'||P==='birth'||P==='end'||P==='dex')window.scrollTo(0,0);
    if(P==='event'){const b=document.getElementById('evbox');if(b&&b.getBoundingClientRect().top>window.innerHeight*0.7)b.scrollIntoView({block:'start',behavior:'smooth'})}
  }
  lastP=P;
  loop();
}

app.addEventListener('click',e=>{
  const tm=e.target.closest('.term');if(tm){glShow(tm);return}glHide();
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='begin'){
    const s=document.getElementById('seed');
    const n=s?parseInt(s.value.replace(/\D/g,''),10):NaN;
    newGame(n>0?n:Math.floor(100000+Math.random()*900000));P='birth';render();
  }
  else if(a==='enter'){P='run';newYear();render()}
  else if(a==='focus'){focus=v;render()}
  else if(a==='strat'){S.strat=v;render()}
  else if(a==='detail'){detail=!detail;try{localStorage.setItem('adj-detail',detail?'1':'0')}catch(e){}render()}
  else if(a==='pol'){if(S.co)S.co.pol=v;render()}
  else if(a==='speed'){const f=prog()/dur();speed=v;yrAcc=f*dur();yrRes=now();render()}
  else if(a==='pause'){if(!paused){yrAcc+=now()-yrRes;paused=true}else{paused=false;yrRes=now()}render()}
  else if(a==='opt')choose(+v);
  else if(a==='cont')cont();
  else if(a==='savecard')saveCard();
  else if(a==='dex'){dexFrom=P;P='dex';render()}
  else if(a==='dtab'){dexTab=v;render()}
  else if(a==='dexback'){P=dexFrom||'start';render()}
  else if(a==='again'){startSeed='';P='start';S=null;END=null;render()}
  else if(a==='same'){newGame(S.seed);P='birth';render()}
  else if(a==='copy'){
    const ta=document.getElementById('share');
    const done=ok=>{b.textContent=ok?'Copied':'Long-press the text to copy it manually'};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>done(true),()=>{ta.focus();ta.select();done(false)});
    }else{ta.focus();ta.select();done(false)}
  }
});
app.addEventListener('change',e=>{if(e.target.id==='autoBox'){auto=e.target.checked;render()}});
app.addEventListener('input',e=>{if(e.target.id==='seed')startSeed=e.target.value});
app.addEventListener('keydown',e=>{const tm=e.target.closest&&e.target.closest('.term');if(tm&&(e.key==='Enter'||e.key===' ')){e.preventDefault();glShow(tm)}else if(e.key==='Escape')glHide()});
if(document.addEventListener)document.addEventListener('click',e=>{if(e.target.closest&&!e.target.closest('.term')&&!e.target.closest('#gpop'))glHide()});
render();
</script>

</body>
