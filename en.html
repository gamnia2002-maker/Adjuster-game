Object.assign(KNOW,{
 icl1:['Settlement decisions','Facing litigation, an insurer should compare the settlement amount with “chance of losing × likely award + legal costs + time.” Settling isn’t admitting defeat; it’s a tool for controlling total claims cost.'],
 icl2:['Claims data matching','The insurance industry has systems for reporting and matching claims data that can reveal repeated or unusual claims by the same person across insurers. Suspicious isn’t the same as fraud: a denial needs concrete evidence, or an ombudsman or court may order payment.'],
 icl3:['Managing large claims','Many insurers have dedicated large-loss units with claims authority matrices and regular case reviews, so major claims are handled consistently and reserves are set early.'],
 iuw1:['Underwriting and pricing','Pricing can’t rest only on whether there was a claim last year. Risk quality, accumulation in the area, reinsurance cost and market rates all matter. The deductible is a common tool for adjusting price and risk sharing.'],
 iuw2:['Risk improvement recommendations','Underwriters often make risk improvement recommendations from surveys, with deadlines, as conditions of cover or renewal. This reduces losses far more than simply raising rates.'],
 iuw3:['Parametric insurance','Parametric insurance pays when an objective index (such as wind speed, earthquake intensity or rainfall) reaches an agreed level, with no loss inspection, so it pays fast. The downside is basis risk: a real loss may not be paid, and a payout may happen without a loss.'],
 iri1:['Retention and reinsurance cost','A higher retention means cheaper reinsurance, but bigger losses for the company to carry itself. Reinsurance buying balances cost, capital and risk tolerance.'],
 iri2:['Reinsurer credit risk','Reinsurance is insurance for insurers. If a reinsurer can’t pay, the risk comes back to the insurer. Regulators usually require cedants to hold reserves or obtain collateral for poorly rated reinsurers.'],
 iri3:['Accumulation management','Insurers must monitor total sums insured in the same area and industry and set limits, so one catastrophe doesn’t hit capital too hard. Science and industrial parks are common accumulation hotspots.'],
 bmar1:['Declarations under stock throughput cover','Stock throughput (STP) premiums are often based on declared stock values. Declaring below actual value may mean claims are paid proportionally. Periodic declarations let the premium follow actual stock.'],
 bmar2:['Notice of damage on delivery','Under Article 56 of Taiwan’s Maritime Act, once goods are received the carrier is presumed to have delivered them as described in the bill of lading. If damage isn’t apparent, written notice must be given to the carrier within three days of delivery to preserve the right to claim.'],
 bmar3:['Inland transit loss prevention','High-value electronics are most often stolen in inland transit. Common measures include GPS tracking, team drivers, stopping only at designated places, seal checks and vetting carriers. A good loss-prevention record also wins better insurance terms.'],
 bpro1:['Book value and replacement cost','Book value on the balance sheet is an accounting figure after depreciation, not the cost to rebuild. If property insurance pays on a replacement cost basis, the sum insured should be based on replacement cost too, or the risk may be underinsured.'],
 bpro2:['Interim payments','Final adjustment of a large claim can take months or even years. Once liability is broadly clear, the insured can ask the insurer for an interim payment based on the adjuster’s preliminary estimate to ease cash pressure.'],
 bpro3:['Claims preparation costs','Some property policies have a claims preparation costs clause, paying reasonable fees for accountants, engineers and other experts the insured hires to prepare the claim. Large business interruption claims especially need such experts.'],
 benr1:['Marine warranty surveyor (MWS)','Insurance for marine construction such as offshore wind often requires major marine operations (lifting, towing) to be approved in advance by a marine warranty surveyor. Failing to get approval as required may affect the claim.'],
 benr2:['Indemnity period and yield ramp-up','The BI indemnity period usually runs until the business returns to pre-loss levels, capped at an agreed maximum. A fab’s yield ramp-up after restart is often within the indemnity.'],
 benr3:['Owner-controlled insurance programs','For large projects, the owner can insure the whole project (an OCIP), covering all contractors. The benefits are consistent cover and no gaps or duplication; the downside is that the owner must manage the whole program.'],
 rtr1:['Reinsurance and sliding-scale commission','In proportional reinsurance, the reinsurer pays the cedant a commission to cover acquisition and management costs. A sliding scale links the commission rate to the loss ratio: the lower the losses, the higher the commission, aligning both sides’ interests.'],
 rtr2:['Retrocession','Reinsurers also pass on part of the risk they take, called retrocession. In a catastrophe year when many treaties are hit at once, retrocession is a key tool for keeping a reinsurer stable.'],
 rtr3:['Reinsurance in emerging markets','Emerging markets often have little historical data, low rates, and rules that favor ceding to local reinsurers first. Entering a new market takes time to build data and relationships.'],
 rfac1:['Underwriting information for facultative','Facultative reinsurance assesses single risks one by one, so how recent and complete the information is matters a great deal. An outdated survey may miss expansions, process changes and other major changes in risk.'],
 rfac2:['Probable maximum loss (PML)','PML is the largest loss a single event could cause when protective systems partly fail. Firewalls, separation distances and fire protection all affect PML, and directly affect how much a reinsurer will accept.'],
 rfac3:['Setting facultative terms','The deductibles, sub-limits and BI waiting periods set by the lead reinsurer define the risk profile of the whole placement. Only professional, sensible terms will attract followers.'],
 rcat1:['Return periods and model uncertainty','“One in a hundred years” means roughly a 1% chance each year, not that it happens only once a century. Catastrophe models depend heavily on assumptions such as exposure data and building vulnerability, and must be checked regularly against real losses.'],
 rcat2:['Exposure data quality','A catastrophe model is only as accurate as its exposure data: address, construction, number of floors and year built. The more gaps, the more uncertain the results.'],
 rcat3:['Catastrophe bonds','Catastrophe bonds transfer catastrophe risk to capital market investors. Triggers can be indemnity (actual losses), parametric (physical measures) or index-based (industry loss indices), each trading off transparency against basis risk.'],
 ers1:['Research data and personal data','Research data containing personal information should be de-identified and covered by a data use agreement, in line with Taiwan’s Personal Data Protection Act and ethics review. A data breach may bring notification and compensation duties.'],
 ers2:['Academic independence','Industry collaborations should agree data use and publication rights in the contract up front. Conclusions may be unwelcome, but academic independence is what gives research its value.'],
 ers3:['Catastrophe risk research','Catastrophe research often combines meteorology, geology, engineering and insurance. Integrated research helps policy fit reality, for example in reviewing the limits and rates of residential earthquake insurance.'],
 etc1:['Case-based teaching and confidentiality','Teaching with real claims cases works well, but they should be de-identified and identifying details rewritten. Adjusters and claims staff owe confidentiality on the cases they handle.'],
 etc2:['Conflicts of interest in exams','Anyone setting or marking a licensing exam should avoid tutoring or anything that could leak questions. Even without an actual leak, a conflict of interest damages the exam’s credibility.'],
 etc3:['Continuing training in insurance','Insurance professionals must regularly complete continuing education. Good courses combine cases, wordings and regulatory updates, and keep the industry improving.'],
 epl1:['Residential earthquake insurance','Taiwan’s basic residential earthquake insurance pays on a total loss, currently up to NT$1.5 million (about US$47K), plus temporary accommodation costs. The limit must balance the protection gap against the premium burden.'],
 epl2:['Designing compulsory liability insurance','If compulsory liability limits are too low, victims aren’t adequately compensated; too high, and businesses bear heavy costs. Tiering by venue size and type of activity is a common design.'],
 epl3:['Financial ombudsman','Taiwan’s Financial Ombudsman Institution handles disputes between consumers and financial institutions. Panel members must be neutral and recuse themselves from conflicts of interest.'],
 cbcp1:['Single points of failure','Business continuity planning looks for single points of failure: anything whose failure stops the whole operation, such as a shared substation, a sole supplier or a single data center.'],
 cbcp2:['Supply-chain mapping','Many companies only know their tier-one suppliers. Mapping tier-two and tier-three suppliers reveals hidden risks such as geographic concentration. Contingent business interruption cover usually only applies to named suppliers.'],
 cbcp3:['ISO 22301','ISO 22301 is the international standard for business continuity management systems, building a full cycle from business impact analysis and risk assessment to response plans, exercises and improvement.'],
 cerm1:['Risk appetite','Risk appetite is the amount of risk a company is willing to take to achieve its goals. A good risk appetite statement combines quantitative limits (such as a cap on single-event losses) with qualitative descriptions, so the board can discuss it concretely.'],
 cerm2:['Three lines of defense','The first line is business units managing their own risks, the second is risk management and compliance overseeing them, and the third is internal audit checking independently. Clear roles make internal control effective.'],
 cerm3:['Board risk governance','Taiwan’s listed companies have a code of practice for risk management that encourages boards to set up risk committees and regularly review key risks. Outside advisers can offer an independent view.'],
 cesg1:['Physical risk assessment','Physical climate risks include flooding, typhoons, heat and water shortages. When assessing a new site, use government flood hazard maps and climate scenarios, not just historical records.'],
 cesg2:['Greenwashing risk','Exaggerating or selectively disclosing emissions progress in a sustainability report can bring accusations of greenwashing and reputational and legal risk. Disclosing real data with a concrete improvement plan earns more trust.'],
 cesg3:['Transition risk','Transition risk is the financial impact of society’s move to low carbon, such as carbon fees, regulation, technology replacement and customer demands. Supply-chain companies are often first in line because of global brands’ carbon targets.'],
 omar1:['The one-year time bar at sea','Under Article 56 of Taiwan’s Maritime Act, the carrier is discharged from liability for loss or damage unless suit is brought within one year of delivery or the date goods should have been delivered. Insurers pursuing subrogation must watch the time bar, and ask for an extension or sue early if needed.'],
 omar2:['Liability in heavy lifts','Heavy lifts need a lifting plan, certified lifting gear and inspection records. When something goes wrong, these records are the key to sorting out liability between cargo owner, ship and stevedores.'],
 omar3:['P&I Clubs','P&I Clubs cover shipowners’ liabilities to third parties, such as cargo damage, oil pollution, crew injury and collision. Clubs appoint correspondents in ports worldwide to respond as soon as something happens.'],
 ocat1:['Staffing and quality in catastrophes','Claims surge after a catastrophe, and adjusting firms often hire temporary staff. Central training, standard forms and report spot checks are the keys to quality.'],
 ocat2:['Determining a constructive total loss','Residential earthquake insurance only pays on a total loss. Besides collapse, this includes cases where the authorities or a qualified engineer determine the building must be demolished and rebuilt. It must rest on objective assessment, not sympathy.'],
 ocat3:['Pre-positioning for catastrophes','Arranging people, equipment and partners before typhoon season lets inspections start right after a disaster, preserving evidence early, helping reduce losses and shortening the whole claims process.'],
 ovol1:['Balancing volume and quality','Volume claims depend on standard procedures and sample audits to maintain quality. Speed and report quality are the two main measures insurers use to choose adjusting firms.'],
 ovol2:['Motor damage estimates','The core of a motor damage estimate is reasonable labor time and parts prices. A database of market rates quickly exposes inflated estimates.'],
 ovol3:['Service level agreements (SLA)','Insurers and adjusting firms often agree service levels, such as inspection and report deadlines and error rates, with penalties for missing them. Remote areas usually need separate terms.'],
 bsme1:['SME protection gaps','SMEs often buy only the bare minimum of insurance. Brokers should explain the gap between minimum limits and realistic losses, and help clients get suitable cover within budget.'],
 bsme2:['Buying insurance online','Regulators allow some lines to be bought online, but with proper identity checks and full disclosure. Online channels can serve many small clients, but advice should still be available.'],
 bsme3:['Broker branch offices','A brokerage opening branches must follow the rules and staff them with qualified professionals. Local service brings you closer to SME clients.'],
 bmnc1:['Global insurance programs','Multinational programs are often designed as a master policy plus local policies: local policies satisfy local law, and the master policy fills gaps in terms and limits. Many countries don’t allow foreign insurers to cover local risks directly.'],
 bmnc2:['Claims currency and exchange rates','Cross-border claims often involve a loss currency different from the policy currency. The policy should specify the exchange rate date, such as the date of loss or date of payment, to avoid disputes.'],
 bmnc3:['An international broker network','Independent brokers can join international broker networks and work with members in other countries to serve multinational clients. Networks usually require members to meet common service standards.'],
 bspe1:['Cyber incident response','After a cyber incident, notify the insurer first and use the policy’s panel response team (forensics, legal, PR). Handling it yourself may leave some costs uncovered. Whether a ransom is covered depends on the wording and the law.'],
 bspe2:['Claims-made policies','D&O and professional liability policies are mostly claims-made: they respond when a claim is made and notified to the insurer during the policy period. If you know a claim may be coming, notify as early as possible within the period.'],
 bspe3:['Professional liability insurance','Professional liability insurance covers professionals’ liability for losses caused by negligence in their work. Group schemes lower premiums, but the wording must fit each profession’s practice risks and regulations.'],
 tb2b1:['The limits of fraud detection','Fraud detection systems can only flag suspicious cases; they can’t be the sole basis for denying a claim. Human review and explainable reasons reduce the harm false positives do to genuine customers.'],
 tb2b2:['Data governance','Insurtech partnerships should agree data ownership, permitted use and retention in the contract. Using personal data to train models must meet the purpose limits and de-identification requirements of Taiwan’s Personal Data Protection Act.'],
 tb2b3:['Cross-border data transfers','Countries have different rules on transferring personal data across borders. An insurtech operating in several markets must check each market’s data protection and security rules.'],
 tai1:['Representative training data','AI model bias often comes from unbalanced training data. When a type of case is rare in the data, the model is more likely to misjudge it, and needs more data or human review.'],
 tai2:['Deepfake claims fraud','Generative AI makes fake photos easy. Common defenses include image authenticity checks, examining file metadata and requiring live photos taken in the app.'],
 tai3:['AI in financial services','Taiwan’s Financial Supervisory Commission has issued guidelines on AI use in financial services, stressing fairness, transparency, explainability and human oversight. Insurers using AI in claims must be able to explain how the model decides.'],
 temb1:['Embedded insurance and consumer protection','Embedded insurance adds cover inside a purchase flow. It’s convenient, but can leave consumers buying without realizing it. Pre-ticked boxes are widely seen as improper; clear disclosure and active choice are good practice.'],
 temb2:['Who may solicit insurance','Under Taiwan law, only insurers, insurance agents and brokers, and their registered representatives may solicit insurance. A platform without a license can only refer customers, not sell.'],
 temb3:['Data sources for automatic payouts','Automatic parametric payouts depend on a reliable data source and a clear trigger. Bad data directly causes wrong or missed payments, so the wording should name the data source and how errors are corrected.']
});


const CLW={
 okW:{t:'The other side didn’t dig deeper, and you got away with it this time. But you know this reading doesn’t really hold up.',fx:{rep:1}},
 ngW:{t:'The other side rebuts your reading point by point, and you have to rewrite the report.',fx:{rep:-3,pro:2}},
 ngR:{t:'Your reading holds up, but the other side won’t accept it, and the case turns into a long dispute.',fx:{hp:-2,pro:1}}
};
const CL=[

{id:'cl_notice',n:'Clause reading: notified on day nine',adj:1,t:'After a factory fire, the insured notifies the insurer on day nine. The insurer wants to decline for late notice.',cl:{x:'When an insured event occurs, the insured shall notify the insurer within five days of becoming aware of it. If the insured fails to notify within that time, the insured shall be liable for any loss the insurer suffers as a result.',o:['Late notice; the insurer can decline entirely','The insurer must still pay, but can claim a deduction for loss caused by the late notice','After five days, the policy automatically lapses'],a:1,why:'The clause (like Articles 58 and 63 of Taiwan’s Insurance Act) makes the insured liable for extra loss caused by the delay; it doesn’t forfeit the claim. The insurer has to show what extra loss the late notice caused, such as lost evidence or a larger loss.',ok:{t:'In your report you separate “loss increased by the delay” from “the original loss.” The insurer accepts your analysis.',fx:{pro:3,rep:3}}}},
{id:'cl_salvage',n:'Clause reading: salvage costs',adj:1,t:'When the warehouse caught fire, the insured hired a crane to save goods, costing US$30K. The goods loss came to US$285K, with a sum insured of US$300K.',cl:{x:'Necessary costs incurred by the insured to avoid or reduce a loss shall be reimbursed by the insurer, even if together with the claim payment they exceed the value of the insured property.',o:['Pay at most the US$300K sum insured','The US$285K loss plus the US$30K salvage cost, US$315K in total, should be paid','Salvage costs were voluntary; not covered'],a:1,why:'This reflects Article 33 of Taiwan’s Insurance Act: to encourage loss reduction, necessary mitigation costs are reimbursed even if, with the claim, they exceed the sum insured. If there’s underinsurance, though, mitigation costs may also be paid proportionally.',ok:{t:'You document clearly why the crane was necessary, and the insurer accepts the full amount.',fx:{pro:3,rep:3}}}},
{id:'cl_contrib',n:'Clause reading: two policies',adj:1,t:'A warehouse is insured against fire with two insurers, for US$180K and US$120K; its actual value is US$300K. This loss is US$60K.',cl:{x:'If the same property is insured against the same peril under another policy, this insurer is liable only for the proportion its sum insured bears to the total sums insured.',o:['Each pays US$60K, so the insured gets US$120K','Whichever was notified first pays in full','The US$180K policy pays US$36K and the other pays US$24K'],a:2,why:'Under the principle of indemnity, the insured can’t profit from having several policies. Shared proportionally, the US$180K policy bears 180/300, or US$36K; the other bears US$24K.',ok:{t:'You include a contribution table in the report; neither insurer objects.',fx:{pro:3,rep:2}}}},
{id:'cl_quakefire',n:'Clause reading: fire caused by an earthquake',adj:1,t:'After an earthquake, a factory gas line ruptures and catches fire, burning an entire production line. The fire policy has no earthquake extension.',cl:{x:'This policy does not cover loss caused by earthquake. However, loss by fire caused by earthquake remains covered.',o:['The earthquake was the cause; nothing is covered','Fire damage is covered; direct earthquake damage is not','The insurer can choose freely whether to pay'],a:1,why:'The clause clearly separates loss caused directly by the earthquake from fire caused by it. In practice, shaking damage and fire damage must be assessed separately to pay correctly.',ok:{t:'You classify each machine as earthquake-damaged or fire-damaged, and the insurer pays on your classification.',fx:{pro:4,rep:2}}}},

{id:'cl_avg',n:'Clause reading: underinsurance',adj:1,spec:['fire'],t:'A warehouse worth US$300K is insured for only US$180K. A fire causes a US$90K loss.',cl:{x:'If the sum insured is less than the value of the insured property, unless otherwise agreed, this insurer’s liability shall be in the proportion that the sum insured bears to the value.',o:['Pay US$90K; it’s within the sum insured','Pay US$54K','Pay US$180K, the sum insured'],a:1,why:'This is the average principle (Article 77 of Taiwan’s Insurance Act). The sum insured is only 60% of value, so 60% is paid: US$90K × 180/300 = US$54K.',ok:{t:'You attach the average calculation. The insured is disappointed but understands.',fx:{pro:3,rep:3}}}},
{id:'cl_debris',n:'Clause reading: debris removal',adj:1,spec:['fire'],t:'Clearing debris after a fire costs US$24K. The property loss itself is US$150K, and the sum insured is adequate.',cl:{x:'This insurer covers necessary costs of removing debris of the damaged insured property, limited to 10% of the amount of the loss.',o:['Debris removal paid in full, US$24K','Debris removal paid at US$15K','Debris removal isn’t covered'],a:1,why:'Debris removal is capped at 10% of the loss: US$150K × 10% = US$15K. The remaining US$9K is the insured’s own cost. Limits and calculations differ by policy, so always read the wording.',ok:{t:'You explain the debris removal cap clearly, so the insured knows what to expect.',fx:{pro:3,rep:2}}}},
{id:'cl_iccc',n:'Clause reading: rain under the C clauses',adj:1,spec:['cargo'],t:'Cartons of cargo waiting on the quay for loading are soaked by heavy rain. The cargo cover is Institute Cargo Clauses (C).',cl:{x:'Institute Cargo Clauses (C): covers loss or damage caused by fire or explosion; vessel stranded, grounded, sunk or capsized; overturning or derailment of land conveyance; collision; discharge at a port of distress; general average sacrifice; jettison.',o:['Rain isn’t a listed peril; not covered','Any loss in transit is covered','Anything not intentional by the insured is covered'],a:0,why:'The (C) clauses are named-perils: only the major events listed are covered. Rain, seawater wetting and theft aren’t in (C). Only (A) is all risks.',ok:{t:'You explain the difference between (A) and (C), and the cargo owner switches to (A) the next year.',fx:{pro:3,rep:2}}}},
{id:'cl_transit',n:'Clause reading: too long in the port warehouse',adj:1,spec:['cargo'],t:'After discharge, goods sit in a port warehouse for 75 days before being trucked to the factory, and are damaged in a road accident. The policy has no extension.',cl:{x:'This insurance terminates on whichever first occurs: delivery to the final warehouse at destination; or the expiry of 60 days after completion of discharge from the overseas vessel.',o:['Still in transit; it should be paid','More than 60 days after discharge; cover had ended; not covered','As long as it eventually reaches the factory, the time in between doesn’t matter'],a:1,why:'The transit clause in the Institute Cargo Clauses ends cover 60 days after discharge, even if goods haven’t reached their final destination. Longer storage needs an extension arranged in advance.',ok:{t:'You point out the timing problem and suggest the owner arrange extensions in future.',fx:{pro:3,rep:2}}}},
{id:'cl_defect',n:'Clause reading: design error',adj:1,spec:['eng'],t:'A retaining wall collapses due to a design error, crushing a completed plant room next to it.',cl:{x:'This policy does not cover the cost of repairing the part of the works itself affected by a design error; but damage to other insured works resulting from it remains covered.',o:['Design error, so nothing is covered','The wall itself isn’t covered; the crushed plant room is','Everything is covered, since it was an accident'],a:1,why:'This is a common defects exclusion design in engineering insurance: it excludes the defective part itself, but accidental damage the defect causes to other parts remains covered.',ok:{t:'You calculate the wall and the plant room losses separately, and the insurer pays accordingly.',fx:{pro:4,rep:2}}}},
{id:'cl_maint',n:'Clause reading: a leak in the maintenance period',adj:1,spec:['eng'],t:'Eight months after completion, a pipe bursts because of poor welding during construction. The policy has an extended maintenance clause.',cl:{x:'Extended maintenance clause: covers loss or damage to the insured works during the maintenance period caused by a source originating during construction, and loss or damage caused by the contractor while fulfilling maintenance obligations.',o:['Caused during construction and occurring in the maintenance period; it should be paid','The works are complete; the construction policy no longer applies','Only damage from the owner’s own renovations is covered'],a:0,why:'Extended maintenance cover applies when the cause arose during construction and the loss occurs during the maintenance period. Losses caused by the owner or third parties after completion aren’t covered.',ok:{t:'You pull the weld inspection records showing the cause dates from construction, and the insurer agrees to pay.',fx:{pro:4,rep:2}}}},
{id:'cl_winded',n:'Clause reading: windstorm deductible',adj:1,spec:['re'],t:'A typhoon damages part of a solar plant; the loss is US$90K.',cl:{x:'For loss caused by typhoon or windstorm, the deductible for each occurrence is 10% of the loss, minimum US$15,000.',o:['Deductible US$9K, pay US$81K','Deductible US$15K, pay US$75K','The higher of 10% of US$90K and US$15K is deducted, pay US$90K'],a:1,why:'10% of the loss is US$9K, below the US$15K minimum, so the deductible is US$15K. Payment is US$90K − US$15K = US$75K.',ok:{t:'Your calculation is clear, and the plant owner gets it immediately.',fx:{pro:3,rep:2}}}},
{id:'cl_saving',n:'Clause reading: electricity saved during shutdown',adj:1,spec:['semi','fire'],t:'A factory is shut for four months. The insured’s BI claim includes all fixed costs for the period, including electricity. But the power bill actually fell 80% during the shutdown.',cl:{x:'Business interruption loss is the reduction in gross profit, less any charges and expenses saved as a result of the interruption.',o:['Fixed costs stand as claimed; no deduction for electricity','Electricity saved during the shutdown should be deducted','BI only pays staff wages'],a:1,why:'BI insurance pays the gross profit the business would have earned without the loss. Expenses actually saved during the shutdown must be deducted, or the insured would profit from the loss.',ok:{t:'You check each expense line, deduct the saved power and consumables, and both sides accept the calculation.',fx:{pro:4,rep:2}}}},
{id:'cl_ip',n:'Clause reading: a 12-month indemnity period',adj:1,spec:['semi'],t:'After a fab incident, returning fully to pre-loss output takes 15 months. The policy’s maximum indemnity period is 12 months.',cl:{x:'Indemnity period: from the date of the incident until the business returns to its pre-loss level, but not exceeding twelve months.',o:['Pay 15 months, since that’s how long it really takes','Pay only 12 months of loss; the rest is the insured’s','Pay only until the tools were repaired'],a:1,why:'The indemnity period runs until the business recovers, but is capped at the agreed maximum. A 15-month recovery can only be paid for 12 months. That’s why the indemnity period should be set on realistic recovery time.',ok:{t:'Your report flags that this gap should be closed at renewal.',fx:{pro:3,rep:3}}}},
{id:'cl_emp',n:'Clause reading: an employee is injured',adj:1,spec:['motor'],t:'A store employee moving stock is hit by a falling shelf. The family wants the store’s public liability policy to pay.',cl:{x:'This policy does not cover injury to the insured’s employees arising in the course of their employment.',o:['Injured in the store, so public liability must pay','Employees injured at work aren’t covered by public liability; labor insurance and employer’s liability apply','As long as the store was negligent, it must pay'],a:1,why:'Public liability insurance protects third parties, such as customers. An employee injured at work is an occupational injury, handled by labor insurance, occupational accident insurance and employer’s liability insurance.',ok:{t:'You help the family turn to the right channels, and they’re grateful.',fx:{pro:3,rep:3}}}},

{id:'cl_misrep',n:'Clause reading: concealed three years ago',route:['ins'],t:'Three years into the policy, the warehouse floods, and you discover the client never disclosed that it had flooded before.',cl:{x:'If the proposer intentionally conceals or negligently omits facts sufficient to change or reduce the insurer’s assessment of the risk, the insurer may rescind the contract. However, once two years have passed since the contract was made, it may not be rescinded even if grounds exist.',o:['Rescind the contract and decline the claim','More than two years have passed; the contract can’t be rescinded, and the claim must be paid','Rescind, but refund the premium'],a:1,why:'Article 64 of Taiwan’s Insurance Act sets time limits: the right to rescind lapses one month after the insurer learns the grounds, or two years after the contract was made. This stops insurance relationships staying uncertain forever.',ok:{t:'You advise paying as the law requires, avoiding an ombudsman case you’d have lost.',fx:{pro:3,rep:3}}}},
{id:'cl_subro',n:'Clause reading: the cap on subrogation',route:['ins'],t:'You paid the insured US$240K. It turns out the factory next door is fully liable, and the court assesses total damages at US$300K.',cl:{x:'After paying a claim, the insurer may exercise the insured’s rights against a third party by subrogation, but may not recover more than the amount it paid.',o:['The insurer can recover US$300K from the other party','The insurer can recover at most US$240K; the remaining US$60K is the insured’s own right','The insurer can’t subrogate'],a:1,why:'Article 53 of Taiwan’s Insurance Act: subrogation is capped at what the insurer has paid. For what insurance didn’t pay (such as the deductible or underinsurance), the insured can still claim from the wrongdoer.',ok:{t:'You and the insured coordinate the recovery, and both get back what they’re owed.',fx:{pro:3,net:2}}}},
{id:'cl_family',n:'Clause reading: a fire started by the son',route:['ins'],t:'The insured’s son smoked at home and accidentally started a fire. After paying, your manager asks if you can subrogate against the son.',cl:{x:'Where the third party is a member of the insured’s family or an employee, the insurer has no right of subrogation, unless the loss was caused intentionally by that person.',o:['Yes, the son is a third party','No, losses negligently caused by family can’t be subrogated','Only half can be recovered'],a:1,why:'Article 53(2) of Taiwan’s Insurance Act: an insurer can’t subrogate against family members or employees for negligence; otherwise it would pay and then take the money back from the family, defeating the purpose of insurance. Intentional acts are the exception.',ok:{t:'You explain the law to your manager, and the company avoids a controversial recovery.',fx:{pro:3,rep:2}}}},
{id:'cl_delay',n:'Clause reading: delayed payment',route:['ins'],t:'The insured submitted all documents two months ago, but payment is stuck in internal processes. The insured demands interest.',cl:{x:'The insurer shall pay within the agreed period after the insured has submitted all supporting documents, or, if no period is agreed, within fifteen days of notice. If payment is late for reasons attributable to the insurer, it shall pay default interest at 10% a year.',o:['No interest; the payment is big enough','Default interest at 10% a year must be added','As long as it’s paid eventually, that’s fine'],a:1,why:'Article 34 of Taiwan’s Insurance Act: delay attributable to the insurer carries default interest of 10% a year. It’s designed to make insurers pay promptly.',ok:{t:'You calculate the interest and pay it with the claim, and push to fix the internal process.',fx:{pro:2,rep:4}}}},

{id:'cl_ipbi',n:'Clause reading: tools fixed, revenue not back',route:['brk','bro'],t:'The client’s equipment was repaired in nine months, but it took five more months for orders to return and revenue to reach pre-loss levels. The insurer only wants to pay nine months.',cl:{x:'Indemnity period: the period from the date of the incident until the insured’s results of business return to the pre-loss level, limited to a maximum of eighteen months.',o:['Pay only nine months; it ends when the equipment is fixed','Pay until results recover: fourteen months','Pay the full eighteen months'],a:1,why:'The indemnity period depends on results of business recovering, not equipment being fixed. Fourteen months is within the 18-month cap, so it can all be paid.',ok:{t:'You use monthly revenue data to prove the recovery period, and the insurer agrees to pay through month fourteen.',fx:{pro:4,rep:3,net:1}}}},
{id:'cl_occur',n:'Clause reading: one occurrence or three?',route:['brk','bro'],t:'A typhoon causes US$24K of damage at each of three client sites within 30 hours. The policy deductible is US$30K per occurrence.',cl:{x:'Deductible of US$30,000 per occurrence. Loss caused by the same typhoon within any 72 consecutive hours shall be treated as one occurrence.',o:['Three occurrences, each within the deductible; nothing paid','One occurrence of US$72K; less the US$30K deductible, pay US$42K','Only the site with the largest loss counts'],a:1,why:'The definition of an occurrence decides how many deductibles apply. The 72-hour clause combines one typhoon’s losses into a single occurrence, which matters a lot for clients with several sites.',ok:{t:'You cite the occurrence definition and win the client an extra US$42K.',fx:{pro:3,rep:3,net:2}}}},
{id:'cl_ai',n:'Clause reading: additional insured',route:['brk','bro'],t:'A US buyer is named as an additional insured on the client’s product liability policy. The buyer is sued by a visitor who slipped on its own wet warehouse floor.',cl:{x:'Cover for an additional insured is limited to liability arising from the named insured’s products or operations.',o:['The buyer is an additional insured, so any liability is covered','This has nothing to do with the client’s products; not covered','Anything that happens in the US is covered'],a:1,why:'An additional insured is only covered for liability connected with the named insured’s products or business. The buyer’s own premises liability belongs on the buyer’s own policy.',ok:{t:'You explain the scope of cover to the buyer and suggest the client spell it out in the contract.',fx:{pro:3,net:2}}}},
{id:'cl_claimsmade',n:'Clause reading: claims-made',route:['brk','bro'],t:'The client’s D&O policy expired at the end of last year and wasn’t renewed. In March, investors sue over a decision made the year before last.',cl:{x:'This policy covers loss from claims first made against the insured during the policy period and notified to the insurer during the policy period.',o:['The decision was made when insurance was in force, so it should be paid','The claim was made after the policy period; not covered','As long as premiums were paid, it’s covered'],a:1,why:'Claims-made cover looks at when the claim is made, not when the act happened. Claims made after expiry aren’t covered unless there’s an extended reporting period. That’s why D&O cover should be renewed continuously.',ok:{t:'You advise the client to renew continuously from now on and consider buying an extended reporting period.',fx:{pro:3,rep:2}}}},

{id:'cl_hours',n:'Clause reading: when do the 72 hours start?',route:['rei'],t:'A typhoon causes the cedant one big loss at hour 10 after landfall and another at hour 90.',cl:{x:'Losses caused by the same catastrophe within any 72 consecutive hours shall be treated as one event. The cedant may choose when the 72 hours begin.',o:['Same typhoon, so it must be one event','The two losses are 80 hours apart and can’t fit in one 72-hour window, so there are at least two events','The reinsurer decides how to count it'],a:1,why:'The cedant can choose the start time, but with the losses 80 hours apart no 72-hour window can cover both. So there are at least two events, each with its own retention.',ok:{t:'Your analysis gets both sides to agree quickly.',fx:{pro:4,rep:2}}}},
{id:'cl_xl',n:'Clause reading: excess of loss',route:['rei'],t:'A fire at the cedant causes a total loss of US$10.5M.',cl:{x:'Excess of loss: the cedant retains US$3 million each event; the reinsurer pays loss above US$3 million, up to US$12 million.',o:['The reinsurer pays US$10.5M','The reinsurer pays US$7.5M','The reinsurer pays US$12M'],a:1,why:'Excess of loss pays only above the retention: US$10.5M − US$3M = US$7.5M, within the US$12M limit.',ok:{t:'The recovery is calculated right the first time, and the cedant is paid quickly.',fx:{pro:3,net:2}}}},
{id:'cl_follow',n:'Clause reading: an ex gratia payment',route:['rei'],t:'To keep a client happy, the cedant made an “ex gratia” payment on a loss outside the cover, and now wants you to share it.',cl:{x:'The reinsurer shall follow the settlements made by the cedant within the terms of the original policy.',o:['The reinsurer must follow all the cedant’s decisions','An ex gratia payment is outside the original policy terms; the reinsurer needn’t share it','The reinsurer shares half'],a:1,why:'Follow the settlements only applies to reasonable, good-faith settlements within the original policy terms. Ex gratia payments outside the terms needn’t be shared unless the reinsurer agreed beforehand.',ok:{t:'You explain your position tactfully, and the cedant accepts it.',fx:{pro:3,rep:2}}}},
{id:'cl_coop',n:'Clause reading: settled without consent',route:['rei'],t:'Without telling you, the cedant settled a large claim with the insured for US$6M.',cl:{x:'The cedant shall notify the reinsurer immediately of any claim that may exceed US$150,000 and shall not settle without the reinsurer’s consent. This clause is a condition precedent to the reinsurer’s liability.',o:['The settlement is reasonable, so the reinsurer must share it','A condition precedent was breached; the reinsurer can deny liability','Late notice afterwards is enough'],a:1,why:'If a claims cooperation clause is expressly a condition precedent, a breach lets the reinsurer deny liability. If it’s an ordinary term, the reinsurer can usually only deduct the loss the breach caused. The exact wording is crucial.',ok:{t:'You negotiate on the basis of the clause, and in the end share part of the loss according to the actual impact.',fx:{pro:4,net:1}}}},

{id:'cl_interest',n:'Clause reading: insurable interest in class',route:['edu'],t:'A student asks: “A seller exports on FOB terms, and the goods are damaged at sea after loading. Can the seller’s own cargo policy pay?”',cl:{x:'If the proposer or insured has no insurable interest in the subject matter, the insurance contract has no effect. (FOB: risk passes from seller to buyer when the goods are loaded on board.)',o:['Yes, the seller insured them','After loading, risk has passed to the buyer; the seller has no insurable interest in the loss at sea, so it can’t be paid','Buyer and seller each get half'],a:1,why:'Insurable interest is the foundation of an insurance contract (Article 17 of Taiwan’s Insurance Act). Under FOB, the buyer bears risk after loading, so the buyer should insure the sea transit.',ok:{t:'The student runs with it and starts using trade terms to decide who should insure.',fx:{pro:2,rep:3}}}},
{id:'cl_indem',n:'Clause reading: an old machine burns',route:['edu'],t:'Midterm question: a ten-year-old machine is destroyed by fire. Its actual value is US$30K; a new one costs US$90K. The policy pays on actual cash value.',cl:{x:'This policy pays on the basis of the actual cash value (replacement cost less depreciation) of the insured property at the time of loss.',o:['Pay US$90K so the insured can buy new','Pay US$30K','Pay US$60K'],a:1,why:'Actual cash value = replacement cost − depreciation, so US$30K is paid. To replace old with new, you need a replacement cost policy. It’s a basic application of the principle of indemnity.',ok:{t:'Most students get it right, and you add it to your question bank.',fx:{pro:2,rep:2}}}},

{id:'cl_cbi',n:'Clause reading: an unnamed supplier',route:['con'],t:'A flood at the client’s tier-two supplier shuts down the client’s plant. The client has contingent business interruption cover.',cl:{x:'Contingent business interruption: covers the insured’s BI loss resulting from an insured event damaging the property of the following named suppliers. (Named suppliers: Company A, Company B)',o:['Any supplier’s loss is covered','The flooded tier-two supplier isn’t named; not covered','Any shutdown of the client is covered'],a:1,why:'Contingent BI is usually on a named-supplier basis, covering only the suppliers listed. A loss at an unnamed tier-two supplier is normally outside cover. That’s why supply-chain mapping matters.',ok:{t:'You advise the client to name key tier-two suppliers at renewal.',fx:{pro:3,rep:2,res:10}}}},
{id:'cl_wait',n:'Clause reading: ten hours down',route:['con','tech'],t:'A cyber incident takes the client’s systems down for ten hours. The client asks whether its cyber policy covers the business interruption.',cl:{x:'Network business interruption: where a system outage lasts longer than the 12-hour waiting period, this insurer pays business interruption loss after the waiting period ends.',o:['Ten hours is within the waiting period; BI isn’t paid','The first twelve hours aren’t paid, but some of it should be','Any outage is paid in full'],a:0,why:'A waiting period works like a deductible measured in time. If the outage doesn’t exceed it, BI isn’t paid, though incident response costs such as forensics and recovery may fall under other sections.',ok:{t:'You advise the client to claim the incident response costs and review whether the waiting period is right.',fx:{pro:3,rep:2,res:10}}}},
{id:'cl_sysfail',n:'Clause reading: not a hacker',route:['tech'],t:'A faulty software update crashes the client’s systems for two days. There was no attack.',cl:{x:'This policy covers system interruption and business loss caused by a malicious cyber attack.',o:['Any system outage is covered','Not a malicious attack, so not within this policy','Anything above the deductible is covered'],a:1,why:'Many cyber policies cover only malicious attacks. Non-malicious system failures (such as faulty updates or human error) need separate “system failure” cover.',ok:{t:'You review the client’s policy and add system failure cover at renewal.',fx:{pro:3,rep:2,res:10}}}}
];

Object.assign(KNOW,{
 cl_notice:['Duty to notify a loss','The insured must notify the insurer within a set time after learning of a loss (five days by default under Taiwan’s Insurance Act). Late notice makes the insured liable for the insurer’s resulting loss; it doesn’t automatically forfeit the claim.'],
 cl_salvage:['Mitigation costs','Necessary costs the insured incurs to avoid or reduce a loss are reimbursed by the insurer, even if together with the claim they exceed the sum insured (Article 33 of Taiwan’s Insurance Act). This encourages active salvage when a loss happens.'],
 cl_contrib:['Double insurance and contribution','When several policies cover the same property against the same peril, each insurer bears the loss in proportion to its sum insured. The insured can’t collect more by buying more policies.'],
 cl_quakefire:['Proximate cause and exclusions','Read the scope of an exclusion carefully. Clauses like “earthquake excluded, but fire caused by earthquake covered” require direct causes and consequential losses to be assessed separately.'],
 cl_avg:['Calculating average','Underinsurance payment = loss × sum insured ÷ value. Setting the sum insured at replacement cost is the best way to avoid average.'],
 cl_debris:['Debris removal','Clearing debris after a fire can be expensive. Property policies often cap debris removal, for example at a percentage of the loss; anything above is the insured’s cost.'],
 cl_iccc:['Institute Cargo Clauses (A), (B), (C)','There are three sets of Institute Cargo Clauses: (A) is all risks, covering everything not excluded; (B) and (C) are named perils, covering only listed events, with (C) the narrowest. Common losses such as rain and theft are only covered under (A).'],
 cl_transit:['The transit clause in cargo insurance','Institute Cargo Clauses run warehouse to warehouse, but for no more than 60 days after discharge. If goods sit too long in a port or interim warehouse, cover may already have ended; arrange an extension in advance.'],
 cl_defect:['Defects exclusions in engineering insurance','Engineering policies usually don’t pay to fix the defective part itself, but do pay for accidental damage the defect causes elsewhere. The international market has several defects clauses (such as the LEG clauses) with different scopes.'],
 cl_maint:['Maintenance period cover','After completion, extended maintenance cover can protect against loss whose cause arose during construction. Basic maintenance cover is narrower.'],
 cl_winded:['Percentage and minimum deductibles','Natural catastrophe deductibles are often “a percentage of the loss, but not less than a set amount.” Calculate the percentage first, then take the higher of that and the minimum.'],
 cl_saving:['Savings in business interruption','BI insurance pays lost gross profit. Variable costs actually saved during the shutdown must be deducted, in line with the principle of indemnity.'],
 cl_ip:['Maximum indemnity period','The maximum BI indemnity period should be set on realistic recovery time, including equipment lead times, rebuilding and customers returning. Setting it too short is the most common gap.'],
 cl_emp:['Public liability and occupational injury','Public liability insurance protects third parties, not employees injured at work. Employees’ occupational injuries are handled by labor insurance, occupational accident insurance and employer’s liability insurance.'],
 cl_misrep:['Disclosure and rescission','If the proposer breaches the duty of disclosure, the insurer may rescind, but within time limits: one month from learning of it, or two years from the contract date (Article 64 of Taiwan’s Insurance Act).'],
 cl_subro:['Scope of subrogation','Subrogation is limited to what the insurer has paid (Article 53 of Taiwan’s Insurance Act). For what insurance didn’t pay, such as the deductible or underinsurance, the insured can claim directly.'],
 cl_family:['No subrogation against family or employees','An insurer can’t subrogate against the insured’s family members or employees unless they caused the loss intentionally. This makes sure insurance really protects the insured’s own circle.'],
 cl_delay:['Default interest','If an insurer delays payment for reasons attributable to itself, it must pay default interest of 10% a year (Article 34 of Taiwan’s Insurance Act).'],
 cl_ipbi:['The BI indemnity period','The indemnity period ends when results of business recover, not when equipment is fixed. Losses during order recovery and yield ramp-up can be claimed within the maximum indemnity period.'],
 cl_occur:['Occurrence definitions and deductibles','A per-occurrence deductible stays the same, but how occurrences are counted decides how many times it applies. Catastrophe hours clauses combine losses from one cause within a time window into one occurrence.'],
 cl_ai:['Additional insureds','Naming trading partners as additional insureds is common, but cover is usually limited to liability connected with the named insured’s products or business. It doesn’t lend them the whole policy.'],
 cl_claimsmade:['Extended reporting period','When a claims-made policy expires without renewal, you can buy an extended reporting period, so claims made for some time after expiry are still covered if the act happened during the policy period.'],
 cl_hours:['Hours clauses in practice','Catastrophe hours clauses usually let the cedant choose the start time, splitting events in the way most favorable to it. But however it chooses, each window has a fixed number of hours.'],
 cl_xl:['Calculating excess of loss','Excess of loss: reinsurer pays = min(loss − retention, limit). If the loss is below the retention, the reinsurer pays nothing.'],
 cl_follow:['Follow the settlements','Reinsurers usually follow the cedant’s good-faith, reasonable settlements within the original policy. Ex gratia payments and settlements outside the terms aren’t covered by the clause.'],
 cl_coop:['Claims cooperation clauses','Claims cooperation or claims control clauses require the cedant to notify the reinsurer, and may require consent before settling. Whether the clause is a condition precedent decides the legal effect of a breach.'],
 cl_interest:['Insurable interest','Insurable interest is the financial relationship between the insured and the insured property. Without it, the contract has no effect. In international trade, whoever bears the risk should insure.'],
 cl_indem:['The principle of indemnity','Property insurance aims to put the insured back where they were before the loss, not to make a profit. Actual cash value deducts depreciation; replacement cost lets old be replaced with new.'],
 cl_cbi:['Named suppliers','Contingent BI often requires suppliers to be named so the insurer can assess the risk. A loss at an unnamed supplier, even if it stops production, is usually not covered.'],
 cl_wait:['Waiting periods','BI cover often has a waiting period, like a deductible measured in time. Cyber waiting periods are commonly 8 to 12 hours, though some are shorter or longer.'],
 cl_sysfail:['Malicious attacks and system failures','Some cyber BI covers only malicious attacks, while others also cover non-malicious system failures. The 2024 CrowdStrike incident put this difference in the spotlight.']
});

 h921:['The 921 earthquake and residential earthquake insurance','On September 21, 1999, the Chi-Chi earthquake (magnitude 7.3) killed more than 2,400 people. At the time about 90% of homes had no earthquake insurance, and victims and mortgage banks suffered huge losses. From April 1, 2002, the government introduced basic residential earthquake insurance and set up the Taiwan Residential Earthquake Insurance Fund. The current limit is up to NT$1.5 million (about US$47K), paid on a total loss.'],
 hnari:['Typhoon Nari and urban flooding','In September 2001, Typhoon Nari lingered over Taiwan for about two days. Taipei flooded badly; 16 Taipei Metro stations and a depot took on water, and full service didn’t resume until December 15. Lessons: don’t put critical server rooms and power equipment in basements; flooded equipment can often be repaired after professional cleaning and drying.'],
 haig:['The 2008 financial crisis and insurer solvency','After Lehman Brothers collapsed in September 2008, AIG suffered huge losses on credit default swaps and other derivatives, and the US government bailed it out. Policyholders of its Taiwan subsidiary, Nan Shan Life, worried for a time about their policies; Nan Shan was later taken over by a group led by Ruentex in 2011. Capital adequacy ratios and credit ratings help judge an insurer’s solvency.'],
 hthai:['The 2011 Thailand floods and supply-chain risk','In late 2011, floods in central Thailand inundated several industrial parks for weeks, affecting about a quarter of global hard-drive component capacity. Insured losses were estimated at over US$10 billion. Lessons: geographic concentration in supply chains, accumulation management and contingent BI; afterwards the local market widely imposed flood sub-limits.'],
 hkhh:['The 2014 Kaohsiung gas explosions','Late on July 31, 2014, propylene leaking from an underground pipeline in Kaohsiung’s Cianjhen and Lingya districts set off a chain of explosions, killing 32 and injuring 321. Lessons: inspecting and managing underground pipelines, third-party liability limits, and insurers’ subrogation after paying claims.'],
 hbx:['The 2015 Formosa Fun Coast explosion and liability limits','On June 27, 2015, a dust explosion at a color party at Formosa Fun Coast water park killed 15 people and injured more than 400. The organizer’s liability limit was only in the tens of millions of NT dollars, far below the injured’s medical costs. Lessons: liability limits should reflect the maximum possible loss, and combustible dust is an often-overlooked hazard.'],
 hever:['The 2021 Ever Given grounding and general average','On March 23, 2021, the ultra-large container ship Ever Given ran aground in the Suez Canal. It was refloated on March 29, and the owner declared general average on April 1. All cargo owners had to contribute and provide security to collect their goods: insured owners got guarantees from their insurers, while uninsured owners had to pay cash deposits.'],
 hcovid:['COVID-19 and pandemic policies','During the pandemic, many businesses worldwide claimed for closures, but most BI policies required physical damage, sparking widespread litigation. In Taiwan, non-life insurers sold huge numbers of “pays on diagnosis” pandemic policies in 2021. Cases exploded in 2022, and by June 2023 claims totaled about NT$271.6 billion (roughly US$8.5 billion), forcing several insurers to raise large amounts of capital. Lesson: pricing must consider extreme scenarios and accumulation.'],
 hwar:['The Ukraine war and war risks','After Russia invaded Ukraine in February 2022, more than 400 aircraft owned by Western lessors, worth over US$12 billion, were stuck in Russia. Lessors and insurers disputed whether all risks or war risks cover applied; in 2025 the English High Court found the losses fell under war risks. Cargo insurance needs the Institute War Clauses added separately, and sanctions clauses matter too.'],
 hdali:['The 2024 Baltimore bridge collapse and limitation of liability','On March 26, 2024, the container ship Dali lost power and struck Baltimore’s Key Bridge, which collapsed, killing six workers and closing the port for weeks. The owner petitioned under US maritime law to limit its liability to about US$43.7 million. Lessons: shipowners’ limitation of liability, the role of P&I Clubs; delay caused by port closures is usually not covered by cargo insurance.'],
 hhl:['The 2024 Hualien earthquake and semiconductors','On April 3, 2024, a magnitude 7.2 earthquake struck off Hualien. TSMC said more than 70% of its fab equipment had recovered within 10 hours. Seismic design at fabs greatly shortens downtime; earthquake losses come mainly from scrapped work in progress and tool recalibration, and policies often carry high earthquake deductibles and BI waiting periods.'],
 hcs:['The 2024 CrowdStrike global outage','On July 19, 2024, a faulty software update from security firm CrowdStrike crashed huge numbers of Windows computers worldwide, hitting aviation, healthcare and finance hard. CyberCube’s initial estimate of insured losses was about US$400 million to US$1.5 billion. Because it wasn’t a malicious attack, coverage depended on whether policies included system failure, and on waiting periods (commonly 8 to 12 hours).']
});

 fs_inflate:['The adjuster’s report in fraud cases','When insurance fraud goes to court, the adjuster’s report is often key evidence. The more complete its calculations, photos and interview records, the better it stands up in court.'],
 fs_pressure:['Independence is a long-term asset','Independence and expertise are an adjuster’s or broker’s most valuable assets. Standing firm may offend people in the short run, but it builds trust over time.'],
 fs_expat:['Coordinating cross-border claims','Large cross-border losses are often run from a regional headquarters, with local teams surveying in each country. The lead has to coordinate different laws, languages and time zones.'],
 fs_reunion:['First steps after a loss','After an incident, first make sure people are safe, then take reasonable steps to mitigate the loss, preserve the scene and evidence, and notify the insurer and broker as soon as possible.'],
 fs_typhoon:['Small claims build reputation too','When a catastrophe floods the system, small claims are easily handled carelessly. Treating every case seriously is a professional’s best long-term investment.'],
 fs_chen:['Industry networks','The insurance world is small. Peers, former colleagues and competitors may well be your future clients or partners.'],
 fs_credit:['Keeping working papers','Keeping working papers, versions and correspondence is basic practice for clarifying responsibility and protecting yourself, and it is the basis for later audits.'],
 fs_clause:['Correcting a misreading after the fact','A wrong clause reading can surface in an audit even if no one caught it at the time. Correcting it yourself usually costs far less than being found out.'],

{id:'ca_rc',n:'Adjusting math: replacement cost, but no rebuild',adj:1,spec:['fire'],t:'A warehouse is destroyed. The policy pays on a replacement cost basis, but the owner decides not to rebuild and plans to sell the land.',ca:{x:'Rebuilding cost: US$600K<br>Actual value after depreciation: US$420K<br>Clause: if the insured doesn’t rebuild within a reasonable time, the claim is paid at actual cash value',o:['US$420K','US$600K','US$180K'],a:0,why:'The extra “new for old” in a replacement cost policy is there so the insured can rebuild. Without a rebuild, only the US$420K actual cash value is payable. This condition is common in replacement cost clauses and stops the insured profiting from insurance.',ok:{t:'You remind the owner: if they change their mind and rebuild within two years, they can still claim the difference.',fx:{pro:3,rep:3}}}},
{id:'ca_cif',n:'Adjusting math: the insured value of cargo',adj:1,spec:['cargo'],sk:'ga',t:'A shipment of 1,000 cartons of electronic parts is exported on CIF terms and, as usual, insured at CIF plus 10%. 200 cartons are a total loss in transit.',ca:{x:'Invoice value (CIF): US$900K<br>Sum insured: CIF × 110% = US$990K<br>Cartons lost: 200 of 1,000 (equal value each)',o:['US$198K','US$180K','US$990K'],a:0,why:'Cargo is usually insured at an agreed value of CIF plus 10%, the extra 10% covering expected profit and costs. 200 cartons are 20%, so the claim is US$990K × 20% = US$198K. Using the invoice value alone underpays by US$18K.',ok:{t:'The cargo owner thought they’d only get the invoice value back and is pleasantly surprised.',fx:{pro:3,rep:2}}}},
{id:'ca_ga',n:'Adjusting math: sharing general average',adj:1,spec:['cargo'],sk:'ga',t:'A container ship runs aground. The master hires salvage tugs to refloat her and declares general average. Your client is one of the cargo owners.',ca:{x:'Ship value: US$9M<br>Cargo A (your client) value: US$1.8M<br>Cargo B value: US$1.2M<br>General average expenditure: US$600K',o:['US$90K','US$360K','US$200K'],a:0,why:'General average is shared by every saved interest in proportion to value. Contributory values total US$9M + US$1.8M + US$1.2M = US$12M, so the rate is US$600K ÷ US$12M = 5%. Your client contributes US$1.8M × 5% = US$90K, normally covered by cargo insurance. Forgetting the ship’s share gives US$360K.',ok:{t:'You arrange the general average security for your client, and the cargo is released.',fx:{pro:4,rep:2}}}},
{id:'ca_pkg',n:'Adjusting math: the carrier’s liability cap',adj:1,spec:['cargo'],sk:'ga',t:'A 4,000 kg precision machine ships as one package, worth US$450K. It is dropped by a crane at discharge. The carrier was at fault, and no value was declared on the bill of lading.',ca:{x:'Under Taiwan’s Maritime Act, when no value is declared, the carrier’s liability is the higher of “about 667 SDR per package” or “2 SDR per kg”<br>Packages: 1<br>Weight: 4,000 kg<br>(SDR: the IMF’s Special Drawing Right)',o:['About 667 SDR','8,000 SDR','The full US$450K'],a:1,why:'Per package it’s about 667 SDR; by weight it’s 4,000 × 2 = 8,000 SDR. The higher, 8,000 SDR, applies, roughly US$11K. That’s far below the US$450K cargo value, which is why cargo owners need their own insurance; high-value cargo can also have its value declared on the bill of lading.',ok:{t:'After paying the cargo owner, the insurer uses your figures to recover the liability cap from the carrier.',fx:{pro:3,rep:3}}}},
{id:'ca_car',n:'Adjusting math: variations without updating the cover',adj:1,spec:['eng'],t:'A new factory build was contracted at US$3M. Variations raised it to US$3.75M, but the construction all risks sum insured was never updated. Heavy rain damages the works by US$150K.',ca:{x:'Sum insured: US$3M (original contract)<br>Completed contract value (with variations): US$3.75M<br>Damage to the works: US$150K<br>Clause: if the sum insured is below the completed contract value, claims are paid proportionally',o:['US$120K','US$150K','US$187.5K'],a:0,why:'The construction all risks sum insured should be the completed contract value. US$3M is only 80% of US$3.75M, so the claim is US$150K × 80% = US$120K. When the works are varied, the sum insured must be endorsed too.',ok:{t:'The contractor gets the sum insured endorsed the next day.',fx:{pro:3,rep:3}}}},
{id:'ca_tpl',n:'Adjusting math: neighbor damage over the limit',adj:1,spec:['eng'],t:'Deep excavation cracks five neighboring houses. Repairs are assessed at US$420K in total, all from one occurrence.',ca:{x:'Total neighbor damage: US$420K<br>Third-party liability: US$300K limit each occurrence<br>Deductible: US$3K each occurrence (taken off the loss first, then the limit applies)',o:['US$300K','US$297K','US$417K'],a:0,why:'Deductible first: US$420K − US$3K = US$417K, then the US$300K per-occurrence limit applies. The insurer pays US$300K and the contractor bears the other US$120K. Applying the limit first and then the deductible gives US$297K. Follow the order the wording sets.',ok:{t:'Seeing your figures, the contractor decides to raise the third-party limit on the next project.',fx:{pro:3,rep:3}}}},
{id:'ca_solar',n:'Adjusting math: a solar plant outage',adj:1,spec:['re'],sk:'bi',t:'A typhoon wrecks a solar plant’s inverters, and the plant is down for 40 days. The BI cover has a 10-day waiting period.',ca:{x:'Average daily power sales: US$2.4K (estimated from the same season’s past output and the tariff)<br>Days down: 40<br>Waiting period: 10 days',o:['US$72K','US$96K','US$24K'],a:0,why:'A waiting period works like a deductible measured in time, so the first 10 days aren’t paid: (40 − 10) × US$2.4K = US$72K. Estimate daily revenue from the same season in past years, because sunshine is seasonal.',ok:{t:'You attach three years of output for the same season, and the insurer has no objection.',fx:{pro:3,rep:2}}}},
{id:'ca_warranty',n:'Adjusting math: splitting insurance and warranty',adj:1,spec:['re'],t:'A wind turbine blade cracks within the warranty period. Repairs cost US$270K. The expert finds a third of the damage was lightning and two thirds a material defect.',ca:{x:'Repair cost: US$270K<br>Causes: lightning 1/3, material defect 2/3<br>Insurance: covers external events such as lightning, not material defects (the manufacturer’s warranty covers those)<br>Deductible: US$15K each occurrence',o:['US$75K','US$90K','US$255K'],a:0,why:'Insurance only bears the lightning share: US$270K × 1/3 = US$90K, less the US$15K deductible, pays US$75K. The other US$180K is a material defect and should be claimed from the manufacturer under the warranty. Renewable energy claims often need this split between insurance and warranty.',ok:{t:'The developer takes your report to the manufacturer, who accepts the defect share.',fx:{pro:4,rep:2}}}},
{id:'ca_wip',n:'Adjusting math: valuing scrapped wafers',adj:1,spec:['semi'],t:'An earthquake scraps 2,000 wafers in process. The policy values work in progress at cost.',ca:{x:'Wafers scrapped: 2,000<br>Average cost incurred: US$9K per wafer<br>Expected selling price when finished: US$30K per wafer<br>Clause: work in progress is valued at the materials and processing costs incurred',o:['US$1.8M','US$6M','US$4.2M'],a:0,why:'Under the clause, work in progress is valued at cost: 2,000 × US$9K = US$1.8M. The margin between cost and selling price belongs to business interruption (lost gross profit) and can’t be claimed twice in the property loss.',ok:{t:'You draw a clear line between property damage and business interruption, avoiding a double-recovery dispute.',fx:{pro:4,rep:2}}}},
{id:'ca_ramp',n:'Adjusting math: yield ramp-up and the indemnity period',adj:1,spec:['semi'],sk:'bi',t:'After a power failure at a fab, capacity takes three months to recover. The BI indemnity period is 2 months.',ca:{x:'Normal monthly gross profit: US$900K<br>Month 1 lost gross profit: 100%<br>Month 2: 50%<br>Month 3: 20%<br>Indemnity period: 2 months from the incident',o:['US$1.35M','US$1.53M','US$1.8M'],a:0,why:'The indemnity period ends after month 2: US$900K × (100% + 50%) = US$1.35M. Month 3’s US$180K loss falls outside the indemnity period and isn’t paid. High-tech plants need an indemnity period that matches real recovery, including yield ramp-up.',ok:{t:'At renewal next year, the client extends the indemnity period to 12 months.',fx:{pro:3,rep:3}}}},
{id:'ca_neg',n:'Adjusting math: contributory negligence and the limit',adj:1,spec:['motor'],t:'A shopper slips in a store and breaks a leg. The court assesses damages at US$150K, but the shopper was 30% to blame. The store’s public liability cover has a US$90K bodily injury limit per person.',ca:{x:'Total damages: US$150K<br>Shopper’s contributory negligence: 30%<br>Bodily injury limit per person: US$90K',o:['US$90K','US$105K','US$150K'],a:0,why:'First reduce for contributory negligence: US$150K × 70% = US$105K, which the store owes. The per-person limit is US$90K, so the insurer pays US$90K and the store pays US$15K itself. Liability limits should reflect the size of the business and foot traffic.',ok:{t:'After your analysis, the store decides to raise its limit.',fx:{pro:3,rep:3}}}},
{id:'ca_cali',n:'Adjusting math: compulsory and voluntary motor cover',adj:1,spec:['motor'],t:'A car crash kills a pedestrian. The court orders the driver to pay US$270K. The driver has compulsory auto liability insurance plus voluntary third-party liability cover.',ca:{x:'Total judgment: US$270K<br>Compulsory cover death benefit: US$90K<br>Voluntary third-party liability: US$150K death limit per person<br>Rule: the compulsory payment counts as part of the damages',o:['US$150K','US$180K','US$270K'],a:0,why:'Compulsory cover pays US$90K first. Under Taiwan’s Compulsory Automobile Liability Insurance Act, that counts as part of the driver’s damages, leaving US$180K for the driver. The voluntary cover’s per-person limit is US$150K, so it pays US$150K and the driver pays US$30K personally.',ok:{t:'The family finally understands where each payment comes from, and a settlement follows quickly.',fx:{pro:3,rep:3}}}},

{id:'ca_coins',n:'Adjusting math: claiming from co-insurers',route:['brk'],t:'The client’s plant is co-insured by three insurers. The fire loss is US$600K, and you need to send each insurer its claim notice.',ca:{x:'Loss: US$600K<br>Deductible: US$30K each occurrence (once for the whole claim)<br>Shares: A 40% (lead), B 35%, C 25%',o:['Insurer B owes US$199.5K','Insurer B owes US$210K','Insurer B owes US$190K'],a:0,why:'Co-insurers are each liable for their own share, and the deductible applies once to the whole claim: (US$600K − US$30K) × 35% = US$199.5K. US$210K forgets the deductible; US$190K wrongly splits the loss equally. Co-insurance is several, not joint: the lead won’t pay for the others.',ok:{t:'All three insurers pay in the same week.',fx:{pro:3,rep:3}}}},
{id:'ca_stp',n:'Adjusting math: under-declared stock',route:['brk'],brn:['brk_mar'],t:'The client’s stock throughput (STP) premium is based on the average stock declared each month. A warehouse floods, with a stock loss of US$360K.',ca:{x:'Declared average stock: US$15M<br>Actual average stock: US$18M<br>Stock loss: US$360K<br>Clause: if declared values are below actual, claims are paid in the ratio declared ÷ actual',o:['US$300K','US$360K','US$240K'],a:0,why:'Declarations were only 5/6 of actual, so the claim is US$360K × 5/6 = US$300K. The premium saved by under-declaring US$3M of stock is far less than the US$60K lost on this claim. That’s why brokers remind clients to declare accurately.',ok:{t:'From next month, the client declares stock straight from its system.',fx:{pro:3,rep:3}}}},
{id:'ca_trend',n:'Adjusting math: trend adjustment for BI',route:['brk'],brn:['brk_pro'],sk:'bi',t:'You’re helping a client prepare a business interruption claim. Before the incident, sales were running 10% above the same period last year.',ca:{x:'Turnover in the same 3 months last year: US$1.8M<br>Pre-loss growth trend: +10%<br>Actual turnover in the 3 months after the loss: US$780K<br>Gross profit rate: 40%<br>Clause: standard turnover is adjusted for trends before and after the loss',o:['US$480K','US$408K','US$1.2M'],a:0,why:'Standard turnover is trend-adjusted: US$1.8M × 1.1 = US$1.98M; the shortfall is US$1.98M − US$780K = US$1.2M; lost gross profit is US$1.2M × 40% = US$480K. Without the trend adjustment it’s (US$1.8M − US$780K) × 40% = US$408K, US$72K less for the client.',ok:{t:'You attach the monthly accounts from the year before the loss, and the insurer accepts the trend adjustment.',fx:{pro:4,rep:2}}}},
{id:'ca_dsu',n:'Adjusting math: an offshore wind farm’s delay',route:['brk'],brn:['brk_enr'],sk:'bi',t:'An offshore wind farm’s offshore substation is damaged in transit, delaying commercial operation by 150 days. The client has delay in start-up (DSU) cover.',ca:{x:'Days of delay: 150<br>Waiting period: 60 days<br>Agreed daily indemnity: US$15K<br>Maximum indemnity period: 365 days',o:['US$1.35M','US$2.25M','US$900K'],a:0,why:'After the 60-day waiting period, the claim is (150 − 60) × US$15K = US$1.35M, within the maximum indemnity period. DSU sums insured for offshore wind are large, and the length of the waiting period is often a key negotiating point.',ok:{t:'The developer’s CFO says the money kept their bank repayments on track.',fx:{pro:3,rep:3}}}},

{id:'ca_ibnr',n:'Adjusting math: how much to reserve?',route:['ins'],brn:['ins_cl'],t:'The company’s liability business has paid US$120K of claims this year. The CFO asks how much more to reserve for unpaid claims.',ca:{x:'First-year paid claims: US$120K<br>Historical development factor (ultimate ÷ first-year paid): 2.5',o:['US$180K','US$300K','US$120K'],a:0,why:'The ultimate estimate = US$120K × 2.5 = US$300K. With US$120K already paid, US$180K more must be reserved, covering reported-but-unpaid and incurred-but-not-reported (IBNR) claims. That’s the basic idea of the chain ladder. Liability claims often surface years later, so reserves can’t rest on paid claims alone.',ok:{t:'The actuarial team checks it the same way and gets the same number.',fx:{pro:3,rep:3}}}},
{id:'ca_reinst',n:'Adjusting math: a sum insured already used once',route:['ins'],brn:['ins_cl'],t:'A machinery policy paid a claim early in the year, and the insured never reinstated the sum insured. Another loss happens at year end.',ca:{x:'Original sum insured: US$300K<br>First claim paid: US$120K<br>Clause: the sum insured reduces by claims paid; without reinstatement, the remaining sum insured is the maximum payable<br>Second loss: US$240K',o:['US$180K','US$240K','US$144K'],a:0,why:'The first claim paid US$120K, leaving US$180K of cover. The second loss of US$240K is capped at the remaining US$180K. Many property policies reduce the sum insured after a claim; remember to reinstate it (usually for extra premium), or the next loss may not be fully covered.',ok:{t:'Your closing letter reminds the insured to reinstate the cover, and they’re grateful.',fx:{pro:3,rep:3}}}}
];
