j_exp:['Technical forensic teams','Large adjusting firms often have specialist teams for fire causes, equipment damage and structural issues. Technical capability is a firm’s core advantage in winning big cases.'],
j_mgr:['Managing a claims team','A claims manager balances quality, speed and cost and assigns cases to the right people. Good allocation lets juniors grow within safe limits.'],
j_ins:['An insurer’s claims department','An insurer’s claims department approves payments, manages adjusters and lawyers, and sets reserves. Moving from adjusting to an insurer shifts your view from “assessing the loss” to “managing total claims cost.”'],
j_rei:['Claims roles at reinsurers','Reinsurance claims staff review cedants’ large claims, manage catastrophe events, and take part in wording interpretation and disputes, usually working in English.'],
j_edu:['Insurance education','University risk and insurance departments, and bodies such as Taiwan’s insurance training institutes, need lecturers with real experience. Practical cases are what students need most.'],
j_back:['Partnership at adjusting firms','Many international adjusting firms use partner or senior partner structures, with partnership based on expertise and the business you bring in.'],
big1:['Planning a major loss inspection','After a major loss, first decide the scope, division of work and order of evidence preservation, and keep co-insurers and reinsurers informed. The first week often decides the direction of the whole claim.'],
big2_fire:['Co-insurance and the lead insurer','Large fire risks are often co-insured by several insurers, with a lead insurer directing the claim. The report must satisfy every co-insurer and reinsurer.'],
big2_cargo:['Stranding and general average adjustment','Costs and sacrifices to refloat a stranded ship are often allowed in general average, with an average adjuster calculating each party’s share by value.'],
big2_eng:['Scope of construction all risks','Construction all risks usually has Section I (the works) and Section II (third-party liability). A collapse often triggers both, and liability and limits must be calculated separately.'],
big2_re:['Design standards and natural perils','Turbine design wind speeds follow IEC classes. Whether a loss is covered often depends on whether actual wind exceeded the design standard and whether there were design or installation defects.'],
big2_semi:['The BI recovery period','The key to business interruption is the “reasonable recovery period”: the time needed to repair, recalibrate and ramp yields back to pre-loss levels, not how long the plant actually stood still.'],
big2_motor:['Splitting multiple liabilities','A major traffic accident may involve the driver, the employer, the maintenance contractor and road authorities. Each has different insurance, and the claim must establish each share of liability.'],
big3:['Claims negotiation and settlement','The final stage of a large claim is often settled through negotiation, settlement or arbitration. The clearer the report and the fuller its basis, the less room there is to haggle, and the faster the claim closes.'],
fire4:['Lithium battery fires and firefighting damage','Lithium batteries in thermal runaway easily reignite. Water damage caused by firefighting is usually covered under fire insurance, but fire and water damage must be separated to allocate the loss correctly.'],
fire5:['Subrogation','After paying the insured, the insurer may recover from a responsible third party up to the amount paid (subrogation, Article 53 of Taiwan’s Insurance Act). Once residents’ fire claims are paid, the insurer can pursue the negligent restaurant.'],
fire6:['Insuring rooftop solar','Rooftop solar plants often lease roofs from building owners. The owner’s fire policy and the plant’s property policy cover separately; the cause of the fire decides who bears the loss.'],
cargo4:['Seawater damage and sweat','A silver nitrate test shows whether rust contains chlorides (seawater). Cargo sweat is condensation from temperature swings. Whether it is covered depends on the wording and whether packing and ventilation were adequate.'],
cargo5:['Inland transit theft','High-value electronics are most often stolen during inland transit. Common loss-prevention measures include GPS tracking, two drivers, stopping only at designated rest areas and seal checks.'],
cargo6:['Insufficient packing exclusion','The Institute Cargo Clauses exclude loss caused by insufficient or unsuitable packing. The key question: was the packing strong enough to withstand ordinary transit?'],
eng3:['Typhoon preparedness','Construction policies usually require the insured to take reasonable precautions before a typhoon. A tower crane not set to free slew per its specifications may affect liability.'],
eng4:['Defects exclusion','Construction all risks usually doesn’t pay to fix the defect itself, but accidental damage the defect causes to other parts may be covered. Where the line falls depends on the policy’s defects clause.'],
eng5:['Natural perils and design floods','River works are designed to a “design flood frequency.” Whether a flood exceeded the design standard is key to deciding between a natural peril and inadequate design.'],
re3:['Estimating lost generation','Business interruption from a turbine outage is often estimated from historical output, wind conditions in the same period and the power price. Actual output from neighboring turbines is a good benchmark.'],
re4:['Where warranty ends and insurance begins','Performance degradation and manufacturing defects in solar panels usually fall under product warranty, not sudden and accidental damage under property insurance.'],
re5:['Critical equipment and spares','Large transformers can take over a year to deliver. Whether spares exist directly decides the size of the business interruption loss.'],
semi3:['Earthquakes and business interruption','Earthquake losses at chip fabs come mainly from downtime, scrapped work in progress and recalibration. The restart timeline is the core of the BI estimate.'],
semi4:['Corrosion and gradual deterioration exclusion','Property insurance usually doesn’t pay for gradual corrosion, rust or wear, but corrosion caused by a sudden leak may be accidental damage.'],
semi5:['Utility interruption cover','Business interruption from a failure of water, power or other utilities usually requires a separate “utilities interruption” extension, often with a waiting period.'],
motor3:['Insuring delivery platforms','Delivery riders usually work as contractors. Platforms typically buy accident and third-party liability cover, but the scope and limits vary widely between platforms.'],
motor4:['Liability for EV fires','The charger installer, the car owner and the building management committee may all be liable. After the motor insurer pays the owner, it can recover from the responsible party through subrogation.'],
motor5:['Compulsory public liability insurance','Some premises, such as amusement parks, hotels and department stores, are legally required to carry public liability insurance with minimum limits.']

Object.assign(KNOW,{
hosp:['Overwork and occupational injury','Illness caused by long-term excessive hours may be recognized as occupational disease. Labor insurance and occupational accident insurance provide medical, disability and death benefits; where the conditions are met, the employer also owes compensation.'],
co_found:['Setting up an insurance-related company','Adjusting companies and insurance brokers must be licensed by the regulator and meet requirements for capital, professional staff and a guarantee deposit or liability insurance. Consultancies have a lower bar, but can’t do licensed business.'],
c_crunch:['Cash flow and working capital','Many companies fail not from losses but because they run out of cash. In professional services, receivables often take months to collect; working capital should last at least one collection cycle.'],
c_inspect:['Corporate governance and internal controls','Regulatory inspections focus on sales conduct, accounts, personal data protection and internal controls. If the systems work day to day, an inspection is routine.'],
c_acq:['Acquisitions and valuation','Professional services firms are often valued on a multiple of profit or revenue. Client stability and whether key people stay are what buyers care about most.'],
c_key:['Key people and non-compete clauses','In Taiwan, non-compete clauses must be reasonable in duration, region and compensation; excessive restrictions may be void. What really keeps people is career growth and profit sharing.'],
c_short:['Improper solicitation and promises','Guaranteeing or exaggerating claims outcomes may breach sales conduct rules for insurance businesses. Proposals should follow the policy wording.'],
o5:['Price competition and service quality','When adjusting fees are squeezed, the usual result is too little inspection time and weaker reports, which eventually shows up as claims disputes.'],
k1:['Commissions and kickbacks','Insurance brokers must not win business with rebates, kickbacks or other improper benefits. If caught, both the firm and individuals may be penalized.'],
k2:['Loss ratios and underwriting appetite','Insurers adjust their appetite by a client group’s loss ratio. Brokers can use loss-prevention plans and risk improvement records to keep insurers on board.'],
k3:['The renewal value of a broker','Broking income comes mainly from renewal commissions. High client retention means high firm value, and claims service is the biggest reason clients renew.'],
k4:['Broker tenders','When companies tender for a broker, they usually score insurance planning, claims service, market leverage and fees. Past claims cases are the most convincing evidence.'],
q1:['Enterprise risk management (ERM)','ERM runs from risk identification and assessment to response and monitoring, and needs a cross-department risk governance structure. Insurance is only one tool for transferring risk.'],
q2:['Liability for consulting reports','If a risk assessment report is used in litigation, its methods, assumptions and data sources will be tested. Stating limitations clearly in the report is a consultant’s best protection.'],
q3:['Revenue swings in consulting','Consultancy income comes mostly from projects and can dry up suddenly. Recurring income such as training courses and annual retainers balances out the project swings.'],
q4:['Catastrophe insurance schemes','Catastrophe risk is often shared between government and the private sector; Taiwan’s residential earthquake insurance, for example, is shared between the earthquake insurance fund and insurers.'],
t1:['Fundraising and dilution','Raising money dilutes the founders, in exchange for capital and time to grow faster. The higher the valuation, the less dilution, but the higher investors’ expectations.'],
t2:['Burn rate','A startup’s net monthly cash outflow is its burn rate. Cash in the bank divided by burn rate is how many months the company can last (its runway).'],
t3:['Responding when big players enter','Large insurers have resources but are usually weak in niche markets. Startups often differentiate through specialist focus or speed of service.'],
t4:['Risks of AI claims','AI models can make mistakes or show bias. Claims decisions affect consumers, so human review and appeal channels are usually kept.'],
t5:['Going public','Listing requires meeting profit, shareholder spread and governance conditions. It gives the shares a market price and subjects the company to stricter oversight.'],
n_lin1:['Report fundamentals','A good adjuster’s report sets out the circumstances, cause analysis, loss calculation and policy response clearly. Senior colleagues’ reports are a newcomer’s best textbook.'],
n_lin2:['Corrections between colleagues','When you find an error in a colleague’s report, the common practice is to tell them privately and let them correct it. If large amounts are involved, follow company procedure.'],
n_lin_ret:['Handing over clients','When senior people retire, client handover should be planned early. Insurers and insureds care about uninterrupted service quality.'],
n_lin_ref:['Industry referrals','The insurance world is small. A recommendation from a senior figure often carries more weight than a CV.'],
n_chen1:['Teamwork and case allocation','Large claims are often handled by several people. When managers allocate work, they consider not only ability but whether you work well with the team.'],
n_chen2:['Peer review','Having colleagues cross-check important reports before they go out greatly reduces errors. Many adjusting firms make peer review standard procedure.'],
n_chen_poach:['Who owns the client relationship','In professional services, clients often follow the person. Firms reduce dependence on any one person through contracts, team service and systems.'],
n_chen_partner:['Starting a business with partners','Before partnering, agree on equity, roles, decision-making and exit, and put it in writing.'],
n_wang1:['The adjuster’s independence','Even when appointed by an insurer, an adjuster’s report is valuable because it is neutral. A good relationship with the client doesn’t mean adopting their position.'],
n_wang2:['The appointing party’s trust','When insurers’ claims managers appoint adjusters, they value past quality and reliability most. Long-term trust is an adjuster’s steadiest source of work.'],
fb_biz:['Insurance planning for business owners','Family businesses face property, liability, business interruption and succession risks at once. An heir who understands insurance makes the company’s risk management more complete.'],
fb_inherit:['Estates and insurance','Life insurance proceeds paid to a named beneficiary are generally not part of the estate, and are often used to plan for taxes and provide for particular family members.'],
fb_borrow:['Lending within the family','Loans between family members should also be documented with agreed repayment terms. For larger amounts, watch out for gift tax.'],
fb_repay:['Loans and gifts','Under tax law, a family loan that is never repaid may be treated as a gift. There is an annual gift tax exemption; only amounts above it need to be declared.'],
fb_parents:['Protecting the main earner','A family’s main earner should prioritize life and disability cover, so the family’s living and education costs are met if something happens.'],
s_crash:['Market crashes and asset allocation','When the market crashes, first check what the money is for: money needed soon shouldn’t be in stocks. If long-term money is well allocated, you usually don’t need to sell in a panic.'],
s_bull:['Margin and leverage','Buying on margin amplifies both gains and losses. If prices fall far enough you get margin calls, and may even be forcibly sold out.'],
s_scam:['Investment scams','“Follow the guru’s trades” and “guaranteed returns” are common scam tactics. If you come across a suspicious group, call Taiwan’s 165 anti-fraud hotline.'],
s_annuity:['What savings insurance is','Savings insurance emphasizes capital protection and forced saving, but surrendering in the early years usually loses money, and real returns may not keep up with inflation. Check the assumed rate and surrender value table before buying.'],
s_property:['Insuring a rental property','Besides residential fire insurance, landlords can consider rental liability cover for injuries to tenants caused by the property’s fixtures.']
});

i5:['Exclusions and complaints','Insurance pays only for covered events; earthquake, war and intentional acts are often excluded or need extra cover. An insured who disagrees can complain to the insurer, or apply to Taiwan’s Financial Ombudsman Institution.'],
i6:['Subrogation in practice','After paying, the insurer acquires the insured’s rights against the wrongdoer up to the amount paid (Article 53 of Taiwan’s Insurance Act). The key to a successful recovery is preserving evidence of the cause.'],
i7:['The Financial Ombudsman Institution','When a financial consumer is in dispute with an institution, they first complain to the institution, then, if unsatisfied, apply to Taiwan’s Financial Ombudsman Institution. Below a set amount, the institution must accept the decision.'],
i8:['Notification clauses in reinsurance','Reinsurance treaties often require the cedant to notify promptly when a claim may exceed a set amount. Late notice may let reinsurers refuse or reduce their share.'],
i9:['Preventing insurance fraud','Insurers have dedicated investigation units and use industry data matching to find unusual claims. Suspicions should be investigated with evidence, not met with an outright denial.'],
i10:['Digital claims','Online claims and automated approval speed up small claims, but rules need continual tuning so fraudsters can’t exploit them.'],
b4:['Setting the sum insured','The sum insured should reflect the actual value or replacement cost of the insured property. If it is too low, claims are reduced proportionally.'],
b5:['Deductibles and premiums','Raising the deductible usually lowers the premium, but the client bears more small losses. In hard markets, brokers often use this to help clients control costs.'],
b6:['The broker’s role in claims disputes','A broker represents the insured: they can appoint independent experts, organize evidence and negotiate with the insurer. If talks truly fail, they help the client go to the ombudsman or court.'],
b7:['BI sums insured and indemnity periods','Business interruption sums insured are based on gross profit, and the indemnity period should cover the time from the loss to normal operation. Setting it too short is a common gap.'],
b8:['Product liability and the US market','US product liability suits often bring large awards. US buyers often require exporters to carry product liability cover at set limits and name the buyer as an additional insured.'],
b9:['The broker’s fiduciary duty','Insurance brokers should put the insured’s interests first, and disclose any remuneration from insurers to clients as required.'],
r4:['Proportional and excess of loss reinsurance','Proportional reinsurance shares premiums and claims at an agreed ratio; excess of loss reinsurance pays only the part of a single loss above an agreed amount.'],
r5:['Accumulation risk','Writing too much in one region means a single catastrophe can trigger huge numbers of claims at once. Reinsurers monitor regional accumulations and buy retrocession when needed.'],
r7:['Reinsurance renewals','Many reinsurance treaties renew on 1 January, with rates reflecting the previous year’s catastrophe losses and market capacity.'],
r8:['Incurred but not reported (IBNR)','IBNR is claims that have occurred but haven’t been reported yet. Liability claims may surface years later, so reserves must be set aside in advance.'],
r9:['Lead reinsurer','Reinsurance treaties are often led by one reinsurer that sets terms and price, with others following for their shares. The leader’s expertise and reputation matter.'],
r10:['Climate change and catastrophe models','Climate change may alter typhoon frequency and intensity. Catastrophe models need updated parameters to reflect future risk, not just past history.'],
e4:['Pricing catastrophe insurance','Catastrophes are rare and severe, with limited history. Pricing often combines catastrophe models, reinsurance costs and diversification.'],
e5:['Qualifying as a loss adjuster','In Taiwan, loss adjusters must pass a national exam, then register and complete training before practicing. Internships are an important way into the industry.'],
e6:['Insurance professional licenses','Insurance has several professional licenses, such as loss adjuster, broker and agent. A license is the basic threshold of competence.'],
e7:['Combining practice and research','Insurance research needs industry data to validate it. Working with industry keeps research practical and makes industry more willing to use it.'],
e8:['The adjuster’s role','A loss adjuster is legally appointed to independently inspect, assess and estimate losses. The appointing party may be the insurer or the insured.'],
e9:['Training claims staff','Claims staff need to keep learning wording interpretation, loss calculation, regulation and communication. Case-based teaching is the most effective training.'],
q5:['Business continuity plan','A business continuity plan (BCP) starts with a business impact analysis (BIA) to identify critical processes and tolerable downtime, then plans backups and recovery steps.'],
q6:['Contingent business interruption','Contingent business interruption covers your own BI loss caused by a loss at a supplier or customer. Key suppliers usually have to be named.'],
q7:['Where consulting ends and broking begins','Consultants without a broker license can’t arrange insurance for clients. A risk consultant can advise, but placement must go through a licensed broker or agent.'],
q9:['Climate-related financial disclosure','International frameworks require companies to disclose the financial effects of climate change, including physical risks (typhoons, floods) and transition risks (regulation, carbon prices).'],
t6:['Data protection and cyber insurance','After a data breach, Taiwan’s Personal Data Protection Act requires companies to notify affected people, among other duties. Cyber insurance can pay for response, notification and legal costs, but watch the exclusions.'],
t7:['Outsourcing in insurance','When insurers outsource operations, they must assess the vendor’s security and operational risk and keep audit rights. A startup entering insurance has to pass these checks first.'],
t8:['The financial regulatory sandbox','The financial sandbox lets innovators test new services in a limited scope, temporarily exempt from some rules; after successful tests, regulations can be adjusted.']
});

 {l:'Compromise: have the adjuster produce a yield ramp-up curve',ok:{t:'The adjuster’s curve gets both sides to give ground; payment runs to month six.',fx:{pro:2,net:2}}}
]},
{id:'benr3',n:'Owner-controlled insurance',route:['brk','bro'],brn:['brk_enr'],once:1,w:8,when:s=>s.rank>=2,t:'The client is building a new plant with over a hundred contractors. Should each contractor insure itself, or should the owner insure the whole project?',ch:[
 {l:'Push for an owner-controlled insurance program (OCIP)',c:{w:{pro:.5,net:.5},b:50,s:.8},ok:{t:'Consistent cover, no gaps, and total premium 10% lower. This becomes your signature case.',fx:{pro:5,net:4,raise:.06,st:'award'}},ng:{t:'Contractors push back, saying their insurance costs were already in their bids.',fx:{net:-2,hp:-2}}},
 {l:'Let each contractor insure itself',ok:{t:'Less work, but when a loss happens, every policy has different terms and the claim turns into a brawl.',fx:{net:1,rep:-2}}},
 {l:'Main contractors under one program, the rest insure themselves',ok:{t:'A compromise that covers most of the risk.',fx:{pro:2,net:2}}}
]},

{id:'rtr1',n:'Asking for more commission',route:['rei'],brn:['rei_tr'],w:9,t:'At renewal of a proportional treaty, a cedant wants the reinsurance commission raised from 30% to 35%. The treaty’s loss ratio has been volatile for five years.',ch:[
 {l:'Propose a sliding scale: the lower the loss ratio, the higher the commission',c:{k:'pro',b:55,s:.7},ok:{t:'The cedant agrees. Interests are aligned, and their underwriting becomes more careful.',fx:{pro:4,net:2}},ng:{t:'They find it too complicated and go to other reinsurers.',fx:{net:-3}}},
 {l:'Agree, to keep your share',ok:{t:'You keep your share, but the next year the loss ratio spikes and the treaty loses money.',fx:{net:2,rep:-2}}},
 {l:'Refuse and stay at 30%',ok:{t:'The cedant gives part of your share to others.',fx:{rep:1,net:-2}}}
]},
{id:'rtr2',n:'Our reinsurance needs reinsurance',route:['rei'],brn:['rei_tr'],w:9,t:'A typhoon hits several treaties you wrote at once. You realize your company’s own retrocession cover is nearly used up.',ch:[
 {l:'Notify the retrocessionaires now and review next year’s retro structure',c:{k:'pro',b:55,s:.7},ok:{t:'You recover in time and buy an extra retro layer for next year.',fx:{pro:3,rep:3}},ng:{t:'The notice is incomplete; the retrocessionaires ask for more documents.',fx:{hp:-2,pro:1}}},
 {l:'Keep quiet until the losses are certain',a:.2,ok:{t:'The notice is late. The retrocessionaires say you breached the notification clause and pay only part.',fx:{rep:-3}}},
 {l:'Ask head office for help and adjust next year’s capacity',ok:{t:'Head office cuts the capacity you can write next year.',fx:{pro:1,net:-1}}}
]},
{id:'rtr3',n:'Opening up Vietnam',route:['rei'],brn:['rei_tr'],once:1,w:8,when:s=>s.rank>=2,t:'Head office wants to enter Vietnam’s treaty market and puts you in charge. Local data is scarce and competition is fierce.',ch:[
 {l:'Spend a year building data and relationships with cedants first',c:{w:{net:.6,pro:.4},b:50,s:.8},ok:{t:'In year two you win three treaties at sensible prices. Head office hands you all of Asia’s emerging markets.',fx:{net:5,pro:3,raise:.08,flag:'abroad'}},ng:{t:'Language and regulation are harder than expected; year one produces almost nothing.',fx:{hp:-4,net:2}}},
 {l:'Win share with low prices first',a:.4,ok:{t:'You get share, but a flood hits in year one and the losses are heavy.',fx:{rep:-3,hp:-2}}},
 {l:'Decline and stay in familiar markets',ok:{t:'You miss the opportunity, but life is more stable.',fx:{fam:3}}}
]},

{id:'rfac1',n:'A three-year-old survey',route:['rei'],brn:['rei_fac'],w:9,t:'You’re offered 10% of a facultative placement on a petrochemical plant. The attached risk survey is three years old.',ch:[
 {l:'Ask for a new survey before quoting',c:{k:'pro',b:55,s:.7},ok:{t:'The new survey shows two new storage tanks. You adjust terms and price and write it with confidence.',fx:{pro:4,rep:2}},ng:{t:'The cedant can’t wait and gives the share to someone else.',fx:{net:-2,pro:1}}},
 {l:'Quote on the old survey',a:.3,ok:{t:'You write it. A year later there’s a loss, and you learn the tank farm had long since been expanded.',fx:{rep:-3}}},
 {l:'Decline this one',ok:{t:'You avoid the risk but lose the premium.',fx:{pro:1}}}
]},
{id:'rfac2',n:'Probable maximum loss',route:['rei'],brn:['rei_fac'],w:9,t:'The cedant estimates a plant’s probable maximum loss (PML) at only 20% of the sum insured. Looking at the layout, you see the firewall between two buildings is incomplete.',ch:[
 {l:'Re-estimate it yourself and adjust your share accordingly',c:{k:'pro',b:55,s:.8},ok:{t:'You estimate PML closer to 60% and halve your share. You’re later proven right.',fx:{pro:5,rep:3}},ng:{t:'Your estimate is seen as too conservative; the cedant is unhappy.',fx:{net:-2,pro:1}}},
 {l:'Accept the cedant’s assessment',ok:{t:'Working together is pleasant, but you’re carrying far more risk than the books show.',fx:{net:2,pro:-1}}},
 {l:'Ask for a sub-limit',ok:{t:'They agree, and your maximum loss is capped.',fx:{pro:2,net:1}}}
]},
{id:'rfac3',n:'You lead',route:['rei'],brn:['rei_fac'],once:1,w:8,when:s=>s.rank>=2,t:'For a new fab’s facultative placement, the broker asks you to be lead reinsurer: you set the terms, others follow.',ch:[
 {l:'Lead, with strict deductibles and BI waiting periods',c:{w:{pro:.6,net:.4},b:50,s:.8},ok:{t:'The terms are professional and sensible, followers fill the placement quickly, and your reputation soars.',fx:{pro:5,net:4,rep:4,raise:.06}},ng:{t:'Terms are too strict, not enough followers, and the broker has to soften them.',fx:{net:-2,pro:2}}},
 {l:'Lead, with loose terms to win a big share',a:.4,ok:{t:'A big share, but two years later a loss exceeds expectations.',fx:{rep:-3,net:2}}},
 {l:'Just follow',ok:{t:'Safe, but the market remembers someone else’s name.',fx:{pro:1}}}
]},

{id:'rcat1',n:'The model says one in a hundred years',route:['rei'],brn:['rei_cat'],w:9,t:'The cat model says typhoon losses in a region exceed US$156M only once in a hundred years. But last year an ordinary typhoon caused US$125M.',ch:[
 {l:'Review the model’s exposure data and building vulnerability assumptions',c:{k:'pro',b:55,s:.8},ok:{t:'You find the model underestimates the vulnerability of industrial buildings. The adjusted numbers are more realistic, and head office adopts your correction.',fx:{pro:5,rep:3}},ng:{t:'Not enough data; the review is inconclusive.',fx:{hp:-2,pro:2}}},
 {l:'Trust the model; one year proves nothing',ok:{t:'The next year another big typhoon hits, proving the model too low.',fx:{rep:-3}}},
 {l:'Just add 30% to the model output',ok:{t:'Simple and effective, but no one can explain why 30%.',fx:{pro:1}}}
]},
{id:'rcat2',n:'Exposure data without addresses',route:['rei'],brn:['rei_cat'],w:9,t:'In the cedant’s exposure data, 30% of policies lack a full address or year built.',ch:[
 {l:'Ask for the gaps to be filled and load the missing data conservatively',c:{w:{pro:.6,net:.4},b:55,s:.7},ok:{t:'The cedant fills in most of it, and the model results are far more credible.',fx:{pro:3,net:2}},ng:{t:'The cedant thinks you’re asking too much.',fx:{net:-2}}},
 {l:'Use the model’s defaults',ok:{t:'Easy, but the results are highly uncertain.',fx:{pro:-1}}},
 {l:'Don’t write it if the data is incomplete',ok:{t:'One fewer treaty, but your portfolio quality is excellent.',fx:{rep:2,net:-1}}}
]},
{id:'rcat3',n:'Catastrophe bonds',route:['rei'],brn:['rei_cat'],once:1,w:8,when:s=>s.rank>=2,t:'The company is considering a catastrophe bond to transfer typhoon risk to capital markets. You decide how the trigger works.',ch:[
 {l:'Lead the design, with a trigger investors can understand',c:{k:'pro',b:50,s:.8},ok:{t:'An index trigger balances transparency and basis risk. The bond is issued successfully, and you become well known in Asian catastrophe risk.',fx:{pro:5,net:4,rep:4,raise:.08,st:'award'}},ng:{t:'Investors doubt the model; the issue is halved.',fx:{hp:-3,pro:3}}},
 {l:'Suggest sticking to traditional reinsurance',ok:{t:'Safe, but the company misses a new way to spread risk.',fx:{pro:1}}},
 {l:'Oppose it: too complex',ok:{t:'Head office brings in outside consultants instead.',fx:{rep:-1}}}
]},

{id:'ers1',n:'Raw data with personal details',route:['edu'],brn:['edu_res'],w:9,t:'An insurer agrees to share claims data for your research, then sends raw files with names and ID numbers.',ch:[
 {l:'Send it back; ask for de-identified data and a data use agreement',c:{k:'rep',b:60,s:.6},ok:{t:'They reprocess the data. Your research process later becomes the university’s model example.',fx:{rep:4,pro:2}},ng:{t:'They find it a hassle; the data arrives six months late.',fx:{pro:1,hp:-1}}},
 {l:'Delete the personal fields yourself and use it',ok:{t:'The research is done, but the raw file was once on your computer, and the ethics committee isn’t pleased.',fx:{pro:2,rep:-1}}},
 {l:'Use it as is; it won’t be published anyway',a:.1,ok:{t:'A research assistant loses a laptop, and you have to report a data breach.',fx:{rep:-6,hp:-3}}}
]},
{id:'ers2',n:'An unwelcome conclusion',route:['edu'],brn:['edu_res'],w:9,t:'Your research shows a best-selling product from your partner insurer has been underpriced for years. They’d rather you didn’t publish.',ch:[
 {l:'Publish de-identified, after talking to them first',c:{w:{rep:.6,net:.4},b:55,s:.7},ok:{t:'After publication, the regulator reviews pricing for similar products. Your partner isn’t happy, but adjusts its rates.',fx:{rep:5,pro:3,net:-2}},ng:{t:'The partner stops sharing data, and your research line ends.',fx:{net:-4,rep:2}}},
 {l:'Withdraw the research',a:.3,ok:{t:'The relationship survives, but you feel uneasy.',fx:{net:2,rep:-2}}},
 {l:'Publish without telling them',ok:{t:'The research is influential, but the industry becomes wary of you.',fx:{rep:3,net:-4}}}
]},
{id:'ers3',n:'An integrated research project',route:['edu'],brn:['edu_res'],once:1,w:8,when:s=>s.rank>=2,t:'Taiwan’s National Science and Technology Council calls for an integrated project on Taiwan’s catastrophe risk. Colleagues nominate you as principal investigator.',ch:[
 {l:'Serve as principal investigator',c:{w:{pro:.5,net:.5},b:50,s:.8},ok:{t:'The project spans meteorology, engineering and insurance, and the regulator adopts its findings. You become the leading name in the field.',fx:{pro:5,net:4,rep:4,hp:-3,st:'award'}},ng:{t:'Sub-projects move at different speeds; coordinating them stalls your own research.',fx:{hp:-5,net:2}}},
 {l:'Lead a sub-project',ok:{t:'A manageable load, and you gain cross-disciplinary experience.',fx:{pro:3,net:2}}},
 {l:'Don’t apply; focus on papers',ok:{t:'Steady papers, but you miss a chance to widen your impact.',fx:{pro:2}}}
]},

{id:'etc1',n:'Teaching with real cases',route:['edu'],brn:['edu_tch'],w:9,t:'You want to teach using a major fire you once handled. The details are gripping, but involve client information.',ch:[
 {l:'De-identify it and rewrite identifying details',c:{k:'pro',b:60,s:.6},ok:{t:'Students are riveted and learn why confidentiality matters.',fx:{pro:2,rep:3}},ng:{t:'Too much rewriting; the case loses its punch.',fx:{pro:1}}},
 {l:'Use it unchanged; students won’t share it',a:.2,ok:{t:'A student posts the slides online, and the old client calls to complain.',fx:{rep:-5}}},
 {l:'Turn it into a fully fictional case',ok:{t:'Safe, but less real.',fx:{pro:1,rep:1}}}
]},
{id:'etc2',n:'A cram school’s offer',route:['edu'],brn:['edu_tch'],w:9,t:'You’re on this year’s licensing exam committee. A cram school offers a large fee for you to teach an exam crash course.',ch:[
 {l:'Refuse; no tutoring while setting questions',c:{k:'rep',b:60,s:.6},ok:{t:'The exam authority hears of it and invites you back the next year.',fx:{rep:4}},ng:{t:'The cram school says you’re arrogant.',fx:{net:-2,rep:1}}},
 {l:'Accept, but only teach basic concepts',a:.2,ok:{t:'After the exam someone reports a conflict of interest, and you’re investigated for six months.',fx:{rep:-6,hp:-3,st:'watch'}}},
 {l:'Recommend teachers who aren’t setting questions',ok:{t:'The cram school is satisfied, and you keep your boundaries.',fx:{net:2,rep:2}}}
]},
{id:'etc3',n:'An online claims academy',route:['edu'],brn:['edu_tch'],once:1,w:8,when:s=>s.rank>=2,t:'Insurance professionals must complete continuing training every year. A platform invites you to create an online claims course series.',ch:[
 {l:'Design the full course yourself, with cases and quizzes',c:{w:{pro:.6,net:.4},b:50,s:.8},ok:{t:'The course becomes a popular choice for continuing training; thousands of claims staff take it.',fx:{pro:3,net:5,rep:4,cash:80}},ng:{t:'Recording is more draining than expected, and quality is uneven.',fx:{hp:-4,pro:1}}},
 {l:'License your old notes and let the platform produce it',ok:{t:'Little effort, mediocre result.',fx:{cash:20,net:1}}},
 {l:'Decline and focus on university teaching',ok:{t:'Your students are glad to have more of your time.',fx:{fam:2,rep:1}}}
]},

{id:'epl1',n:'Should earthquake cover go up?',route:['edu'],brn:['edu_pol'],w:9,t:'The regulator is considering raising the residential earthquake insurance limit and asks for your view.',ch:[
 {l:'Use data to show the protection gap and the premium burden',c:{k:'pro',b:55,s:.7},ok:{t:'You calculate the gap between rebuilding costs and the current limit, and the premium at different limits. The committee adopts your analysis.',fx:{pro:4,rep:3,net:2}},ng:{t:'Your data isn’t recent enough, and your analysis is questioned.',fx:{pro:1,rep:-1}}},
 {l:'Back the industry and keep things as they are',ok:{t:'The industry is pleased, but the media criticizes the inadequate cover.',fx:{net:3,rep:-2}}},
 {l:'Argue for a big increase',ok:{t:'A fine ideal, but premiums would rise too much; the committee doesn’t adopt it.',fx:{rep:1}}}
]},
{id:'epl2',n:'Minimum limits for compulsory liability insurance',route:['edu'],brn:['edu_pol'],w:9,t:'After a major event accident, legislators want minimum public liability limits reviewed. You’re invited to a public hearing.',ch:[
 {l:'Argue limits should reflect maximum possible casualties, tiered by scale',c:{w:{pro:.6,rep:.4},b:55,s:.7},ok:{t:'Your proposal, tiered by venue size and event type, is written into the draft amendment.',fx:{pro:4,rep:4}},ng:{t:'Business groups say it’s too costly and the proposal is shelved.',fx:{net:-2,pro:1}}},
 {l:'Argue for big increases across the board',ok:{t:'Victims’ groups support you, but small businesses push back hard.',fx:{rep:1,net:-2}}},
 {l:'Talk theory only, no numbers',ok:{t:'Nobody remembers what you said at the hearing.',fx:{pro:1}}}
]},
{id:'epl3',n:'An invitation to the ombudsman panel',route:['edu'],brn:['edu_pol'],once:1,w:8,when:s=>s.rank>=2,t:'The Financial Ombudsman Institution invites you to serve on its panel, deciding disputes between consumers and insurers.',ch:[
 {l:'Accept, and resign all insurer consulting work',c:{k:'rep',b:55,s:.7},ok:{t:'Your decisions are known for being clear and neutral. A few years later you’re a driving force behind the system.',fx:{rep:5,pro:3,cash:-20}},ng:{t:'The caseload is heavy; you often read files late into the night.',fx:{hp:-4,rep:2}}},
 {l:'Accept, and keep the consulting work',a:.2,ok:{t:'An insurer in one case happens to be your consulting client. You have to recuse yourself, and it makes the news.',fx:{rep:-5,st:'media'}}},
 {l:'Decline',ok:{t:'You keep focusing on research and teaching.',fx:{hp:1}}}
]},

{id:'cbcp1',n:'The same substation',route:['con'],brn:['con_bcp'],w:9,t:'Running a continuity exercise for a client, you find the backup data center and the main one are fed by the same substation.',ch:[
 {l:'Recommend an offsite backup and estimate the cost of a day without power',c:{k:'pro',b:55,s:.7},ok:{t:'You show that one day’s outage costs ten times the backup. The board approves the budget on the spot.',fx:{pro:3,rep:3,res:30}},ng:{t:'The budget gets cut; only half is done.',fx:{pro:1,res:10}}},
 {l:'Put it in the report and let the client decide',ok:{t:'The report is delivered; the client does nothing.',fx:{res:15}}},
 {l:'Leave it out so the project doesn’t look bad',a:.1,ok:{t:'Six months later the substation fails, both data centers go down, and the client asks why you missed it.',fx:{rep:-6,res:-30}}}
]},
{id:'cbcp2',n:'Tier-two suppliers',route:['con'],brn:['con_bcp'],w:9,t:'The client only has data on tier-one suppliers. Digging deeper, you find four of six tier-two suppliers are in the same industrial park.',ch:[
 {l:'Build a supply-chain map to reveal concentration',c:{w:{pro:.6,net:.4},b:55,s:.7},ok:{t:'The client develops second sources. Two years later that park floods, and the client’s lines are barely affected.',fx:{pro:4,rep:4,res:30}},ng:{t:'Suppliers won’t share data; the map stays incomplete.',fx:{pro:1,res:10}}},
 {l:'Assess only tier-one suppliers',ok:{t:'The project finishes on time, but leaves a hidden gap.',fx:{res:15}}},
 {l:'Just recommend contingent business interruption insurance',ok:{t:'The client buys it, but the tier-two suppliers aren’t named, so cover is limited.',fx:{res:15,pro:-1}}}
]},
{id:'cbcp3',n:'Certification support',route:['con'],brn:['con_bcp'],once:1,w:8,when:s=>s.rank>=2,t:'A listed electronics company wants international certification of its business continuity management system (ISO 22301) and asks you to guide it.',ch:[
 {l:'Take it on, starting with a business impact analysis',c:{w:{pro:.6,net:.4},b:50,s:.8},ok:{t:'The client passes first time. The case brings your firm five more clients in the same industry.',fx:{pro:4,net:4,res:80,sz:.3}},ng:{t:'The client’s internal push is weak; certification slips a year.',fx:{hp:-3,res:20}}},
 {l:'Refer it to a specialist certification consultancy',ok:{t:'You earn a referral fee but miss a chance to build your brand.',fx:{res:15,net:1}}},
 {l:'Decline; the team has no capacity',ok:{t:'The team breathes a sigh of relief.',fx:{hp:2}}}
]},

{id:'cerm1',n:'Risk appetite',route:['con'],brn:['con_erm'],w:9,t:'The board wants you to define the company’s “risk appetite”: how much risk is it willing to take?',ch:[
 {l:'Combine quantitative limits with qualitative statements',c:{k:'pro',b:55,s:.7},ok:{t:'You set limits like “no single event loss above 5% of net worth.” For the first time, the board can discuss risk concretely.',fx:{pro:4,rep:3,res:30}},ng:{t:'Too many metrics; the directors can’t follow.',fx:{pro:1,res:10}}},
 {l:'Adapt another company’s template',ok:{t:'Done quickly, but it doesn’t fit the company’s reality.',fx:{res:15,pro:-1}}},
 {l:'Write principles, no numbers',ok:{t:'A beautiful document no one knows how to use.',fx:{res:15}}}
]},
{id:'cerm2',n:'Three lines of defense',route:['con'],brn:['con_erm'],w:9,t:'The client’s risk management department and internal audit often do the same work, and often blame each other.',ch:[
 {l:'Clarify roles with the three lines model',c:{w:{pro:.5,net:.5},b:55,s:.7},ok:{t:'Business units manage risk, risk management oversees, and audit independently checks. With roles clear, control deficiencies halve.',fx:{pro:3,net:3,res:30}},ng:{t:'No department wants to change; progress is slow.',fx:{hp:-2,res:10}}},
 {l:'Suggest merging the two departments',ok:{t:'Leaner staffing, but audit loses independence and the regulator objects.',fx:{rep:-2,res:15}}},
 {l:'Stay out of it; it’s internal politics',ok:{t:'You avoid trouble, but the client’s problem remains.',fx:{res:10}}}
]},
{id:'cerm3',n:'Outside adviser to the risk committee',route:['con'],brn:['con_erm'],once:1,w:8,when:s=>s.rank>=2,t:'A listed company asks you to be the outside adviser to its board risk committee.',ch:[
 {l:'Accept, with a quarterly key-risk report',c:{w:{pro:.5,rep:.5},b:50,s:.8},ok:{t:'Your quarterly report gets the board to tackle a currency risk early. Other listed companies start calling you.',fx:{pro:4,rep:5,res:80,sz:.3}},ng:{t:'Management is uncooperative; you often can’t get data for the report.',fx:{hp:-3,res:20}}},
 {l:'Accept, but only attend meetings',ok:{t:'Good pay, but you feel you add little.',fx:{res:30}}},
 {l:'Decline',ok:{t:'You focus on your existing clients.',fx:{hp:1}}}
]},

{id:'cesg1',n:'Flood-prone zone',route:['con'],brn:['con_esg'],w:9,t:'The client’s new plant site is in a government-mapped flood-prone zone, but the client says: “It hasn’t flooded here in fifty years.”',ch:[
 {l:'Explain using flood hazard maps and climate scenarios',c:{k:'pro',b:55,s:.7},ok:{t:'You show the client flood depths under extreme rainfall. The client decides to raise the plant and install flood gates.',fx:{pro:4,rep:3,res:30}},ng:{t:'The client thinks you’re scaremongering.',fx:{net:-2,res:10}}},
 {l:'Assess based on historical records',ok:{t:'The report looks good but doesn’t reflect future change.',fx:{res:15,pro:-1}}},
 {l:'Suggest a different site',ok:{t:'The client finds it unrealistic.',fx:{net:-2,res:10}}}
]},
{id:'cesg2',n:'Make the report look better',route:['con'],brn:['con_esg'],w:9,t:'The client wants the sustainability report to make its carbon cuts look better than the data does.',ch:[
 {l:'Write to the actual data and propose an improvement path',c:{k:'rep',b:55,s:.7},ok:{t:'Investors appreciate the honesty and concrete plan.',fx:{rep:4,res:30}},ng:{t:'The client is unhappy and won’t renew next year.',fx:{res:-10,rep:2}}},
 {l:'Polish it as the client wants',a:.2,ok:{t:'A year later environmental groups accuse the client of greenwashing, and your name comes up too.',fx:{rep:-6,st:'media'}}},
 {l:'Withdraw from the project',ok:{t:'You keep your principles, but lose the income.',fx:{rep:2,res:-10}}}
]},
{id:'cesg3',n:'Supply-chain carbon targets',route:['con'],brn:['con_esg'],once:1,w:8,when:s=>s.rank>=2,t:'Global brands want their Taiwan supply chain to cut emissions 30% within five years. A large supplier asks you to assess the financial impact.',ch:[
 {l:'Build a financial model of transition risk',c:{w:{pro:.6,net:.4},b:50,s:.8},ok:{t:'You quantify carbon fees, equipment replacement and lost orders. The model becomes your firm’s signature product.',fx:{pro:5,net:3,res:80,sz:.3}},ng:{t:'Too many assumptions; the model is called unreliable.',fx:{hp:-3,res:20}}},
 {l:'Do only a carbon inventory',ok:{t:'Job done, but the client feels the key financial analysis is missing.',fx:{res:20}}},
 {l:'Don’t take it',ok:{t:'A competitor takes the project.',fx:{rep:-1}}}
]},

{id:'omar1',n:'The one-year clock',route:['own'],brn:['own_mar'],w:9,t:'An insurer asks you to help recover from a shipping line. You check the dates: the goods were discharged eleven months ago.',ch:[
 {l:'Send a letter now and ask the carrier to extend the time limit',c:{k:'pro',b:55,s:.7},ok:{t:'The carrier’s insurer agrees to an extension. The recovery proceeds, and the insurer gives you more recovery cases.',fx:{pro:4,rep:3,res:30}},ng:{t:'The carrier refuses; the insurer has to file suit before the deadline.',fx:{hp:-2,res:10}}},
 {l:'Take your time and get the file in order first',a:.2,ok:{t:'The one-year limit passes and the right to recover is extinguished. The insurer is furious.',fx:{rep:-5,res:-20}}},
 {l:'Advise the insurer to sue now to protect the time limit',ok:{t:'The time limit is protected, but litigation isn’t cheap.',fx:{pro:2,res:15}}}
]},
{id:'omar2',n:'The transformer drop',route:['own'],brn:['own_mar'],w:9,t:'A 200-tonne transformer falls during lifting at the port. The cargo owner, the ship and the stevedores all say it isn’t their fault.',ch:[
 {l:'Pull the lifting plan, gear inspection certificates and operation records',c:{k:'pro',b:55,s:.8},ok:{t:'The records show the lifting gear was past its inspection date. With liability clear, the insurer recovers from the stevedores.',fx:{pro:5,rep:3,res:30}},ng:{t:'The records are incomplete; the liability split is argued for a year.',fx:{hp:-3,res:10}}},
 {l:'Handle the cargo loss first, liability later',ok:{t:'The cargo owner is paid, but the evidence for recovery isn’t preserved.',fx:{res:20,pro:-1}}},
 {l:'Invite the ship’s insurer to a joint survey',ok:{t:'The joint survey heads off later disputes.',fx:{net:3,res:20}}}
]},
{id:'omar3',n:'P&I correspondent',route:['own'],brn:['own_mar'],once:1,w:8,when:s=>s.rank>=2,t:'An international P&I Club wants a Taiwan correspondent to handle incidents involving ships in Taiwanese ports.',ch:[
 {l:'Take it on, with a 24-hour response team',c:{w:{pro:.5,net:.5},b:50,s:.8},ok:{t:'You handle an oil spill and the Club is delighted. International work flows in from then on.',fx:{pro:4,net:5,res:80,sz:.3,hp:-3}},ng:{t:'Too many midnight calls; the team can’t cope.',fx:{hp:-5,res:20}}},
 {l:'Only take daytime cases',ok:{t:'The Club finds that insufficient and gives you only some of its cases.',fx:{res:20,net:1}}},
 {l:'Decline',ok:{t:'You keep focusing on cargo cases.',fx:{hp:2}}}
]},

{id:'ocat1',n:'Temporary staff',route:['own'],brn:['own_cat'],w:9,t:'After a typhoon, an insurer sends you 300 cases at once. You only have people for 100.',ch:[
 {l:'Hire temporary staff, train them centrally and spot-check reports',c:{w:{pro:.5,net:.5},b:55,s:.7},ok:{t:'All 300 close within two months; errors found in spot checks are fixed in time.',fx:{pro:3,rep:3,res:60,hp:-3}},ng:{t:'The temporary staff’s reports are uneven, and the insurer sends many back.',fx:{rep:-3,res:20,hp:-4}}},
 {l:'Take 100 and decline the rest',ok:{t:'Quality holds, but the insurer gives the rest to a competitor.',fx:{rep:2,res:20,net:-2}}},
 {l:'Take them all and work overtime yourself',a:.3,ok:{t:'For two months you sleep four hours a night.',fx:{res:50,hp:-8}}}
]},
{id:'ocat2',n:'Just call it a total loss',route:['own'],brn:['own_cat'],w:9,t:'After an earthquake, residents of an apartment plead: “Write our home up as a total loss so the earthquake insurance pays.” The engineer’s assessment says it can be repaired.',ch:[

 {l:'Generously deem it a constructive total loss',a:.1,ok:{t:'An audit finds the basis inadequate, and the insurer ends its relationship with you.',fx:{rep:-7,res:-30}}},

]},
{id:'ocat3',n:'Before typhoon season',route:['own'],brn:['own_cat'],once:1,w:8,when:s=>s.rank>=2,t:'You want to deploy people, equipment and a partner network before typhoon season, so your firm is a step ahead when catastrophe strikes.',ch:[

{id:'ovol2',n:'The body shop’s estimates',route:['own'],brn:['own_vol'],w:9,t:'You notice a partner body shop’s estimates run 30% above market rates for both labor and parts.',ch:[

]},
