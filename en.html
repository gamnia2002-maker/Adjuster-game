Object.assign(KNOW,{
 ca_avgded:['The order of average and deductible','For underinsurance, first scale the loss by sum insured ÷ value, then deduct as the wording says. A different order gives a different number, so read the wording before adjusting.'],
 ca_acv:['Depreciation and salvage','Actual cash value = replacement cost − depreciation. If the insured keeps the salvage, its value comes off the claim; if the insurer takes it, it doesn’t.'],
 ca_tax:['VAT and indemnity','A regular business can reclaim input VAT, so it isn’t a real loss; claims are settled net of tax. For tax-exempt bodies or individuals who can’t reclaim it, VAT is part of the loss.'],
 ca_stock:['The gross margin method for stock','When the books are destroyed, closing stock can be rebuilt as opening stock + purchases − cost of sales, with cost of sales estimated as sales × (1 − gross margin). Use an average margin from a stable period.'],
 ca_bi:['Lost gross profit in BI','Business interruption pays gross profit: the fall in turnover times the gross profit rate, less costs saved during the shutdown. Insurance gross profit is usually turnover less variable costs.'],
 ca_icw:['Increased cost of working and the economic limit','Extra costs spent to reduce a business interruption loss are covered, up to the gross profit loss they avoid. That gives the insured a reason to recover fast and avoids uneconomic spending.'],
 ca_interim:['Interim payments','Before the adjustment is finished, an insurer can make interim payments on amounts that are confirmed and undisputed, less the deductible. In large cases, interim payments often decide whether the insured survives the recovery period.'],
 ca_items:['Separate items vs blanket cover','With separate items, each item is tested against its own value and averaged separately; blanket cover combines them. With separate items, a shortfall in one item isn’t offset by another that’s fully insured.'],
 ca_rc:['The rebuilding condition in replacement cost cover','Replacement cost policies usually pay the new-for-old difference only if the insured rebuilds or replaces within a reasonable time; otherwise the claim is paid at actual cash value.'],
 ca_cif:['CIF plus 10%','In international trade, cargo is customarily insured at CIF plus 10%, the extra covering expected profit and additional costs. Partial losses are paid as the damaged share times the sum insured.'],
 ca_ga:['The general average rate','General average rate = general average amount ÷ total contributory values of all saved interests (ship, cargo, freight). Each party pays its contributory value times the rate; cargo owners’ shares are usually covered by cargo insurance.'],
 ca_pkg:['The carrier’s limitation of liability','When no value is declared, the carrier’s liability for cargo damage is the higher of a per-package or per-kilogram SDR amount. For light, high-value goods, the cap is often far below the cargo value, so owners should buy their own cargo insurance.'],
 ca_car:['The sum insured for construction all risks','The construction all risks sum insured should be the full completed contract value, including materials, labor and variations. Endorse it when the works are varied, or claims will be averaged.'],
 ca_tpl:['Deductibles and liability limits','With liability cover, check whether the deductible sits inside the limit or comes off the loss before the limit applies. The two wordings give different results when the loss exceeds the limit.'],
 ca_solar:['Calculating the waiting period','Losses within a business interruption waiting period aren’t paid, like a deductible measured in time. For renewables, daily losses are estimated from the same season’s historical output.'],
 ca_warranty:['Insurance and warranty','Insurance covers sudden and unforeseen external events; warranties deal with defects in the product itself. One loss can have both causes, so the adjustment splits liability by cause.'],
 ca_wip:['Valuing work in progress','Work in progress is usually valued at the materials and processing costs incurred. The margin between cost and selling price belongs to business interruption cover and can’t be claimed twice in the property loss.'],
 ca_ramp:['An indemnity period long enough','The BI indemnity period runs from the incident, and only losses within it are paid. Recovery in semiconductors and chemicals includes yield ramp-up; if the period is too short, the later losses are uninsured.'],
 ca_neg:['Contributory negligence','When the victim was also at fault, the court can reduce the damages. Liability insurance pays only what the insured owes, up to the limit.'],
 ca_cali:['How compulsory and voluntary cover fit together','Payments under compulsory auto liability insurance count as part of the insured’s damages. Anything above that is then paid by voluntary third-party liability cover, up to its limit.'],
 ca_coins:['Co-insurers’ several liability','Under co-insurance, each insurer is liable for its own share only, not jointly. The deductible usually applies once to the whole claim, then the balance is shared out by percentage.'],
 ca_stp:['Stock declarations and proportional payment','Stock throughput premiums are often based on declared stock values. If declarations are below actual, claims are cut by declared ÷ actual; the premium saved by under-declaring is rarely worth it.'],
 ca_trend:['Trend adjustment','Standard turnover for a BI claim is adjusted for trends before and after the loss, seasonality and market changes. Without a trend adjustment, a growing business is underpaid.'],
 ca_dsu:['Delay in start-up insurance','Delay in start-up (DSU) cover pays lost expected revenue or fixed costs when an insured event during construction or transit delays commercial operation. It is usually a fixed daily amount, with a waiting period.'],
 ca_ibnr:['The chain ladder and IBNR','The chain ladder uses historical development factors to project ultimate claims from what has been paid or reported so far. Ultimate claims minus paid claims is the reserve needed, including incurred but not reported (IBNR) claims.'],
 ca_reinst:['Reinstating the sum insured','Some property policies reduce the sum insured after a claim. The insured can pay extra premium to reinstate it, so cover is back to full if there’s another loss in the same period.']
});

{id:'m8',n:'Integration after an acquisition',route:['mgr'],w:6,yrs:[12,40],t:'Your firm has bought a small adjusting firm in central-south Taiwan. Its report formats, fees and habits are all different from yours.',ch:[

{id:'m10',n:'Succession',route:['mgr'],w:6,yrs:[20,42],t:'The managing director asks: “Who could take your job?” You have someone in mind, but he’s not quite ready.',ch:[

{id:'m12',n:'Re-tendering the adjuster panel',route:['mgr'],w:6,t:'A large insurer is re-tendering its adjuster panel on a three-year contract. A competitor has bid 30% below you.',ch:[

Object.assign(KNOW,{
 x4:['A court-appointed examination','Courts can appoint experts to examine technical issues. A court-appointed expert gives a neutral professional opinion; the report should address both sides’ issues and explain its method, basis and limits.'],
 x5:['An expert witness’s credibility','Expert witnesses are most often attacked for inconsistency and bias. Acknowledging how methods have evolved and explaining how cases differ can actually make your evidence more credible.'],
 x6:['Primary and secondary arc beads','Beads on wiring may have caused the fire (primary beads), or formed when fire destroyed insulation and caused a short (secondary beads). Metallography and arc mapping are common ways to tell them apart.'],
 x7:['Fracture analysis','A fracture surface holds clues: fatigue often leaves beach marks, while overload leaves a rougher surface. Fracture surfaces must be preserved carefully so they aren’t scratched or corroded in handling.'],
 x8:['Joint witnessing of destructive tests','Tests that alter evidence, such as dismantling or powering up, should be notified in advance so all interested parties can attend. Otherwise, the evidence may be said to have been destroyed and the findings lose weight.'],
 x9:['Peer review of reports','Review by a senior colleague is the last line of defense against calculation and judgment errors. Review the work, not the person, and turn common errors into a checklist.'],
 x10:['Digital scene preservation','Lidar, drones and 3D scanning can preserve evidence before a site is cleared and present it clearly in court. Keeping raw data and work records protects the evidence’s credibility.'],
 x11:['Expert conflicts of interest','An expert can’t act for both sides in the same case. Check for conflicts before accepting, and never let it look as if expert opinions can be bought.'],
 x12:['Investigation practice guides','A shared practice guide gives different experts’ reports a consistent method and format, so courts and insurers can compare them, and it raises standards across the profession.'],
 m4:['Staffing for catastrophes','Adjusting firms’ caseloads swing sharply with catastrophes. A common approach is a core team plus catastrophe support contracts with peers, retirees or outside providers, so the firm doesn’t carry excess staff year-round.'],
 m5:['Service level agreements','A service level agreement (SLA) sets attendance times, reporting deadlines and penalties. Before committing, allow for exceptions such as catastrophes, so you don’t sign up to standards you can’t meet.'],
 m6:['Catastrophe claims triage','In a catastrophe, claims are graded by size, complexity and urgency: small claims close quickly by video or desk review, while large, complex claims get senior staff on site. That’s the key to efficiency.'],
 m7:['Quality management','Dual review, calculation checklists and regular sampling are the basic tools of claims quality. Correcting errors yourself costs far less than having an audit find them.'],
 m8:['Integration after M&A','In professional services, an acquisition’s value lies mostly in people and client relationships. Integrate too fast and key people leave with clients; too slowly and the benefits never come.'],
 m9:['Performance measures for claims teams','Counting closed cases alone tends to sacrifice quality. A common approach combines turnaround time, quality sampling, return rates and client feedback.'],
 m10:['Succession planning','Good managers develop successors early and gradually let them lead important cases. Succession planning also reduces an organization’s dependence on any one person.'],
 m11:['Responding to ransomware','When ransomware strikes, isolate infected systems, preserve evidence, restore from offline backups, and notify the people affected as Taiwan’s Personal Data Protection Act requires. Paying a ransom doesn’t guarantee the data hasn’t leaked.'],
 m12:['Re-tendering the adjuster panel','Insurers regularly re-tender their adjuster panels. Besides price, turnaround times, return rates, quality sampling results and catastrophe capacity are key criteria.']
});

{id:'rtr4',n:'A loss ratio over 100',route:['rei'],brn:['rei_tr'],w:9,t:'A cedant’s proportional fire treaty has run above a 100% loss ratio two years in a row. Renewal is next month.',ch:[
 {l:'Ask for a loss analysis, cut the commission and add a loss ratio cap',c:{k:'pro',w:{pro:.6,net:.4},b:50,s:.8},ok:{t:'They accept the new terms and tighten their underwriting.',fx:{pro:3,rep:4}},ng:{t:'They move to other reinsurers, and you lose the treaty.',fx:{net:-2}}},
 {l:'A long-standing client; keep the terms',ok:{t:'The relationship survives, and the third year’s loss ratio is still 105%.',fx:{net:2,rep:-3}}},
 {l:'Withdraw from the treaty',ok:{t:'The books are clean, but the cedant stops giving you its other treaties too.',fx:{net:-4,rep:1}}}
]},
{id:'rtr5',n:'Silent cyber',route:['rei'],brn:['rei_tr'],w:9,t:'Reviewing a property treaty, you notice the wording says nothing about cyber attacks. If a hacker caused a factory explosion, would this treaty pay?',ch:[
 {l:'Add an explicit cyber clause at renewal; if it’s covered, say so',c:{k:'pro',b:55,s:.8},ok:{t:'The cedant resists at first, then accepts explicit cover with a sub-limit.',fx:{pro:4,rep:3}},ng:{t:'Both sides deadlock over the wording, and renewal slips by a month.',fx:{hp:-2,net:-1}}},
 {l:'Everyone does it this way; leave it',ok:{t:'The risk is still in the treaty; nobody knows how big it is.',fx:{rep:-1}}}
]},
{id:'rtr6',n:'Accounts three months late',route:['rei'],brn:['rei_tr'],w:9,t:'A cedant’s quarterly accounts are three months late, with unclear premium and claims detail.',ch:[
 {l:'Visit them and help build a reporting process',c:{k:'net',b:55,s:.7},ok:{t:'They’re grateful, and the accounts are on time and clear from then on.',fx:{net:4,rep:3}},ng:{t:'Their account handler leaves, and the data is still a mess.',fx:{hp:-2}}},
 {l:'Enforce the treaty and hold back claim payments',c:{k:'pro',b:50,s:.7},ok:{t:'The accounts arrive within a week.',fx:{pro:2,rep:2}},ng:{t:'They think you’re looking for an excuse not to pay, and relations sour.',fx:{net:-3}}}
]},

{id:'rfac4',n:'A petrochemical plant survey',route:['rei'],brn:['rei_fac'],w:9,t:'You join a risk engineer surveying a petrochemical plant. The fire pump test log is empty for six months. The plant says, “The system is stable; there’s no need to test often.”',ch:[
 {l:'Make fire pump testing a condition of cover',c:{k:'pro',b:55,s:.8},ok:{t:'The plant tests the pumps and finds one has been broken for a long time.',fx:{pro:5,rep:3}},ng:{t:'The plant thinks you’re overreacting and goes to other reinsurers.',fx:{net:-2,pro:2}}},
 {l:'Write it at a higher price',ok:{t:'You collect more premium, but the risk itself hasn’t improved.',fx:{cash:3,rep:-1}}}
]},
{id:'rfac5',n:'Follow or price it yourself?',route:['rei'],brn:['rei_fac'],w:9,t:'On a power plant facultative placement, the lead reinsurer has set the price and terms. The broker asks if you’ll follow for 10%.',ch:[
 {l:'Re-evaluate with your own model; follow only if the price is right',c:{k:'pro',b:55,s:.8},ok:{t:'Your view matches the lead’s, and you follow with confidence.',fx:{pro:3,rep:2}},ng:{t:'Your price comes out above the lead’s, so you pass on the business.',fx:{net:-1,pro:1}}},
 {l:'Trust the lead and follow',ok:{t:'You save time, but you don’t fully know what you’ve taken on.',fx:{net:2}}}
]},
{id:'rfac6',n:'Information found only at claim time',route:['rei'],brn:['rei_fac'],w:9,t:'After a factory fire, you find the information given at placement left out a warehouse storing flammable solvents, and that’s exactly where the fire started.',ch:[
 {l:'Discuss next steps with the cedant under the duty of disclosure',c:{k:'pro',w:{pro:.6,rep:.4},b:50,s:.8},ok:{t:'Both sides negotiate a reasonable outcome under the contract and tighten information checks for the future.',fx:{pro:4,rep:3}},ng:{t:'The dispute goes to arbitration and drags on for two years.',fx:{hp:-3,rep:-1}}},
 {l:'It’s not much; pay it',ok:{t:'The cedant is grateful, but your underwriters are not pleased.',fx:{net:3,rep:-1}}}
]},

{id:'rcat4',n:'New model version, losses up 30%',route:['rei'],brn:['rei_cat'],w:9,t:'The model vendor releases a new typhoon model. The same portfolio’s estimated losses rise 30%. Sales worries the prices will scare clients off.',ch:[
 {l:'Understand each change, and explain to management which ones are justified',c:{k:'pro',b:55,s:.8},ok:{t:'Management adopts the new model but phases the price impact in over two years.',fx:{pro:5,rep:3}},ng:{t:'Your explanation is too technical, and management sticks with the old version.',fx:{hp:-2,pro:1}}},
 {l:'Keep the old version; it’s more competitive',ok:{t:'Everyone else in the market has switched, and your prices look suspiciously cheap.',fx:{rep:-3}}}
]},
{id:'rcat5',n:'The perils the model missed',route:['rei'],brn:['rei_cat'],w:9,t:'Losses from hail, wildfire and urban flooding have surged worldwide in recent years, but most catastrophe models focus on typhoons and earthquakes.',ch:[
 {l:'Build an experience analysis for secondary perils to fill the model’s gaps',c:{k:'pro',b:50,s:.8},ok:{t:'Your analysis leads the company to reprice several regions, avoiding a wave of losses the following year.',fx:{pro:5,rep:4,hp:-2}},ng:{t:'There’s too little history, and the results are highly uncertain.',fx:{pro:2,hp:-2}}},
 {l:'Wait for the vendor’s new model',ok:{t:'You save effort, but you’re two years late.',fx:{rep:-1}}}
]},
{id:'rcat6',n:'48 hours after the typhoon',route:['rei'],brn:['rei_cat'],w:9,t:'A super typhoon has just passed. The CEO wants the company’s estimated loss within 48 hours. Almost no field data is in yet.',ch:[
 {l:'Combine the model with industry loss indices, give a range and explain the uncertainty',c:{k:'pro',b:55,s:.8},ok:{t:'The final loss lands in the middle of your range, and the CEO remembers you.',fx:{pro:4,rep:5}},ng:{t:'The actual loss exceeds the top of your range.',fx:{rep:-3,hp:-2}}},
 {l:'Give one precise number so management can decide',ok:{t:'It’s a neat number, but it needs a big revision two weeks later.',fx:{rep:-3}}}
]},

{id:'ers4',n:'Thesis similarity',route:['edu'],brn:['edu_res'],w:9,t:'Your master’s student’s thesis scores 38% similarity in the checker. The student says, “It’s mostly statutes and the literature review.”',ch:[
 {l:'Check it section by section and require rewriting with proper citations',c:{k:'pro',b:55,s:.7},ok:{t:'After rewriting, the thesis is actually clearer.',fx:{pro:2,rep:4}},ng:{t:'The student can’t finish the rewrite in time and graduates a semester late.',fx:{rep:1,net:-2}}},
 {l:'Statutes are bound to repeat; let it through',ok:{t:'At the oral defense, an external examiner points out two passages copied word for word.',fx:{rep:-5}}}
]},
{id:'ers5',n:'An insurer’s data',route:['edu'],brn:['edu_res'],w:9,t:'An insurer offers you ten years of claims data for research, but wants to approve any paper before publication.',ch:[
 {l:'Sign, agreeing to a pre-publication review but no say over conclusions',c:{k:'net',b:55,s:.7},ok:{t:'They agree. The research is published in an international journal, and both sides are happy.',fx:{pro:4,rep:4,net:2}},ng:{t:'Their legal team insists on a veto over conclusions, and the collaboration falls through.',fx:{net:-1}}},
 {l:'Accept all their conditions',ok:{t:'You get the data, but you’re asked to cut the conclusion of one paper.',fx:{pro:2,rep:-3}}}
]},
{id:'ers6',n:'An international conference',route:['edu'],brn:['edu_res'],w:9,t:'Your paper is accepted for an oral presentation at an international insurance association’s annual meeting, but it clashes with your child’s graduation.',ch:[
 {l:'Go and present',ok:{t:'Your talk sparks lively discussion, and you meet two future collaborators.',fx:{pro:3,rep:4,net:3,fam:-3}}},
 {l:'Have your co-author present it',ok:{t:'You take lots of photos at the graduation.',fx:{fam:4,net:-1}}},
 {l:'Ask to present online',c:{k:'net',b:50,s:.6},ok:{t:'The organizers agree, and you miss neither.',fx:{fam:2,rep:2}},ng:{t:'The organizers don’t allow online presentations.',fx:{fam:1,rep:-1}}}
]},

{id:'etc4',n:'Rumors of a leaked exam',route:['edu'],brn:['edu_tch'],w:9,t:'After the midterm, students report that the questions were almost identical to a cram school’s practice exam. You wrote those questions yourself.',ch:[
 {l:'Explain how the exam was set and rebuild the question bank',c:{k:'rep',b:55,s:.7},ok:{t:'The investigation finds a former TA’s old notes had leaked. Students accept how you handled it.',fx:{rep:4,hp:-2}},ng:{t:'The rumors never quite die down.',fx:{rep:-2,hp:-2}}},
 {l:'Ignore it',ok:{t:'Your end-of-term teaching evaluations drop sharply.',fx:{rep:-3}}}
]},
{id:'etc5',n:'Term papers written by AI',route:['edu'],brn:['edu_tch'],w:9,t:'Several term papers are perfectly formatted, thin on substance, and cite court judgments that don’t exist.',ch:[
 {l:'Switch to oral presentations where students explain their analysis',c:{k:'pro',b:55,s:.7},ok:{t:'Students have to really understand the material to pass, and the course becomes more rigorous.',fx:{pro:3,rep:3}},ng:{t:'The presentations take two weeks, and the syllabus falls apart.',fx:{hp:-3}}},
 {l:'Set AI rules and require students to disclose how they used it',ok:{t:'Students start using AI as a tool, not a ghostwriter.',fx:{rep:3,pro:2}}},
 {l:'Give them all low marks',ok:{t:'One student appeals, saying he didn’t use AI.',fx:{rep:-3,hp:-2}}}
]},
{id:'etc6',n:'Co-teaching with practitioners',route:['edu'],brn:['edu_tch'],w:9,t:'The department encourages co-taught courses. You can invite adjusters, brokers and claims managers from the industry to teach.',ch:[
 {l:'Run it as a case workshop, with a practitioner bringing a real case each week',c:{k:'net',b:55,s:.8},ok:{t:'The course is a hit, and several students are offered internships by the practitioners.',fx:{net:5,rep:4}},ng:{t:'Practitioners’ schedules are hard to pin down, and the course keeps changing.',fx:{hp:-2,net:1}}},
 {l:'Just invite one or two speakers',ok:{t:'Students find it useful, but it’s only two classes.',fx:{net:2}}}
]},

{id:'epl4',n:'Climate disclosure for insurers',route:['edu'],brn:['edu_pol'],w:9,t:'The regulator asks you to help draft climate risk disclosure guidelines for insurers. The industry worries too much disclosure will hurt share prices.',ch:[
 {l:'Phase it in: governance and strategy first, quantification later',c:{k:'net',w:{net:.5,pro:.5},b:55,s:.8},ok:{t:'The guidelines are issued smoothly, and insurers have time to prepare.',fx:{rep:5,net:3}},ng:{t:'Neither the industry nor environmental groups are happy.',fx:{hp:-2,rep:-1}}},
 {l:'Push for full alignment with international standards at once',c:{k:'pro',b:45,s:.8},ok:{t:'An international body cites the guidelines as a model.',fx:{rep:6,pro:3}},ng:{t:'The industry pushes back hard, and the guidelines are delayed a year.',fx:{net:-3,hp:-2}}}
]},
{id:'epl5',n:'Deadlines for adjusters’ reports',route:['edu'],brn:['edu_pol'],w:9,t:'Consumer groups complain claims are too slow, and a legislator proposes requiring adjusters to finish reports within a fixed number of days. The regulator asks for your view.',ch:[
 {l:'Recommend deadlines by case type and size, with reasons required for delays',c:{k:'pro',b:55,s:.8},ok:{t:'The revised rules balance speed and quality, and the industry can accept them.',fx:{rep:5,pro:3}},ng:{t:'The categories are too complex to audit in practice.',fx:{hp:-2}}},
 {l:'Back a single deadline; simple and clear',ok:{t:'Small claims speed up, but report quality on large ones drops.',fx:{rep:-2,net:1}}}
]},
{id:'epl6',n:'Typhoon and flood cover take-up',route:['edu'],brn:['edu_pol'],w:9,t:'Every time a typhoon floods homes, the victims are uninsured. Take-up of typhoon and flood cover added to home fire policies is low. Some want it made compulsory.',ch:[
 {l:'Study an opt-out design, with pricing based on flood risk maps',c:{k:'pro',b:55,s:.8},ok:{t:'After a one-year pilot, take-up rises clearly without a big jump in premiums.',fx:{rep:6,pro:3}},ng:{t:'Premiums in high-risk areas are too high, sparking controversy.',fx:{rep:-1,hp:-2}}},
 {l:'Push to make it compulsory for everyone',ok:{t:'Take-up rises, but homeowners in low-risk areas feel forced to subsidize others.',fx:{rep:1,net:-2}}},
 {l:'Keep it voluntary and promote it more',ok:{t:'The campaign runs, and take-up barely moves.',fx:{rep:-1}}}
]},

{id:'cbcp4',n:'A real exercise, for once',route:['con'],brn:['con_bcp'],w:9,t:'The client’s business continuity plan is thorough on paper but has never been tested. You suggest an actual failover exercise.',ch:[
 {l:'On a weekend, run the line on backup systems for four hours',c:{k:'pro',b:50,s:.8},ok:{t:'The exercise exposes three problems, all fixed before a real incident.',fx:{pro:5,rep:4,res:10}},ng:{t:'The failover fails, the line stops for half a day, and the client is unhappy.',fx:{rep:-3,hp:-2}}},
 {l:'Start with a tabletop exercise',ok:{t:'Low risk, but many problems only appear in a real failover.',fx:{pro:2,res:5}}}
]},
{id:'cbcp5',n:'The backup data center is in the same building',route:['con'],brn:['con_bcp'],w:9,t:'You discover the client’s backup data center is two floors above the main one.',ch:[
 {l:'Recommend an off-site backup and set recovery time objectives by business need',c:{k:'net',w:{net:.5,pro:.5},b:55,s:.8},ok:{t:'The client sets up a backup site in southern Taiwan, and the board approves the budget.',fx:{rep:4,pro:3,res:10}},ng:{t:'The budget is cut, and only cloud backups are done.',fx:{rep:1}}},
 {l:'Just put it in the report',ok:{t:'The client glances at it and files it in a drawer.',fx:{rep:-1}}}
]},
{id:'cbcp6',n:'A second supplier is too expensive',route:['con'],brn:['con_bcp'],w:9,t:'The client has only one supplier for a key component. Qualifying a second one adds 10% to costs, and Procurement strongly objects.',ch:[
 {l:'Calculate a month without supply and compare it with the 10%',c:{k:'pro',b:55,s:.8},ok:{t:'Once the numbers are on the table, the chairman approves a second supplier on the spot.',fx:{pro:4,rep:4,res:10}},ng:{t:'Procurement challenges your assumptions, and the discussion goes nowhere.',fx:{hp:-2}}},
 {l:'Recommend more safety stock',ok:{t:'The compromise is accepted, though inventory costs rise too.',fx:{rep:2,res:5}}}
]},

{id:'cerm4',n:'Everything is amber',route:['con'],brn:['con_erm'],w:9,t:'All twenty risks on the client’s risk map are rated “medium.” The board learns nothing from it.',ch:[
 {l:'Pick the top five risks and quantify them by loss amount and probability',c:{k:'pro',b:55,s:.8},ok:{t:'For the first time, the board spends an hour discussing risk.',fx:{pro:4,rep:4,res:10}},ng:{t:'The data is thin, and the quantification is challenged.',fx:{hp:-2,pro:1}}},
 {l:'Re-interview each department and adjust the scores',ok:{t:'A few risks turn red, but the method is still subjective.',fx:{pro:2,res:5}}}
]},
{id:'cerm5',n:'The board only wants green lights',route:['con'],brn:['con_erm'],w:9,t:'You find the client’s cyber risk is very high, but the CEO wants the board report to be “not too alarming.”',ch:[
 {l:'Report it honestly, with an improvement plan and timetable',c:{k:'rep',b:55,s:.8},ok:{t:'The board approves the budget, and the CEO later thanks you.',fx:{rep:5,pro:2}},ng:{t:'The CEO is unhappy, and your contract isn’t renewed next year.',fx:{rep:3,cash:-15}}},
 {l:'Tone it down as the CEO wants',ok:{t:'Six months later the company is attacked, and the board asks why your report was green.',fx:{rep:-7}}}
]},
{id:'cerm6',n:'Set up a captive?',route:['con'],brn:['con_erm'],w:9,t:'A group pays over US$3M in premiums a year. The CFO asks: would a captive insurer pay off?',ch:[
 {l:'Run a feasibility study: loss history, capital needs, tax and regulation',c:{k:'pro',b:55,s:.8},ok:{t:'The study shows some lines suit self-insurance, and the group decides to start by participating through reinsurance.',fx:{pro:5,rep:4,res:10}},ng:{t:'Halfway through the study, the group changes CFO and the project is shelved.',fx:{hp:-2}}},
 {l:'Recommend setting one up right away and win the management work',ok:{t:'The captive is formed, but a big loss in its second year leaves it short of capital.',fx:{cash:10,rep:-3}}}
]},

{id:'cesg4',n:'Heat on the building site',route:['con'],brn:['con_esg'],w:9,t:'A construction client asks: summers keep getting hotter; how should we manage heat stress for outdoor work?',ch:[
 {l:'Monitor a heat index, shift working hours and add rest breaks',c:{k:'pro',b:55,s:.8},ok:{t:'That summer, the sites have no heat illness cases.',fx:{pro:3,rep:4,res:10}},ng:{t:'Shifting hours affects the schedule, and the project owner isn’t keen.',fx:{net:-2,pro:1}}},
 {l:'Buy a few more industrial fans',ok:{t:'It helps, but not enough.',fx:{res:3}}}
]},
{id:'cesg5',n:'The carbon fee arrives',route:['con'],brn:['con_esg'],w:9,t:'Taiwan’s carbon fee takes effect. A heavy-emitting client asks how much it will hit their finances.',ch:[
 {l:'Model several carbon price scenarios and assess reduction options',c:{k:'pro',b:55,s:.8},ok:{t:'The client sets a reduction plan based on your analysis and qualifies for a preferential rate.',fx:{pro:5,rep:4,res:10}},ng:{t:'The client’s emissions data is incomplete, so the model is only a rough estimate.',fx:{pro:2,hp:-1}}},
 {l:'Summarize the regulations for the client',ok:{t:'The client says: “We know all this. We need numbers.”',fx:{rep:-1}}}
]},
{id:'cesg6',n:'A green power contract',route:['con'],brn:['con_esg'],w:9,t:'A client is about to sign a 20-year renewable power purchase agreement and asks what the risks are.',ch:[
 {l:'Analyze shortfalls in generation, plant delays and counterparty credit risk',c:{k:'pro',b:55,s:.8},ok:{t:'The client adds a generation guarantee and a replacement supply clause to the contract.',fx:{pro:4,rep:4,res:10}},ng:{t:'The terms are already agreed, so the client has to look to insurance instead.',fx:{pro:2}}},
 {l:'Suggest insurance to transfer part of the risk',c:{k:'net',b:50,s:.7},ok:{t:'You find cover for generation shortfalls.',fx:{net:4,rep:2,res:5}},ng:{t:'There’s no suitable product on the market.',fx:{hp:-1}}}
]},

{id:'omar4',n:'A reefer loses power',route:['own'],brn:['own_mar'],w:9,t:'A refrigerated container loses power for 18 hours at a transshipment port. It holds a full load of frozen shrimp.',ch:[
 {l:'Download the reefer’s temperature log and pre-trip inspection report',c:{k:'pro',b:55,s:.8},ok:{t:'The log shows the power cut happened at the terminal, so the carrier can’t escape liability.',fx:{pro:4,rep:3,cash:10}},ng:{t:'There are gaps in the log, so liability can only be presumed.',fx:{hp:-2,pro:1}}},
 {l:'Sample the cargo and determine what’s still usable',c:{k:'pro',b:50,s:.7},ok:{t:'Most of the shrimp can be sold at a lower grade, cutting the loss sharply.',fx:{pro:3,rep:3,cash:8}},ng:{t:'The test results are poor, and the whole container must be destroyed.',fx:{hp:-1}}}
]},
{id:'omar5',n:'Grain that heats up',route:['own'],brn:['own_mar'],w:9,t:'A bulk cargo of corn arrives with one hold heated and caked. The cargo owner blames seawater; the shipowner says the moisture was too high at loading.',ch:[
 {l:'Take layered samples and compare them with the pre-loading moisture certificate',c:{k:'pro',b:55,s:.8},ok:{t:'The moisture pattern shows it was the cargo itself, not seawater. Liability is clear.',fx:{pro:5,rep:3,cash:10}},ng:{t:'The shipowner’s surveyor challenges your sampling method.',fx:{rep:-2,hp:-2}}},
 {l:'Deal with the damaged cargo first to stop it spreading',ok:{t:'The loss is contained, but liability still isn’t settled.',fx:{rep:2,cash:5}}}
]},
{id:'omar6',n:'The master’s sea protest',route:['own'],brn:['own_mar'],w:9,t:'A cargo is wet-damaged. The carrier produces the master’s sea protest, claiming heavy weather on the voyage was a peril of the sea.',ch:[
 {l:'Compare the voyage weather data with the ship’s log',c:{k:'pro',b:55,s:.8},ok:{t:'The weather on that leg was ordinary. The carrier’s defense doesn’t hold.',fx:{pro:5,rep:3,cash:10}},ng:{t:'The weather data does show a spell of heavy seas, so liability is hard to decide.',fx:{pro:1}}},
 {l:'Accept the sea protest',ok:{t:'The insurer thinks your recovery report is sloppy.',fx:{rep:-3}}}
]},

{id:'ocat4',n:'A drone complaint',route:['own'],brn:['own_cat'],w:9,t:'After an earthquake, your team surveys damaged neighborhoods by drone, and residents report illegal flying.',ch:[
 {l:'Ground the drones, check no-fly zones and licenses, and file the permits',c:{k:'pro',b:55,s:.7},ok:{t:'Three days later you’re flying legally again, with a company drone procedure in place.',fx:{pro:3,rep:3}},ng:{t:'The permit process is slower than expected, and the survey falls behind.',fx:{hp:-2}}},
 {l:'Disaster relief comes first; keep flying',ok:{t:'The firm gets a fine and a spot on the local news.',fx:{cash:-5,rep:-3}}}
]},
{id:'ocat5',n:'Post-disaster price gouging',route:['own'],brn:['own_cat'],w:9,t:'After a typhoon, quotes for roof repairs double overnight. The insured hands you a quote and wants it paid in full.',ch:[
 {l:'Build a post-disaster unit price list from several quotes and pre-disaster rates',c:{k:'pro',b:55,s:.8},ok:{t:'The insurer and the insured both accept your rates, and claims move faster.',fx:{pro:4,rep:4,cash:10}},ng:{t:'The price list doesn’t reflect real material shortages, and the insured is upset.',fx:{rep:-2,hp:-2}}},
 {l:'Approve the quote as is',ok:{t:'The claim is fast, but the insurer thinks you didn’t do your job.',fx:{rep:-3,net:1}}}
]},
{id:'ocat6',n:'The old man at the door',route:['own'],brn:['own_cat'],w:9,t:'In a flooded old neighborhood, a man in his eighties sits at his door holding a soaked policy, asking over and over: “Will this pay?”',ch:[
 {l:'Sit with him, go through it page by page, and list the documents he needs',ok:{t:'It takes an extra hour. He holds your hand and thanks you again and again.',fx:{rep:3,hp:-1,fam:1}}},
 {l:'Ask his children to call the firm, and move on to the next house',ok:{t:'Your schedule holds, but you think about him all day.',fx:{hp:-1}}}
]},

{id:'ovol4',n:'Automatic case assignment',route:['own'],brn:['own_vol'],w:9,t:'You introduce an automatic dispatch system that assigns cases by distance and workload. Senior staff complain: “The hard cases all go to the juniors.”',ch:[
 {l:'Add case difficulty and experience levels to the dispatch rules',c:{k:'pro',b:55,s:.8},ok:{t:'Closure times shorten, and fewer reports are returned.',fx:{pro:3,rep:3,cash:8}},ng:{t:'The rules are too complex, and the system keeps picking the wrong person.',fx:{hp:-2}}},
 {l:'Have a manager review assignments by hand',ok:{t:'It’s much fairer, but the manager spends two extra hours a day on it.',fx:{hp:-2,net:2}}}
]},
{id:'ovol5',n:'Complaints are rising',route:['own'],brn:['own_vol'],w:9,t:'A partner insurer tells you your motor claims draw twice as many complaints as other adjusting firms.',ch:[
 {l:'Analyze the complaints and improve contact frequency and explanations',c:{k:'net',b:55,s:.8},ok:{t:'Most complaints are “no one told me what’s happening.” With progress updates, complaints halve.',fx:{rep:4,net:2,cash:5}},ng:{t:'Before the changes take effect, the insurer starts sending you fewer cases.',fx:{cash:-8}}},
 {l:'Speed up each case',ok:{t:'Cases are faster, but complaints don’t fall.',fx:{rep:-1,hp:-2}}}
]},
{id:'ovol6',n:'What a hundred small claims have in common',route:['own'],brn:['own_vol'],w:9,t:'Analyzing a year of scooter claims, you find over a hundred with recurring times, places and witnesses.',ch:[
 {l:'Write it up for the insurer and the Insurance Anti-Fraud Institute',c:{k:'pro',b:55,s:.8},ok:{t:'The insurer investigates and breaks up a fraud ring, then sends you more cases.',fx:{pro:3,rep:5,cash:10}},ng:{t:'The links in the data aren’t strong enough, and the insurer decides to keep watching.',fx:{pro:1}}},
 {l:'Not our job; carry on as usual',ok:{t:'Six months later the ring is broken up, and the insurer asks why you didn’t spot it.',fx:{rep:-3}}}
]},

{id:'bsme4',n:'A noodle shop’s fire insurance',route:['bro'],brn:['bro_sme'],w:9,t:'A long-established noodle shop has only US$15K of fire cover, but its equipment alone is worth US$60K. The owner says, “Save on premium wherever we can.”',ch:[
 {l:'Use a simple chart to show how underinsurance gets averaged',c:{k:'net',b:55,s:.7},ok:{t:'The owner gets it and raises cover to US$60K for only a little more premium.',fx:{rep:3,net:2,cash:3}},ng:{t:'The owner still thinks they won’t need it.',fx:{}}},
 {l:'Respect the owner’s decision',ok:{t:'Two years later the kitchen catches fire, and the owner gets only a quarter of the loss.',fx:{rep:-2}}}
]},
{id:'bsme5',n:'A worker falls',route:['bro'],brn:['bro_sme'],w:9,t:'A worker at a small renovation firm falls from a ladder. The owner thought labor insurance was enough; now the family wants more compensation.',ch:[
 {l:'Help with the claim and recommend employer’s liability cover',c:{k:'net',b:55,s:.8},ok:{t:'The owner buys the cover and refers two other firms to you.',fx:{net:4,rep:3,cash:5}},ng:{t:'The owner thinks you’re just selling, and things cool a little.',fx:{net:-1}}},
 {l:'Handle only the labor insurance part',ok:{t:'The owner is left to face the rest of the dispute alone.',fx:{rep:-1}}}
]},
{id:'bsme6',n:'A hundred calls after the typhoon',route:['bro'],brn:['bro_sme'],w:9,t:'After a typhoon, almost all your SME clients call to report claims at once. Your firm has twelve people.',ch:[
 {l:'Set up an online claim form and reply in order of loss size',c:{k:'pro',w:{pro:.5,net:.5},b:55,s:.8},ok:{t:'Every client hears back within two days, and word gets around.',fx:{rep:5,net:3,cash:8}},ng:{t:'The form is too complicated, and many owners still phone.',fx:{hp:-3}}},

Object.assign(KNOW,{
 icl4:['Explaining a declinature','A declinature should state the clause, facts and reasons, and explain how to complain or apply to the ombudsman. Unclear declinatures are a major source of consumer disputes.'],
 icl5:['Handling two adjusters’ reports','Insureds can appoint their own adjusters. When reports differ widely, comparing assumptions and calculation bases item by item usually finds the source; if needed, the parties can jointly appoint a third expert.'],
 icl6:['Detecting insurance fraud','The same place, the same body shop and the same witnesses recurring are typical signs of a fraud ring. Insurers can compile the data, report it to the Insurance Anti-Fraud Institute and assist investigators.'],
 iuw4:['Renewing poor business','For business with persistently high loss ratios, renewal can bring higher rates, higher deductibles or required risk improvements. Leaving terms unchanged means other clients subsidize it.'],
 iuw5:['The risk of EV car parks','EV battery fires are hard to put out and prone to reignite. Underwriters look at where chargers are, how they’re separated, sprinkler and smoke detection design, and firefighting access.'],
 iuw6:['Adequacy of the sum insured','A sum insured left unchanged for years invites average at claim time. Underwriters can ask for a valuation or index it to construction costs, protecting both client and insurer.'],
 iri4:['The cash call clause','A reinsurance cash call clause lets the cedant ask reinsurers to pay their share of a single large claim above a set amount immediately, without waiting for periodic accounts.'],
 iri5:['Reinsurer credit risk','Cedants usually set a minimum rating for reinsurers. A special termination clause lets the cedant end the contract early or demand security if a reinsurer is downgraded.'],
 iri6:['Reinsurance strategy for a new line','When launching a new line, insurers often use quota share to spread risk and draw on reinsurers’ experience and data, then raise retention gradually as experience builds.'],
 bmar4:['Claims on temperature-controlled cargo','For pharmaceuticals and other temperature-controlled cargo, the full temperature record and the product’s stability data are key. Whether goods must be destroyed depends on regulations and the manufacturer’s quality judgment.'],
 bmar5:['Duty and increased value insurance','Cargo is usually insured at CIF plus 10%, which excludes import duty. Goods with high duty can be covered with separate duty or increased value insurance.'],
 bmar6:['Accumulation in storage','Stock concentrated in one flood-prone area can turn one disaster into a big loss. Spreading storage and setting sensible sub-limits are key parts of stock cover planning.'],
 bpro4:['Claims preparation costs','Some policies add claims preparation costs cover, paying for accountants and other professionals the insured hires to prepare a claim. The more complex the BI claim, the more valuable it is.'],
 bpro5:['Increased cost of construction (building codes)','The extra cost of rebuilding to new codes isn’t always covered by standard fire policies. A building codes extension is needed to cover it.'],
 bpro6:['Warranties','A warranty requires the insured to maintain certain conditions, such as working fire protection. Breach can have serious consequences; the insurer may deny liability for a loss.'],
 benr4:['Abnormal readings when shipping precision equipment','If shock loggers or tilt indicators are triggered, stop and don’t sign a clean receipt; notify the insurer and the OEM to open the crate jointly, and note the anomaly on the delivery receipt to preserve recovery rights against the carrier.'],
 benr5:['Microcracks in solar panels','Hail or transport shocks can cause cracks invisible to the eye that reduce long-term output. Electroluminescence (EL) testing reveals them and is key evidence for a claim.'],
 benr6:['The testing period','Construction and erection policies often have special terms for testing and commissioning, such as its length and scope. Once equipment is handed over to the owner, it usually falls outside the engineering cover.'],
 rtr4:['Adjusting proportional treaty terms','When a proportional treaty performs badly, common fixes include lower commission, a loss ratio cap, a sliding scale commission or narrower cover.'],
 rtr5:['Silent cyber','When a traditional property or liability policy neither clearly covers nor excludes cyber risk, it’s called “silent cyber.” International markets now generally require wordings to address it explicitly.'],
 rtr6:['Reinsurance accounts and reporting','Proportional treaties depend on cedants sending regular premium and claims accounts. Late or unclear accounts affect the reinsurer’s reserving and risk management.'],
 rfac4:['Risk engineering surveys','Facultative reinsurers often send risk engineers to large risks to review fire protection, process safety and maintenance records. Survey recommendations can be made conditions of cover.'],
 rfac5:['Leading and following','In facultative placements, a lead reinsurer usually sets the price and terms and others follow. Followers should still make their own risk assessment, not simply trust the lead.'],
 rfac6:['Disclosure in reinsurance','A cedant also owes the reinsurer a duty to disclose material facts. Significant omissions in placement information may affect the reinsurer’s liability under the contract and the law.'],
 rcat4:['Catastrophe model updates','Vendors update models with new science and loss experience, sometimes shifting estimated losses sharply. Users should understand why a model changed, not just look at the numbers.'],
 rcat5:['Secondary perils','Losses from “secondary perils” such as hail, wildfire and urban flood have grown fast, but modeling lags behind and needs supplementing with experience analysis.'],
 rcat6:['Post-event loss estimates','Early estimates after a catastrophe often combine model output with industry loss indices and present a range to show uncertainty. A single number gives false comfort.'],
 ers4:['Academic integrity','Theses must cite statutes, cases and literature properly. Similarity checkers are only a tool; supervisors still need to check section by section for improper copying.'],
 ers5:['Research independence in industry partnerships','Industry partnerships can agree data confidentiality and review procedures in advance, but research conclusions should stay independent. That independence is what makes research credible.'],
 ers6:['International academic exchange','International conferences are key for presenting research and building networks. Common international bodies include national insurance societies and risk management associations.'],
 etc4:['Fair exams','Question banks need regular refreshing, and old questions and notes need managing. When disputes arise, openly explaining how exams are set maintains trust.'],
 etc5:['AI and assessment','Generative AI can invent cases and references. Setting rules for its use and requiring students to explain their analysis builds judgment better than a blanket ban.'],
 etc6:['Co-teaching with practitioners','Bringing practitioners with real cases into the classroom shows students how claims and risk management work in practice and opens doors to internships and jobs.'],
 epl4:['Climate risk disclosure for insurers','Insurers’ climate disclosures usually cover governance, strategy, risk management, and metrics and targets. Phasing them in lets insurers build their quantification capability step by step.'],
 epl5:['Rules on claims turnaround','Turnaround rules need to balance speed and quality. Reasonable deadlines by case type, with reasons required for delays, work better than a single deadline.'],
 epl6:['Home typhoon and flood cover','In Taiwan, home typhoon and flood cover is mostly an add-on to home fire insurance, and take-up is low. An opt-out design is one way to close the protection gap.'],
 cbcp4:['Business continuity exercises','Business continuity plans need regular exercises. Tabletops check the process; only a real failover proves the backup systems and people actually work.'],
 cbcp5:['Recovery time objectives','Recovery time objectives (RTO) and recovery point objectives (RPO) should be set by business need. Backup facilities too close to the main site can be hit by the same disaster.'],
 cbcp6:['Single-supplier risk','When a key component has only one supplier, one disruption can stop the whole line. A second supplier or more safety stock should be weighed against the potential business interruption loss.'],
 cerm4:['Quantifying risk','A risk map with everything in the middle can’t rank anything. Quantifying the major risks by loss amount and probability is what helps a board decide.'],
 cerm5:['Honest risk reporting','Risk reporting is valuable because it lets the board see problems early. Playing down major risks usually ends with the company and the reporter paying the price together.'],
 cerm6:['Captive insurers','A captive is an insurer set up by a corporate group to insure its own risks. Whether it pays off depends on loss history, capital needs, tax and regulation.'],
 cesg4:['Heat stress','Rising temperatures increase heat stress for outdoor work. Heat index monitoring, shifted working hours, hydration and rest are the basic preventive measures.'],
 cesg5:['The financial impact of carbon pricing','Carbon fees or emissions trading directly raise costs for heavy emitters. Modeling several carbon price scenarios helps companies plan reduction timelines and investment.'],
 cesg6:['Risks in renewable power purchase agreements','Long-term renewable PPAs carry risks of generation shortfalls, plant delays and counterparty credit. Contract terms and insurance can share part of them.'],
 omar4:['Claims on refrigerated containers','A reefer’s temperature download and pre-trip inspection report are key to establishing when power failed and who is liable. Damaged goods that can be sold at a lower grade reduce the loss.'],
 omar5:['Heating in bulk grain','Bulk grain with too much moisture heats and cakes in transit. Layered sampling compared with pre-loading certificates separates inherent cargo problems from seawater damage.'],
 omar6:['Sea protests and heavy weather','Carriers often claim perils of the sea to avoid liability. Comparing weather data with the ship’s log tests whether conditions really exceeded what the ship should withstand on that route.'],
 ocat4:['Drone operating procedures','Post-disaster aerial surveys must follow drone regulations, including restricted zones, registration and operator licensing. An internal procedure avoids violations during disaster response.'],
 ocat5:['Price swings after disasters','After a catastrophe, materials and labor are scarce and quotes soar. A post-disaster unit price list built from several quotes keeps claims reasonable while meeting insureds’ real needs.'],
 ocat6:['Empathy in claims','In a catastrophe, what victims often need most is someone to explain the next step. A claims handler’s patience and empathy are part of the insurance service too.'],
 ovol4:['Automated dispatch','Automated dispatch improves efficiency but must account for case difficulty and staff experience. Dispatching purely by distance and volume tends to hurt quality.'],
 ovol5:['The root cause of complaints','The most common cause of claims complaints is lack of information. Proactive progress updates, timelines and document lists often reduce complaints more than speed does.'],
 ovol6:['Data analytics and fraud detection','Among many small claims, recurring times, places, witnesses or body shops are important clues to fraud rings. An adjusting firm’s data analytics can be a valuable service in itself.'],
 bsme4:['Underinsurance among small businesses','Small businesses often under-declare to save premium and get averaged at claim time. A simple example explaining average is one of a broker’s most effective services.'],
 bsme5:['Employer’s liability insurance','Beyond labor insurance and occupational accident insurance, employers may still owe injured workers civil damages. Employer’s liability insurance fills that gap.'],
 bsme6:['Client service in a catastrophe','In a catastrophe, claims flood in all at once. Online notification, triage by loss size and proactive replies help a small brokerage maintain service.'],
 bmnc4:['US workers’ compensation','US workers’ compensation is governed by state law, and most states require employers to carry it. Taiwan policies usually have territorial limits and can’t replace local compulsory cover.'],
 bmnc5:['Difference in conditions and limits','In a global program, the master policy can add difference in conditions (DIC) and difference in limits (DIL) cover to fill gaps in the scope or limits of local policies.'],
 bmnc6:['Insurance planning for an overseas plant','Setting up abroad means understanding local compulsory insurance, admitted insurers, natural catastrophe risk and foreign exchange rules, and working with local partners through an international broker network.'],
 bspe4:['Disclosure in D&O insurance','D&O proposal forms often ask whether you know of circumstances that may lead to a claim. Disclosing may get that matter excluded, but failing to disclose can put the whole policy at risk.'],
 bspe5:['Product recall insurance','Product liability covers third-party injury and property damage, usually not recall costs. Recall costs need separate product recall insurance.'],
 bspe6:['Kidnap and ransom insurance','Kidnap and ransom insurance covers ransoms, crisis consultants and related costs, and the policy itself is usually confidential. Combined with security training and evacuation services, it rounds out the management of overseas posting risk.'],
 tb2b4:['Productization vs customization','B2B software companies must balance client demands against the product roadmap. Turn requests that can become standard features into product, and handle the rest as paid development.'],
 tb2b5:['Service levels and incident communication','After an outage, reporting it proactively, publishing a post-incident review and honoring the penalties are key to keeping enterprise clients’ trust.'],
 tb2b6:['Managing outsourced vendors’ security','Insurers are responsible for the information security of their outsourced IT vendors and often require them to pass audits or hold international security certification.'],
 tai4:['Labeling data quality','An AI model is only as good as its training data. Having experts sample and relabel key data is often more effective than simply adding more.'],
 tai5:['Human review thresholds','AI claims often set auto-approval thresholds by amount and model confidence. Keeping human review is an important control on errors and fairness.'],
 tai6:['System load in a catastrophe','After a catastrophe, claim volumes can be dozens of times normal. Systems must scale elastically, and models need tuning for specific loss types such as flood damage.'],
 temb4:['Channel fees for embedded insurance','Embedded insurance must respect regulatory limits on solicitation and commission. If channel fees are too high, premiums can’t reflect the true cost of risk.'],
 temb5:['The value of an insurance product','A very low loss ratio may mean the cover is too narrow or claims are too hard to make. Giving consumers real protection is the way to last.'],
 temb6:['Adverse selection and moral hazard','Return shipping insurance invites “ordering to return.” Differentiated pricing and claim rules built on behavior data reduce adverse selection and moral hazard.']
});

 tech:{n:'A hundred thousand claims on typhoon night',st:[' (1) The traffic surge',' (2) The media storm',' (3) The regulator'],

 bg_ins1:['The lead insurer’s role','In co-insured cases, the lead insurer runs the claim: appointing adjusters, coordinating co-insurers and reinsurers, and dealing with the insured. How the first week of a big case is organized and notified sets the pace for everything after.'],
 bg_ins2:['Interim payments on large losses','Large claims are often paid in stages based on amounts the adjusters have confirmed. The basis for each payment must satisfy reinsurers, or recoveries will run into trouble.'],
 bg_ins3:['Settling large losses','Settling a very large claim means satisfying the insured, the co-insurers and the reinsurers at once. Getting the lead reinsurer on board first is often what lets the whole case close.'],
 bg_brk1:['The broker on the night of the loss','After a loss, the broker helps the client mitigate, preserve evidence and notify every insurer, and shows the client how to record mitigation costs. What happens on the first night shapes the whole claim.'],
 bg_brk2:['Disputes over the indemnity period','Indemnity period disputes turn on the “reasonable time to recover.” Order data, the OEM’s restart schedule and yield ramp-up records are the strongest evidence.'],
 bg_brk3:['Claim negotiations','In negotiations the broker represents the client but must also weigh long-term market relationships. Complete evidence is always the best bargaining chip.'],
 bg_rei1:['Estimating losses after a catastrophe','After a catastrophe, reinsurers must estimate losses from incomplete data. Cross-checking models, industry loss indices and cedants’ reports improves accuracy.'],
 bg_rei2:['Event definition and the hours clause','A reinsurance hours clause (such as 72 hours) defines the scope of one event. Cedants may try to split losses into several events to recover more limits; weather data is the basis for deciding.'],
 bg_rei3:['Renewals after a catastrophe','Reinsurance prices usually rise after a catastrophe. Repricing in line with loss experience while offering long-term support strengthens the relationship with cedants.'],
 bg_edu1:['Post-disaster policy research','Post-disaster research needs first-hand claims and damage data. Only collaboration between academia, regulators and industry reveals the real gaps in the system.'],
 bg_edu2:['Residential earthquake cover limits','Taiwan’s basic residential earthquake insurance has a fixed maximum sum insured, often below actual rebuilding costs. Balancing higher cover against premium burden is at the heart of the policy debate.'],
 bg_edu3:['Amending insurance law','Reforming the insurance system takes research evidence, stakeholder engagement and the legislative process. Cross-party support is often key to passing a bill.'],
 bg_con1:['Responding to a supply chain break','When a single supplier fails, immediately take stock, look for alternative sources and tell downstream customers. A supply chain map built in advance cuts response time dramatically.'],
 bg_con2:['Named supplier disputes in CBI','Contingent business interruption cover often uses named suppliers. Whether names, parent-subsidiary links and sites match the list is a frequent focus of disputes.'],
 bg_con3:['Business continuity strategy','Business continuity strategy should rank risks and invest in stages. Dual sourcing, safety stock, insurance and alternative processes each have their own costs and benefits.'],
 bg_bro1:['Tendering a global insurance program','Large companies tendering global insurance programs look at a broker’s risk assessment skills, international service network and claims capability, not just price.'],
 bg_bro2:['Placing difficult risks','High-risk business such as semiconductors and earthquake exposure needs full risk engineering data to persuade insurers. Alternatives such as retention and parametric cover reduce reliance on traditional insurance.'],
 bg_bro3:['Claims service in a global program','A global program proves its worth when there’s a claim. The broker coordinates local policies, the master policy and insurers in each country, and reports regularly to the client’s leadership.'],
 bg_tech1:['System resilience in a catastrophe','Insurtech platforms must handle traffic spikes in a catastrophe. Load testing in advance, elastic cloud scaling and automating simple cases are what get you through the peak.'],
 bg_tech2:['AI claims and public opinion','When AI claims handling sparks controversy, explaining how decisions are made and starting human reviews keeps trust better than dodging or shifting blame.'],
 bg_tech3:['AI model governance','Insurers using AI must be able to explain fairness, explainability and data governance. Regulators and consumers pay more and more attention to these.']

function survive(){if(S.hp<=0&&!S.f.hosp){S.f.hosp=true;S.ms.push({k:'hosp',a:S.age});S.hp=15;if(!S.q.some(x=>x.id==='hosp'))S.q.unshift({id:'hosp',at:S.age});return true}return false}

function promote(){

  let ffx=Object.assign({},f.fx);

function statOf(ch){
  if(ch.c)return mainK(ch.c);
  if(ch.hid)return ch.hid.k;
  if(ch.hs)return 'pro';
  let best=LIFE.has(EV.id)||/^fb_|^s_/.test(EV.id)?'fam':'rep',bv=0;
  KEYS.forEach(k=>{const v=ch.ok.fx[k]||0;if(v>bv){bv=v;best=k}});
  return best;
}
const cOf=ch=>ch.c||{k:statOf(ch)};
function outs(ch){
  if(ch.ok.fx.end||ch.ok.fx.brn)return [{n:'OK',p:100,g:'m',r:ch.ok}];
  if(ch.c){
    const p=Math.round(pOf(ch.c));
    const rm=hasT('risk')?1.5:1,wm=hasSt('watch')?2:1;
    const g=Math.max(1,Math.round(p*(ch.gr?0.2:0.12)*rm)),bf=Math.min(100-p,Math.max(1,Math.round((100-p)*0.2*rm*wm)));
    return [{n:'Great success',p:g,g:'g',r:ch.gr||null,tw:ch.gr?0:2},{n:'Success',p:p-g,g:'g',r:ch.ok},{n:'Failure',p:100-p-bf,g:'b',r:ch.ng},{n:'Major failure',p:bf,g:'b',r:ch.ng,tw:-2}];
  }
  const c=cOf(ch),p=Math.round(clamp(70+(val(c.k)-50)*0.5+varMod(c)+bsum(c),20,92)),g=Math.round(p*0.3);
  return [{n:'Smooth',p:g,g:'g',r:ch.ok,tw:1},{n:'As expected',p:p-g,g:'m',r:ch.ok},{n:'Trouble',p:100-p,g:'b',r:ch.ok,tw:-1}];
}
function addFx(a,b,m){const o=Object.assign({},a);Object.keys(b).forEach(k=>{o[k]=(o[k]||0)+Math.round(b[k]*m)});return o}
function scaleFx(fx,sign,m){const o=Object.assign({},fx);KEYS.concat(['cash']).forEach(k=>{if(o[k]&&Math.sign(o[k])===sign)o[k]=Math.round(o[k]*m)});return o}

function score(kind){

const ENDINGS=ENDALL.length;
function finish(kind,sp){
  let t,d;const tr=S.track,r=S.rank;
  if(kind==='special'){t=sp.t;d=sp.d}
  else if(kind==='collapse'){t='Collapsed from overwork';d='You collapse in a temporary tent beside the site and never wake up. Someone else submits that report for you.'}
  else if(kind==='sick'){t='Died in office';d='You never reached retirement. As colleagues cleared your desk, they found a stack of old cases covered in your notes.'}
  else if(kind==='banned'){t='Struck off by the industry';d='The day the association’s letter reached the office, your name was crossed off the register. Your profession wasn’t taken from you; you gave it away, bit by bit.'}
  else if(kind==='retire'&&brEnd()){const be=brEnd();t=be[0];d=be[1]}
  else if(S.co&&S.co.t==='tech'&&(S.f.ipo||S.co.V>=1500)){t=S.f.ipo?'Founder of a listed company':'Startup founder';d=S.f.ipo?'A photo of the bell-ringing day hangs on the office wall. Your claims platform now handles tens of thousands of cases a day.':'Your startup survived, and changed part of how claims are done.'}
  else if(S.co&&S.co.t==='own'&&(r>=5||S.co.V>=800)){t=r>=5?'Adjusting Group Chair':'Founder of an adjusting firm';d=r>=5?'The small studio of years ago now has offices in three cities.':'Your bet paid off. The company’s name carries more weight than your business card, and a successor is in place.'}
  else if(S.co&&S.co.t==='bro'&&S.co.V>=800){t='Founder of a broking firm';d='Your broking firm built its name claim by claim. Its client renewal rate is the highest in the industry.'}
  else if(S.co&&S.co.t==='con'&&S.co.V>=500){t='Founder of a consultancy';d='When companies face risk problems, your consultancy is the first name they think of.'}
  else if(r>=4&&tr==='exp'){t=r>=5?'Forensic Authority':'Chief technical expert';d='When courts, insurers and reinsurers face the hardest technical disputes, yours is the first name they think of.'}
  else if(r>=4&&tr==='mgr'){t=r>=5?'Adjusting firm general manager':'Manager who came up from the field';d=r>=5?'You went from site visits to the boardroom. On the day you retired, the whole floor stood and applauded.':'You led teams, signed big cases, and watched many newcomers become seniors.'}
  else if(r>=4&&tr==='brk'){t='Claims director at a broker';d='You went from inspecting sites to designing whole claims strategies for clients. The big cases you handled became case studies in your firm’s pitches.'}
  else if(r>=4&&tr==='ins'){t=r>=5?'Deputy general manager of an insurer':'Claims head at an insurer';d='You spent thirty years on the insurer’s side, knowing every payment stands for a family or a factory.'}
  else if(r>=4&&tr==='rei'){t=r>=5?'Global reinsurance claims director':'Asia-Pacific reinsurance claims head';d='Your passport is full of stamps. Colleagues in London, Zurich and Singapore all know your name.'}

  else if(S.f.abroad&&r>=4){t='Chief adjuster for Asia';d='Those three years in Singapore changed you. Before you retired, your name was on major loss reports across half of Asia.'}
  else if(r>=4){t='Manager who came up from the field';d='You led teams, signed big cases, and watched many newcomers become seniors. After retirement, people still call: “What do you make of this?”'}
  else if(S.pro>=72&&S.rep>=65){t=EXPS[S.sp.id][0];d=EXPS[S.sp.id][1]}
  else if(S.fam>=82&&S.hp>=45){t='A full life';d='You weren’t the brightest name in the industry, but there was always someone waiting for you at dinner. That is rare.'}
  else if(S.f.sold){t='Entrepreneur with a successful exit';d='You started a company and sold it for a good price. Afterward, you took only the cases you really wanted.'}
  else if(S.f.failed&&r>=3){t='Fell down and got back up';d='The year the company folded, you thought it was all over. Then you went back to work and climbed step by step back to where you had been, and higher.'}
  else if(NW()>=8000){t='Adjuster who got rich investing';d='Your salary was only the start. What made you financially free was thirty years of discipline and compounding.'}
  else if(NW()>=3500){t='Financially free adjuster';d='You finished your cases, saved your money, and at last you can choose the cases you want.'}
  else if(S.fam<=20){t='Successful, and alone';d='The reports are beautiful; the house is quiet. You start to wonder whether there was a time you should have taken a day off.'}
  else if(r>=3){t='The team’s backbone';d='You weren’t the one who shone brightest, but every team needs someone like you. When things go wrong, you are the first call.'}
  else{t='An ordinary, reliable professional';d='You finished the cases you had to, and held the lines you had to hold.'}
  const GL=goalsEval(kind);
  END={kind,t,d,goals:GL,score:Math.min(100,score(kind)+3*GL.filter(x=>x.ok).length)};
  achRec();
  S.log.push({age:S.age,t:'Ending: '+t,k:(kind==='retire'||kind==='special')?'up':'bad',m:1});
  P='end';auto=false;render();
}

const STONE=['..GGGG..','.GGGGGG.','GGGDGGGG','GGDDDGGG','GGGDGGGG','GGGGGGGG','GGGGGGGG','GGGGGGGG','GGGGGGGG','GGGGGGGG'];
const PLANE=['..W.....','WWWWWWWW','..W.....'];

function hex(c){return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function toHex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hex(a),B=hex(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))}
function skyAt(t){
  const st=[[0,'#a8dcff'],[.35,'#86c8f2'],[.65,'#f4cf93'],[.85,'#ee9a72'],[1,'#7a5a96']];
  for(let i=1;i<st.length;i++)if(t<=st[i][0]){const [a,ca]=st[i-1],[b,cb]=st[i];return mix(ca,cb,(t-a)/(b-a))}
  return st[st.length-1][1];
}
function hairAt(age){return age<42?'#2a2522':age<52?'#5e5853':age<60?'#9d9893':'#dcdad6'}
function outfit(){
  const r=S.rank,tr=S.track,sp=END&&END.kind==='special';
  if(sp||S.f.semi)return {T:'#4f9ac7',A:'#3f86b3',W:'#4f9ac7',P:'#c8b991'};
  if(tr==='edu')return {T:'#5d7d4a',A:'#f2efe6',W:'#f2efe6',P:'#6e604c',glass:1,book:1};
  if(tr==='brk')return {T:'#1f3554',A:'#d9a521',W:'#ffffff',P:'#1f3554',bag:1};
  if(tr==='ins')return {T:'#6b7380',A:'#2d6cb5',W:'#ffffff',P:'#5b636f',bag:1};
  if(tr==='rei')return {T:'#23262c',A:'#8a2343',W:'#ffffff',P:'#23262c',bag:1};
  if(tr==='own')return {T:'#5b4636',A:'#2e7d5b',W:'#ffffff',P:'#4d3b2e',bag:1};
  if(tr==='bro')return {T:'#2b2f3a',A:'#d9a521',W:'#ffffff',P:'#2b2f3a',bag:1};
  if(tr==='con')return {T:'#4a5c6e',A:'#e0a030',W:'#ffffff',P:'#3b4a5a',glass:1,bag:1};
  if(tr==='tech')return {T:'#333a44',A:'#333a44',W:'#333a44',P:'#4a6fa5'};
  if(tr==='exp'&&r>=3)return {T:'#eef0f2',A:'#5a8fbf',W:'#5a8fbf',P:'#4a5562',glass:1,bag:1};
  if((tr==='mgr'||tr==='adj')&&r>=3)return {T:'#3a3f48',A:'#b8322a',W:'#ffffff',P:'#3a3f48',bag:1};
  if(r>=2)return {T:'#9cc3e6',A:'#22395a',W:'#ffffff',P:'#3b4a5a',helm:'#f4f4f4',bag:1};
  return {T:'#f07f1f',A:'#e9e9e2',W:'#f07f1f',P:'#3b4a5a',helm:'#f5c400',board:1};
}
function homeKind(){return S.home>0?(NW()>=1500?'villa':'apt'):'room'}
function carKind(){const n=NW();return n>=1000?2:n>=150?1:0}
function sceneCaption(){
  const h={room:'Rented room',apt:'Apartment',villa:'House'}[homeKind()];
  const c=['No car','Small car','Sedan'][carKind()];
  const fam=[];
  if(S.f.married)fam.push('Spouse');if(S.kids)fam.push(S.kids+' kid(s)');if(S.fam>=75)fam.push('A dog');
  return MKT[S.mkt].n+' · '+RT().n+' · '+rankName()+' · '+h+' · '+c+(fam.length?' · '+fam.join(', '):'')+(S.f.abroad?' · Overseas posting':'');
}
function drawScene(cv){
  if(!cv||!cv.getContext)return;
  const c=cv.getContext('2d');if(!c)return;
  const W=120;
  const px=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const spr=(map,x,y,pal)=>map.forEach((row,j)=>{for(let i=0;i<row.length;i++){const k=pal[row[i]];if(k)px(x+i,y+j,1,1,k)}});
  const dead=END&&(END.kind==='collapse'||END.kind==='sick');
  const t=clamp((S.age-23)/42,0,1);
  const night=dead||t>.93;
  
  const sky=dead?'#1c2240':skyAt(t);
  for(let i=0;i<4;i++)px(0,i*11,W,11,mix(sky,'#ffffff',i*0.06));
  if(night){
    [[8,5],[20,12],[33,4],[47,9],[61,3],[75,11],[84,6],[110,4]].forEach(([x,y])=>px(x,y,1,1,'#f4f1d0'));
    px(100,6,5,5,'#f2efcf');px(102,6,3,2,sky);
  }else{
    const sx=Math.round(6+t*104),sy=Math.round(24-Math.sin(Math.PI*t)*18),sc=t>.7?'#ffb46b':'#ffe48a';
    px(sx-2,sy-3,5,7,sc);px(sx-3,sy-2,7,5,sc);
  }
  const cl=(x,y)=>{const col=night?'#3a4166':'#ffffff';px(x,y,9,2,col);px(x+2,y-1,5,1,col);px(x+1,y+2,7,1,col)};
  const off=(S.seed%50)+S.age*3;
  cl((off%140)-12,9);cl(((off+64)%140)-12,15);
  if(S.mkt==='cat'&&!dead){
    px(0,0,W,44,'rgba(70,80,96,0.35)');
    for(let i=0;i<40;i++){const x=(i*37+S.age*11)%W,y=(i*13+S.age*7)%40+2;px(x,y,1,2,'#c9d6e3')}
  }
  if(S.f.abroad||S.track==='rei')spr(PLANE,((S.age*7+S.seed)%90)+10,5,{W:night?'#c9cbe0':'#ffffff'});
  
  px(0,44,W,12,'#79b85a');px(0,44,W,1,'#5f9a45');px(0,46,W,3,'#cbbfa3');px(0,49,W,1,'#b3a68a');px(0,52,W,4,'#6aa64e');
  
  const kind=homeKind(),lit=night?'#ffe6a0':'#6a7c8c';
  let top=24;
  if(kind==='room'){
    px(90,24,24,22,'#b8afa3');px(90,24,24,2,'#9c9388');
    for(let r=0;r<3;r++)for(let k=0;k<2;k++)px(94+k*10,28+r*6,5,3,lit);
    px(101,41,3,2,'#e6e6e6');px(106,40,4,6,'#6b4a35');
  }else if(kind==='apt'){
    top=12;px(88,12,28,34,'#d8c9b0');px(88,12,28,2,'#bfae92');
    for(let r=0;r<5;r++)for(let k=0;k<4;k++)px(91+k*6,16+r*5,4,3,(night&&(r+k)%2)?'#ffe6a0':'#6a7c8c');
    px(99,40,6,6,'#5d4636');
  }else{
    top=17;px(90,24,26,22,'#efe0c4');
    for(let i=0;i<7;i++)px(88+i*2,23-i,30-i*4,1,'#b8432f');
    px(94,28,6,5,night?'#ffe6a0':'#86b6d6');px(106,28,6,5,night?'#ffe6a0':'#86b6d6');px(92,35,22,1,'#9a8a70');px(101,37,6,9,'#7a4b2e');
  }
  if(S.co||(END&&END.kind==='special')){
    const sc=S.co?{own:'#f5c400',bro:'#d9a521',con:'#7fb2d6',tech:'#a98be0'}[S.co.t]:'#3f9c7a';
    px(92,top-7,22,5,sc);for(let k=0;k<5;k++)px(94+k*4,top-5,2,1,'#1b1500');px(95,top-2,1,2,'#555555');px(110,top-2,1,2,'#555555');
  }
  
  const ck=carKind();
  if(ck===1)spr(CAR1,4,43,{C:'#d2463c',G:'#a8d4ee',K:'#1d1d1d'});
  if(ck===2)spr(CAR2,2,43,{C:'#2b3240',G:'#a8d4ee',K:'#111111'});
  
  if(S.f.married)spr(SPOUSE,38,32,{H:hairAt(S.age),S:'#f1c7a1',E:'#2b2b2b',M:'#a2533f',C:'#c0507a',B:'#2a2a2a'});
  
  const o=outfit(),age=S.age,mood=(S.hp+S.fam)/2;
  const m=ADULT.slice();
  if(o.helm&&!END){m[0]='...YYYY...';m[1]='..YYYYYY..';m[2]='.YYYYYYYY.'}
  else if(age>=58){m[0]='..........';m[2]='..HSSSSH..'}
  if(o.glass||age>=48)m[4]='..GEGGEG..';
  if(mood<35){m[5]='..SDSSDS..';m[6]='..SMMMMS..'}
  else if(mood>=62){m[6]='..SMSSMS..';m[7]='...SMMS...'}
  const X=51,Y=32;
  if(dead){
    spr(STONE,X+1,Y+7,{G:'#8d939c',D:'#5c626b'});
    [[X,'#e05a6a'],[X+2,'#f5c400'],[X+7,'#e05a6a'],[X+9,'#ffffff']].forEach(([x,col])=>px(x,45,1,1,col));
  }else{
    spr(m,X,Y,{H:hairAt(age),Y:o.helm,S:'#f1c7a1',D:'#cf9a78',E:'#2b2b2b',G:'#3a3a3a',M:'#a2533f',T:o.T,A:o.A,W:o.W,P:o.P,B:'#2a2a2a'});
    if(END&&END.kind==='banned'){px(X+1,Y+10,8,5,'#b88a52');px(X+1,Y+12,8,1,'#8a6438')}
    else if(!END||END.kind!=='special'){
      if(o.bag&&!S.f.semi){px(X+8,Y+13,3,3,'#6b4428');px(X+9,Y+12,1,1,'#6b4428')}
      if(o.book)px(X+8,Y+11,2,3,'#b8322a');
      if(o.board)px(X-1,Y+10,2,3,'#c8a36a');
    }
    if(S.rep>=80)px(X+2,Y+9,1,1,'#ffd23f');
    if(S.f.cert)px(X+7,Y+9,1,1,'#6fd0ff');
  }
  
  const kc=['#3e9e6a','#e0a030'];
  S.kb.slice(0,2).forEach((b,i)=>{
    const ka=S.age-b,x=64+i*9,pal={H:'#2a2522',S:'#f1c7a1',E:'#2b2b2b',M:'#a2533f',C:kc[i],P:'#3b4a5a',B:'#2a2a2a'};
    const mp=ka<4?KID0:ka<12?KID1:KID2;
    spr(mp,x,49-mp.length,pal);
  });
  if(S.fam>=75&&!dead)spr(DOG,80,44,{D:'#b07a45',E:'#222222'});
  if(S.pro>=80&&!dead){px(30,45,6,1,'#2f5d7c');px(31,44,5,1,'#b8322a');px(30,43,6,1,'#e0a030')}
}


const chip=(t,c)=>'<span class="chip '+c+'">'+t+'</span>';
const TRS={careful:'More confident on technical questions',smooth:'Good at defusing conflict and building relationships',stub:'Principled, but slow to make friends',work:'Gets more from working hard; family tends to suffer',home:'Gets more from family time; dislikes long trips',opt:'Tough body, bounces back from setbacks quickly',amb:'Faster promotions and more chances, but tends to neglect family',sweet:'Builds a network fast; insurer contacts especially like you',just:'Bigger reputation gain when refusing improper benefits',risk:'Prone to big successes, and big failures'};
const FBS={rich:'Family has seed money and supports you',normal:'An ordinary family, with no special help or burden',loan:'Graduated with student loans; saving is slow at first',pillar:'You support your family: devoted, but you share the household costs'};
const lvl=v=>v>=75?'Top':v>=60?'Excellent':v>=50?'Good':v>=40?'Average':v>=25?'Weak':'Very poor';
const rel=v=>v>=40?'Close':v>=15?'On good terms':v>-15?'Average':v>-35?'Some friction':'Hostile';
const odds=p=>p>=80?'Very good odds':p>=60?'Good odds':p>=40?'Even odds':p>=20?'A bit risky':'Very risky';
function arrows(fx){
  if(!fx)return '';
  const o=[],ar=(v,big)=>(v>0?'↑':'↓')+(Math.abs(v)>=big?(v>0?'↑':'↓'):'');
  KEYS.forEach(k=>{if(fx[k])o.push(chip(KN[k]+' '+ar(fx[k],6),fx[k]>0?'up':'dn'))});
  if(fx.cash)o.push(chip('Savings '+ar(fx.cash,100),fx.cash>0?'up':'dn'));
  if(fx.raise)o.push(chip('Salary '+ar(fx.raise,.1),fx.raise>0?'up':'dn'));
  ['lin','chen','wang','apr'].forEach(k=>{if(fx[k])o.push(chip(NPCN[k]+' '+(fx[k]>0?'♥':'✕'),fx[k]>0?'up':'dn'))});
  if(fx.res)o.push(chip('Company funds '+ar(fx.res,100),fx.res>0?'up':'dn'));
  if(fx.gov)o.push(chip('Company discipline '+ar(fx.gov,10),fx.gov>0?'up':'dn'));
  if(fx.sz)o.push(chip('Company size '+ar(fx.sz,.3),fx.sz>0?'up':'dn'));
  if(fx.Vm)o.push(chip('Company value '+ar(fx.Vm-1,.3),fx.Vm>=1?'up':'dn'));
  if(fx.home)o.push(chip('Property ↑','up'));
  const FL={married:'Marriage',house:'Home purchase',abroad:'Overseas posting',divorced:'Separation',eng:'English ability',cert:'International qualification',sprint:'Sprint mode',semi:'Slowing down'};
  if(fx.flag&&FL[fx.flag])o.push(chip(FL[fx.flag],'hk'));
  if(fx.kid)o.push(chip('New baby','hk'));
  if(fx.route)o.push(chip('Moves to '+ROUTES[fx.route].n,'hk'));
  if(fx.found)o.push(chip('Founds '+CO[fx.found].n,'hk'));
  if(fx.st)o.push(chip(STA[fx.st].n,'hk'));
  if(fx.sk)o.push(chip('Learns '+SK[fx.sk].n,'hk'));
  if(fx.strat)o.push(chip('Investing set to '+STRAT[fx.strat].n,'hk'));
  if(fx.invSell)o.push(chip('Sells investments','hk'));
  if(fx.invBuy)o.push(chip('Invests more','hk'));
  if(fx.pol)o.push(chip('Company '+POL[fx.pol].n,'hk'));
  if(fx.big&&fx.big>-9)o.push(chip('Big case '+(fx.big>0?'advantage':'disadvantage'),fx.big>0?'up':'dn'));
  if(fx.sched)o.push(chip(/^big/.test(fx.sched.id)?'Big case: next stage':'Sets up a follow-up','hk'));
  if(fx.sell)o.push(chip('Sells company','hk'));
  if(fx.bust)o.push(chip('Company closes','dn'));
  if(fx.ipo)o.push(chip('Going public','hk'));
  if(fx.end)o.push(chip('Life turn','hk'));
  return o.join('');
}
const fxView=fx=>detail?fxChips(fx):arrows(fx);

function mast(){return '<div class="mast"><b>The Loss Adjuster</b><span class="code">Life code '+S.seed+'</span></div>'}
function stage(){
  let bar='';
  if(P==='run'){
    bar='<div class="yb"><span>'+(paused?'Paused':'Time running')+'</span><b>'+S.age+' → '+(S.age+1)+' yrs old</b></div>'
      +'<div class="ytrack"><u class="run'+(paused?' pz':'')+'" style="animation-duration:'+dur()+'ms;animation-delay:-'+Math.round(prog())+'ms"></u></div>';
  }else if(P==='event'||P==='result'){
    bar='<div class="yb"><span>Crossroads, time paused</span><b>'+S.age+' yrs old</b></div><div class="ytrack"><u class="hold"></u></div>';
  }
  const L=a=>((a-23)/42*100).toFixed(2)+'%';
  const marks=S.log.filter(e=>e.m&&e.age>23).map(e=>'<'+(e.m===2?'i class="done"':'em')+' style="left:'+L(e.age)+'"></'+(e.m===2?'i':'em')+'>').join('');
  const life=END?'':'<div class="life"><div class="yb"><span>Life progress · diamonds = career moves, yellow dots = promotions</span><b>'+Math.round((S.age-23)/42*100)+'%</b></div>'
    +'<div class="ltrack"><u style="width:'+L(Math.min(S.age,65))+'"></u>'+marks+'</div>'
    +'<div class="lscale">'+[23,35,45,55,65].map(a=>'<span style="left:'+L(a)+'">'+a+'</span>').join('')+'</div></div>';
  return '<section class="stage"><canvas class="scene" id="scene" width="120" height="56" role="img" aria-label="Character and life scene"></canvas>'
    +'<p class="cap">'+sceneCaption()+'</p>'+(!END&&S.hp<25?'<p class="var warn">Your body is sending warning signs. '+(S.f.hosp?'You have already collapsed once. Next time you may not wake up. ':'')+'Consider switching your focus to “Family & rest”.</p>':'')+bar+life+'</section>';
}
function finLine(){
  if(!detail){let h='<p class="cap">Money: '+STRAT[S.strat].n+(S.home>0?' · Owns property':'')+(S.mort>0?' · Paying mortgage':'')+'</p>';if(S.co){const c=S.co,st=c.res<CO[c.t].cap*.1||c.lp<0?'Tight':c.lp>CO[c.t].P*.15?'Growing':'Stable';h+='<div class="var">'+CO[c.t].n+' · Operations'+st+' · Company discipline'+(c.gov>=70?'Good':c.gov>=45?'Average':'Loose')+' · Strategy: '+POL[c.pol].n+'</div>'}return h}
  const p=['Cash '+cur(S.cash)+'','Investments '+cur(S.inv)+'('+STRAT[S.strat].n+(S.inv>0?', this year '+(S.lr>=0?'+':'')+Math.round(S.lr)+'%':'')+')'];
  if(S.home>0)p.push('Property '+cur(S.home)+''+(S.mort>0?' (mortgage '+cur(S.mort)+')':''));

function profLine(){
  const rows=[];
  rows.push('<b>Traits</b> '+S.traits.map(x=>TR[x].n).join(', ')+' · <b>Strong</b> '+KN[S.tal]+' · <b>Weak</b> '+KN[S.weak]);
  const sk=Object.keys(S.skills).map(x=>SK[x].n);rows.push('<b>Skills</b> '+(sk.length?sk.join(', '):'None yet'));
  {const cs=Object.keys(S.cert||{});if(cs.length)rows.push('<b>Credentials</b> '+cs.map(x=>CERT[x].n).join(', '))}
  rows.push('<b>People</b> '+Object.keys(NPCN).filter(x=>x!=='apr'||S.f.apr).map(x=>NPCN[x]+' '+(detail?(S.npc[x]>0?'+':'')+S.npc[x]:rel(S.npc[x]))).join(' · '));
  if(S.st.length)rows.push('<b>Status</b> '+S.st.map(z=>STA[z.id].n+(detail?' ('+z.y+' yr)':'')).join(', '));
  return '<div class="cap prof">'+rows.map(r=>'<span>'+r+'</span>').join('')+'</div>';
}
function head(){
  const bars=KEYS.map(k=>'<div class="st"><span>'+KN[k]+'</span><i><u style="width:'+S[k]+'%;background:var(--s-'+k+')"></u></i><b class="'+(S[k]<25?'low':'')+'">'+(detail?Math.round(S[k]):(S[k]<25?'Danger':''))+'</b></div>').join('');
  const tg=[MKT[S.mkt].n,STK[S.stk].n];
  if(S.f.married)tg.push('Married');if(S.f.divorced)tg.push('Divorced');

function dexCat(e){
