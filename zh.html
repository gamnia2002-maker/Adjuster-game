<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="保險公證人人生模擬:從 23 歲入行到 65 歲退休,在每個十字路口做出選擇,邊玩邊學保險理賠。">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>公證人求生指南：今天又出險了</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
/* 版面:案件卷宗。窄欄單列:像素場景與時間條在上,十字路口卡片緊接其後,下方是屬性、控制與逐年日誌。色票:安全帽黃、鋼藍墨、冷灰紙。 */
:root{
  --bg:#e8ecef; --card:#f8fafb; --ink:#14212c; --mute:#5a6a77; --line:#c9d3da;
  --accent:#f2b705; --accent-ink:#1b1500; --steel:#2f5d7c;
  --good:#23794a; --bad:#b53a29; --track:#d6dee4;
  --s-pro:#2f5d7c; --s-rep:#b8860b; --s-net:#6a4fa3; --s-hp:#1f8a7a; --s-fam:#c0507a;
  --f-display:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1923; --card:#16242f; --ink:#e7eef3; --mute:#97a8b5; --line:#2b3d4b;
    --accent:#f4c430; --accent-ink:#1b1500; --steel:#7fb2d6;
    --good:#4fbf86; --bad:#ee7b68; --track:#243543;
    --s-pro:#6fa8d1; --s-rep:#f2c14e; --s-net:#a98be0; --s-hp:#4fcbb4; --s-fam:#ee8aa8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1923; --card:#16242f; --ink:#e7eef3; --mute:#97a8b5; --line:#2b3d4b;
  --accent:#f4c430; --accent-ink:#1b1500; --steel:#7fb2d6;
  --good:#4fbf86; --bad:#ee7b68; --track:#243543;
  --s-pro:#6fa8d1; --s-rep:#f2c14e; --s-net:#a98be0; --s-hp:#4fcbb4; --s-fam:#ee8aa8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font:400 16px/1.75 var(--f-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.3}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.mast{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.mast b{font:900 20px/1.2 var(--f-display);letter-spacing:.06em}
.code{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.04em}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.hero h1{font-size:clamp(34px,10vw,48px);font-weight:900;letter-spacing:.04em}
.hero .lede{font-size:17px;max-width:34em}
.stamp{align-self:flex-start;font:700 12px var(--f-mono);letter-spacing:.14em;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:3px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.facts div{border-top:2px solid var(--ink);padding-top:6px;line-height:1.3}
.facts b{display:block;font:700 22px var(--f-mono)}
.facts span{font-size:12px;color:var(--mute)}

.tab{display:inline-block;background:var(--accent);color:var(--accent-ink);font:700 12px var(--f-mono);letter-spacing:.1em;padding:5px 12px;border-radius:5px 5px 0 0;margin-bottom:-1px;position:relative}
.tab.dark{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.card.ev{border:2px solid var(--accent)}
.card.br{border:2px solid var(--steel)}
.tab.br{background:var(--steel);color:var(--card)}
.card h2{font-size:22px}
.last{font:500 13px/1.6 var(--f-mono);color:var(--mute);border-left:3px solid var(--line);padding-left:10px}

/* 場景與時間 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:10px}
canvas.scene{display:block;width:100%;height:auto;aspect-ratio:120/56;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px;background:#a8dcff}
.cap{font-size:12px;color:var(--mute);line-height:1.5}
.yb{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--mute)}
.yb b{font:700 12px var(--f-mono);color:var(--ink)}
.ytrack{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.ytrack u{display:block;height:100%;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.ytrack u.run{animation-name:yfill;animation-timing-function:linear;animation-fill-mode:forwards}
.ytrack u.pz{animation-play-state:paused}
.ytrack u.hold{transform:scaleX(1);background:var(--steel)}
@keyframes yfill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.life{display:flex;flex-direction:column;gap:4px}
.ltrack{position:relative;height:14px;background:var(--track);border-radius:3px}
.ltrack>u{position:absolute;left:0;top:0;bottom:0;background:var(--ink);opacity:.82;border-radius:3px 0 0 3px;transition:width .4s}
.ltrack i{position:absolute;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;transform:rotate(45deg);border:2px solid var(--steel);background:var(--card)}
.ltrack i.done{background:var(--steel)}
.ltrack em{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--accent)}
.lscale{position:relative;height:14px;font:500 11px/14px var(--f-mono);color:var(--mute)}
.lscale span{position:absolute;transform:translateX(-50%)}
.lscale span:first-child{transform:none}
.lscale span:last-child{transform:translateX(-100%)}

.hdr{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px 12px}
.kv{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.kv span{font-size:12px;color:var(--mute)}
.kv b{font:700 16px var(--f-mono)}
.kv b.zh{font:700 15px var(--f-body)}
.sts{display:flex;flex-direction:column;gap:6px}
.st{display:grid;grid-template-columns:2.6em 1fr 2.4em;align-items:center;gap:10px;font-size:13px}
.st i{display:block;height:8px;background:var(--track);border-radius:2px;overflow:hidden}
.st u{display:block;height:100%;border-radius:2px;transition:width .4s}
.st b{text-align:right;font:700 13px var(--f-mono)}
.st b.low{color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.prof{display:flex;flex-direction:column;gap:2px}
.var.warn{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.linkbtn{all:unset;cursor:pointer;font-size:13px;color:var(--steel);text-decoration:underline;align-self:flex-start}
.linkbtn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.prof b{color:var(--ink);font-weight:700}

.ctrl{display:flex;flex-direction:column;gap:10px}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;color:var(--mute);letter-spacing:.06em}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);cursor:pointer}
.auto input{width:18px;height:18px;accent-color:var(--steel)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg.s3{grid-template-columns:repeat(3,1fr)}
.seg.s4{grid-template-columns:repeat(4,1fr)}
@media (max-width:460px){.seg.s4 button{font-size:13px;padding:8px 2px}.facts{grid-template-columns:1fr 1fr}}
.seg button{all:unset;box-sizing:border-box;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:14px;line-height:1.35;background:var(--bg)}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg);font-weight:700}
.pbtn{all:unset;box-sizing:border-box;padding:8px 14px;border-radius:6px;border:1px solid var(--ink);font:700 14px var(--f-body);cursor:pointer;min-width:6em;text-align:center}
.pbtn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;line-height:1.55}
.opt:hover{border-color:var(--steel)}
.opt[disabled]{cursor:not-allowed;opacity:.5}
.opt[disabled]:hover{border-color:var(--line)}
.opt:focus-visible,.btn:focus-visible,.seg button:focus-visible,.pbtn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.opt b{font-weight:700;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:500 12px/1.2 var(--f-mono);padding:4px 7px;border-radius:3px;border:1px solid var(--line)}
.chip.up{color:var(--good);border-color:currentColor}
.chip.dn{color:var(--bad);border-color:currentColor}
.chip.pr{color:var(--steel);border-color:currentColor}
.chip.hk{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lk{color:var(--mute);border-style:dashed}
.btn{all:unset;box-sizing:border-box;display:block;text-align:center;padding:13px 18px;border-radius:6px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--f-body);cursor:pointer;letter-spacing:.06em}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--mute)}
.field input,.field textarea{font:500 16px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
.field textarea{font:400 14px/1.6 var(--f-body);resize:none;height:84px}

.rowkv{display:flex;flex-direction:column;gap:2px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.rowkv:last-of-type{border-bottom:0;padding-bottom:0}
.rowkv .k{font-size:12px;color:var(--mute)}
.rowkv .v{font-weight:700}
.rowkv .p{font:500 12px var(--f-mono);color:var(--steel)}

.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:3.4em 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6}
.feed li:last-child{border-bottom:0}
.feed li>span{font:700 12px/1.9 var(--f-mono);color:var(--mute)}
.feed li div{min-width:0;display:flex;flex-direction:column;gap:4px}
.feed li.up b,.feed li.up>div>span:first-child{color:var(--good)}
.feed li.bad b{color:var(--bad)}
.feed li.ev b{color:var(--steel)}
.feed li.new{animation:fresh .6s ease-out}
@keyframes fresh{from{background:color-mix(in srgb,var(--accent) 30%,transparent)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.feed li.new{animation:none}.st u,.ltrack>u{transition:none}}

.score{display:flex;align-items:baseline;gap:10px}
.score b{font:900 56px/1 var(--f-display)}
.score span{color:var(--mute);font:500 13px var(--f-mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
svg.ch{width:100%;height:auto;display:block}
svg .gl{stroke:var(--line);stroke-width:1}
svg .tx{fill:var(--mute);font:9px var(--f-mono)}

details{border:1px solid var(--line);border-radius:6px;background:var(--card)}
summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:15px}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:500}
td.r,th.r{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.tbl{overflow-x:auto}
.foot{font-size:12px;color:var(--mute);text-align:center}
.know{border:1px dashed var(--steel);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.know .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.know b{font-size:15px}
.know p{font-size:14px;line-height:1.75}
.var{font-size:13px;line-height:1.6;background:color-mix(in srgb,var(--accent) 20%,transparent);border-left:3px solid var(--accent);padding:6px 10px;border-radius:0 4px 4px 0}
.tier{font:700 14px var(--f-mono);letter-spacing:.08em}
.tier.g{color:var(--good)}.tier.b{color:var(--bad)}.tier.m{color:var(--steel)}
.twist{font-size:14px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}
.feed li.mk>div>span:first-child{color:var(--s-rep);font-weight:700}
.clause{margin:0;border-left:3px solid var(--steel);background:var(--bg);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px;line-height:1.75;display:flex;flex-direction:column;gap:4px}
.clause .kt,.clans .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.clans{border:1px solid var(--steel);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.clans b{font-size:15px}
.clans .ok{color:var(--good);font:700 13px var(--f-mono)}.clans .ng{color:var(--bad);font:700 13px var(--f-mono)}
.clans p{font-size:14px;line-height:1.75}
.src{font:500 12px var(--f-mono);color:var(--mute);letter-spacing:.03em}
.tab.hist{background:var(--ink);color:var(--bg)}
.dexh{font-size:clamp(28px,8vw,40px)!important}
.dexsum{display:flex;align-items:baseline;gap:10px;border-top:2px solid var(--ink);padding-top:8px}
.dexsum b{font-size:34px;font-weight:700}
.dexsum span{color:var(--mute);font-size:13px}
.dexc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.dexc>summary{display:grid;grid-template-columns:1fr auto;gap:6px 10px;cursor:pointer;font-weight:700;list-style:none}
.dexc>summary::-webkit-details-marker{display:none}
.dexc>summary i{grid-column:1/-1;display:block;height:6px;background:var(--track);border-radius:3px;overflow:hidden}
.dexc>summary u{display:block;height:100%;background:var(--accent)}
.dexc ul{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.dexc li{font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.dexc li summary{cursor:pointer;font-weight:500}
.dexc li p{margin-top:6px;color:var(--mute);line-height:1.75}
.dexc li.lock{color:var(--mute);display:flex;justify-content:space-between;gap:10px}
.dexc li.lock span{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:1px 6px;white-space:nowrap;align-self:flex-start}
.endc{gap:16px}
.idcard{width:100%;max-width:380px;margin:0 auto;height:auto;display:block;border-radius:12px;box-shadow:0 8px 24px rgba(20,33,44,.22);background:#f7f4ec}
.sum{font:700 19px/1.65 var(--f-display);border-left:4px solid var(--accent);padding-left:12px;text-wrap:pretty}
.story{display:flex;flex-direction:column;gap:6px}
.story .kt{font:700 11px var(--f-mono);letter-spacing:.12em;color:var(--steel)}
.story p{font-size:16px;line-height:1.95}
.endbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:-6px 0 0}
.linkbtn.inl{display:inline;font-size:12px;align-self:auto}
.term{border-bottom:1px dashed var(--steel);cursor:help}
.term:focus-visible{outline:2px solid var(--steel);outline-offset:1px}
.gpop{position:absolute;z-index:50;background:var(--card);color:var(--ink);border:1px solid var(--steel);border-radius:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.2);font:400 14px/1.7 var(--f-body)}
.gpop b{display:block;color:var(--steel);font-size:14px;margin-bottom:2px}
.gpop p{margin:0}
.works,.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.works li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:baseline;border-top:1px dashed var(--line);padding-top:8px;font-size:15px}
.works li span{font-size:12px;color:var(--mute)}
.works li em{font-style:normal;font:700 12px var(--f-mono);color:var(--good)}
.goals li{display:flex;gap:10px;align-items:flex-start;border-top:1px dashed var(--line);padding-top:8px}
.goals li i{font-style:normal;font:700 14px var(--f-mono);width:20px;flex:none;text-align:center}
.goals li.ok i{color:var(--good)}.goals li.no i{color:var(--mute)}
.goals li div{display:flex;flex-direction:column}
.goals li b{font-size:15px}.goals li span{font-size:13px;color:var(--mute)}
.goals li.no b{color:var(--mute)}
.dtabs{display:flex;gap:8px}
.dtabs button{flex:1;font:700 14px var(--f-body);padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.dtabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.achsum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.achsum div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.achsum b{font-size:22px}
.achsum span{font-size:12px;color:var(--mute)}
.dexc li.achok{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dexc li.achok em{font-style:normal;font-size:12px;color:var(--good);white-space:nowrap}
.dexc li.achok span{line-height:1.6}
.gcard{gap:12px;padding:12px}
.kvs.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kv em{display:block;font-style:normal;font-size:12px;line-height:1.4;color:var(--mute);margin-top:2px}
.pbk{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pst{font-size:12px;color:var(--mute)}
.spd{display:flex;gap:4px;flex:none}
.spd button{all:unset;box-sizing:border-box;min-width:36px;height:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;font:600 13px var(--f-body);cursor:pointer;background:var(--bg);color:var(--ink)}
.spd button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spd button:focus-visible,.gear:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.spd svg{width:10px;height:10px;fill:currentColor}
.ltrack .yr{position:absolute;top:0;bottom:0;width:calc(100% / 42);min-width:6px;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
.ltrack .yr.run{animation-name:yfill;animation-timing-function:linear;animation-fill-mode:forwards}
.ltrack .yr.pz{animation-play-state:paused}
.ltrack .yr.hold{transform:scaleX(1);background:var(--steel)}
details.more{border:none;border-top:1px dashed var(--line);border-radius:0;background:none;padding:8px 0 0}
.more>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--steel);list-style:none;padding:0}
.more>summary::-webkit-details-marker{display:none}

/* 知識卡:每則事件一張 */
const KNOW={
br1:['公證人、保險公司、經紀人','保險公證人受委託獨立查勘、鑑定損失並出具報告;保險公司負責核賠與給付;保險經紀人代表要保人規劃保險並協助理賠。三者站的位置不同,看同一件理賠的角度也不同。'],
br2:['再保險','保險公司把承擔的部分風險再轉給再保險公司,以穩定財務、提高承保能量。大型災損最後往往由國際再保人分擔,所以再保人常會參與或查核重大理賠。'],
br3:['公證報告的獨立性','公證報告的價值來自獨立與專業。無論職涯走到哪個階段,報告都應依證據與保單條款認定,不受委託方或被保險人的壓力左右。'],
first:['第一時間的現場保全','事故發生後,應盡快拍照、標記、保存起火點與受損物,並記錄時間與在場人員。現場一旦清理或被雨水破壞,原因鑑定就很難回溯。'],
english:['倫敦市場','倫敦(Lloyd’s 與倫敦公司市場)是全球大型商業風險與再保險的核心市場。許多海上、能源、巨災保單以英文條款為準,條款解釋常參考英國法。'],
emba:['風險管理與企業決策','企業主越了解風險管理,越會把保險當成財務工具,而不只是成本。保險規劃通常要搭配損失預防、自留額與營運持續計畫一起看。'],
deadline:['初步報告','初步報告通常在勘查後短期內提出,說明事故經過、初估損失、保單適用與待補文件。資料不完整時,應明確註記假設與限制,之後再以正式報告更新。'],
bribe:['公證人的誠信','公證人收受利益而影響報告內容,可能涉及刑事責任並失去執業資格。遇到不當利益,應拒絕並留下紀錄,向公司報備。'],
audit:['理賠稽核','保險公司與再保人會對大額或異常理賠做事後稽核,調閱報告、照片與計算底稿。底稿完整、推算有依據,是公證人最好的保護。'],
trust:['信譽是公證人的資產','保險公司與經紀人指派公證人時,最看重過往報告的品質與誠信紀錄。一次正直的選擇,常在多年後換來大案的指名。'],
typhoon:['巨災事件的理賠作業','颱風、地震等巨災會在短時間內產生大量案件。保險公司常啟動簡易理賠流程並分級處理:小額案件快速結案,大額案件安排資深公證人。'],
quake:['地震險','住宅地震基本保險承保建築物全損與推定全損;商業火險附加的地震險,常有較高的自負額或比例分擔。理賠前先確認適用條款與自負額。'],
angry:['理賠溝通','被保險人在事故後常處於焦慮狀態。清楚說明流程、所需文件與時程,比爭論金額更能降低衝突。'],
unsafe:['勘查人員的安全','火災或倒塌現場可能有結構坍塌、有毒氣體與帶電設備。進入前應確認結構安全、配戴防護裝備,必要時等技師評估。沒有任何證據值得用生命交換。'],
underins:['不足額保險與比例分擔','保險金額低於實際價值時,通常按「保險金額 ÷ 實際價值」的比例賠付。例:價值 5 億、保額 3 億,損失 1 億只賠 6,000 萬。定期依重置成本檢視保額可以避免。'],
depr:['實際現金價值與重置成本','實際現金價值(ACV)= 重置成本 − 折舊;重置成本(RCV)則按新品價格賠付,不扣折舊。保單採用哪一種基礎,直接決定老舊設備能賠多少。'],
bi:['營業中斷損失','營業中斷保險賠的是事故造成停工期間的毛利損失與持續費用,以合理復原期間為限。估算重點是停工前的營運基礎、復原時程,以及能否用替代產能減損。'],
fraud:['保險詐欺的警訊','同一聯絡人重複出現、事故前剛加保、單據格式一致、損失清單異常精確,都是常見的警訊。發現疑點應交由保險公司調查單位處理,並保全證據。'],
threat:['高爭議案件的自我保護','處理詐欺或高爭議案件時,避免單獨行動、不在私人場合談案。遇到威脅立即報警並通知公司,保留所有紀錄。'],
media:['災害現場的對外發言','重大災害時,理賠立場通常由保險公司統一對外說明。公證人宜只說明流程與時程,不評論賠不賠、賠多少。'],
trip:['海外勘查與當地協作','跨國保單在海外出事時,常由當地公證人先行勘查、保全現場,再由主辦公證人統籌報告。事先建立海外合作網絡,能大幅縮短反應時間。'],
pandemic:['遠端勘查','無法進入現場時,可用視訊、空拍與被保險人拍攝的照片遠端勘查,但要確認拍攝時間與地點,必要時事後補做實地查核。'],
newcontact:['報告的可驗證性','好的公證報告讓任何人都能從證據推回結論:照片有編號、數字有來源、推算有公式。審核者越挑剔,越需要這種結構。'],
pressure:['報告的中立','公證人雖受保險公司委託,報告仍應依證據與條款認定。刻意壓低或灌水,都可能讓公證人在訴訟中負擔責任。'],
lawsuit:['公證報告在訴訟中的角色','理賠爭議進入訴訟時,公證報告常是重要證據,公證人也可能被傳喚作證。報告裡的每個假設,都可能在交互詰問中被逐一檢視。'],
inflate:['損失清單的查核','庫存損失應以帳冊、進銷存紀錄、盤點表與發票交叉核對。誇大損失可能構成保險詐欺,協助的人也有法律責任。'],
credit:['底稿與紀錄','理賠分析的計算底稿、版本紀錄與往來郵件,是釐清責任與功勞的依據,也是日後稽核時的保護。'],
scapegoat:['理賠決策的書面紀錄','重要決策要留下書面紀錄:誰決定、依據什麼、何時通知。出問題時,紀錄是唯一能還原事實的東西。'],
merger:['產業整合','國際保險經紀與公證公司持續整併。併購後通常會整合系統與流程,專業能力越清楚可見的人,越容易在新組織中找到位置。'],
freeze:['承保循環','保費與案量會隨承保循環起伏:軟市場保費下降、競爭激烈;硬市場保費上升、承保條件變嚴。從業人員的收入也會跟著波動。'],
hunter:['理賠人才市場','具備大型商業險、工程險、海上險或再保經驗的理賠人才,在保險公司、經紀公司與公證公司之間都相當搶手。'],
cert:['專業證照','國際上常見的理賠相關資格,包括英國特許保險學會(CII)與特許理算師學會(CILA)。證照不等於能力,但能讓國際客戶更快信任你。'],
court:['專家證人','在訴訟中提供專業意見時,要清楚說明方法、依據與限制。法官要的是可理解、可驗證的推論,而不只是結論。'],
soft:['軟市場','承保能量充足時,保費下降、條件放寬,理賠與公證服務也跟著被壓價。低價常伴隨品質下降,這是長期客戶最在意的風險。'],
ai:['AI 在理賠的應用','AI 可以協助摘要條款、分類照片、比對單據、草擬報告,但條款解釋與損失認定仍需專業判斷。引用前一定要核對原始條款。'],
newbie:['經驗傳承','理賠的判斷力大多來自案例。讓新人跟著看現場、讀舊報告、參與計算,是培養公證人最有效的方式。'],
reins:['再保人的理賠參與','大額理賠常需取得再保人同意(理賠合作或理賠控制條款)。再保人會檢視報告的方法與計算,要求補充資料是常態。'],
speaker:['案例分享','公會與研討會的案例分享,能讓同業對理賠標準形成共識,也是建立專業名聲的重要管道。'],
olderr:['報告更正','發現已交付的報告有誤時,應主動通知委託方並出具更正說明。主動更正的成本,遠低於被稽核發現的代價。'],
startup:['設立公證公司','設立公證人公司須符合主管機關對資格、資本與專業人員的要求,並依規定繳存保證金或投保責任保險。創業前要先算清楚案源、人力與現金流。'],
broker:['保險經紀人','保險經紀人基於被保險人的利益洽訂保險,並在理賠時協助整理索賠文件、與保險公司協商。好的經紀人會在事故發生前,就把理賠需要的條件設計進保單。'],
expat:['區域理賠中心','跨國保險集團常在新加坡、香港等地設立區域中心,集中處理亞洲大型案件,讓專業人才與再保資源可以跨國調度。'],
petro:['聯合公證','超大型損失常由多家公證公司聯合處理,依專業分工(結構、設備、營業中斷),並設主公證人統籌報告與對外溝通。'],
lastcase:['長尾理賠','部分責任險或工程險案件,事故與求償可能相隔多年。完整保存舊案資料,是處理長尾理賠的關鍵。'],
earlyout:['退休與年金','提早退休要評估的不只是存款,還有醫療、長照與通膨。年金與醫療保險可以補足退休後的現金流與醫療風險。'],
b1:['經紀人的立場','經紀人代表客戶,也要與保險公司維持長期關係。最穩的做法,是用證據與條款支持索賠,並誠實告知客戶合理的預期。'],
b2:['STP 存貨流通保險','Stock Throughput 保單把貨物從原料採購、運輸、倉儲到成品出貨的全程整合在一張保單,減少運輸險與火險之間的缺口,常見於跨國製造業。'],
b3:['經紀服務的價值','客戶留下來的理由通常不是費率,而是出事時誰能把理賠處理好。防損訓練與理賠成果,是經紀人最有說服力的服務。'],
i1:['理賠準備金','保險公司要依估計的未決賠款提存準備金。刻意低估可以美化短期財報,但違反提存規範,主管機關檢查時會被要求補提並處分。'],
i_audit:['主管機關檢查','金融監理機關會定期檢查保險公司的準備金、理賠流程與內控。決策過程有沒有書面紀錄,常是責任歸屬的關鍵。'],
i2:['理賠效率指標','保險公司常用平均結案天數、未決案件數、客訴率衡量理賠品質。只追求速度而犧牲查核,可能讓詐欺或錯賠增加。'],
i3:['核保與理賠的回饋','理賠資料是核保最好的教材。把事故原因與損失型態回饋給核保,可以改善費率與承保條件。'],
r1:['再保理賠協商','再保理賠爭議常涉及條款解釋、損失分配與事件定義。數據與先例越完整,在國際市場越有話語權。'],
r2:['巨災模型','再保公司用巨災模型評估颱風、地震、洪水的潛在損失,決定承保容量與價格。大型巨災年之後,再保費率通常會上漲。'],
r3:['72 小時條款','巨災再保合約常約定:連續 72 小時內、同一原因造成的損失視為一次事件。事件怎麼切分,會影響自留額要扣幾次、再保人要賠多少。'],
o1:['事務所的現金流','公證行的收入取決於報告完成與委託方付款,帳期可能長達數月。準備足夠的營運資金,是小型事務所的基本功。'],
o2:['客戶集中度','獨家合約帶來穩定案源,也讓公司依賴單一客戶。客戶集中度太高,是小型專業事務所最大的營運風險之一。'],
o3:['合夥協議','合夥創業應事先約定股權、客戶歸屬、競業與退場機制。沒有書面約定時,拆夥往往兩敗俱傷。'],
o4:['地區據點','公證業務高度仰賴在地人脈與到場速度。開設據點前,先用駐點方式確認案源與需求。'],
x1:['火災鑑識','火災原因鑑定會分析燃燒痕跡、起火點、電氣熔痕與助燃劑殘留,是判斷意外、設計缺陷或人為縱火的關鍵。'],
x2:['專家證人的中立','專家證人對法院負責,而不是對委託人負責。意見要建立在可重現的方法上,並清楚說明不確定性。'],
x3:['損失計算方法','常見方法包括修復成本法、重置成本扣折舊、毛利損失法。選用哪一種,要看保單基礎與損失型態。'],
m1:['資深人才與報告品質','公證工作高度依賴資深人員的判斷。裁員或流失資深人員,常直接影響報告品質與客戶信任。'],
m2:['新興產業的保險需求','再生能源、半導體、物流等產業的保險需求快速成長。具備產業知識的理賠團隊,更容易開拓新客群。'],
m3:['關鍵人才風險','專業服務公司最大的資產是人。關鍵人才離職可能帶走客戶,企業常以職涯發展、獎酬與競業約定降低風險。'],
e1:['理賠實務教育','保險公證人須通過國家考試取得資格,執業後也要持續受訓。實務書籍與案例教材,是新人入行最重要的學習資源。'],
e2:['企業風險管理','企業風險管理要從辨識、評估、控制、移轉四個步驟著手。保險只是「移轉」的一種手段,不是全部。'],
e3:['國際再保職涯','國際再保公司重視英文、條款理解與數據分析能力。具體的案例與成果,比空泛的推薦更有說服力。'],
fire1:['故意行為除外','被保險人故意造成的損失屬於除外責任。懷疑人為縱火時,應交由鑑識單位分析,並配合警消調查。'],
fire2:['倉庫火災的多方求償','公共倉庫失火時,貨主可能分別向自己的保險公司、倉庫業者及其責任保險求償。釐清每批貨的所有權、保險與倉儲契約是第一步。'],
fire3:['住宅火險的動產舉證','住宅火險承保建築物與屋內動產,但動產需要舉證。平時拍照或保留購買紀錄,事故後能大幅加快理賠。'],
cargo1:['共同海損','船舶遇險時,為保全船貨所做的犧牲或支出,由船、貨各方按價值比例分攤。貨主通常要提供擔保(多由貨物保險人出具)才能提貨。'],
cargo2:['溫控貨物','冷鏈貨物理賠的關鍵在溫度紀錄。紀錄缺漏時,要結合原始數據、運輸時序與產品穩定性報告,判斷是否真的受損。'],
cargo3:['衝擊記錄器','高價設備運輸常裝設衝擊記錄器。數值超標不等於一定受損,要會同原廠開箱檢測,判斷受損範圍。'],
re1:['太陽能電廠保險','太陽能電廠常投保營運期財產險(含天災)與營業中斷險。颱風損失的爭議常在於:風速是否超過設計規範,還是施工或設計缺陷。'],
re2:['離岸風電施工險','離岸風電施工期多以營造綜合險承保,海纜損壞是最常見也最昂貴的損失之一。施工船租金高,修復速度直接影響損失金額。'],
semi1:['半導體的營業中斷','晶圓廠停機的損失常遠大於設備本身,包括報廢晶圓與營業中斷。計算時要考量產能利用率、在製品、訂單與替代產能。'],
semi2:['煙燻污染','無塵室或電子設備遭煙塵污染,不一定需要整機更換。專業清潔與檢測後,許多設備可以恢復使用,損失會大幅下降。'],
eng1:['第三人責任','施工造成鄰房損害,屬於營造綜合險的第三人意外責任範圍。施工前的鄰房現況鑑定,是釐清責任的重要依據。'],
eng2:['減損費用','為避免或減輕損害所支出的必要費用,保險人依保險法第 33 條負償還責任。及時減損,對被保險人與保險公司都有利。'],

big2_eng:['營造綜合險的承保範圍','營造綜合險通常分為工程本體(第一部分)與第三人責任(第二部分)。塌陷事故常同時觸發兩部分,責任與限額要分開計算。'],

big2_semi:['營業中斷的復原期','營業中斷損失的關鍵是「合理復原期」:設備修復、重新校正、良率爬升到事故前水準所需的時間,而不是實際停工多久。'],

fire5:['代位求償','保險公司賠付被保險人後,可以在賠付範圍內向應負責任的第三人求償(保險法第 53 條)。住戶的火險賠完後,保險公司可以再向有過失的餐廳求償。'],
fire6:['屋頂型光電的保險','屋頂型太陽能常由電廠業者向屋主租用屋頂。屋主的廠房火險與電廠的財產險各自承保,起火原因決定由哪一方負責。'],
cargo4:['海水損害與艙汗','硝酸銀測試可以判斷鏽蝕是否含氯化物(海水)。艙汗則是溫差造成的凝結。是否理賠要看保單條款,以及包裝與通風是否適當。'],

eng3:['颱風應變措施','營造險通常要求被保險人在颱風前採取合理的防護措施。塔吊沒有依規範解除迴轉鎖定,可能影響責任認定。'],

re4:['保固與保險的分界','光電板的性能衰退與製造瑕疵,通常屬於產品保固範圍,而不是財產保險的突發意外事故。'],

Object.assign(KNOW,{
 icl1:['和解的決策','面對訴訟,保險公司要比較和解金額與「敗訴機率 × 判賠金額 + 訴訟費用 + 時間成本」。和解不代表認輸,而是控制總理賠成本的工具。'],
 icl2:['理賠資料比對','保險業有理賠資料通報與比對機制,可以發現同一人在多家公司重複或異常申請。可疑不等於詐欺,拒賠必須有具體證據,否則可能被評議或判決要求給付。'],
 icl3:['大額理賠管理','許多保險公司設有大額理賠專責單位,搭配核賠權限表與定期案件檢討。目的是讓重大賠案有一致的處理標準,並及早掌握準備金。'],
 iuw1:['核保定價','核保定價不能只看去年有沒有賠款,還要看風險品質、同一地區的累積曝險、再保成本與市場行情。自負額是調整價格與風險分擔的常用工具。'],
 iuw2:['風險改善建議','核保人員常依查勘報告提出風險改善建議,並設定完成期限,作為承保或續保條件。這比單純提高費率更能真正降低損失。'],
 iuw3:['參數型保險','參數型保險依客觀指標(例如風速、地震強度、降雨量)是否達標來賠付,不需要查勘實際損失,賠得快。缺點是「基差風險」:有損失不一定賠,沒損失也可能賠。'],
 iri1:['自留額與再保成本','自留額越高,再保費用越低,但公司要自己承擔的損失越大。再保安排要在成本、資本與風險承受度之間取得平衡。'],
 iri2:['再保人的信用風險','再保是保險公司的保險,再保人付不出錢,風險就回到保險公司身上。主管機關通常對評等不足的再保人,要求分出公司提存準備或取得擔保。'],
 iri3:['累積風險管理','保險公司要監控同一地區、同一產業的累積保額,設定上限,避免一次巨災就衝擊資本。科學園區、工業區都是常見的累積熱點。'],
 bmar1:['存貨運輸保險的申報','存貨運輸保險(STP)常依存貨價值申報計算保費。申報低於實際價值,出險時可能按比例理賠。申報制可以讓保費跟著實際存貨調整。'],
 bmar2:['提貨時的毀損通知','依台灣海商法第 56 條,貨物受領後推定運送人已依載貨證券交清貨物。毀損不明顯時,應在提貨後三日內以書面通知運送人,才能保全求償權利。'],
 bmar3:['內陸運輸損防','高價電子產品在內陸運輸最容易失竊。常見損防措施包括 GPS 追蹤、雙駕駛、只停靠指定地點、封條核對與運輸商資格審查。良好的損防紀錄也能爭取較好的保險條件。'],
 bpro1:['帳面價值與重置成本','財報上的帳面價值是扣除折舊後的會計數字,不等於重建成本。財產保險若以重置成本為理賠基礎,保額也應以重置成本估算,否則可能不足額。'],
 bpro2:['預付賠款','大型理賠的最終理算可能需要數月甚至數年。在責任大致確定後,被保險人可以依公證人的初步評估,向保險公司申請預付部分賠款,緩解現金壓力。'],
 bpro3:['索賠準備費用','部分財產保險附有「索賠準備費用」條款,負擔被保險人為準備索賠而聘請會計師、工程師等專家的合理費用。大型營業中斷理賠特別需要這類專家。'],
 benr1:['海事保證鑑定人(MWS)','離岸風電等海事工程保險,常要求重大海上作業(例如吊裝、拖航)事先取得海事保證鑑定人核准。未依約取得核准,可能影響理賠。'],
 benr2:['賠償期間與良率爬坡','營業中斷的賠償期間,通常是到營業恢復至事故前水準為止,並以約定的最長期間為上限。半導體廠復機後的良率爬坡期,往往也在賠償範圍內。'],
 benr3:['業主統保計畫','大型工程可由業主統一投保(OCIP),涵蓋所有承包商。好處是保障一致、避免缺口與重複投保;缺點是業主要負責管理整個保險計畫。'],
 rtr1:['再保佣金與滑動佣金','比例再保中,再保人付給分出公司再保佣金,補貼其招攬與管理成本。滑動佣金讓佣金率隨損失率變動,損失率越低佣金越高,讓雙方利益一致。'],
 rtr2:['轉再保','再保公司也會把自己承擔的風險再轉出去,稱為轉再保。巨災年多份合約同時出險時,轉再保是再保公司穩定財務的重要工具。'],
 rtr3:['新興市場的再保','新興市場常有歷史資料不足、費率偏低、法規要求優先分給本地再保公司等特性。進入新市場需要時間建立資料與關係。'],
 rfac1:['臨分的核保資訊','臨時再保逐件評估單一風險,核保資訊的新舊與完整度非常重要。過時的查勘報告可能漏掉擴建、製程改變等重大風險變化。'],
 rfac2:['最大可能損失(PML)','PML 是在防護設施部分失效的情況下,單一事故可能造成的最大損失。防火牆、間距與消防設備都會影響 PML,也直接影響再保人願意承接的比例。'],
 rfac3:['臨分的條件設定','領頭再保人設定的自負額、分項限額與營業中斷等待期,決定了整件臨分的風險輪廓。條件專業合理,其他再保人才願意跟進。'],
 rcat1:['回歸期與模型不確定性','「百年一遇」指每年約 1% 的發生機率,不代表一百年只會發生一次。巨災模型受曝險資料、建物易損性等假設影響很大,要定期用實際損失檢驗。'],
 rcat2:['曝險資料品質','巨災模型的準確度取決於曝險資料:地址、建築結構、樓層、建造年份。資料缺漏越多,模型結果的不確定性越大。'],
 rcat3:['巨災債券','巨災債券把巨災風險轉給資本市場的投資人。觸發方式可分為賠償型(依實際損失)、參數型(依物理指標)與指數型(依產業損失指數),各有透明度與基差風險的取捨。'],
 ers1:['研究資料與個資','使用含個人資料的研究資料,應去識別化並簽訂資料使用協議,依個人資料保護法與研究倫理審查辦理。資料外洩可能要負通報與賠償責任。'],
 ers2:['學術獨立','產學合作要在合約中事先約定資料使用與發表權。研究結論可能不討喜,但學術獨立正是研究的價值所在。'],
 ers3:['巨災風險研究','巨災風險研究常需要結合氣象、地質、工程與保險。整合型研究能讓政策設計更貼近實際,例如住宅地震保險的保額與費率檢討。'],
 etc1:['案例教學與保密','用真實理賠案例教學很有效,但應去識別化並改寫可辨識的細節。公證人與理賠人員對經手案件負有保密義務。'],
 etc2:['考試的利益迴避','擔任證照考試出題或閱卷委員期間,應避免參與補習或任何可能洩題的活動。利益衝突即使沒有實際洩題,也會損害考試的公信力。'],
 etc3:['保險業的在職訓練','保險從業人員依規定需定期完成在職教育訓練。好的訓練課程結合案例、條款與法規更新,是業界持續進步的基礎。'],
 epl1:['住宅地震基本保險','台灣的住宅地震基本保險在全損時理賠,現行保額最高 150 萬元,另有臨時住宿費用。保額要在保障缺口與保費負擔之間取得平衡。'],
 epl2:['強制責任保險的設計','強制責任保險的最低保額太低,受害人得不到足夠補償;太高則增加業者負擔。依場所規模、活動型態分級,是常見的設計方式。'],
 epl3:['金融消費評議','金融消費評議中心處理消費者與金融機構的爭議。評議委員必須中立,遇到利益衝突要迴避。'],
 cbcp1:['單點故障','營運持續規劃要找出「單點故障」:一旦失效就會讓整個營運停擺的環節,例如共用的變電所、唯一的供應商、單一的資料中心。'],
 cbcp2:['供應鏈地圖','很多企業只掌握一階供應商。建立涵蓋二階、三階供應商的供應鏈地圖,才能發現地理集中等隱藏風險。或有營業中斷保險通常也只承保列名的供應商。'],
 cbcp3:['ISO 22301','ISO 22301 是營運持續管理系統的國際標準,從營運衝擊分析、風險評估、應變計畫到演練與改善,建立完整的管理循環。'],
 cerm1:['風險胃納','風險胃納是公司願意為達成目標而承擔的風險程度。好的風險胃納聲明結合量化指標(例如單一事件損失上限)與質化描述,讓董事會能具體討論。'],
 cerm2:['三道防線','第一道防線是業務單位自行管理風險,第二道是風險管理與法遵部門監督,第三道是內部稽核獨立查核。三者分工清楚,內控才能有效。'],
 cerm3:['董事會的風險治理','台灣的上市櫃公司有風險管理實務守則可參考,鼓勵董事會設立風險管理委員會,定期檢視關鍵風險。外部顧問可以提供獨立觀點。'],
 cesg1:['實體風險評估','氣候變遷的實體風險包括淹水、颱風、高溫與缺水。評估新廠址時,應參考政府的淹水潛勢圖與氣候情境,而不只是歷史紀錄。'],
 cesg2:['漂綠風險','永續報告誇大或選擇性揭露減碳成果,可能被指控漂綠,引發聲譽與法律風險。依實際數據揭露,並提出具體改善路徑,反而更能取得信任。'],
 cesg3:['轉型風險','轉型風險是社會邁向低碳過程中帶來的財務衝擊,例如碳費、法規、技術汰換與客戶要求。供應鏈企業常因國際品牌的減碳要求而首當其衝。'],
 omar1:['海上運送的一年時效','依台灣海商法第 56 條,貨物毀損滅失自受領或應受領之日起一年內未起訴,運送人解除責任。保險公司代位追償時要特別注意時效,必要時請求延長或先行起訴。'],
 omar2:['重件吊掛的責任','重件吊掛應有吊掛計畫、合格的吊具與檢驗紀錄。事故發生時,這些紀錄是釐清貨主、船方與裝卸公司責任的關鍵。'],
 omar3:['船東互保協會(P&I)','船東互保協會承保船東對第三人的責任,例如貨損、油污、船員傷亡與碰撞。協會在各港口指定代理,事故發生時第一時間到場處理。'],
 ocat1:['巨災時的人力與品質','巨災後案件暴增,公證公司常需招募臨時人員。集中訓練、標準化表單與報告抽查,是維持品質的關鍵。'],
 ocat2:['擬制全損的認定','住宅地震基本保險只在全損時理賠。全損除了建物倒塌,也包括依規定經主管機關或專業技師判定須拆除重建等情形。認定必須依據客觀鑑定,不能因同情而從寬。'],
 ocat3:['巨災應變的預先部署','在颱風季前預先安排人力、設備與合作網絡,能讓查勘在災後第一時間展開,及早保全證據、協助減損,也能縮短整體理賠時間。'],
 ovol1:['量與質的平衡','量販型理賠案件要靠標準作業流程與抽審機制維持品質。處理速度與報告品質,是保險公司評選合作公證公司的兩大指標。'],
 ovol2:['車損估價','車損估價的核心是合理的工時與零件價格。建立行情資料庫比對,能有效發現灌水的估價單。'],
 ovol3:['服務水準協議(SLA)','保險公司與合作公證公司常約定服務水準,例如查勘時限、報告時限與錯誤率,未達標準可能被扣款。偏遠地區通常需要另行約定。'],
 bsme1:['中小企業的保障缺口','中小企業常只買最低限度的保險。經紀人應說明最低保額與實際可能損失的差距,協助客戶在預算內取得合適的保障。'],
 bsme2:['網路投保','主管機關開放部分險種可以網路投保,但要做好身分驗證與完整的資訊揭露。線上管道能服務大量中小客戶,也要保留專業諮詢。'],
 bsme3:['經紀人的分支機構','經紀公司設立分支機構要依規定辦理,並配置合格的專業人員。在地服務能拉近與中小企業客戶的距離。'],
 bmnc1:['全球保險計畫','跨國企業的保險計畫常以「主控保單加當地保單」設計:當地保單符合當地法規,主控保單補足條件與限額的差異。很多國家不允許由境外保險公司直接承保境內風險。'],
 bmnc2:['理賠幣別與匯率','跨國理賠常遇到損失幣別與保單幣別不同。保單應約定換算的匯率日期,例如損失發生日或理賠給付日,避免爭議。'],
 bmnc3:['國際經紀網路','獨立經紀公司可以加入國際經紀網路,和各國的成員合作服務跨國客戶。網路通常要求成員遵守一致的服務標準。'],
 bspe1:['資安事件應變','發生資安事件時,應先通知保險公司並使用保單指定的應變團隊(鑑識、法律、公關)。自行處理可能讓部分費用不在理賠範圍。贖金是否理賠,依條款與法規而定。'],
 bspe2:['索賠基礎制','董監事責任險、專業責任險多採「索賠基礎制」:在保險期間內被提出求償並通知保險公司,保單才會適用。知道可能被求償時,應在保單期間內儘早通知。'],
 bspe3:['專業責任保險','專業責任保險承保專業人士因執業疏失,造成他人損失的賠償責任。團體方案能降低保費,但條款要符合各行業的執業風險與法規。'],
 tb2b1:['詐欺偵測的界線','詐欺偵測系統只能標示可疑案件,不能作為拒賠的唯一依據。人工複核與可解釋的判斷依據,能降低誤判對正常客戶的傷害。'],
 tb2b2:['資料治理','保險科技合作要在合約中約定資料所有權、使用範圍與保存期限。使用個人資料訓練模型,要符合個人資料保護法的特定目的與去識別化要求。'],
 tb2b3:['跨境資料傳輸','各國對個人資料跨境傳輸有不同規定。保險科技要跨市場經營,必須逐一確認當地的個資與資安規範。'],
 tai1:['訓練資料的代表性','AI 模型的偏差常來自訓練資料分布不均。某類樣本太少時,模型對這類案件的判斷就容易出錯,需要補足資料或加上人工複核。'],
 tai2:['深偽理賠詐欺','生成式 AI 讓偽造照片變得容易。常見對策包括影像真偽檢測、檢查檔案的拍攝資訊,以及要求在 App 內即時拍攝。'],
 tai3:['金融業運用 AI','台灣金管會已發布金融業運用人工智慧的指引,強調公平、透明、可解釋與人工監督。使用 AI 理賠的保險公司,要能說明模型如何做出決定。'],
 temb1:['嵌入式保險與消費者保護','嵌入式保險在消費流程中附上保險,方便但容易讓消費者「不知不覺」投保。預設勾選常被認為不當,清楚揭露與主動選擇才是好做法。'],
 temb2:['招攬資格','依台灣法規,保險只能由保險業、保險代理人、保險經紀人及其登錄的業務員招攬。平台若沒有資格,只能導流,不能自行推銷。'],
 temb3:['自動理賠的資料源','參數型自動理賠的關鍵是可信的資料源與清楚的觸發條件。資料錯誤會直接造成錯賠或漏賠,條款要約定資料來源與更正機制。']
});

/* ===================== 第十版:條款解讀題 ===================== */
const CLW={
 okW:{t:'對方沒有深究,這次過關了。但你心裡知道,這個解讀其實站不太住。',fx:{rep:1}},
 ngW:{t:'你的解讀被對方逐條駁回,報告得重寫。',fx:{rep:-3,pro:2}},
 ngR:{t:'你的解讀站得住腳,但對方不接受,案件拖成長期爭議。',fx:{hp:-2,pro:1}}
};
const CL=[
/* ---- 公證人:通用 ---- */
{id:'cl_notice',n:'條款解讀:第九天才通知',adj:1,t:'工廠火災後,被保險人第九天才通知保險公司。保險公司想以「逾期通知」為由拒賠。',cl:{x:'被保險人遇有保險事故,應於知悉後五日內通知保險人。被保險人未於期限內通知者,對於保險人因此所受之損失,應負賠償責任。',o:['逾期通知,保險人可以全部拒賠','保險人仍應理賠,但可就延遲通知造成的損失主張扣減','只要超過五天,保險契約自動失效'],a:1,why:'條款(與台灣保險法第 58、63 條)規定的是「賠償因延遲而增加的損失」,不是喪失理賠權利。保險人要證明延遲通知造成了哪些額外損失,例如證據滅失或損害擴大。',ok:{t:'你在報告中區分了「延遲造成的擴大損失」與「原本的損失」。保險公司接受了你的分析。',fx:{pro:3,rep:3}}}},
{id:'cl_salvage',n:'條款解讀:搶救費用',adj:1,t:'倉庫起火時,被保險人租了吊車搶救貨物,花了 100 萬。最後貨物損失 950 萬,保險金額是 1,000 萬。',cl:{x:'被保險人為避免或減輕損害之必要行為所生之費用,由保險人償還。其償還數額與賠償金額合計雖超過保險標的價值,仍應償還。',o:['最多只賠到保險金額 1,000 萬','損失 950 萬加搶救費用 100 萬,共 1,050 萬都應償還','搶救費用是被保險人自願支出,不賠'],a:1,why:'這是台灣保險法第 33 條的精神:鼓勵被保險人減損,必要的減損費用即使加上賠款超過保額,仍應償還。不過若有不足額保險,減損費用也可能按比例計算。',ok:{t:'你把吊車費用的必要性寫得很清楚,保險公司全額認列。',fx:{pro:3,rep:3}}}},
{id:'cl_contrib',n:'條款解讀:兩張保單',adj:1,t:'一間倉庫同時向兩家保險公司投保火險,保額分別是 600 萬與 400 萬,倉庫實際價值 1,000 萬。這次損失 200 萬。',cl:{x:'同一保險標的另有其他保險契約承保同一危險者,本公司僅按本契約保險金額對全部保險金額之比例,負賠償責任。',o:['兩家各賠 200 萬,被保險人拿 400 萬','先出險通知的那家全賠','保額 600 萬的那家賠 120 萬,另一家賠 80 萬'],a:2,why:'損害填補原則下,被保險人不能因為多張保單而獲利。依比例分攤,600 萬那張負擔 600/1000,也就是 120 萬;另一張負擔 80 萬。',ok:{t:'你在報告中列出分攤表,兩家保險公司都沒有意見。',fx:{pro:3,rep:2}}}},
{id:'cl_quakefire',n:'條款解讀:地震引起的火災',adj:1,t:'地震後,工廠的瓦斯管線破裂起火,燒掉一整條產線。這張火險沒有加保地震險。',cl:{x:'本保險對於地震所致之損失,不負賠償責任。但因地震引起之火災所致之損失,本公司仍負賠償責任。',o:['地震是原因,全部不賠','火災造成的損失要賠,地震直接震損的部分不賠','保險公司可以自由選擇賠或不賠'],a:1,why:'條款明確區分地震「直接」造成的損失與地震「引起的火災」。實務上要把震損與火損分開認定,才能正確理賠。',ok:{t:'你逐台判定哪些設備是震損、哪些是火損,保險公司依你的分類理賠。',fx:{pro:4,rep:2}}}},
/* ---- 公證人:依專長 ---- */
{id:'cl_avg',n:'條款解讀:不足額保險',adj:1,spec:['fire'],t:'一座倉庫實際價值 1,000 萬,只投保 600 萬。這次火災損失 300 萬。',cl:{x:'保險金額不及保險標的物之價值者,除契約另有訂定外,本公司之負擔,以保險金額對於保險標的物之價值比例定之。',o:['賠 300 萬,損失在保額內就全賠','賠 180 萬','賠 600 萬,也就是保險金額'],a:1,why:'這是比例分攤原則(台灣保險法第 77 條)。保額只有價值的六成,就按六成理賠:300 萬 × 600/1,000 = 180 萬。',ok:{t:'你附上比例分攤的計算底稿,被保險人雖然失望,但也看懂了。',fx:{pro:3,rep:3}}}},
{id:'cl_debris',n:'條款解讀:清除費用',adj:1,spec:['fire'],t:'火災後清運殘骸花了 80 萬。財產損失本身是 500 萬,保額足夠。',cl:{x:'本公司對於清除受損保險標的物殘餘物所生之必要費用,負賠償責任,但以損失金額之百分之十為限。',o:['清除費用全額 80 萬','清除費用賠 50 萬','清除費用不在承保範圍'],a:1,why:'清除費用的上限是損失金額的 10%:500 萬 × 10% = 50 萬。超過的 30 萬由被保險人自行負擔。不同保單的上限與計算方式不一樣,一定要看條款。',ok:{t:'你把清除費用的上限講清楚,被保險人提早有心理準備。',fx:{pro:3,rep:2}}}},
{id:'cl_iccc',n:'條款解讀:C 條款下的雨淋',adj:1,spec:['cargo'],t:'一批紙箱包裝的貨物在碼頭等候裝船時被大雨淋濕。貨物險是協會貨物條款(C)。',cl:{x:'協會貨物條款(C):承保火災或爆炸、船舶擱淺觸礁沉沒或傾覆、陸上運輸工具傾覆或出軌、碰撞、在避難港卸貨、共同海損犧牲、投棄所致之毀損滅失。',o:['雨淋不在列舉的危險內,不賠','運送途中的損失都賠','只要不是被保險人故意,都賠'],a:0,why:'(C) 條款是列舉式,只賠列出的重大事故。雨淋、海水浸濕、竊盜都不在 (C) 條款內。(A) 條款才是概括承保。',ok:{t:'你說明了 (A)、(C) 條款的差別,貨主隔年改買 (A) 條款。',fx:{pro:3,rep:2}}}},
{id:'cl_transit',n:'條款解讀:港區倉庫放太久',adj:1,spec:['cargo'],t:'貨物卸船後,在港區倉庫放了 75 天,才運往工廠,途中車禍受損。保單沒有延長條款。',cl:{x:'本保險效力至下列情形之一最先發生時終止:貨物交付至目的地倉庫;或貨物自海輪卸載完畢後屆滿六十日。',o:['仍在運輸途中,應該理賠','卸船已超過 60 天,保險效力已終止,不賠','只要最後送到工廠,中間多久都沒關係'],a:1,why:'協會貨物條款的運送條款規定,卸載完畢後滿 60 天保險即終止,即使貨物還沒送到最終目的地。需要更長的存放時間,要事先加保延長。',ok:{t:'你指出時間點的問題,也建議貨主以後事先申請延長。',fx:{pro:3,rep:2}}}},
{id:'cl_defect',n:'條款解讀:設計錯誤',adj:1,spec:['eng'],t:'擋土牆因設計錯誤倒塌,壓壞了旁邊已經完工的機電室。',cl:{x:'本保險不承保因設計錯誤所致該部分工程本身之修復費用;但因此所致其他承保工程之毀損滅失,仍予賠償。',o:['設計錯誤,全部不賠','擋土牆本身不賠,被壓壞的機電室要賠','全部都賠,因為是意外事故'],a:1,why:'這是工程險常見的瑕疵除外設計:排除「有瑕疵的部分本身」,但瑕疵造成「其他部分」的意外損壞仍在承保範圍。',ok:{t:'你把擋土牆與機電室的損失分開計算,保險公司依此理賠。',fx:{pro:4,rep:2}}}},
{id:'cl_maint',n:'條款解讀:保固期間的漏水',adj:1,spec:['eng'],t:'大樓完工後第八個月,管線因施工時焊接不良破裂漏水。工程險附有保固期間延長條款。',cl:{x:'保固期間延長條款:承保保固期間內,因施工期間之原因所致承保工程之毀損滅失,以及承包商為履行保固義務所致之毀損滅失。',o:['施工期間的原因造成,在保固期間內發生,應理賠','工程已完工,工程險不再承保','只賠業主自己裝潢造成的損失'],a:0,why:'擴大保固條款承保「原因發生在施工期間、損失發生在保固期間」的情形。業主或第三人在完工後造成的損失,則不在範圍內。',ok:{t:'你調出焊接檢驗紀錄,證明原因在施工期間,保險公司同意理賠。',fx:{pro:4,rep:2}}}},
{id:'cl_winded',n:'條款解讀:風災自負額',adj:1,spec:['re'],t:'颱風吹壞一座太陽能電廠的部分設備,損失 300 萬。',cl:{x:'颱風、暴風所致之損失,每一事故自負額為損失金額之百分之十,最低新台幣五十萬元。',o:['自負額 30 萬,賠 270 萬','自負額 50 萬,賠 250 萬','自負額 300 萬的 10% 和 50 萬取高者,賠 300 萬'],a:1,why:'損失的 10% 是 30 萬,低於最低自負額 50 萬,所以適用 50 萬。賠款是 300 萬 − 50 萬 = 250 萬。',ok:{t:'你的計算清楚明瞭,電廠業主馬上就懂了。',fx:{pro:3,rep:2}}}},
{id:'cl_saving',n:'條款解讀:停工省下的電費',adj:1,spec:['semi','fire'],t:'工廠停工四個月,被保險人申請的營業中斷損失包含這段期間的全部固定成本,包括電費。但停工期間電費其實少了八成。',cl:{x:'營業中斷損失以毛利減少額為準,並應扣除因營業中斷而節省之費用。',o:['固定成本照列,電費不用扣','停工期間節省的電費應該扣除','營業中斷只賠員工薪水'],a:1,why:'營業中斷保險賠的是「如果沒出事應該賺到的毛利」,停工期間實際省下的費用要扣除,否則被保險人會因事故而獲利。',ok:{t:'你逐項檢查費用,扣除了節省的電費與耗材,計算被雙方接受。',fx:{pro:4,rep:2}}}},
{id:'cl_ip',n:'條款解讀:賠償期間 12 個月',adj:1,spec:['semi'],t:'晶圓廠事故後,完全恢復到事故前的產能需要 15 個月。保單的最長賠償期間是 12 個月。',cl:{x:'賠償期間:自事故發生日起,至營業恢復至事故前水準之日止,但最長不超過十二個月。',o:['賠 15 個月,因為實際就要這麼久','只賠 12 個月的損失,超過部分由被保險人負擔','只賠機台修好前的期間'],a:1,why:'賠償期間是「到營業恢復為止」,但以約定的最長期間為上限。15 個月的復原期只能賠 12 個月。這也是為什麼投保時要依實際復原時間設定賠償期間。',ok:{t:'你在報告中提醒,這個缺口應該在續約時補上。',fx:{pro:3,rep:3}}}},
{id:'cl_emp',n:'條款解讀:員工受傷',adj:1,spec:['motor'],t:'賣場員工在搬貨時被倒下的貨架砸傷,家屬要求用賣場的公共意外責任險理賠。',cl:{x:'本保險對於被保險人之受僱人於執行職務時所受之傷害,不負賠償責任。',o:['在賣場內受傷,公共意外責任險要賠','員工執行職務受傷不在公共意外責任險範圍,應由勞保與雇主責任險處理','只要賣場有過失就要賠'],a:1,why:'公共意外責任險保障的是第三人(例如顧客)。員工在工作中受傷,屬於職業災害,由勞工保險、職業災害保險與雇主責任險處理。',ok:{t:'你協助家屬轉向正確的理賠管道,家屬很感謝。',fx:{pro:3,rep:3}}}},
/* ---- 保險公司 ---- */
{id:'cl_misrep',n:'條款解讀:三年前的隱瞞',route:['ins'],t:'保單生效三年後倉庫淹水,你才發現投保時客戶沒有告知倉庫曾經淹過水。',cl:{x:'要保人有故意隱匿或過失遺漏,足以變更或減少保險人對於危險之估計者,保險人得解除契約。但契約訂立後經過二年,即有可以解除之原因,亦不得解除契約。',o:['可以解除契約並拒賠','契約已超過兩年,不能解除契約,應依約理賠','可以解除契約,但要退還保費'],a:1,why:'台灣保險法第 64 條設有除斥期間:保險人知道後一個月內不行使,或契約訂立已超過兩年,就不能再解除契約。這是為了讓保險關係不會永遠處在不確定的狀態。',ok:{t:'你依法建議理賠,避免了一場會輸的評議案。',fx:{pro:3,rep:3}}}},
{id:'cl_subro',n:'條款解讀:代位求償的上限',route:['ins'],t:'你賠了被保險人 800 萬。調查發現隔壁工廠要負全責,法院判定總損害是 1,000 萬。',cl:{x:'保險人得於給付賠償金額後,代位行使被保險人對於第三人之請求權。但其所請求之數額,以不逾賠償金額為限。',o:['保險公司可以向對方求償 1,000 萬','保險公司最多求償 800 萬,剩下的 200 萬是被保險人自己的權利','保險公司不能代位求償'],a:1,why:'台灣保險法第 53 條:代位求償以已賠付的金額為上限。保險沒賠到的部分(例如自負額、不足額),被保險人仍可自行向加害人求償。',ok:{t:'你和被保險人協調一起求償,雙方都拿回了應得的部分。',fx:{pro:3,net:2}}}},
{id:'cl_family',n:'條款解讀:兒子引起的火災',route:['ins'],t:'被保險人的兒子在家裡抽菸,不小心引起火災。理賠後,主管問能不能向兒子代位求償。',cl:{x:'第三人為被保險人之家屬或受僱人時,保險人無代位請求權;但損失係由其故意所致者,不在此限。',o:['可以,兒子是第三人','不行,家屬過失造成的損失不能代位求償','只能求償一半'],a:1,why:'台灣保險法第 53 條第 2 項:家屬或受僱人過失造成的損失,保險人不能代位。否則保險公司賠了錢再向家人要回來,保險就失去意義。故意造成的除外。',ok:{t:'你向主管說明法條,公司沒有做出會引起爭議的求償。',fx:{pro:3,rep:2}}}},
{id:'cl_delay',n:'條款解讀:拖延給付',route:['ins'],t:'被保險人交齊文件已經兩個月,賠款因為內部流程卡住還沒付。被保險人要求加付利息。',cl:{x:'保險人應於被保險人交齊證明文件後,於約定期限內給付賠償金額;無約定期限者,應於接到通知後十五日內給付。保險人因可歸責於自己之事由致未在期限內給付者,應給付遲延利息年利一分。',o:['不用付利息,賠款本身就已經很多了','應依年利率 10% 加付遲延利息','只要最後有付就好'],a:1,why:'台灣保險法第 34 條:可歸責於保險人的遲延,要付年利一分(10%)的遲延利息。這是促使保險公司及時理賠的設計。',ok:{t:'你主動計算遲延利息一併給付,也推動內部改善流程。',fx:{pro:2,rep:4}}}},
/* ---- 經紀人 ---- */
{id:'cl_ipbi',n:'條款解讀:機台修好了,營收還沒回來',route:['brk','bro'],t:'客戶工廠的設備九個月就修好了,但訂單回流、營收回到事故前水準,又花了五個月。保險公司只想賠九個月。',cl:{x:'賠償期間:自事故發生日起,至被保險人營業結果恢復至事故前水準之期間,但最長以十八個月為限。',o:['只賠九個月,設備修好就結束','賠到營業結果恢復,共十四個月','賠滿十八個月'],a:1,why:'賠償期間看的是「營業結果恢復」,不是「設備修好」。14 個月在 18 個月上限內,所以都可以賠。',ok:{t:'你拿出月營收資料證明恢復期,保險公司同意賠到第十四個月。',fx:{pro:4,rep:3,net:1}}}},
{id:'cl_occur',n:'條款解讀:一次還是三次',route:['brk','bro'],t:'一個颱風在 30 小時內造成客戶三個廠區各損失 80 萬。保單每一事故自負額 100 萬。',cl:{x:'每一事故自負額新台幣一百萬元。同一颱風於連續七十二小時內所致之損失,視為一次事故。',o:['三次事故,每次都在自負額內,不賠','視為一次事故,共 240 萬,扣自負額 100 萬賠 140 萬','只能算損失最大的那個廠區'],a:1,why:'事故定義決定扣幾次自負額。72 小時條款把同一颱風的損失合併成一次事故,這對有多個廠區的客戶特別重要。',ok:{t:'你引用事故定義條款,幫客戶多拿到 140 萬。',fx:{pro:3,rep:3,net:2}}}},
{id:'cl_ai',n:'條款解讀:附加被保險人',route:['brk','bro'],t:'美國買方被列為客戶產品責任險的附加被保險人。買方因為自己倉庫的地板濕滑,被訪客告了。',cl:{x:'附加被保險人之保障,以其因被保險人之產品或營業行為所生之責任為限。',o:['買方是附加被保險人,什麼責任都可以賠','這件事與客戶的產品無關,不在保障範圍','只要在美國發生就可以賠'],a:1,why:'附加被保險人只在「與被保險人的產品或業務有關」的範圍內受保障。買方自己的場所責任,應由買方自己的保單處理。',ok:{t:'你向買方說明保障範圍,也建議客戶在合約中寫清楚。',fx:{pro:3,net:2}}}},
{id:'cl_claimsmade',n:'條款解讀:索賠基礎制',route:['brk','bro'],t:'客戶的董監事責任險在去年底到期,今年沒有續保。今年三月,投資人針對前年的決策提告。',cl:{x:'本保險承保被保險人於保險期間內首次受到賠償請求,並於保險期間內通知本公司之損失。',o:['決策發生在前年,當時有保險,應該理賠','求償在保險期間結束後才提出,不在保障範圍','只要有繳過保費都能理賠'],a:1,why:'索賠基礎制看的是「求償何時提出」,不是「行為何時發生」。保單到期後才提出的求償不保,除非有延長報告期間條款。這也是董監事責任險要持續續保的原因。',ok:{t:'你建議客戶以後要持續續保,並考慮購買延長報告期間。',fx:{pro:3,rep:2}}}},
/* ---- 再保 ---- */
{id:'cl_hours',n:'條款解讀:72 小時的起算',route:['rei'],t:'颱風登陸後第 10 小時與第 90 小時,各造成分出公司一筆大損失。',cl:{x:'因同一巨災於連續七十二小時內所致之損失,視為一次事故。七十二小時之起算時點由分出公司選擇。',o:['同一個颱風,一定算一次事故','兩筆損失相隔 80 小時,無法放進同一個 72 小時,至少是兩次事故','由再保人決定怎麼算'],a:1,why:'分出公司可以選擇起算時點,但兩筆損失相隔 80 小時,任何 72 小時的窗口都無法同時涵蓋,所以至少是兩次事故,各自適用自留額。',ok:{t:'你的分析讓雙方很快達成共識。',fx:{pro:4,rep:2}}}},
{id:'cl_xl',n:'條款解讀:超額賠款再保',route:['rei'],t:'分出公司的一場火災,總損失 3.5 億。',cl:{x:'超額賠款再保:每一事故分出公司自留新台幣一億元,再保人負擔超過一億元以上之損失,最高四億元。',o:['再保人賠 3.5 億','再保人賠 2.5 億','再保人賠 4 億'],a:1,why:'超額賠款再保只負擔自留額以上的部分:3.5 億 − 1 億 = 2.5 億,在 4 億的限額內。',ok:{t:'攤賠計算一次就對,分出公司很快收到款項。',fx:{pro:3,net:2}}}},
{id:'cl_follow',n:'條款解讀:通融給付',route:['rei'],t:'分出公司為了維持客戶關係,對一件不在承保範圍的損失做了「通融給付」,現在要求你分攤。',cl:{x:'再保人應遵從分出公司於原保單條款範圍內,所作之理賠決定。',o:['再保人應遵從分出公司的所有決定','通融給付不在原保單條款範圍內,再保人沒有義務分攤','再保人分攤一半'],a:1,why:'遵從理賠條款(follow the settlements)只適用於原保單條款範圍內、合理善意的理賠。超出條款的通融給付,除非事先取得再保人同意,否則再保人不必分攤。',ok:{t:'你婉轉說明立場,分出公司也接受了。',fx:{pro:3,rep:2}}}},
{id:'cl_coop',n:'條款解讀:沒經同意就和解',route:['rei'],t:'分出公司沒有通知你,就和被保險人以 2 億和解了一件大案。',cl:{x:'分出公司知悉可能超過新台幣五百萬元之賠案時,應立即通知再保人,且非經再保人同意,不得和解。本條為再保人責任之先決條件。',o:['和解金額合理,再保人就應分攤','違反先決條件,再保人可以主張不負責任','只要事後補通知就好'],a:1,why:'理賠合作條款若明定為「先決條件」,分出公司違反時,再保人可以主張不負責任。若只是一般約定,通常只能就違約造成的損失主張扣減。條文的用字非常關鍵。',ok:{t:'你引用條款與對方協商,最後依實際影響部分分攤。',fx:{pro:4,net:1}}}},
/* ---- 學界 ---- */
{id:'cl_interest',n:'條款解讀:課堂上的保險利益',route:['edu'],t:'學生問:「賣方以 FOB 條件出口,貨物裝上船後在海上受損。賣方自己買的貨物險能不能賠?」',cl:{x:'要保人或被保險人,對於保險標的物無保險利益者,保險契約失其效力。(FOB:貨物裝上船時,風險由賣方移轉給買方。)',o:['可以,賣方有投保','裝船後風險已移轉給買方,賣方對海上的損失沒有保險利益,不能賠','買賣雙方各賠一半'],a:1,why:'保險利益是保險契約的基礎(台灣保險法第 17 條)。FOB 條件下,裝船後的風險由買方承擔,應由買方投保海上運輸險。',ok:{t:'學生舉一反三,開始用貿易條件判斷誰該投保。',fx:{pro:2,rep:3}}}},
{id:'cl_indem',n:'條款解讀:舊機器燒掉了',route:['edu'],t:'期中考題:一台十年的舊機器燒毀,實際價值 100 萬,買新的要 300 萬。保單以實際現金價值為理賠基礎。',cl:{x:'本保險以保險標的物於損失發生時之實際現金價值(重置成本扣除折舊)為理賠基礎。',o:['賠 300 萬,讓被保險人買新的','賠 100 萬','賠 200 萬'],a:1,why:'實際現金價值 = 重置成本 − 折舊,所以賠 100 萬。若要以新換舊,要投保重置成本基礎的保單。這是損害填補原則的基本應用。',ok:{t:'大部分學生答對了,你把這題收進題庫。',fx:{pro:2,rep:2}}}},
/* ---- 顧問與新創 ---- */
{id:'cl_cbi',n:'條款解讀:沒列名的供應商',route:['con'],t:'客戶的二階供應商工廠淹水,導致客戶停工。客戶有或有營業中斷保險。',cl:{x:'或有營業中斷:承保因下列列名供應商之財產,遭受本保險承保之事故,致被保險人營業中斷之損失。(列名供應商:甲公司、乙公司)',o:['只要是供應商出事都賠','淹水的二階供應商沒有列名,不賠','只要客戶停工就賠'],a:1,why:'或有營業中斷多採列名制,只保列出的供應商。沒列名的二階供應商出事,通常不在範圍內。這也是供應鏈地圖的重要性。',ok:{t:'你建議客戶續約時把關鍵二階供應商也列入。',fx:{pro:3,rep:2,res:10}}}},

  {l:'和設備原廠一起評估,能修的先搶救乾燥',c:{w:{pro:.6,net:.4},b:50,s:.8},ok:{t:'你救回了三成設備,也在國際同業間建立了名聲。',fx:{pro:5,net:4,flag:'abroad'}},ng:{t:'水退得太慢,設備大多只能報廢。',fx:{hp:-4,pro:3}}},
  {l:'水退前先處理文件與存貨帳',ok:{t:'你整理出完整的存貨資料,讓後續理賠快了很多。',fx:{pro:3,net:1}}},
  {l:'以家庭為由婉拒外派',ok:{t:'公司派了別人去。',fx:{fam:3,rep:-1}}}]},
 C:{n:'模型沒算到的洪水',t:'泰國大水造成的損失遠超過巨災模型的估計。你發現公司在幾個工業區的累積保額非常高。',ch:[
  {l:'盤點累積曝險,並建議日後設定洪水分項限額',c:{k:'pro',b:55,s:.8},ok:{t:'你的盤點讓公司及早提存準備金。隔年續約時,分項限額成了市場標準做法。',fx:{pro:5,rep:3}},ng:{t:'資料不完整,累積數字一直在變。',fx:{hp:-3,pro:2}}},
  {l:'等損失確定再處理',ok:{t:'準備金提存太晚,財報被迫大幅修正。',fx:{rep:-3}}},
  {l:'立即通知再保人並啟動攤回',ok:{t:'攤回順利,公司的損失穩住了。',fx:{pro:2,net:2}}}]},
 A:{n:'泰國淹水,台灣停工',t:'客戶在台灣的工廠沒事,但泰國的硬碟零件供應商被大水淹了,客戶的產線因此停擺。',ch:[
  {l:'檢查是否有或有營業中斷保障與列名供應商',c:{k:'pro',b:55,s:.7},ok:{t:'客戶剛好把那家供應商列名在保單上,營業中斷順利理賠。你成了客戶心中的英雄。',fx:{pro:4,net:4}},ng:{t:'那家供應商沒有列名,客戶只能自行吸收損失。',fx:{pro:2,net:-2}}},
  {l:'建議客戶向供應商求償',ok:{t:'天災屬於不可抗力,供應商不負責任。',fx:{pro:1}}},
  {l:'協助客戶找替代供應商',ok:{t:'客戶的產線兩個月後恢復,很感謝你。',fx:{net:3}}}]}
}},
{k:'hkhh',y:2014,src:'2014 年高雄氣爆',v:{
 F:{n:'深夜的連環氣爆',t:'深夜,市區地下管線連環氣爆,好幾條街被炸開。保險公司委託你勘查沿線店家與住戶的損失。',ch:[
  {l:'逐戶建立損失清冊,區分爆炸震損、火損與後續損失',c:{w:{pro:.6,net:.4},b:55,s:.7},ok:{t:'你的清冊成了保險公司代位求償的基礎資料。',fx:{pro:4,rep:3}},ng:{t:'災區管制,很多店家你進不去。',fx:{hp:-3,pro:2}}},
  {l:'先處理商家的營業中斷',ok:{t:'商家很感激,但財物損失的證據有一部分沒保全。',fx:{net:3,pro:-1}}},
  {l:'用簡易表單快速估損',ok:{t:'結案快,但金額爭議不少。',fx:{rep:-1,net:1}}}]},
 C:{n:'理賠後的代位求償',t:'氣爆後,公司先賠付了數百件住戶與商家的火險。接下來要決定怎麼向管線業者求償。',ch:[
  {l:'保全證據,和其他保險公司共同代位求償',c:{k:'pro',b:55,s:.7},ok:{t:'聯合求償讓訴訟成本降低,也增加了談判籌碼。',fx:{pro:4,net:3}},ng:{t:'各保險公司意見不一,求償拖了好幾年。',fx:{hp:-2,pro:1}}},
  {l:'等刑事判決確定後再說',ok:{t:'時間拖太久,部分請求權面臨時效問題。',fx:{rep:-2}}},
  {l:'放棄求償,成本太高',ok:{t:'公司少了一筆可以追回的錢。',fx:{pro:-1}}}]},
 A:{n:'地下管線的責任',t:'氣爆事件後,一位石化業客戶請你檢視:如果他們的管線出事,保險夠不夠?',ch:[
  {l:'檢視第三人責任險保額、管線維護紀錄與除外條款',c:{k:'pro',b:55,s:.7},ok:{t:'你發現保額只有可能損失的十分之一,客戶決定大幅提高。',fx:{pro:4,net:3}},ng:{t:'客戶不願提供維護紀錄,評估只能做一半。',fx:{pro:1}}},
  {l:'只比較保費',ok:{t:'客戶省了錢,但保障缺口還在。',fx:{net:1,rep:-1}}},
  {l:'建議客戶建立管線巡檢與緊急應變機制',ok:{t:'客戶採納了,也拿到更好的保險條件。',fx:{pro:2,net:2}}}]}
}},
{k:'hbx',y:2015,src:'2015 年八仙塵爆',v:{
 F:{n:'彩色派對的塵爆',t:'一場彩色派對發生粉塵爆炸,造成大量燒燙傷。保險公司委託你處理主辦單位的公共意外責任險,但保額遠遠不夠。',ch:[
  {l:'清楚說明保額上限與分配方式,協助家屬申請其他補助',c:{k:'rep',b:55,s:.7},ok:{t:'家屬雖然難過,但清楚知道保險能做什麼、不能做什麼。你也協助他們找到政府與民間的資源。',fx:{rep:5,pro:2,hp:-2}},ng:{t:'家屬情緒激動,你承受很大的壓力。',fx:{hp:-5,rep:2}}},
  {l:'依保額比例,快速分配',ok:{t:'程序很快,但家屬覺得被當成數字。',fx:{pro:2,rep:-2}}},
  {l:'等法院判決確定責任再處理',ok:{t:'家屬等了好幾年,醫療費用壓力很大。',fx:{rep:-3}}}]},
 C:{n:'保額只有五千萬',t:'一場塵爆造成數百人受傷,但主辦單位的責任保險保額只有幾千萬元,傷者的醫療費估計要好幾億。',ch:[
  {l:'依約盡快給付,並與家屬清楚溝通保額上限',c:{k:'rep',b:55,s:.7},ok:{t:'賠款很快到位,家屬理解保險已經盡力。',fx:{rep:4,pro:2}},ng:{t:'媒體追問為什麼只賠這麼少,你成了箭靶。',fx:{rep:-1,st:'media'}}},
  {l:'等責任釐清後再給付',ok:{t:'程序上沒錯,但輿論壓力很大。',fx:{rep:-3}}},
  {l:'建議公司檢討大型活動責任險的承保標準',ok:{t:'公司開始要求活動主辦單位提供安全計畫。',fx:{pro:3,rep:2}}}]},
 A:{n:'辦活動要保多少',t:'塵爆事件後,一家活動公司請你建議:辦一場萬人活動,責任險要保多少?',ch:[
  {l:'依活動規模與最大可能傷亡建議保額,並檢查場地與粉塵風險',c:{k:'pro',b:55,s:.7},ok:{t:'客戶採納建議,也取消了噴灑粉末的橋段。',fx:{pro:4,rep:3}},ng:{t:'客戶覺得保費太貴,只保了一半。',fx:{pro:2,net:-1}}},
  {l:'買法規最低保額就好',ok:{t:'客戶省了錢,但你知道這樣不夠。',fx:{rep:-2}}},
  {l:'建議客戶找專業的活動安全顧問',ok:{t:'客戶的活動辦得很順利。',fx:{net:2}}}]}
}},
{k:'hever',y:2021.2,src:'2021 年長賜輪擱淺蘇伊士運河',v:{
 F:{n:'卡在運河的貨櫃輪',t:'一艘超大型貨櫃輪擱淺在蘇伊士運河,卡了六天。脫困後,船東宣告共同海損。你處理的一批貨就在船上。',ch:[
  {l:'協助貨主透過保險公司出具共同海損擔保函,儘快提貨',c:{k:'pro',b:55,s:.7},ok:{t:'貨主拿到擔保函,貨物順利放行。你也把共同海損的流程講得很清楚。',fx:{pro:4,net:3}},ng:{t:'擔保函格式來回修改,提貨延了兩週。',fx:{hp:-2,pro:2}}},
  {l:'等海損理算結果出來再處理',ok:{t:'貨物被船方留置,貨主急得跳腳。',fx:{net:-3}}},
  {l:'建議貨主先付現金保證金',ok:{t:'貨主付了一大筆錢,後來才知道保險公司可以出擔保。',fx:{net:-2,pro:1}}}]},
 C:{n:'上百張擔保函',t:'貨櫃輪擱淺後宣告共同海損,上百位有投保的貨主同時要你們出具擔保函。',ch:[
  {l:'建立標準流程,快速出具並控管累積責任',c:{w:{pro:.5,net:.5},b:55,s:.7},ok:{t:'貨主們在兩週內陸續提貨,公司的服務口碑大好。',fx:{pro:3,rep:4}},ng:{t:'案件太多,有些擔保函出錯要重做。',fx:{hp:-3,pro:1}}},
  {l:'逐件審核,慢慢來',ok:{t:'沒有出錯,但貨主等得很不耐煩。',fx:{rep:-2}}},
  {l:'委託海損理算師協助',ok:{t:'專業分工,流程順暢。',fx:{net:2,pro:1}}}]},
 A:{n:'沒買貨物險的客戶',t:'客戶的一批貨在擱淺的貨櫃輪上。客戶為了省錢,這批貨沒有買貨物險。現在船東宣告共同海損。',ch:[
  {l:'說明共同海損:沒保險就得自付保證金才能提貨',c:{k:'pro',b:55,s:.7},ok:{t:'客戶付了保證金提貨,也決定以後每批貨都要投保。',fx:{pro:3,net:3}},ng:{t:'客戶不相信沒受損的貨也要分攤,和船方吵了很久。',fx:{hp:-2,net:-1}}},
  {l:'建議客戶拒絕分攤',a:.2,ok:{t:'船方留置貨物,客戶的交期全部延誤。',fx:{rep:-3,net:-3}}},
  {l:'協助客戶找海損理算師諮詢',ok:{t:'客戶搞懂了流程,順利提貨。',fx:{net:2}}}]}
}},
{k:'hcovid',y:2020.5,src:'2020–2022 年 COVID-19 疫情與防疫保單',v:{
 F:{n:'疫情停業能不能賠',t:'疫情期間,一家連鎖餐廳因政府命令停止內用,向保險公司申請營業中斷理賠。保險公司請你評估。',ch:[
  {l:'檢查是否有實體損失要件與傳染病附加條款',c:{k:'pro',b:55,s:.7},ok:{t:'保單的營業中斷以實體損失為前提,也沒有傳染病附加。你的報告條理清楚,雙方都接受。',fx:{pro:4,rep:3}},ng:{t:'條款有模糊空間,案子進入評議。',fx:{hp:-2,pro:2}}},
  {l:'改用遠端視訊勘查',ok:{t:'你學會了遠端勘查的技巧,但有些細節還是要到現場看。',fx:{pro:2,sk:'digi'}}},
  {l:'同情業者,建議從寬認定',a:.2,ok:{t:'保險公司不接受你的意見,覺得你不夠專業。',fx:{rep:-3}}}]},
 C:{n:'確診就賠',t:'公司去年賣出大量「確診就賠」的防疫保單,保費很便宜。今年確診人數暴增,理賠申請一天湧入上萬件。',ch:[
  {l:'依約理賠,並向再保人攤回、檢討定價',c:{w:{pro:.6,rep:.4},b:50,s:.8},ok:{t:'公司雖然大虧,但信譽保住了。你主導的檢討報告,成了日後商品設計的教材。',fx:{pro:4,rep:4,hp:-4}},ng:{t:'理賠量太大,系統當機,客訴暴增。',fx:{hp:-6,rep:-1}}},
  {l:'想辦法提高理賠文件門檻',a:.2,ok:{t:'主管機關要求保險公司依約理賠,公司的形象大傷。',fx:{rep:-5,st:'media'}}},
  {l:'建議立即停售',ok:{t:'公司停售了,但已經賣出的保單還是要賠。',fx:{pro:2}}}]},
 A:{n:'要不要買防疫保單',t:'一位企業客戶想幫全體員工買「確診就賠」的防疫保單當福利,保費很便宜。',ch:[
  {l:'說明保障內容,也提醒保險公司大量理賠的風險',c:{k:'pro',b:55,s:.7},ok:{t:'客戶買了,也理解這類商品的極端情境。後來確診暴增,理賠雖慢但都拿到了。',fx:{pro:3,net:3}},ng:{t:'客戶覺得你想太多。',fx:{net:-1}}},
  {l:'大力推薦,保費很划算',ok:{t:'客戶很滿意,但你沒有說明保險公司的理賠壓力,理賠延遲時客戶來抱怨。',fx:{net:1,rep:-1}}},
  {l:'建議客戶改用醫療團體保險',ok:{t:'保障比較全面,但保費高很多。',fx:{pro:1}}}]}
}},
{k:'hwar',y:2022.1,src:'2022 年俄烏戰爭',v:{
 F:{n:'卡在黑海的貨',t:'戰爭爆發,一批要運往黑海港口的貨物被困在中途港。貨主問你:「保險會賠嗎?」',ch:[
  {l:'檢查貨物險是否附加兵險,以及制裁條款',c:{k:'pro',b:55,s:.7},ok:{t:'貨物險有附加協會兵險條款,但延誤本身不在承保範圍。你把可以賠與不能賠的部分講得很清楚。',fx:{pro:4,rep:3}},ng:{t:'條款與制裁規定交錯,你花了很多時間才釐清。',fx:{hp:-2,pro:2}}},
  {l:'告訴貨主戰爭一律不賠',ok:{t:'貨主後來發現有附加兵險,覺得你不夠專業。',fx:{rep:-3}}},
  {l:'協助貨主安排轉運',ok:{t:'貨物順利轉運,但額外運費要自己負擔。',fx:{net:2}}}]},
 C:{n:'困在俄羅斯的飛機',t:'戰爭爆發後,四百多架西方租賃公司的飛機被困在俄羅斯。租賃公司向保險公司求償。',ch:[
  {l:'先釐清是一般險還是戰爭險的責任',c:{k:'pro',b:50,s:.8},ok:{t:'你的分析讓公司及早提存準備金。幾年後英國法院判決屬於戰爭險範圍,與你的判斷一致。',fx:{pro:5,rep:3}},ng:{t:'法律爭議太複雜,短期內沒有定論。',fx:{hp:-2,pro:2}}},
  {l:'全部拒賠,等法院判決',ok:{t:'租賃公司提起大規模訴訟。',fx:{rep:-2}}},
  {l:'和其他保險人協商和解',ok:{t:'部分和解了,但金額很大。',fx:{net:2}}}]},
 A:{n:'要出貨到戰區附近',t:'客戶的大訂單要出貨到黑海附近的港口,問你保險要怎麼安排。',ch:[
  {l:'確認兵險附加、額外保費,並評估制裁風險',c:{k:'pro',b:55,s:.7},ok:{t:'客戶知道了兵險保費會隨局勢變動,也確認買方不在制裁名單上。',fx:{pro:4,net:3}},ng:{t:'兵險報價一天一變,客戶很頭痛。',fx:{hp:-2,pro:2}}},
  {l:'建議用一般貨物險就好',a:.2,ok:{t:'貨物在港口遭到攻擊受損,一般條款不保戰爭。',fx:{rep:-5}}},
  {l:'建議客戶改用其他港口',ok:{t:'運費增加,但風險小很多。',fx:{net:2}}}]}
}},
{k:'hdali',y:2024.2,src:'2024 年巴爾的摩大橋事故',v:{
 F:{n:'大橋倒塌,港口封閉',t:'一艘貨櫃輪失去動力撞上大橋,大橋倒塌,港口封閉數週。貨主要求保險賠償貨物延誤的損失。',ch:[
  {l:'說明延誤不是貨物險承保的危險,並協助申請其他費用',c:{k:'pro',b:55,s:.7},ok:{t:'貨主雖然失望,但理解貨物險不保延誤。你也協助他們處理改港的額外費用。',fx:{pro:4,rep:3}},ng:{t:'貨主堅持要賠,案子進入申訴。',fx:{hp:-2,pro:1}}},
  {l:'建議保險公司通融',ok:{t:'保險公司拒絕,覺得你不專業。',fx:{rep:-2}}},
  {l:'協助貨主向船方求償',ok:{t:'船方聲請責任限制,求償金額有上限。',fx:{pro:2}}}]},
 C:{n:'船東的責任上限',t:'貨櫃輪撞毀大橋,船東依法聲請將責任限制在約 4,370 萬美元。但重建大橋的成本高出好幾十倍。',ch:[
  {l:'評估責任限制能否被打破,以及互保協會與再保的攤賠',c:{k:'pro',b:50,s:.8},ok:{t:'你的分析讓公司提早掌握最壞情境,準備金提存得剛好。',fx:{pro:5,rep:3}},ng:{t:'法律情境太多,模型一直在改。',fx:{hp:-3,pro:2}}},
  {l:'假設責任限制一定成立',ok:{t:'後來原告主張船東有過失,責任限制面臨挑戰。',fx:{rep:-2}}},
  {l:'等法院判決',ok:{t:'準備金提存太晚。',fx:{rep:-1}}}]},
 A:{n:'改港的額外運費',t:'港口封閉,客戶的貨被迫改到其他港口卸貨,多了一大筆陸運費用。客戶問保險能不能賠。',ch:[
  {l:'檢查保單的轉運費用條款與承保危險',c:{k:'pro',b:55,s:.7},ok:{t:'你說明港口封閉不是承保的危險,但協助客戶向運送人確認費用分攤。',fx:{pro:4,net:2}},ng:{t:'條款解釋有爭議,客戶不太滿意。',fx:{net:-1,pro:2}}},
  {l:'告訴客戶一定能賠',a:.2,ok:{t:'保險公司拒賠,客戶怪你。',fx:{rep:-4}}},
  {l:'建議客戶下次在合約中約定改港費用',ok:{t:'客戶修改了合約範本。',fx:{pro:2,net:1}}}]}
}},
{k:'hhl',y:2024.3,src:'2024 年花蓮地震',v:{

const GLX=[];GLOSS.forEach((g,i)=>g.a.forEach(a=>GLX.push([a,i])));GLX.sort((x,y)=>y[0].length-x[0].length);
function glz(s){
  if(!s||typeof s!=='string')return s;
  const src=LANG==='en'?s.toLowerCase():s,used=new Set(),mk=[];
  const okB=(p,n)=>LANG!=='en'||(!/[a-z0-9]/i.test(s[p-1]||'')&&!/[a-z0-9]/i.test(s[p+n]||''));
  for(const [al,i] of GLX){
    if(used.has(i))continue;const a=LANG==='en'?al.toLowerCase():al;let p=src.indexOf(a);
    while(p>=0){if(okB(p,a.length)&&!mk.some(m=>p<m[1]&&p+a.length>m[0])){mk.push([p,p+a.length,i]);used.add(i);break}p=src.indexOf(a,p+1)}
    if(mk.length>=4)break;
  }
  mk.sort((x,y)=>x[0]-y[0]);let o='',q=0;
  mk.forEach(([x,y,i])=>{o+=s.slice(q,x)+'<span class="term" role="button" tabindex="0" data-g="'+i+'">'+s.slice(x,y)+'</span>';q=y});
  return o+s.slice(q);
}
function glHide(){if(typeof document==='undefined'||!document.getElementById)return;const d=document.getElementById('gpop');if(d&&d.remove)d.remove()}
function glShow(el){
  glHide();const g=GLOSS[+el.dataset.g];if(!g)return;
  const d=document.createElement('div');d.className='gpop';d.id='gpop';d.setAttribute('role','dialog');
  d.innerHTML='<b>'+g.t+'</b><p>'+g.d+'</p>';document.body.appendChild(d);
  const r=el.getBoundingClientRect(),w=Math.min(300,window.innerWidth-24);d.style.width=w+'px';
  const x=Math.max(12,Math.min(r.left,window.innerWidth-w-12));d.style.left=(x+window.scrollX)+'px';d.style.top=(r.bottom+window.scrollY+8)+'px';
}

{id:'ca_avgded',n:'理算題:不足額加自負額',adj:1,t:'工廠火災,機器設備實際價值 2,000 萬,只投保 1,500 萬。損失 400 萬,每一事故自負額 20 萬。',ca:{x:'保險金額:1,500 萬<br>保險標的價值:2,000 萬<br>損失金額:400 萬<br>自負額:每一事故 20 萬(比例分攤後扣除)',o:['280 萬','285 萬','380 萬'],a:0,why:'先比例分攤,再扣自負額:400 萬 × 1,500/2,000 = 300 萬;300 萬 − 20 萬 = 280 萬。先扣自負額再分攤會算成 285 萬;忘了比例分攤則是 380 萬。計算順序要依條款約定。',ok:{t:'你的計算底稿一目了然,保險公司與被保險人都沒有意見。',fx:{pro:3,rep:3}}}},
{id:'ca_acv',n:'理算題:舊機器的實際價值',adj:1,t:'一台用了 4 年的射出成型機燒毀。保單以實際現金價值理賠,殘骸賣給回收商得 20 萬,由被保險人保留。',ca:{x:'重置成本:500 萬<br>耐用年限:10 年(直線法,不計殘值)<br>已使用:4 年<br>殘骸:20 萬,歸被保險人',o:['280 萬','300 萬','480 萬'],a:0,why:'折舊 = 500 萬 × 4/10 = 200 萬,實際現金價值 300 萬。殘骸留給被保險人,要從賠款中扣除:300 萬 − 20 萬 = 280 萬。若殘骸由保險人取回處理,才賠 300 萬。',ok:{t:'你把折舊表和殘骸處理一起寫進報告,沒有人再追問。',fx:{pro:3,rep:3}}}},
{id:'ca_tax',n:'理算題:營業稅要不要賠',adj:1,t:'辦公室淹水,修繕廠商開出 525 萬的發票(含 5% 營業稅)。被保險人是一般營業人,進項稅額可以扣抵。',ca:{x:'修繕發票:525 萬(含營業稅 25 萬)<br>被保險人:可扣抵進項稅額<br>自負額:每一事故 10 萬',o:['490 萬','515 萬','525 萬'],a:0,why:'可以扣抵的營業稅不是被保險人的實際損失,依損害填補原則應扣除:525 萬 − 25 萬 = 500 萬,再扣自負額 10 萬,賠 490 萬。被保險人不能扣抵時(例如免稅單位或個人),營業稅才計入損失。',ok:{t:'會計主管看了你的說明,點頭說:「這樣算才對。」',fx:{pro:3,rep:2}}}},
{id:'ca_stock',n:'理算題:燒掉多少庫存',adj:1,t:'倉庫火災連帳冊也燒了。會計師從往來資料重建數字,搶救出的完好存貨經清點值 300 萬。',ca:{x:'期初存貨:1,000 萬<br>本期進貨:2,000 萬<br>本期銷貨收入:2,500 萬<br>過去三年平均毛利率:20%<br>搶救出的完好存貨:300 萬',o:['700 萬','200 萬','1,000 萬'],a:0,why:'用毛利率法推算期末存貨:銷貨成本 = 2,500 萬 × (1 − 20%) = 2,000 萬;期末帳面存貨 = 1,000 + 2,000 − 2,000 = 1,000 萬;扣掉完好的 300 萬,損失 700 萬。直接拿銷貨收入相減會算成 200 萬,低估了損失。',ok:{t:'帳冊雖然燒了,你的推算仍然站得住腳。',fx:{pro:4,rep:2}}}},
{id:'ca_bi',n:'理算題:停工兩個月的毛利損失',adj:1,sk:'bi',t:'工廠火災停工兩個月。營業中斷保險以毛利為保險標的,賠償期間 12 個月,保額足夠。',ca:{x:'停工期間營業額減少:2,000 萬<br>毛利率(營業額扣除變動成本):30%<br>停工期間省下的費用:100 萬',o:['500 萬','600 萬','2,000 萬'],a:0,why:'毛利損失 = 營業額減少 × 毛利率 = 2,000 萬 × 30% = 600 萬;停工期間省下的費用(例如沒用到的電費、外包費)要扣除:600 萬 − 100 萬 = 500 萬。營業中斷保險賠的是毛利,不是營業額。',ok:{t:'你把營業額、毛利與節省費用拆得很清楚,財務長很快就簽了。',fx:{pro:3,rep:3}}}},

{id:'ca_interim',n:'理算題:預付賠款要付多少',adj:1,t:'一件大型火災還在理算。被保險人資金吃緊,申請預付賠款。',ca:{x:'各方已無爭議的損失:1,200 萬<br>仍有爭議的損失:800 萬<br>自負額:每一事故 50 萬',o:['1,150 萬','1,200 萬','1,950 萬'],a:0,why:'預付賠款通常以「確定可賠、沒有爭議」的金額為基礎,並先扣自負額:1,200 萬 − 50 萬 = 1,150 萬。有爭議的 800 萬等理算完成再決定。預付能減輕被保險人的現金壓力,也避免營業中斷損失擴大。',ok:{t:'預付款一週內就撥下來,工廠提早一個月復工。',fx:{pro:2,rep:4}}}},

{id:'ca_items',n:'理算題:建築與存貨分開投保',adj:1,spec:['fire'],t:'一座工廠的建築物與存貨分項投保,這次火災兩者都燒到了。',ca:{x:'建築物:保額 3,000 萬,價值 3,000 萬,損失 600 萬<br>存貨:保額 1,000 萬,價值 2,000 萬,損失 500 萬<br>條款:各項目分別適用比例分攤',o:['850 萬','880 萬','1,100 萬'],a:0,why:'分項投保時,每一項分別比較保額與價值。建築物足額,賠 600 萬;存貨只保了一半,賠 500 萬 × 1,000/2,000 = 250 萬;合計 850 萬。把兩項合併計算(4,000/5,000 × 1,100 萬)會得到 880 萬,那是總括保額的算法。',ok:{t:'你分項列出計算,業主這才發現存貨保額多年沒調整。',fx:{pro:3,rep:3}}}},
{id:'ca_rc',n:'理算題:重置成本但不重建',adj:1,spec:['fire'],t:'倉庫全毀,保單以重置成本為理賠基礎。業主決定不重建,打算把土地賣掉。',ca:{x:'重建成本:2,000 萬<br>折舊後的實際價值:1,400 萬<br>條款:被保險人未於合理期間內重建者,以實際現金價值理賠',o:['1,400 萬','2,000 萬','600 萬'],a:0,why:'重置成本保單多賠的「新舊差額」,是為了讓被保險人能夠重建。不重建,就只能拿實際現金價值 1,400 萬。這個條件常寫在重置成本條款裡,目的是避免被保險人因保險而獲利。',ok:{t:'你提醒業主:如果兩年內改變主意重建,還能補請差額。',fx:{pro:3,rep:3}}}},
{id:'ca_cif',n:'理算題:貨物險的保險價額',adj:1,spec:['cargo'],sk:'ga',t:'一批 1,000 箱的電子零件以 CIF 條件出口,依慣例按 CIF 加一成投保。運送途中 200 箱全損。',ca:{x:'發票金額(CIF):3,000 萬<br>保險金額:CIF × 110% = 3,300 萬<br>全損箱數:200 箱 / 1,000 箱(每箱價值相同)',o:['660 萬','600 萬','3,300 萬'],a:0,why:'貨物險常以 CIF 加一成作為約定保險價額,多出的一成代表預期利潤與費用。200 箱占 20%,賠 3,300 萬 × 20% = 660 萬。只用發票金額計算,會少賠 60 萬。',ok:{t:'貨主本來以為只能拿回發票金額,收到賠款時有點意外。',fx:{pro:3,rep:2}}}},

{id:'ca_pkg',n:'理算題:運送人的責任上限',adj:1,spec:['cargo'],sk:'ga',t:'一台 4,000 公斤的精密機台以一件包裝海運,價值 1,500 萬。卸貨時被吊車摔壞,運送人有過失,提單上沒有聲明價值。',ca:{x:'依海商法,未聲明價值時,運送人的賠償責任以「每件約 667 SDR」或「每公斤 2 SDR」計算,取較高者<br>件數:1 件<br>重量:4,000 公斤<br>(SDR:國際貨幣基金的特別提款權)',o:['約 667 SDR','8,000 SDR','1,500 萬全額'],a:1,why:'按件計算約 667 SDR,按重量計算是 4,000 × 2 = 8,000 SDR,取較高者 8,000 SDR,折合新台幣三十多萬。和 1,500 萬的貨值相比差很多,所以貨主一定要有自己的貨物險;高價貨物也可以在提單上聲明價值。',ok:{t:'保險公司賠了貨主之後,依你的計算向運送人追回了責任上限的金額。',fx:{pro:3,rep:3}}}},
{id:'ca_car',n:'理算題:工程追加後沒調保額',adj:1,spec:['eng'],t:'廠房新建工程原本合約金額 1 億,追加變更設計後變成 1 億 2,500 萬,但營造綜合險的保額沒有跟著調整。工程本體因豪雨損失 500 萬。',ca:{x:'保險金額:1 億(原合約金額)<br>完工總價(含追加):1 億 2,500 萬<br>工程本體損失:500 萬<br>條款:保險金額低於完工總價時,按比例賠付',o:['400 萬','500 萬','625 萬'],a:0,why:'營造綜合險的保額應是完工總價。保額 1 億只占 1 億 2,500 萬的 80%,所以賠 500 萬 × 80% = 400 萬。工程追加變更時,要記得同步批改保額。',ok:{t:'營造廠第二天就去辦了保額批改。',fx:{pro:3,rep:3}}}},
{id:'ca_tpl',n:'理算題:鄰房損害超過限額',adj:1,spec:['eng'],t:'深開挖工程造成五戶鄰房龜裂,經鑑定修復費用合計 1,400 萬,屬於同一事故。',ca:{x:'鄰房損害合計:1,400 萬<br>第三人責任:每一事故限額 1,000 萬<br>自負額:每一事故 10 萬(先由損失中扣除,再適用限額)',o:['1,000 萬','990 萬','1,390 萬'],a:0,why:'先扣自負額:1,400 萬 − 10 萬 = 1,390 萬,再適用每一事故限額 1,000 萬,保險賠 1,000 萬,其餘 400 萬由營造廠負擔。先套限額再扣自負額會算成 990 萬。條款怎麼寫,順序就怎麼走。',ok:{t:'營造廠看了你的計算,決定下一個案子把第三人責任限額提高。',fx:{pro:3,rep:3}}}},
{id:'ca_solar',n:'理算題:太陽能電廠的停機損失',adj:1,spec:['re'],sk:'bi',t:'颱風吹壞太陽能電廠的變流器,停機 40 天。營業中斷保障有 10 天等待期間。',ca:{x:'平均每日售電收入:8 萬(依過去同季發電量與費率估算)<br>停機天數:40 天<br>等待期間:10 天',o:['240 萬','320 萬','80 萬'],a:0,why:'等待期間類似以時間計算的自負額,前 10 天不賠:(40 − 10) × 8 萬 = 240 萬。估算每日收入時要看過去同一季節的發電量,因為日照有季節性。',ok:{t:'你附上過去三年的同期發電量,保險公司沒有異議。',fx:{pro:3,rep:2}}}},
{id:'ca_warranty',n:'理算題:保險與保固的切分',adj:1,spec:['re'],t:'風機葉片在保固期內出現裂紋,維修費 900 萬。鑑定認為三分之一是雷擊造成,三分之二是材料瑕疵。',ca:{x:'維修費:900 萬<br>原因比例:雷擊 1/3、材料瑕疵 2/3<br>保險:承保雷擊等外來事故,不保材料瑕疵(由原廠保固負責)<br>自負額:每一事故 50 萬',o:['250 萬','300 萬','850 萬'],a:0,why:'保險只負擔雷擊造成的部分:900 萬 × 1/3 = 300 萬,扣自負額 50 萬,賠 250 萬。其餘 600 萬屬材料瑕疵,應依保固向原廠求償。再生能源理賠很常遇到保險與保固的責任切分。',ok:{t:'開發商拿著你的報告去找原廠,原廠也認了瑕疵的部分。',fx:{pro:4,rep:2}}}},
{id:'ca_wip',n:'理算題:報廢晶圓怎麼估價',adj:1,spec:['semi'],t:'地震讓 2,000 片在製晶圓報廢。保單約定在製品以成本計價。',ca:{x:'報廢片數:2,000 片<br>平均已投入成本:每片 3 萬<br>完成後的預計售價:每片 10 萬<br>條款:在製品以已投入的原料及加工成本計算',o:['6,000 萬','2 億','1 億 4,000 萬'],a:0,why:'在製品依條款以成本計:2,000 × 3 萬 = 6,000 萬。售價與成本之間的利潤屬於營業中斷保險(毛利損失)的範圍,不能在財產損失裡重複主張。',ok:{t:'你把財產損失與營業中斷的界線畫清楚,避免了重複理賠的爭議。',fx:{pro:4,rep:2}}}},
{id:'ca_ramp',n:'理算題:良率爬坡與賠償期間',adj:1,spec:['semi'],sk:'bi',t:'晶圓廠停電事故後,產能分三個月才恢復。營業中斷保險的賠償期間是 2 個月。',ca:{x:'每月正常毛利:3,000 萬<br>第 1 個月毛利損失:100%<br>第 2 個月:50%<br>第 3 個月:20%<br>賠償期間:事故發生後 2 個月',o:['4,500 萬','5,100 萬','6,000 萬'],a:0,why:'賠償期間只到第 2 個月底:3,000 萬 × (100% + 50%) = 4,500 萬。第 3 個月的 600 萬損失超出賠償期間,不賠。高科技廠要依實際復原時程(含良率爬坡)設定足夠的賠償期間。',ok:{t:'客戶隔年續約時,把賠償期間拉長到 12 個月。',fx:{pro:3,rep:3}}}},
{id:'ca_neg',n:'理算題:與有過失與責任限額',adj:1,spec:['motor'],t:'賣場顧客滑倒骨折,法院認定總損害 500 萬,顧客自己也有三成過失。賣場的公共意外責任險每一個人體傷限額 300 萬。',ca:{x:'總損害:500 萬<br>顧客與有過失:30%<br>每一個人體傷責任限額:300 萬',o:['300 萬','350 萬','500 萬'],a:0,why:'先依與有過失減輕:500 萬 × 70% = 350 萬,這是賣場應負的賠償;保險每人限額 300 萬,所以保險賠 300 萬,賣場自付 50 萬。責任限額要依營業規模與人流量設定。',ok:{t:'賣場看完你的分析,決定提高投保限額。',fx:{pro:3,rep:3}}}},
{id:'ca_cali',n:'理算題:強制險與任意險',adj:1,spec:['motor'],t:'一起車禍造成路人死亡,法院判決加害人應賠 900 萬。加害人有強制汽車責任保險,另外投保任意第三人責任險。',ca:{x:'判決賠償總額:900 萬<br>強制險死亡給付:300 萬<br>任意第三人責任險:每一個人死亡限額 500 萬<br>規定:強制險給付視為損害賠償金額的一部分',o:['500 萬','600 萬','900 萬'],a:0,why:'強制險先給付 300 萬,依強制汽車責任保險法,這筆錢視為加害人損害賠償的一部分,剩下 600 萬由加害人負責。任意險每人限額 500 萬,所以任意險賠 500 萬,加害人自行負擔 100 萬。',ok:{t:'家屬終於弄懂每一筆錢從哪裡來,和解很快就談成了。',fx:{pro:3,rep:3}}}},
/* ---- 經紀人:理賠顧問 ---- */
{id:'ca_coins',n:'理算題:共保的求償金額',route:['brk'],t:'客戶的廠房由三家保險公司共保,火災損失 2,000 萬,你要寄出求償通知給每一家。',ca:{x:'損失:2,000 萬<br>自負額:每一事故 100 萬(全案扣一次)<br>共保比例:甲 40%(首席)、乙 35%、丙 25%',o:['乙公司應付 665 萬','乙公司應付 700 萬','乙公司應付 633 萬'],a:0,why:'共保是各保險人依比例分別負責,自負額對全案只扣一次:(2,000 萬 − 100 萬) × 35% = 665 萬。700 萬是忘了扣自負額;633 萬是誤以為三家平均分攤。共保是分別責任,首席保險人不會替其他人付款。',ok:{t:'三家保險公司的款項在同一週入帳。',fx:{pro:3,rep:3}}}},
{id:'ca_stp',n:'理算題:存貨申報不足',route:['brk'],brn:['brk_mar'],t:'客戶的存貨運輸保險(STP)依每月申報的平均庫存計費。倉庫淹水,存貨損失 1,200 萬。',ca:{x:'申報的平均庫存:5 億<br>實際平均庫存:6 億<br>存貨損失:1,200 萬<br>條款:申報價值低於實際價值時,按申報 ÷ 實際的比例賠付',o:['1,000 萬','1,200 萬','800 萬'],a:0,why:'申報只有實際的 5/6,所以賠 1,200 萬 × 5/6 = 1,000 萬。少報 1 億庫存省下的保費,遠不如這次少拿的 200 萬。這也是經紀人要提醒客戶如實申報的原因。',ok:{t:'客戶從下個月開始改用系統自動帶出的庫存數字申報。',fx:{pro:3,rep:3}}}},
{id:'ca_trend',n:'理算題:營業中斷的趨勢調整',route:['brk'],brn:['brk_pro'],sk:'bi',t:'你協助客戶準備營業中斷索賠。事故前,客戶業績一直比去年同期成長 10%。',ca:{x:'去年同期 3 個月營業額:6,000 萬<br>事故前成長趨勢:+10%<br>事故後 3 個月實際營業額:2,600 萬<br>毛利率:40%<br>條款:標準營業額應依事故前後的趨勢調整',o:['1,600 萬','1,360 萬','4,000 萬'],a:0,why:'標準營業額要依趨勢調整:6,000 萬 × 1.1 = 6,600 萬;營業額減少 6,600 − 2,600 = 4,000 萬;毛利損失 4,000 萬 × 40% = 1,600 萬。沒做趨勢調整會算成 (6,000 − 2,600) × 40% = 1,360 萬,客戶少拿 240 萬。',ok:{t:'你附上事故前一年的月報表,趨勢調整被保險公司接受。',fx:{pro:4,rep:2}}}},
{id:'ca_dsu',n:'理算題:離岸風場延遲完工',route:['brk'],brn:['brk_enr'],sk:'bi',t:'離岸風場的海上變電站在運送途中受損,商轉日延後 150 天。客戶有延遲完工(DSU)保險。',ca:{x:'延遲天數:150 天<br>等待期間:60 天<br>每日約定賠償金額:50 萬<br>最長賠償期間:365 天',o:['4,500 萬','7,500 萬','3,000 萬'],a:0,why:'扣除 60 天等待期間後,賠 (150 − 60) × 50 萬 = 4,500 萬,在最長賠償期間內。離岸風場的延遲完工保險金額很大,等待期間的長短常是談判重點。',ok:{t:'開發商的財務長說,這筆錢剛好撐住了銀行的還款。',fx:{pro:3,rep:3}}}},
/* ---- 保險公司:理賠 ---- */
{id:'ca_ibnr',n:'理算題:準備金要提多少',route:['ins'],brn:['ins_cl'],t:'公司的責任險業務,今年度已付賠款 400 萬。財務長問你,還要提列多少未付賠款準備金。',ca:{x:'第一年已付賠款:400 萬<br>歷史發展因子(最終賠款 ÷ 第一年已付):2.5',o:['600 萬','1,000 萬','400 萬'],a:0,why:'最終賠款估計 = 400 萬 × 2.5 = 1,000 萬,已經付了 400 萬,還要準備 600 萬,包含已報未付與已發生未報(IBNR)的賠款。這是鏈梯法的基本概念。責任險的賠款常在多年後才浮現,準備金不能只看已付。',ok:{t:'精算部門用同樣的方法複核,數字一致。',fx:{pro:3,rep:3}}}},
{id:'ca_reinst',n:'理算題:賠過一次的保額',route:['ins'],brn:['ins_cl'],t:'一張機器保險年初賠過一次,被保險人沒有辦理保額復效。年底又發生一次損失。',ca:{x:'原保險金額:1,000 萬<br>第一次賠款:400 萬<br>條款:賠款後保險金額相應減少,未辦理復效者,以剩餘保額為賠償上限<br>第二次損失:800 萬',o:['600 萬','800 萬','480 萬'],a:0,why:'第一次賠了 400 萬,保額剩 600 萬。第二次損失 800 萬,以剩餘保額 600 萬為上限。很多財產保單有「賠款後保額相應減少」的約定,出險後要記得辦理復效(通常要加繳保費),否則下一次可能不夠賠。',ok:{t:'你在結案信裡提醒被保險人辦理復效,對方很感謝。',fx:{pro:3,rep:3}}}}
];
CA.forEach(e=>{
  const c=e.ca,id=e.id;
  const ev={id,n:e.n,w:e.w||(e.adj?(e.spec?3:4):5),t:e.t,cl:c,ca:1,ch:c.o.map((l,i)=>{const R=i===c.a;return {l,c:{k:c.k||'pro',b:(c.b||55)+(R?25:-15),s:c.s||.6},ok:R?c.ok:CAW.okW,ng:R?CAW.ngR:CAW.ngW,ans:R}})};
  if(e.spec)ev.spec=e.spec;
  if(e.route)ev.route=e.route;
  if(e.brn)ev.brn=e.brn;
  if(e.adj)ROUTE_OK[id]=ADJR;
  if(e.sk)SK[e.sk].ids.push(id);
  E.push(ev);TAG.law.add(id);
});
Object.assign(KNOW,{
 ca_avgded:['比例分攤與自負額的順序','不足額保險要先依「保額 ÷ 價值」打折,再依條款扣自負額。順序不同,金額就不同,理算前一定要看清條款怎麼寫。'],
 ca_acv:['折舊與殘骸','實際現金價值 = 重置成本 − 折舊。受損標的的殘骸若留給被保險人,殘骸價值要從賠款中扣除;若由保險人取回處理,則不扣。'],
 ca_tax:['營業稅與損害填補','一般營業人的進項營業稅可以扣抵,不是實際損失,理賠時應以未稅金額計算。免稅單位或個人不能扣抵,營業稅才算損失的一部分。'],
 ca_stock:['毛利率法推算存貨','帳冊毀損時,可用「期初存貨 + 進貨 − 銷貨成本」推算期末存貨,銷貨成本再以銷貨收入乘上(1 − 毛利率)估算。毛利率要用穩定期間的平均值。'],
 ca_bi:['營業中斷的毛利損失','營業中斷保險賠的是毛利:營業額減少乘上毛利率,再扣除停工期間省下的費用。保險上的毛利,通常是營業額扣除變動成本。'],
 ca_icw:['額外費用與經濟限度','為了減少營業中斷損失而支出的額外費用可以賠,但以「因此避免的毛利損失」為限。這讓被保險人有動機積極復原,也避免不划算的支出。'],
 ca_interim:['預付賠款','理算完成前,保險人可依已確定、沒有爭議的金額先行預付,並扣除自負額。大型案件的預付賠款,常是被保險人能否撐過復原期的關鍵。'],
 ca_items:['分項投保與總括投保','分項投保時,每一項目分別比較保額與價值、分別比例分攤;總括投保則合併計算。分項投保時,某一項不足額不會被其他足額項目補回來。'],
 ca_rc:['重置成本的重建條件','重置成本保單通常要求被保險人在合理期間內重建或重購,才賠新舊差額;不重建,就以實際現金價值理賠。'],
 ca_cif:['CIF 加一成','國際貿易的貨物險習慣以 CIF 價格加一成投保,多出的部分涵蓋預期利潤與額外費用。部分損失按受損比例乘上保險金額計算。'],
 ca_ga:['共同海損分攤率','共同海損分攤率 = 共同海損金額 ÷ 所有獲救利益(船舶、貨物、運費)的分攤價值合計。各方依自己的分攤價值乘上分攤率負擔,貨主的部分通常由貨物險承擔。'],
 ca_pkg:['運送人的責任限制','未聲明價值時,運送人對貨損的責任依「每件」或「每公斤」的 SDR 金額計算,取較高者。高價、重量輕的貨物,責任上限往往遠低於貨值,貨主應自行投保貨物險。'],
 ca_car:['營造綜合險的保額','營造綜合險的保額應為完工總價,包含材料、工資、追加工程。工程變更追加時要同步批改,否則出險時會被比例分攤。'],
 ca_tpl:['自負額與責任限額','責任保險要確認自負額是在限額內扣除,還是先由損失扣除後再適用限額。這兩種寫法,在損失超過限額時會產生不同的結果。'],
 ca_solar:['等待期間的計算','營業中斷的等待期間內的損失不賠,類似以時間計算的自負額。再生能源的每日損失,要依同季節的歷史發電量估算。'],
 ca_warranty:['保險與保固','保險承保突發而不可預料的外來事故,保固處理產品本身的瑕疵。同一個損失可能同時有兩種原因,理算時要依原因切分責任。'],
 ca_wip:['在製品的估價','在製品通常以已投入的原料與加工成本計價。成本與售價之間的利潤,屬於營業中斷保險的範圍,不能在財產損失重複主張。'],
 ca_ramp:['賠償期間要夠長','營業中斷的賠償期間從事故發生起算,只賠期間內的損失。半導體、化工等產業的復原包含良率爬坡,賠償期間太短,後段損失就沒有保障。'],
 ca_neg:['與有過失','受害人自己也有過失時,法院可以減輕加害人的賠償金額。責任保險只在被保險人應負的賠償範圍內、依限額給付。'],
 ca_cali:['強制險與任意險的關係','強制汽車責任保險的給付,視為被保險人損害賠償金額的一部分。超過強制險的部分,再由任意第三人責任險在限額內負擔。'],
 ca_coins:['共保的分別責任','共保時,各保險人依承保比例分別負責,不負連帶責任。自負額通常對全案只扣一次,再依比例分配給各保險人。'],

 icl4:['拒賠的說明義務','拒賠時應具體說明適用的條款、事實與理由,並告知申訴或評議管道。說明不清的拒賠,常是消費爭議的主要來源。'],
 icl5:['兩份公證報告的處理','被保險人可以自行委任公證人。雙方報告差異大時,逐項比對假設與計算基礎,通常能找出差異來源;必要時可共同指定第三位專家。'],

 iri5:['再保人的信用風險','分出公司通常會訂定再保人的最低信評標準。合約中的特別終止條款,讓再保人信評下降時可以提前終止或要求擔保。'],
 iri6:['新險種的再保策略','開辦新險種時,常用比例再保分散風險,同時借重再保人的經驗與數據。等累積足夠經驗後,再逐步提高自留。'],

 bmar5:['關稅與增值保險','貨物險的保險金額通常是 CIF 加一成,不包含進口關稅。高關稅的貨物,可以另外投保關稅或增值保險。'],
 bmar6:['倉儲的累積風險','存貨集中在同一個淹水潛勢區,一次災害就可能造成大損失。分散倉儲與設定合理的分項限額,是存貨保險的重要規劃。'],
 bpro4:['索賠準備費用','部分保單附加「索賠準備費用」保障,負擔被保險人為準備索賠而聘請會計師等專業人士的費用。營業中斷索賠越複雜,這項保障越有價值。'],
 bpro5:['法令變更條款','重建時為符合新法規增加的成本,一般火險不一定承保。附加法令變更條款,才能涵蓋這部分費用。'],
 bpro6:['保證條款','保證條款要求被保險人維持特定的條件,例如消防設備正常運作。違反保證條款的法律效果可能很嚴重,出險時保險人可能主張不負責任。'],
 benr4:['精密設備運輸的異常紀錄','震動記錄器與傾斜指示器異常時,應暫停簽收、通知保險人與原廠聯合開箱,並在簽收單上註記異常,保留向運送人追償的權利。'],
 benr5:['太陽能面板的隱裂','冰雹或運送衝擊可能造成肉眼看不見的隱裂,影響長期發電量。電致發光(EL)檢測可以找出隱裂,是理賠舉證的重要工具。'],
 benr6:['試車期間','營造與安裝工程險常對試運轉期間有特別約定,例如期間長度與承保範圍。設備一旦移交業主使用,通常就不再屬於工程險的保障。'],

 rtr6:['再保帳務與報表','比例合約依賴分出公司定期提供保費與賠款報表。報表遲交或資料不清,會影響再保人的準備金與風險管理。'],
 rfac4:['風險工程查勘','臨分再保人常派風險工程師查勘大型風險,檢視消防、製程安全與維護紀錄。查勘建議可以列為承保條件。'],
 rfac5:['領頭與跟單','臨分常由領頭再保人訂定價格與條件,其他再保人跟單。跟單前仍應有自己的風險評估,而不只是信任領頭。'],
 rfac6:['再保的告知義務','分出公司對再保人也負有告知重要事實的義務。投保資料有重大遺漏時,依合約與法律可能影響再保人的責任。'],

 rcat5:['次要災害','冰雹、野火、都市淹水等「次要災害」近年損失快速增加,但模型的發展相對落後,需要額外的經驗分析補足。'],

 ers4:['學術誠信','論文要正確引註法條、判決與文獻。相似度比對只是工具,指導教授仍要逐段檢查,確認沒有不當引用。'],

 ers6:['國際學術交流','國際研討會是發表研究與建立合作網絡的重要場合。保險學界常見的國際組織包括各國保險學會與風險管理學會。'],
 etc4:['考試的公平性','題庫要定期更新,並管理好舊題與筆記的流通。發生爭議時,公開說明出題程序是維持信任的方法。'],
 etc5:['AI 與學習評量','生成式 AI 可能產生不存在的判決或文獻。訂出使用規範、要求說明分析過程,比全面禁止更能培養學生的判斷力。'],
 etc6:['業師協同教學','邀請實務專家帶真實案例進課堂,能讓學生理解理賠與風險管理的實務,也為學生打開實習與就業的機會。'],
 epl4:['保險業氣候風險揭露','保險業的氣候揭露通常涵蓋治理、策略、風險管理與指標目標。分階段實施能讓業者逐步建立量化能力。'],
 epl5:['理賠時效的規範','理賠時效的規範要兼顧效率與品質。依案件類型訂定合理期限,並要求說明延遲原因,比單一期限更可行。'],
 epl6:['住宅颱風洪水險','台灣的住宅颱風洪水險多為住宅火險的附加險,投保率偏低。預設附加、可退出的設計,是提高保障缺口覆蓋率的一種方式。'],
 cbcp4:['營運持續演練','營運持續計畫要定期演練。桌上推演適合檢查流程,實際切換演練才能驗證備援系統與人員是否真的能運作。'],
 cbcp5:['復原時間目標','復原時間目標(RTO)與資料復原點目標(RPO)要依營運需求訂定。備援設施與主設施太近,可能同時受到同一場災害影響。'],
 cbcp6:['單一供應商風險','關鍵零件只有單一供應商時,一次斷料就可能讓整條產線停擺。開發第二供應商或增加安全庫存,都要和潛在的營業中斷損失比較。'],
 cerm4:['風險量化','風險地圖如果全部集中在中間,就失去排序的功能。挑出重大風險,以損失金額與發生機率量化,才能協助董事會決策。'],
 cerm5:['風險報告的誠實','風險報告的價值在於讓董事會及早看到問題。淡化重大風險,最後的代價往往由公司與報告者一起承擔。'],
 cerm6:['自保公司','自保公司是企業集團自己成立的保險公司,用來承保集團內部的風險。是否划算,要看損失經驗、資本需求、稅務與法規。'],
 cesg4:['熱危害','氣溫上升讓戶外作業的熱危害增加。熱指數監測、調整作業時段、補水與休息,是預防熱傷害的基本措施。'],
 cesg5:['碳定價的財務影響','碳費或碳交易會直接增加排放大戶的成本。用不同碳價情境建立財務模型,能協助企業規劃減量時程與投資。'],
 cesg6:['綠電購售合約的風險','長期綠電購售合約的風險包括發電量不足、電廠延遲完工與交易對手的信用風險。合約條款與保險可以分擔其中一部分。'],
 omar4:['冷凍貨櫃的理賠','冷凍貨櫃的溫度下載紀錄與運送前檢查報告,是判斷斷電時間與責任歸屬的關鍵。受損貨物若能降級出售,可以減少損失。'],
 omar5:['散裝穀物的發熱','散裝穀物水分過高時,運送途中會發熱、結塊。分層取樣並比對裝船前的檢驗報告,可以區分貨物本身的問題與海水損害。'],
 omar6:['海事報告與惡劣天候','運送人常以海上危險主張免責。比對氣象資料與航海日誌,可以檢驗天候是否真的超出船舶在該航線應能承受的程度。'],
 ocat4:['無人機作業規範','災後空拍勘查要遵守無人機的相關法規,包括禁限航區、註冊與操作資格。建立公司內部的作業規範,能避免救災時的違規風險。'],
 ocat5:['災後的價格波動','巨災後材料與人工常短缺,報價大幅上漲。建立災後單價表、參考多家報價,能讓理賠在合理範圍內兼顧被保險人的實際需要。'],

 ovol4:['自動派案','自動派案系統可以提升效率,但要考慮案件難度與人員經驗。完全以距離與數量派案,容易讓品質下降。'],
 ovol5:['客訴的根本原因','理賠客訴最常見的原因是資訊不透明。主動通知進度、說明時程與所需文件,往往比加快速度更能降低客訴。'],
 ovol6:['資料分析與詐保偵測','大量小額案件中,重複出現的時間、地點、證人或修車廠,是詐保集團的重要線索。公證公司的資料分析能力,也能成為服務價值。'],
 bsme4:['中小企業的保額不足','小型商家常為了省保費而低報保額,出險時被比例分攤。用簡單的例子說明比例分攤,是經紀人最有效的服務之一。'],
 bsme5:['雇主責任險','勞工保險與職業災害保險之外,雇主仍可能對受傷員工負民事賠償責任。雇主責任險可以補足這個缺口。'],
 bsme6:['巨災時的客戶服務','巨災時大量報案同時湧入。線上報案、依損失大小分流與主動回覆,是小型經紀公司維持服務品質的方法。'],
 bmnc4:['美國的勞工補償保險','美國的勞工補償保險依各州法律辦理,多數州要求雇主投保。台灣的保單通常有地域限制,不能取代當地的強制保險。'],
 bmnc5:['差異條件與差額保障','跨國保險計畫中,主保單可以加上差異條件(DIC)與差額限額(DIL),補足當地保單在範圍或限額上的不足。'],
 bmnc6:['海外設廠的保險規劃','海外設廠要了解當地的強制保險、准許承保的保險公司、天災風險與外匯規定,並透過國際經紀網路與當地夥伴合作。'],
 bspe4:['董監事責任險的告知','董監事責任險的要保書常詢問是否知悉可能導致求償的情事。如實告知可能讓該事件被除外,但不實告知可能讓整張保單出問題。'],
 bspe5:['產品召回保險','產品責任險承保第三人的體傷與財損,通常不包括召回費用。召回費用需要另外投保產品召回保險。'],
 bspe6:['綁架勒贖保險','綁架勒贖保險承保贖金、危機顧問與相關費用,保單通常要求保密。搭配安全訓練與緊急撤離服務,才能完整管理派駐風險。'],

 tb2b5:['服務水準與事件溝通','系統事故後主動通報、公開事後檢討並依約處理罰則,是維持企業客戶信任的關鍵。'],

 tai4:['標註資料品質','AI 模型的表現受限於訓練資料的品質。由專業人員抽檢與重新標註關鍵樣本,往往比單純增加資料量更有效。'],
 tai5:['人工覆核門檻','AI 理賠常依金額與模型信心分數設定自動核定門檻。保留人工覆核,是控制錯誤與維持公平的重要機制。'],
 tai6:['巨災時的系統負載','巨災後的理賠量可能是平常的數十倍。系統要能彈性擴充,模型也要針對泡水等特定損失型態調整。'],

 temb5:['保險商品的價值','損失率過低的商品,可能代表保障範圍太窄或理賠門檻太高。讓消費者真正得到保障,才是長期經營之道。'],

 e_redpen:['公證報告的架構','一份公證報告通常包括:事故經過、勘查發現、事故原因、保險責任意見、損失計算與結論建議。每一項判斷都要附上依據,例如照片、單據、檢測報告或保單條款。'],
 e_court:['證人的具結','出庭作證前,證人原則上要先具結,保證據實陳述。依刑法第 168 條,證人對案情有重要關係的事項具結後故意作虛偽陳述,構成偽證罪,可處七年以下有期徒刑。'],
 e_ot:['加班費的計算','依勞動基準法第 24 條,平日延長工時在 2 小時以內,每小時工資至少加給三分之一;再延長 2 小時以內,至少加給三分之二。雇主也要逐日記錄出勤,記到分鐘為止。'],
 e_photo:['現場照片的保存','現場照片是理賠最重要的證據之一。拍完要盡快備份到兩個地方,保留原始檔和拍攝時間;放進報告的照片不能修改內容,必要時註明拍攝位置與方向。'],
 e_young:['勘查前的準備','出發前先讀保單,核對保險標的、地址與保險金額,並列出要確認的事項和要收集的文件。到了現場照清單逐項確認,能讓對方感受到專業,也避免漏問。'],
 e_quit:['新人的留任','理賠與公證工作的前幾年最辛苦,新人流動率也最高。有計畫的師徒制、清楚的升遷路徑和合理的案件分配,是留住人才的關鍵。'],
 e_prelim:['初步報告','大型損失發生後,公證人通常要在勘查後短時間內提出初步報告(Preliminary Report),說明事故經過、初步原因、保險責任意見與損失預估,讓保險人與再保人提列賠款準備金。'],
 e_eng:['公證人的專業背景','財產與工程損失常涉及機電、化工與營建專業。公證人除了保險知識,也要能讀懂圖面、設備規格與維修紀錄,必要時再委請技師或原廠鑑定。'],
 e_abroad:['國際保險計畫','台商海外工廠的保險,常以國際保險計畫安排:當地保險公司依當地法規出具當地保單,再透過再保險把風險分給台灣或國際的保險人。理賠時要同時看當地保單和主保單的條件。'],
 e_poach:['離職後競業禁止','依勞動基準法第 9-1 條,離職後競業禁止的約定要符合條件才有效:雇主有應受保護的正當營業利益、勞工的職位能接觸營業秘密、期間不得超過兩年,而且雇主要給予合理補償。'],
 e_switch:['保險科技','影像辨識、自動化估損與資料分析,正在改變理賠流程。同時懂保險實務和資料的人才,是保險公司與保險科技公司最缺的。'],
 e_guild:['同業交流','理賠與公證的判斷力很依賴案例經驗。參加同業讀書會、公會研習與研討會,可以接觸自己公司沒遇過的案件類型;分享案例時,記得先去除客戶可辨識的資訊。'],
 e_salary:['勞退自提','依勞工退休金條例,勞工可以在每月工資 6% 的範圍內自願提繳退休金。自提的金額,可以從當年度的個人綜合所得總額中全數扣除。'],
 e_rent:['押金的上限','依土地法第 99 條與租賃住宅市場發展及管理條例第 7 條,住宅租賃的押金不得超過兩個月的租金。租屋族也可以考慮投保租屋相關的責任保險,保障自己的疏失造成火災或漏水時,對房東或鄰居的賠償責任。'],
 e_loan:['就學貸款的還款','依教育部規定,就學貸款在畢業後滿一年的次日開始還款,按月平均攤還。收入未達一定標準的人(目前為平均月所得未達 5 萬元),可以申請緩繳本金,一次一年,最多 12 次,緩繳期間的利息由政府負擔。'],
 e_scooter:['機車竊盜損失險','強制汽車責任保險只賠事故造成的人員傷亡,不賠車輛失竊。要保障失竊,必須另外投保竊盜損失險;通常要先報警,並在一定期間(常見為 30 天)內沒有尋回,才會理賠。'],
 e_friendins:['投資型保單的費用','投資型保單的保費要先扣除保費費用、保險成本與管理費,剩下的才進入投資帳戶,投資損益由要保人自行承擔。買之前要看清楚費用結構,並先確認基本的壽險、醫療與意外保障是否足夠。'],

function statOf(ch){

  KEYS.forEach(k=>{const v=ch.ok.fx[k]||0;if(v>bv){bv=v;best=k}});

}
const cOf=ch=>ch.c||{k:statOf(ch)};
function outs(ch){
  if(ch.ok.fx.end||ch.ok.fx.brn||(EV&&EV.dt)||(EV&&EV.rv&&!ch.c))return [{n:'確定',p:100,g:'m',r:ch.ok}];
  if(ch.c){
    const p=Math.round(pOf(ch.c));
    const rm=hasT('risk')?1.5:1,wm=hasSt('watch')?2:1;
    const g=Math.max(1,Math.round(p*(ch.gr?0.2:0.12)*rm)),bf=Math.min(100-p,Math.max(1,Math.round((100-p)*0.2*rm*wm)));
    return [{n:'大成功',p:g,g:'g',r:ch.gr||null,tw:ch.gr?0:2},{n:'成功',p:p-g,g:'g',r:ch.ok},{n:'失敗',p:100-p-bf,g:'b',r:ch.ng},{n:'大失敗',p:bf,g:'b',r:ch.ng,tw:-2}];
  }
  const c=cOf(ch),p=Math.round(clamp(70+(val(c.k)-50)*0.5+varMod(c)+bsum(c),20,92)),g=Math.round(p*0.3);
  return [{n:'順利',p:g,g:'g',r:ch.ok,tw:1},{n:'如預期',p:p-g,g:'m',r:ch.ok},{n:'出狀況',p:100-p,g:'b',r:ch.ok,tw:-1}];
}
function addFx(a,b,m){const o=Object.assign({},a);Object.keys(b).forEach(k=>{o[k]=(o[k]||0)+Math.round(b[k]*m)});return o}
function scaleFx(fx,sign,m){const o=Object.assign({},fx);KEYS.concat(['cash']).forEach(k=>{if(o[k]&&Math.sign(o[k])===sign)o[k]=Math.round(o[k]*m)});return o}

function hex(c){return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16))}
function toHex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=hex(a),B=hex(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t))}
function skyAt(t){
  const st=[[0,'#a8dcff'],[.35,'#86c8f2'],[.65,'#f4cf93'],[.85,'#ee9a72'],[1,'#7a5a96']];
  for(let i=1;i<st.length;i++)if(t<=st[i][0]){const [a,ca]=st[i-1],[b,cb]=st[i];return mix(ca,cb,(t-a)/(b-a))}
  return st[st.length-1][1];
}
function hairAt(age){return age<42?'#2a2522':age<52?'#5e5853':age<60?'#9d9893':'#dcdad6'}
function outfit(){
  const r=S.rank,tr=S.track,sp=END&&END.kind==='special';
  if(sp||S.f.semi)return {T:'#4f9ac7',A:'#3f86b3',W:'#4f9ac7',P:'#c8b991'};
  if(tr==='edu')return {T:'#5d7d4a',A:'#f2efe6',W:'#f2efe6',P:'#6e604c',glass:1,book:1};
  if(tr==='brk')return {T:'#1f3554',A:'#d9a521',W:'#ffffff',P:'#1f3554',bag:1};
  if(tr==='ins')return {T:'#6b7380',A:'#2d6cb5',W:'#ffffff',P:'#5b636f',bag:1};
  if(tr==='rei')return {T:'#23262c',A:'#8a2343',W:'#ffffff',P:'#23262c',bag:1};
  if(tr==='own')return {T:'#5b4636',A:'#2e7d5b',W:'#ffffff',P:'#4d3b2e',bag:1};
  if(tr==='bro')return {T:'#2b2f3a',A:'#d9a521',W:'#ffffff',P:'#2b2f3a',bag:1};
  if(tr==='con')return {T:'#4a5c6e',A:'#e0a030',W:'#ffffff',P:'#3b4a5a',glass:1,bag:1};
  if(tr==='tech')return {T:'#333a44',A:'#333a44',W:'#333a44',P:'#4a6fa5'};
  if(tr==='exp'&&r>=3)return {T:'#eef0f2',A:'#5a8fbf',W:'#5a8fbf',P:'#4a5562',glass:1,bag:1};
  if((tr==='mgr'||tr==='adj')&&r>=3)return {T:'#3a3f48',A:'#b8322a',W:'#ffffff',P:'#3a3f48',bag:1};
  if(r>=2)return {T:'#9cc3e6',A:'#22395a',W:'#ffffff',P:'#3b4a5a',helm:'#f4f4f4',bag:1};

}

function sceneCaption(){

  return MKT[S.mkt].n+' · '+RT().n+' · '+rankName()+' · '+h+' · '+c+(fam.length?' · '+fam.join('、'):'')+(S.f.abroad?' · 有外派經歷':'');

function drawScene(cv){
  if(!cv||!cv.getContext)return;
  const c=cv.getContext('2d');if(!c)return;
  const W=120;
  const px=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h)};
  const spr=(map,x,y,pal)=>map.forEach((row,j)=>{for(let i=0;i<row.length;i++){const k=pal[row[i]];if(k)px(x+i,y+j,1,1,k)}});
  const dead=END&&(END.kind==='collapse'||END.kind==='sick');
  const t=clamp((S.age-23)/42,0,1);
  const night=dead||t>.93;
  /* 天空:年紀越大,天色從早晨走向黃昏 */
  const sky=dead?'#1c2240':skyAt(t);
  for(let i=0;i<4;i++)px(0,i*11,W,11,mix(sky,'#ffffff',i*0.06));
  if(night){
    [[8,5],[20,12],[33,4],[47,9],[61,3],[75,11],[84,6],[110,4]].forEach(([x,y])=>px(x,y,1,1,'#f4f1d0'));
    px(100,6,5,5,'#f2efcf');px(102,6,3,2,sky);
  }else{
    const sx=Math.round(6+t*104),sy=Math.round(24-Math.sin(Math.PI*t)*18),sc=t>.7?'#ffb46b':'#ffe48a';
    px(sx-2,sy-3,5,7,sc);px(sx-3,sy-2,7,5,sc);
  }
  const cl=(x,y)=>{const col=night?'#3a4166':'#ffffff';px(x,y,9,2,col);px(x+2,y-1,5,1,col);px(x+1,y+2,7,1,col)};
  const off=(S.seed%50)+S.age*3;
  cl((off%140)-12,9);cl(((off+64)%140)-12,15);
  if(S.mkt==='cat'&&!dead){
    px(0,0,W,44,'rgba(70,80,96,0.35)');
    for(let i=0;i<40;i++){const x=(i*37+S.age*11)%W,y=(i*13+S.age*7)%40+2;px(x,y,1,2,'#c9d6e3')}
  }
  if(S.f.abroad||S.track==='rei')spr(PLANE,((S.age*7+S.seed)%90)+10,5,{W:night?'#c9cbe0':'#ffffff'});
  /* 地面 */
  px(0,44,W,12,'#79b85a');px(0,44,W,1,'#5f9a45');px(0,46,W,3,'#cbbfa3');px(0,49,W,1,'#b3a68a');px(0,52,W,4,'#6aa64e');
  /* 住處 */
  const kind=homeKind(),lit=night?'#ffe6a0':'#6a7c8c';
  const top=drawHome(px,kind,night,lit);
  if(S.co||(END&&END.kind==='special')){
    const sc=S.co?{own:'#f5c400',bro:'#d9a521',con:'#7fb2d6',tech:'#a98be0'}[S.co.t]:'#3f9c7a';
    px(92,top-7,22,5,sc);for(let k=0;k<5;k++)px(94+k*4,top-5,2,1,'#1b1500');px(95,top-2,1,2,'#555555');px(110,top-2,1,2,'#555555');
  }
  /* 車 */
  drawCar(spr,px);
  /* 配偶 */
  if(S.f.married)spr(SPOUSE,38,32,{H:hairAt(S.age),S:'#f1c7a1',E:'#2b2b2b',M:'#a2533f',C:'#c0507a',B:'#2a2a2a'});
  /* 主角:髮色隨年齡、服裝隨職級與路線、表情隨健康與家庭 */
  const o=outfit(),age=S.age,mood=(S.hp+S.fam)/2;
  const m=ADULT.slice();
  if(o.helm&&!END){m[0]='...YYYY...';m[1]='..YYYYYY..';m[2]='.YYYYYYYY.'}
  else if(age>=58){m[0]='..........';m[2]='..HSSSSH..'}
  if(o.glass||age>=48)m[4]='..GEGGEG..';
  if(mood<35){m[5]='..SDSSDS..';m[6]='..SMMMMS..'}
  else if(mood>=62){m[6]='..SMSSMS..';m[7]='...SMMS...'}
  const X=51,Y=32;
  if(dead){
    spr(STONE,X+1,Y+7,{G:'#8d939c',D:'#5c626b'});
    [[X,'#e05a6a'],[X+2,'#f5c400'],[X+7,'#e05a6a'],[X+9,'#ffffff']].forEach(([x,col])=>px(x,45,1,1,col));
  }else{
    spr(m,X,Y,{H:hairAt(age),Y:o.helm,S:'#f1c7a1',D:'#cf9a78',E:'#2b2b2b',G:'#3a3a3a',M:'#a2533f',T:o.T,A:o.A,W:o.W,P:o.P,B:'#2a2a2a'});
    if(END&&END.kind==='banned'){px(X+1,Y+10,8,5,'#b88a52');px(X+1,Y+12,8,1,'#8a6438')}
    else if(!END||END.kind!=='special'){
      if(o.bag&&!S.f.semi){px(X+8,Y+13,3,3,'#6b4428');px(X+9,Y+12,1,1,'#6b4428')}
      if(o.book)px(X+8,Y+11,2,3,'#b8322a');
      if(o.board)px(X-1,Y+10,2,3,'#c8a36a');
    }
    if(S.rep>=80)px(X+2,Y+9,1,1,'#ffd23f');
    if(S.f.cert)px(X+7,Y+9,1,1,'#6fd0ff');
    drawGear(px,X,Y);
  }
  /* 孩子:隨年齡長大 */
  const kc=['#3e9e6a','#e0a030'];
  S.kb.slice(0,2).forEach((b,i)=>{
    const ka=S.age-b,x=64+i*9,pal={H:'#2a2522',S:'#f1c7a1',E:'#2b2b2b',M:'#a2533f',C:kc[i],P:'#3b4a5a',B:'#2a2a2a'};
    const mp=ka<4?KID0:ka<12?KID1:KID2;
    spr(mp,x,49-mp.length,pal);
  });
  if(S.fam>=75&&!dead)spr(DOG,80,44,{D:'#b07a45',E:'#222222'});
  if(S.pro>=80&&!dead){px(30,45,6,1,'#2f5d7c');px(31,44,5,1,'#b8322a');px(30,43,6,1,'#e0a030')}
}

function dexCat(e){

  if(r.some(x=>['own','tech'].includes(x))||/^c_|^co_/.test(e.id))return 'biz';
  if(r.some(x=>['ins','rei'].includes(x)))return 'ins';
  if(r.some(x=>['brk','bro','con','edu'].includes(x)))return 'brk';

function lifeStory(){
