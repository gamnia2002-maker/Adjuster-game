  const SANS="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif",SERIF="'Noto Serif TC','Songti TC','PMingLiU',serif",MONO="'JetBrains Mono',ui-monospace,Menlo,monospace";
  const rr=(x,y,w,h,r)=>{c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()};
  const T=(t,x,y,f,col,al)=>{c.font=f;c.fillStyle=col;c.textAlign=al||'left';c.textBaseline='alphabetic';c.fillText(LANG==='en'?String(t).replace(/’/g,"'"):t,x,y)};
  const fit=(t,x,y,w,wt,sz,mn,fam,col,al)=>{let z=sz;c.font=wt+' '+z+'px '+fam;while(c.measureText(t).width>w&&z>mn){z-=1;c.font=wt+' '+z+'px '+fam}let u=t;while(c.measureText(u).width>w&&u.length>2)u=u.slice(0,-2)+'…';T(u,x,y,wt+' '+z+'px '+fam,col,al)};
  const dead=END.kind==='collapse'||END.kind==='sick';
  c.clearRect(0,0,W,H);rr(1,1,W-2,H-2,18);c.save();c.clip();
  c.fillStyle='#f7f4ec';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(47,93,124,0.06)';c.lineWidth=1;for(let i=-H;i<W;i+=10){c.beginPath();c.moveTo(i,H);c.lineTo(i+H,0);c.stroke()}
  c.fillStyle='#2f5d7c';c.fillRect(0,0,W,52);c.fillStyle='#f2b705';c.fillRect(0,52,W,5);
  fit(CARDH[S.track]||CARDH.adj,20,33,236,'700',16,12,SANS,'#ffffff');
  T('No. '+S.seed,W-20,32,'500 12px '+MONO,'#cfe0ec','right');
  /* 頭像 */
  const px=20,py=76,pw=104,ph=128,hs=heroSprite(),sc=6,sx=px+Math.round((pw-10*sc)/2),sy=py+ph-17*sc-10;
  c.fillStyle='#d7e6f0';c.fillRect(px,py,pw,ph);c.fillStyle='#c9d9c3';c.fillRect(px,py+ph-24,pw,24);
  hs.m.forEach((row,j)=>{for(let i=0;i<row.length;i++){const col=hs.pal[row[i]];if(col){c.fillStyle=col;c.fillRect(sx+i*sc,sy+j*sc,sc,sc)}}});
  if(S.rep>=80){c.fillStyle='#ffd23f';c.fillRect(sx+2*sc,sy+9*sc,sc,sc)}
  if(S.f.cert){c.fillStyle='#6fd0ff';c.fillRect(sx+7*sc,sy+9*sc,sc,sc)}
  if(dead){c.fillStyle='rgba(28,30,36,0.38)';c.fillRect(px,py,pw,ph);c.save();c.beginPath();c.rect(px,py,pw,ph);c.clip();c.translate(px+pw-14,py+14);c.rotate(Math.PI/4);c.fillStyle='#1b1b1b';c.fillRect(-50,-7,100,14);c.restore()}
  c.strokeStyle='#2f5d7c';c.lineWidth=2;c.strokeRect(px,py,pw,ph);
  T('23 → '+S.age+' 歲',px+pw/2,py+ph+20,'500 12px '+MONO,'#4a5a67','center');
  /* 右欄:結局、職稱、路線 */
  const rx=140,rw=W-rx-20;
  T('職涯結局',rx,90,'700 11px '+SANS,'#7a8894');
  const {fs,tl}=cardTitle(c,rw,SERIF);
  let y=90+fs+2;tl.forEach(l=>{T(l,rx,y,'900 '+fs+'px '+SERIF,'#14212c');y+=fs+3});
  fit(rankName(),rx,y+10,rw,'700',15,11,SANS,'#14212c');
  fit(RT().n+(BR()?' · '+BR().n:''),rx,y+30,rw,'500',12,10,SANS,'#4a5a67');
  fit(S.sp.n,rx,y+48,rw,'500',12,10,SANS,'#7a8894');
  /* 五項屬性 */
  const top=Math.max(py+ph+40,y+74);
  c.fillStyle='#d9d2c2';c.fillRect(20,top-14,W-40,1);
  const COL={pro:'#2f5d7c',rep:'#b8860b',net:'#6a4fa3',hp:'#1f8a7a',fam:'#c0507a'};
  c.font='500 13px '+SANS;const lw=Math.max(...KEYS.map(x=>c.measureText(KN[x]).width));c.font='500 12px '+SANS;const vw=Math.max(...KEYS.map(x=>c.measureText(lvl(S[x])).width));
  const bx0=20+lw+10,bw=W-20-vw-10-bx0;
  KEYS.forEach((kk,i)=>{const yy=top+6+i*24;
    T(KN[kk],20,yy+10,'500 13px '+SANS,'#14212c');
    c.fillStyle='#e3ddd0';c.fillRect(bx0,yy+1,bw,10);c.fillStyle=COL[kk];c.fillRect(bx0,yy+1,bw*clamp(S[kk],0,100)/100,10);
    T(lvl(S[kk]),W-20,yy+10,'500 12px '+SANS,S[kk]<25?'#b53a29':'#4a5a67','right')});
  /* 底部:技能、特質、淨資產、總評章 */
  const fy=top+6+5*24+16;
  c.fillStyle='#d9d2c2';c.fillRect(20,fy-10,W-40,1);
  const fw=W-20-20-90;
  T('技能與證照',20,fy+14,'700 12px '+SANS,'#7a8894');
  c.font='500 13px '+SANS;const sl=wrapLines(c,skt,fw).slice(0,3);sl.forEach((l,i)=>T(l,20,fy+33+i*18,'500 13px '+SANS,'#14212c'));
  const ty=fy+33+sl.length*18+10;
  T('特質',20,ty,'700 12px '+SANS,'#7a8894');fit(S.traits.map(x=>TR[x].n).join('、'),20,ty+19,fw,'500',13,10,SANS,'#14212c');
  fit('淨資產 '+cur(NW()),20,ty+44,fw,'500',13,10,SANS,'#4a5a67');
  const bx=W-60,by=fy+52;
  c.beginPath();c.arc(bx,by,38,0,Math.PI*2);c.fillStyle='#f2b705';c.fill();c.lineWidth=2;c.strokeStyle='#1b1500';c.stroke();
  T('總評',bx,by-10,'700 11px '+SANS,'#1b1500','center');T(String(END.score),bx,by+20,'700 28px '+MONO,'#1b1500','center');
  (END.goals||[]).forEach((g,i)=>{const mx=bx-24+i*24,my=by+56;c.beginPath();c.arc(mx,my,8,0,Math.PI*2);if(g.ok){c.fillStyle='#f2b705';c.fill();c.lineWidth=1.5;c.strokeStyle='#1b1500';c.stroke();c.beginPath();c.moveTo(mx-4,my);c.lineTo(mx-1,my+3);c.lineTo(mx+4,my-3);c.lineWidth=2;c.strokeStyle='#1b1500';c.stroke()}else{c.lineWidth=1.5;c.strokeStyle='#cfc6b2';c.stroke()}});
  if(END.kind==='banned'){c.save();c.translate(W-96,150);c.rotate(-0.22);c.strokeStyle='rgba(181,58,41,0.85)';c.lineWidth=3;c.strokeRect(-56,-24,112,44);T('註銷',0,10,'900 26px '+SERIF,'rgba(181,58,41,0.85)','center');c.restore()}
  c.restore();rr(1,1,W-2,H-2,18);c.lineWidth=2;c.strokeStyle='#cfc6b2';c.stroke();
  return cv;
}
function cardRender(){
  const img=document.getElementById('idcard');if(!img||!img.setAttribute)return;
  const put=()=>{if(P!=='end')return;const cv=drawCard(),im=document.getElementById('idcard');if(cv&&im)try{im.src=cv.toDataURL('image/png')}catch(e){}};
  put();
  try{if(document.fonts&&document.fonts.load){const txt=END.t+rankName()+RT().n+(BR()?BR().n:'')+S.sp.n+(CARDH[S.track]||'')+KEYS.map(k=>KN[k]+lvl(S[k])).join('')+Object.keys(S.skills).map(x=>SK[x].n).join('')+'技能淨資產總評職涯結局歲註銷'+S.traits.map(x=>TR[x].n).join('');
    Promise.all([document.fonts.load("900 34px 'Noto Serif TC'",txt),document.fonts.load("700 17px 'Noto Sans TC'",txt),document.fonts.load("500 13px 'Noto Sans TC'",txt),document.fonts.load("500 14px 'JetBrains Mono'",'No.0123456789→')]).then(put,put)}}catch(e){}
}
function saveCard(){
  const cv=CARDCV||drawCard();if(!cv||!cv.toBlob)return;
  const fn='adjuster-card-'+S.seed+'.png';
  cv.toBlob(b=>{
    if(!b)return;
    if(DL){DL.save({filename:fn,data:b}).catch(()=>{});return}
    const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);
  },'image/png');
}
function worksHTML(){
  const cs=(S.cases||[]).slice().sort((a,b)=>b.w-a.w||b.a-a.a).slice(0,3).sort((a,b)=>a.a-b.a);
  if(!cs.length)return '';
  return '<div class="story"><span class="kt">代表作</span><ul class="works">'+cs.map(c=>'<li><span class="mono">'+c.a+' 歲</span><b>'+c.n+'</b><em>'+c.o+'</em></li>').join('')+'</ul></div>';
}
function goalsHTML(){
  const g=END.goals||[];if(!g.length)return '';const k=g.filter(x=>x.ok).length;
  return '<div class="story"><span class="kt">人生目標 · 達成 '+k+' / '+g.length+(k?' · 總評 +'+(3*k):'')+'</span><ul class="goals">'+g.map(x=>'<li class="'+(x.ok?'ok':'no')+'"><i>'+(x.ok?'✔':'✕')+'</i><div><b>'+x.n+'</b><span>'+x.d+'</span></div></li>').join('')+'</ul></div>';
}
function endView(){
  return mast()
   +'<div><span class="tab">結案報告</span><div class="card endc">'
   +'<img class="idcard" id="idcard" alt="'+END.t+' · '+rankName()+'" width="360" height="512">'
   +'<p class="hint">長按或右鍵也可以儲存小卡圖片</p>'
   +'<p class="sum">'+lifeSummary()+'</p>'
   +'<div class="story"><span class="kt">人生故事</span><p>'+lifeStory()+'</p></div>'+worksHTML()+goalsHTML()+familyHTML()+assetsHTML()+spendHTML()
   +'<div class="endbtns"><button class="btn" data-a="savecard">下載小卡</button><button class="btn sec" data-a="again">再活一次</button></div>'
   +'<p class="hint">'+(S.nc?'這一局新收錄 '+S.nc+' 張知識卡 · ':'')+'<button class="linkbtn inl" data-a="dex">理賠小教室圖鑑</button></p>'
   +'</div></div>';
}
let lastP='';
function render(){
  glHide();
  let h='';
  if(P==='start')h=startView();
  else if(P==='birth')h=birthView();
  else if(P==='run'||P==='event'||P==='result')h=playView();
  else if(P==='end')h=endView();
  else if(P==='dex')h=dexView();
  app.innerHTML=h;
  if(S&&P!=='start'&&P!=='dex'&&P!=='end')drawScene(document.getElementById('scene'));
  if(P==='end')cardRender();
  if(P==='start'){const kc=document.getElementById('kv');if(kc&&kc.getContext)kvInit(kc)}
  miniUpd();
  if(P!==lastP){
    if(P==='start'||P==='birth'||P==='end'||P==='dex')window.scrollTo(0,0);
    if(P==='event'){const b=document.getElementById('evbox');if(b){const t=b.getBoundingClientRect().top;if(t>window.innerHeight*0.5||t<0)b.scrollIntoView({block:'start',behavior:'smooth'})}}
  }
  lastP=P;
  loop();
}

app.addEventListener('click',e=>{
  const tm=e.target.closest('.term');if(tm){glShow(tm);return}glHide();
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='begin'){
    const s=document.getElementById('seed');
    const n=s?parseInt(s.value.replace(/\D/g,''),10):NaN;
    newGame(n>0?n:Math.floor(100000+Math.random()*900000));P='birth';render();
  }
  else if(a==='enter'){P='run';newYear();render()}
  else if(a==='focus'){focus=v;render()}
  else if(a==='shop'){if(shopCat===v){shopCat=null;if(shopPz&&paused&&P==='run'){paused=false;yrRes=now()}shopPz=false}else{shopCat=v;if(v==='house')pickReg();if(P==='run'&&!paused){yrAcc+=now()-yrRes;paused=true;shopPz=true}}render()}
  else if(a==='shopx'){shopCat=null;if(shopPz&&paused&&P==='run'){paused=false;yrRes=now()}shopPz=false;render()}
  else if(a==='sreg'){shopReg=v;render()}
  else if(a==='buy'){const q=v.split(':');buy(q[0],q[1],q[2]);render()}
  else if(a==='sell'){if(v==='house'){if(hNet()+liq(S)>=0)sellHouse()}else if(v==='car')sellCar();else if(v==='watch')sellWatch();fresh=S.log.length;render()}
  else if(a==='strat'){S.strat=v;render()}
  else if(a==='gear'){gearOpen=!gearOpen;render()}
  else if(a==='detail'){detail=!detail;try{localStorage.setItem('adj-detail',detail?'1':'0')}catch(e){}render()}
  else if(a==='pol'){if(S.co)S.co.pol=v;render()}
  else if(a==='speed'){const f=prog()/dur();speed=v;yrAcc=f*dur();yrRes=now();if(paused)paused=false;render()}
  else if(a==='pause'){if(!paused){yrAcc+=now()-yrRes;paused=true}else{paused=false;yrRes=now()}render()}
  else if(a==='opt')choose(+v);
  else if(a==='cont')cont();
  else if(a==='savecard')saveCard();
  else if(a==='dex'){dexFrom=P;P='dex';render()}
  else if(a==='dtab'){dexTab=v;render()}
  else if(a==='dexback'){P=dexFrom||'start';render()}
  else if(a==='again'){startSeed='';P='start';S=null;END=null;render()}
  else if(a==='same'){newGame(S.seed);P='birth';render()}
  else if(a==='copy'){
    const ta=document.getElementById('share');
    const done=ok=>{b.textContent=ok?'已複製':'請長按文字手動複製'};
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(()=>done(true),()=>{ta.focus();ta.select();done(false)});
    }else{ta.focus();ta.select();done(false)}
  }
});
app.addEventListener('change',e=>{if(e.target.id==='autoBox'){auto=e.target.checked;render()}});
app.addEventListener('toggle',e=>{const t=e.target;if(t&&t.classList&&t.classList.contains('more'))moreOpen=t.open},true);
app.addEventListener('input',e=>{if(e.target.id==='seed')startSeed=e.target.value});
app.addEventListener('keydown',e=>{const tm=e.target.closest&&e.target.closest('.term');if(tm&&(e.key==='Enter'||e.key===' ')){e.preventDefault();glShow(tm)}else if(e.key==='Escape')glHide()});
if(document.addEventListener)document.addEventListener('click',e=>{if(e.target.closest&&!e.target.closest('.term')&&!e.target.closest('#gpop'))glHide()});
render();
</script>
